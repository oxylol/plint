<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e4e9e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2421" media="(prefers-color-scheme: dark)">
<title>TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f6a53'/%3E%3Crect x='12' y='16' width='40' height='26' rx='4' fill='%23e4e9e5'/%3E%3Crect x='24' y='46' width='16' height='4' rx='2' fill='%23e4e9e5'/%3E%3C/svg%3E">
<style>
  /* Plint Soft UI tokens, with fallbacks so the page also works straight off :7000 */
  :root {
    color-scheme: light dark;
    --bg: var(--p-bg, #e4e9e5); --ink: var(--p-ink, #22302a); --ink2: var(--p-ink2, #56655d);
    --hi: var(--p-hi, rgba(255,255,255,.92)); --lo: var(--p-lo, rgba(146,163,152,.55));
    --edge: var(--p-edge, rgba(255,255,255,.6)); --track: var(--p-track, #d3dad5);
    --accent: var(--p-accent, #3f6a53); --accent-soft: var(--p-accent-soft, rgba(63,106,83,.13));
    --on-accent: var(--p-on-accent, #f2f6f3); --bad: var(--p-bad, #a63d32);
    --font: var(--p-font, "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif);
    --raise: var(--p-raise, 9px 9px 20px var(--lo), -9px -9px 20px var(--hi));
    --raise-sm: var(--p-raise-sm, 4px 4px 10px var(--lo), -4px -4px 10px var(--hi));
    --press: var(--p-press, inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi));
    --press-sm: var(--p-press-sm, inset 3px 3px 6px var(--lo), inset -3px -3px 6px var(--hi));
    --r-lg: var(--p-r-lg, 26px); --r: var(--p-r, 18px); --r-sm: var(--p-r-sm, 12px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--p-bg, #1e2421); --ink: var(--p-ink, #dde6e0); --ink2: var(--p-ink2, #9aa8a0);
      --hi: var(--p-hi, rgba(255,255,255,.05)); --lo: var(--p-lo, rgba(0,0,0,.5));
      --edge: var(--p-edge, rgba(255,255,255,.04)); --track: var(--p-track, #151a17);
      --accent: var(--p-accent, #8ec3a4); --accent-soft: var(--p-accent-soft, rgba(142,195,164,.14));
      --on-accent: var(--p-on-accent, #13201a); --bad: var(--p-bad, #e5877b);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header.tv-head { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 14px; }
  header.tv-head h1 { font: 800 22px/1 var(--font); margin: 0; letter-spacing: -.02em; }
  header.tv-head .sub { font: 600 13px/1.2 var(--font); color: var(--ink2); }
  header.tv-head .who { flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink2); flex: none; }
  .dot.ok { background: var(--accent); } .dot.bad { background: var(--bad); }

  section { margin: 0 0 16px; padding: 16px; border-radius: var(--r-lg); background: var(--bg); box-shadow: var(--raise); border: 1px solid var(--edge); }
  h2 { font: 800 11px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 0 0 12px; }

  .now { display: flex; align-items: center; gap: 14px; }
  .now .art { width: 54px; height: 54px; border-radius: var(--r-sm); box-shadow: var(--press-sm); display: grid; place-items: center; color: var(--accent); flex: none; }
  .now .art svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .now .t { flex: 1; min-width: 0; }
  .now .t b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .t span { color: var(--ink2); font-size: 13px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  button { all: unset; cursor: pointer; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: var(--r); box-shadow: var(--raise-sm); border: 1px solid var(--edge); font: 700 12px/1.1 var(--font); text-align: center; color: var(--ink); transition: box-shadow .12s ease, transform .12s ease; position: relative; min-height: 86px; justify-content: center; }
  .tile:active, .tile.on { box-shadow: var(--press-sm); }
  .tile .well { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--accent); }
  .tile .well svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile i.run { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
  .tile.on i.run { background: var(--accent); }

  .row { display: flex; gap: 12px; align-items: center; }
  .btn { flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); box-shadow: var(--raise-sm); border: 1px solid var(--edge); font: 800 14px/1 var(--font); color: var(--ink); }
  .btn:active { box-shadow: var(--press-sm); }
  .btn.primary { color: var(--on-accent); background: var(--accent); border-color: transparent; }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.sq { flex: none; width: 52px; }

  .vol { display: flex; align-items: center; gap: 12px; }
  .vol .track { flex: 1; height: 14px; border-radius: 7px; box-shadow: var(--press-sm); background: var(--track); position: relative; }
  .vol .fill { position: absolute; inset: 3px auto 3px 3px; width: 50%; border-radius: 5px; background: var(--accent); transition: width .15s ease; }
  .vol input { position: absolute; inset: -14px 0; width: 100%; opacity: 0; margin: 0; height: 42px; }
  .vol .n { font: 800 14px/1 var(--font); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--ink2); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
  .pad .btn { height: 60px; }
  .pad .mid { font-size: 13px; }
  .hint { font: 600 12px/1.4 var(--font); color: var(--ink2); margin: 10px 0 0; }
  .hint a { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .2s ease; background: var(--bg); color: var(--ink); box-shadow: var(--raise); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 16px; font: 700 13px/1 var(--font); pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  select { all: unset; width: 100%; height: 44px; padding: 0 14px; border-radius: var(--r-sm); box-shadow: var(--press-sm); font: 700 14px/44px var(--font); color: var(--ink); box-sizing: border-box; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(6, 1fr); } }
</style>
</head>
<body>
<header class="tv-head">
  <div class="who">
    <h1>TV</h1>
    <div class="sub" id="sub">connecting…</div>
  </div>
  <i class="dot" id="dot" title="remote service"></i>
</header>

<section>
  <h2>Now</h2>
  <div class="now">
    <div class="art" id="art"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 21h8"/></svg></div>
    <div class="t"><b id="nowTitle">Nothing in front</b><span id="nowSub">—</span></div>
    <button class="btn sq" id="pp" title="Play / pause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M6 4l12 8-12 8z"/></svg></button>
  </div>
</section>

<section>
  <h2>Open</h2>
  <div class="grid" id="apps"></div>
</section>

<section>
  <h2>Sound</h2>
  <div class="vol">
    <button class="btn sq" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6"/></svg></button>
    <div class="track"><div class="fill" id="fill"></div><input type="range" min="0" max="100" id="vol" aria-label="Volume"></div>
    <div class="n" id="volN">—</div>
  </div>
  <div id="outWrap" style="margin-top:12px; display:none">
    <select id="out" aria-label="Audio output"></select>
  </div>
</section>

<section>
  <h2>Screen</h2>
  <div class="row">
    <button class="btn" data-display="off"><svg viewBox="0 0 24 24"><path d="M12 3v9M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>Screen off</button>
    <button class="btn" data-display="on"><svg viewBox="0 0 24 24"><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>Screen on</button>
  </div>
</section>

<section>
  <h2>Navigate</h2>
  <div class="pad">
    <span></span><button class="btn" data-key="up"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><span></span>
    <button class="btn" data-key="left"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button class="btn primary" data-key="enter">OK</button>
    <button class="btn" data-key="right"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="btn mid" data-key="back">Back</button>
    <button class="btn" data-key="down"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
    <button class="btn mid" data-key="f">Full</button>
  </div>
  <p class="hint" id="axHint" hidden>Keys need one permission on the Mac: System Settings → Privacy &amp; Security → Accessibility → allow <b>osascript</b>.</p>
</section>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var ICON = {
    stremio: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5l5.5 3.5-5.5 3.5z",
    youtube: "M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM10 9l5 3-5 3z",
    steam: "M4 13.5a8 8 0 1 0 .6-4.4L9 11a3 3 0 1 1-1 4.9zM15 6.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6z",
    moonlight: "M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z",
    spotify: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM7.5 10c3-1 6.5-.8 9.5.8M8 13c2.5-.8 5.3-.6 7.5.6M8.5 16c2-.6 4-.5 5.8.4",
    music: "M9 18V6l10-2v12M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM19 16a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"
  };
  var LABEL = { stremio: "Stremio", youtube: "YouTube", steam: "Steam Link", moonlight: "Moonlight", spotify: "Spotify", music: "Music" };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("apps"), toastT;

  Object.keys(LABEL).forEach(function (k) {
    var b = document.createElement("button");
    b.className = "tile"; b.dataset.app = k;
    b.innerHTML = '<i class="run"></i><span class="well"><svg viewBox="0 0 24 24"><path d="' + ICON[k] + '"/></svg></span>' + LABEL[k];
    b.addEventListener("click", function () { post("/api/open", { app: k }, "Opening " + LABEL[k]); });
    grid.appendChild(b);
  });

  function toast(msg, bad) {
    var t = $("toast"); t.textContent = msg; t.style.color = bad ? "var(--bad)" : "var(--ink)";
    t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function post(path, body, msg) {
    if (msg) toast(msg);
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.error) toast(d.error, true); if (d && d.state) render(d.state); })
      .catch(function () { toast("TV not reachable", true); });
  }
  function render(s) {
    $("dot").className = "dot ok";
    $("sub").textContent = (s.front ? s.front + " in front" : "Idle") + (s.output ? " · " + s.output : "");
    var np = s.playing;
    if (np) { $("nowTitle").textContent = np.title; $("nowSub").textContent = (np.artist ? np.artist + " · " : "") + np.app + (np.state === "paused" ? " · paused" : ""); }
    else { $("nowTitle").textContent = s.front || "Nothing in front"; $("nowSub").textContent = np === null ? "—" : ""; }
    $("pp").innerHTML = '<svg viewBox="0 0 24 24"><path d="' + (np && np.state === "playing" ? "M7 5h3v14H7zM14 5h3v14h-3z" : "M6 4l12 8-12 8z") + '"/></svg>';
    if (typeof s.volume === "number" && document.activeElement !== $("vol")) {
      $("vol").value = s.volume; $("fill").style.width = s.volume + "%"; $("volN").textContent = s.muted ? "mute" : s.volume;
    }
    $("mute").classList.toggle("on", !!s.muted);
    Array.prototype.forEach.call(grid.children, function (b) { b.classList.toggle("on", !!(s.apps && s.apps[b.dataset.app])); });
    if (s.outputs && s.outputs.length > 1) {
      var sel = $("out"); $("outWrap").style.display = "";
      if (sel.options.length !== s.outputs.length) {
        sel.innerHTML = s.outputs.map(function (o) { return "<option>" + o.replace(/</g, "&lt;") + "</option>"; }).join("");
      }
      sel.value = s.output || sel.value;
    }
    $("axHint").hidden = s.accessibility !== false;
  }
  function poll() {
    fetch("/api/state", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(render).catch(function () { $("dot").className = "dot bad"; $("sub").textContent = "TV not reachable"; });
  }

  $("pp").addEventListener("click", function () { post("/api/playpause"); });
  $("mute").addEventListener("click", function () { post("/api/volume", { mute: !$("mute").classList.contains("on") }); });
  $("vol").addEventListener("input", function () { $("fill").style.width = this.value + "%"; $("volN").textContent = this.value; });
  $("vol").addEventListener("change", function () { post("/api/volume", { level: +this.value }); });
  $("out").addEventListener("change", function () { post("/api/output", { name: this.value }, "Sound → " + this.value); });
  document.querySelectorAll("[data-display]").forEach(function (b) { b.addEventListener("click", function () { post("/api/display", { action: b.dataset.display }, b.dataset.display === "off" ? "Screen off" : "Screen on"); }); });
  document.querySelectorAll("[data-key]").forEach(function (b) { b.addEventListener("click", function () { post("/api/key", { key: b.dataset.key }); }); });

  poll(); setInterval(poll, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
