---
# Plint · home screen
title: Plint
description: Home
favicon: /images/favicon.svg

# Keep dark: Plint Soft UI (theme/apps/homepage.css) remaps Homepage's colour
# scale for light and dark itself, keyed off the device setting.
theme: dark
color: zinc
headerStyle: clean
cardStyle: hairline
statusStyle: dot
hideVersion: true
disableCollapse: true
iconStyle: theme
useEqualHeights: true

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
  showSearchSuggestions: false

# Games and Tailscale span their whole row (Soft UI draws servers/devices in them).
layout:
  Everyday:
    style: row
    columns: 2
  Health:
    style: row
    columns: 2
  System:
    style: row
    columns: 3
  Links:
    style: row
    columns: 4
