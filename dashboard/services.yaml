---
# Plint · services on the home screen
# Status dots come from Docker (container:) or a ping (siteMonitor:).
# siteMonitor URLs go straight to the port, so they work even if DNS is down.
# Cards with widgets live together in Health so every row keeps an even height.

- Everyday:
    - Games:
        icon: amp.png
        href: https://games.{{HOMEPAGE_VAR_DOMAIN}}
        description: AMP · game servers
        siteMonitor: http://host.docker.internal:8080

    - D&D Table:
        icon: mdi-dice-d20
        href: https://table.{{HOMEPAGE_VAR_DOMAIN}}
        description: Plint Table · campaigns, dice, DM screen
        server: plint
        container: table

    - Stremio:
        icon: stremio.png
        href: https://stremio.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movies & series
        server: plint
        container: stremio

    - Notifications:
        icon: ntfy.png
        href: https://ntfy.{{HOMEPAGE_VAR_DOMAIN}}
        description: ntfy · push to your phone
        server: plint
        container: ntfy

- Health:
    - Status:
        icon: uptime-kuma.png
        href: https://status.{{HOMEPAGE_VAR_DOMAIN}}
        description: Uptime Kuma · checks every minute
        server: plint
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: https://status.{{HOMEPAGE_VAR_DOMAIN}}
          slug: plint

    - AdGuard:
        icon: adguard-home.png
        href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}
        description: Ad blocking · DNS
        server: plint
        container: adguard
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADMIN_USER}}"
          password: "{{HOMEPAGE_VAR_ADMIN_PASSWORD}}"

    - Backups:
        icon: kopia.png
        href: https://backup.{{HOMEPAGE_VAR_DOMAIN}}
        description: Kopia · game servers, nightly
        server: plint
        container: kopia
        widget:
          type: kopia
          url: https://backup.{{HOMEPAGE_VAR_DOMAIN}}
          username: "{{HOMEPAGE_VAR_ADMIN_USER}}"
          password: "{{HOMEPAGE_VAR_ADMIN_PASSWORD}}"
          snapshotHost: plint
          snapshotPath: /sources/amp

    # The graph is drawn by Plint Soft UI from data/theme/speedtest.json.
    - Internet:
        icon: speedtest-tracker.png
        href: https://speed.{{HOMEPAGE_VAR_DOMAIN}}
        description: Speedtest Tracker · 4 tests a day
        server: plint
        container: speedtest-tracker

- System:
    - Host:
        icon: cockpit.png
        href: https://host.{{HOMEPAGE_VAR_DOMAIN}}
        description: Cockpit · updates, disks
        # Via Caddy: Cockpit's own HEAD reply trips Node's HTTP parser.
        siteMonitor: https://host.{{HOMEPAGE_VAR_DOMAIN}}

    - Stacks:
        icon: dockge.png
        href: https://stacks.{{HOMEPAGE_VAR_DOMAIN}}
        description: Dockge · containers
        server: plint
        container: dockge

    - Metrics:
        icon: beszel.png
        href: https://metrics.{{HOMEPAGE_VAR_DOMAIN}}
        description: Beszel · history
        server: plint
        container: beszel

    # No dot here: Uptime Kuma pings the tailnet address instead.
    - Tailscale:
        icon: tailscale-light.png
        href: https://login.tailscale.com/admin/machines
        description: Remote access
