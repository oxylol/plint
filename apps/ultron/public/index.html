<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e11">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ultron">
<title>Ultron</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/geist-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/doto-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ultron.css">
</head>
<body>
<header class="top">
  <a class="home" id="home" href="/" aria-label="Plint home">
    <svg viewBox="0 20 128 88" aria-hidden="true"><path d="M14 74h108v20l-8 8H6V82zM26 50h72v12l-6 6H20V56zM49 28h57v11l-5 5H44V33z"/></svg>
  </a>
  <div class="who">
    <h1 id="name" aria-label="Ultron">ULTRON</h1>
    <small><span class="ru">УЛЬТРОН // </span>UNIT 5230<span class="clock" id="clock"></span></small>
  </div>
  <div class="state" id="stateBox" role="status">
    <i class="blk" id="lamp"></i><span id="state">READY</span><span class="ru" id="stateRu">ГОТОВ</span>
  </div>
</header>

<main>
  <section class="core">
    <button class="face" id="faceBtn" type="button" aria-label="Talk to Ultron">
      <canvas id="face"></canvas>
    </button>
    <video id="eye" playsinline muted hidden aria-label="What he sees. Tap to switch camera."></video>
    <div class="read">
      <div><span>MIND <span class="ru">/ РАЗУМ</span></span><b id="rMind">CELERIS-1</b></div>
      <div><span>VOICE <span class="ru">/ ГОЛОС</span></span><b id="rVoice">...</b></div>
      <div><span>TURNS <span class="ru">/ ХОДЫ</span></span><b id="rTurns" class="num">0</b></div>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <section class="talk">
    <div class="grp bar">
      <span>TRANSCRIPT <span class="ru">/ ПРОТОКОЛ</span></span>
      <span class="acts">
        <button class="btn o sm" id="swMem" type="button" aria-pressed="false" aria-controls="memory">MEMORY</button>
        <button class="btn o sm" id="swTune" type="button" aria-pressed="false" aria-controls="tune">TUNE</button>
        <button class="btn o sm" id="swForget" type="button" title="Forget this talk: the transcript is cleared, a line or two of it stays with him">FORGET</button>
      </span>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>
</main>

<section class="tune" id="tune" hidden aria-label="Tune what he is given">
  <div class="grp"><span>TUNING <span class="ru">/ НАСТРОЙКА</span></span><span id="tuneWho">WHAT HE IS GIVEN</span></div>
  <div id="tuneRows"></div>
  <label class="tx"><span>ALSO TELL HIM <span class="ru">/ ЕЩЁ</span></span>
    <textarea id="tuneExtra" rows="3" maxlength="2000" placeholder="ANYTHING ELSE, IN PLAIN WORDS" spellcheck="false"></textarea></label>
  <div class="tfoot">
    <button class="btn o sm" id="tunePrompt" type="button" aria-pressed="false">SHOW THE PROMPT</button>
    <span class="gap"></span>
    <button class="btn sm" id="tuneClose" type="button">DONE</button>
  </div>
  <pre id="tuneText" hidden></pre>
</section>

<section class="tune" id="memory" hidden aria-label="What he has learned">
  <div class="grp"><span>MEMORY <span class="ru">/ ПАМЯТЬ</span></span><span id="memCount"></span></div>
  <svg id="memGraph" role="img" aria-label="Graph of what he has learned"></svg>
  <p class="memHint" id="memHint"></p>
  <div id="memFacts"></div>
  <div id="memTalks"></div>
  <div class="tfoot">
    <button class="btn o sm" id="memWipe" type="button">WIPE</button>
    <span class="gap"></span>
    <button class="btn sm" id="memClose" type="button">DONE</button>
  </div>
</section>

<footer class="deck">
  <form id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="input" type="text" enterkeyhint="send" placeholder="SAY SOMETHING" aria-label="Say something to Ultron" maxlength="4000">
    <button class="btn o icon" id="mic" type="button" aria-label="Speak" aria-pressed="false" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1h4v8H6zM3 7h1.5v3h7V7H13v4.5H8.75V13H11v1.5H5V13h2.25v-1.5H3z"/></svg>
    </button>
    <button class="btn" id="send" type="submit">SEND</button>
  </form>
  <div class="sw">
    <button class="btn o sm" id="swVoice" type="button" aria-pressed="true">VOICE</button>
    <button class="btn o sm" id="swLoop" type="button" aria-pressed="false" aria-label="Talk mode: he keeps listening. Right after he has spoken, anything you say is for him; later he answers to his name" hidden>TALK</button>
    <button class="btn o sm" id="swLang" type="button" aria-label="Language he listens for" hidden>EN</button>
    <button class="btn o sm" id="swEyes" type="button" aria-pressed="false" aria-label="Eyes: let him see through this device's camera">EYES</button>
    <button class="btn o sm" id="swAwake" type="button" aria-pressed="true" aria-label="Awake: he may speak first, when you come in, when you have gone quiet, or when what he sees changes">AWAKE</button>
  </div>
</footer>
<script src="ultron.js"></script>
</body>
</html>
