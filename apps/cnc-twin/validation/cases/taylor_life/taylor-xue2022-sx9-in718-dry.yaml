# Xue et al. (2022): sialon ceramic (NTK SX9) in dry turning of aged Inconel 718 at 150-250 m/min:
# flank-wear curves (every 30 s) and the time to the VB = 0.3 mm criterion.
format: cnctwin-validation-case
version: 1
id: taylor-xue2022-sx9-in718-dry
quantity: taylor_life
reference:
  src: xue-2022-in718-ceramic-tool-wear
  location: "Sect. 2 and Table 3 (setup, criteria), Sect. 3.2 (inspection every 30 s, flank wear governs SX9 at all speeds), Fig. 2c-d (VB and VN versus cutting time, digitised)"
  digitised: true
  uncertainty_pct: 2
  measured: true
  note: "Figure markers located by colour on the 741 x 642 px PMC image (axes calibrated on the 0 and 0.6 mm ticks: 2.80 um/px), end markers checked on 5x enlargements; digitisation uncertainty about +-5 um. The measurement uncertainty of the wear readings is not stated."
setup:
  operation: longitudinal_turning
  material:
    db: inconel718
    note: "solution-treated and aged IN718 bar (source Table 2: Rm 1430 MPa, Rp0.2 1300 MPa, 40 HRC, 14.7 W/m K; Table 1: Ni 52.15, Cr 19.26, Nb 5.03, Mo 3.03, Ti 1.08, Al 0.56 wt%, Fe bal.)"
  stock:
    src: xue-2022-in718-ceramic-tool-wear
    page: Sect. 2
    form: round bar
    diameter_mm: 140
    length_mm: 250
    note: "45 deg chamfer machined before each cutting entry to protect the ceramic edge"
  tool:
    src: xue-2022-in718-ceramic-tool-wear
    page: Sect. 2
    type: turning_insert
    iso_designation: SNGN 120416T01020
    grade: "NTK SX9 (sialon, Si3N4-based)"
    tool_class: ceramic
    coating: none
    holder: CSRNR 2020K12
    rake_deg: -6
    clearance_deg: 6
    inclination_deg: -6
    cutting_edge_angle_deg: {value: 75, note: "kappa_r of the CSRNR holder as stated ('cutting edge angle of 75 deg')"}
    nose_radius_mm: {value: 1.6, src: est, note: "decoded from the ISO designation (nose-radius code 16 = 1.6 mm); the coding standard was not read in this run"}
    inscribed_circle_mm: {value: 12.7, src: est, note: "decoded from the ISO designation (size 12 of a square insert = 1/2 in IC); not stated in the source"}
    edge_preparation: {value: "T-land 0.10 mm x 20 deg", src: est, note: "decoded from the edge code T01020 of the designation; not stated in words in the source"}
    assumed_inputs: [nose_radius_mm, inscribed_circle_mm, edge_preparation]
  machine:
    src: xue-2022-in718-ceramic-tool-wear
    page: Sect. 2
    model: EMCO Maxxturn 65 turning centre
    max_rpm: 5000
  conditions:
    src: xue-2022-in718-ceramic-tool-wear
    page: Table 3, Sect. 2
    cutting_speed_m_min: [150, 200, 250]
    feed_mm_rev: 0.15
    ap_mm: 1
    coolant: dry
    wear_criterion_VB_mm: 0.3
    wear_criterion_VN_mm: 0.6
    criterion_note: "test stopped when any of VB >= 0.3 mm, VN >= 0.6 mm, severe chipping or fracture was reached (ISO 3685); wear measured every 30 s"
  dynamics: null
  program: null
reference_values:
  - {name: time_to_VB_0.3mm, value: 2.27, unit: min, uncertainty: 0.25, x: 150, x_name: cutting_speed, x_unit: m/min, note: "computed here by linear interpolation between 120 s (VB 0.22) and 150 s (VB 0.37): 136 s; test ended at 150 s"}
  - {name: time_to_VB_0.3mm, value: 1.46, unit: min, uncertainty: 0.25, x: 200, x_name: cutting_speed, x_unit: m/min, note: "between 60 s (VB 0.18) and 90 s (VB 0.31): 88 s; test ended at 90 s"}
  - {name: time_to_VB_0.3mm, value: 1.04, unit: min, uncertainty: 0.25, x: 250, x_name: cutting_speed, x_unit: m/min, note: "between 60 s (VB 0.28) and 90 s (VB 0.56): 62 s; test ended at 90 s"}
reference_curves:
  - name: VB_vc150
    x_name: cutting_time
    x_unit: s
    y_name: VB
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.08], [60, 0.13], [90, 0.17], [120, 0.22], [150, 0.37]]
  - name: VB_vc200
    x_name: cutting_time
    x_unit: s
    y_name: VB
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.11], [60, 0.18], [90, 0.31]]
  - name: VB_vc250
    x_name: cutting_time
    x_unit: s
    y_name: VB
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.16], [60, 0.28], [90, 0.56]]
  - name: VN_vc150
    x_name: cutting_time
    x_unit: s
    y_name: VN
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.19], [60, 0.25], [90, 0.28], [120, 0.30], [150, 0.38]]
  - name: VN_vc200
    x_name: cutting_time
    x_unit: s
    y_name: VN
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.18], [60, 0.23], [90, 0.25]]
  - name: VN_vc250
    x_name: cutting_time
    x_unit: s
    y_name: VN
    y_unit: mm
    uncertainty: 0.005
    points: [[0, 0], [30, 0.11], [60, 0.14], [90, 0.16]]
notes: "Ceramic, not carbide. The source states that flank wear (abrasion by NbC/TiC, with adhesion and Ti-enrichment) governs SX9 at all three speeds (Sects. 3.2-3.4), so the interpolated times to VB = 0.3 mm are the tool lives; they give a Taylor exponent n = ln(250/150) / ln(136/62) = 0.65 (computed here, not in the paper). Note the higher feed (0.15 mm/rev) than the WG300 series of the same paper (taylor-xue2022-wg300-in718-dry). One test per speed (no repeats stated)."
