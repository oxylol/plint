# C45 (221 HV10) drilling with coated solid-carbide twist drills of controlled geometry (point 137.5 deg, helix
# 30 deg, lip clearance 10 deg, web 0.3D, chisel 0.025D), emulsion: measured feed (thrust) force Ff versus feed
# for D 8 mm at vc 80.21 m/min (text values, 10 repeats each) and feed-averaged Ff for three more D/vc settings.
format: cnctwin-validation-case
version: 1
id: thrust-drill-c45-sklenicka2024-carbide
quantity: drilling_thrust
reference:
  src: sklenicka-2024-c45-drilling-feed-force
  location: "Sects. 3.1-3.3 (material, machine, tools), Table 4 (constant tool factors), Table 5 (factor levels), Sect. 5 verification experiment text (Ff per feed at D 8 mm, vc 80.21 m/min; feed-averaged Ff for the four D/vc settings of Fig. 13)"
  digitised: false
  uncertainty_pct: 1
  measured: true
  note: "Values are read from the text (stated with three decimals and a +- term, presumably the standard deviation of the 10 repeats; it is 0.4-1.5 % of each value). The statistic of each force record (steady mean or peak) is not defined in the source."
setup:
  operation: drilling
  material:
    db: aisi1045
    note: "C45 ground bar D 118 x 30 mm; measured HV10 221.5 +- 3.0, Rm 740.5 +- 1.4 MPa, ferritic-pearlitic with 17.5 % ferrite (source Sect. 3.1, Table 2); harder than the normalised DB entry (190 HB)"
  tool:
    src: sklenicka-2024-c45-drilling-feed-force
    page: Sect. 3.2, Tables 4-5
    type: twist_drill
    tool_class: carbide
    tool_material: "Ceratizit CTS20D, coated 'Triple Cr SHM', slightly convex cutting edge; made by RTI, University of West Bohemia"
    diameter_mm: [8, 12]
    lip_count: {value: 2, src: est, note: "assumed: two-flute twist drill (not stated in words)"}
    point_angle_deg: 137.5
    helix_deg: 30
    lip_clearance_deg: 10
    web_diameter: "0.3 D"
    margin_width: "0.115 D"
    supporting_bevel_width: "0.135 D"
    edge_radius_um: 15
    chisel_edge_length: "0.025 D (thinned point)"
    assumed_inputs: [lip_count]
  holder:
    src: sklenicka-2024-c45-drilling-feed-force
    page: Sect. 3.2
    type: hydraulic
    note: "hydro-plastic chuck with exchangeable sleeves for 8-12 mm tools"
  machine:
    src: sklenicka-2024-c45-drilling-feed-force
    page: Sect. 3.2
    model: DMG DMU eVo 40 linear
    dynamometer: Kistler 9272 (workpiece clamped on it)
  conditions:
    src: sklenicka-2024-c45-drilling-feed-force
    page: Table 5, Sect. 5
    hole_depth: "2 D (blind)"
    coolant: "Blaser Blasocut BC 35 Kombi emulsion, 6.9 %"
    fn_mm_rev: [0.09, 0.13, 0.175, 0.22, 0.26]
    vc_m_min: [80.21, 149.79]
    spindle_rpm: {value: "3191 (D 8, 80.21 m/min); 5960 (D 8, 149.79); 2128 (D 12, 80.21); 3973 (D 12, 149.79)", src: est, note: "computed here from vc and D; not stated"}
    repeats: 10
    assumed_inputs: [spindle_rpm]
  dynamics: null
  program: null
reference_values:
  - {name: Ff_feedavg_D8_vc149.79, value: 831.775, unit: N, uncertainty: 10, note: "average of Ff over the five feeds 0.09-0.26 mm/rev at D 8 mm, vc 149.79 m/min (text: 831.775 +- 99.506 N)"}
  - {name: Ff_feedavg_D12_vc80.21, value: 1031.368, unit: N, uncertainty: 10, note: "average over the five feeds at D 12 mm, vc 80.21 m/min (text: 1031.368 +- 139.602 N; elsewhere 1032 N)"}
  - {name: Ff_feedavg_D12_vc149.79, value: 1128.008, unit: N, uncertainty: 10, note: "average over the five feeds at D 12 mm, vc 149.79 m/min (text: 1128.008 +- 129.383 N)"}
  - {name: Ff_feedavg_D8_vc80.21, value: 796.660, unit: N, uncertainty: 10, note: "check: equals the mean of the five per-feed values of the curve below (computed here: 796.66 N)"}
reference_curves:
  - name: Ff_D8_vc80.21
    x_name: fn
    x_unit: mm/rev
    y_name: Ff (feed force)
    y_unit: N
    uncertainty: 8.4
    points: [[0.09, 342.014], [0.13, 550.920], [0.175, 907.039], [0.22, 1031.390], [0.26, 1151.936]]
    note: "text values with +- 2.246, 8.439, 2.939, 4.899, 4.359 N; curve uncertainty = the largest of them"
notes: "A geometry-controlled drilling data set: the same paper's DOE covers D 8-12 mm, fn 0.09-0.26, vc 80-150 m/min, point 130-145 deg, lip clearance 8-12 deg and helix 25-35 deg (Table 5), but its individual measurements are given only through regression models and figures; the verification experiment values above were measured with eps_r 137.5, alpha_o 10, omega_r 30 deg. The companion paper on torque with the same tools and material is case torque-drill-c45-hnatik2025-carbide. The handbook formula of the source (Eq. 2, constants of Table 1) deviates from the measured Ff by 56-81 % (70 % on average) for C45 (discussion section). The 16MnCr5 values of the same experiment are not used (material not in the DB). The jump of Ff between fn 0.13 and 0.175 mm/rev (551 to 907 N) is as printed."
