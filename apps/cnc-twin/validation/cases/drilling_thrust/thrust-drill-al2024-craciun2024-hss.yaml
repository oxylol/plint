# Al 2024-T351 drilling with HSS-Co5 twist drills of 6, 8 and 10 mm, f 0.1-0.4 mm/rev, vc 50-70 m/min:
# steady mean thrust Fz of each hole (Table 3, 27 runs).
format: cnctwin-validation-case
version: 1
id: thrust-drill-al2024-craciun2024-hss
quantity: drilling_thrust
reference:
  src: craciun-2024-al2024-drilling-forces
  location: "Sect. 2 (setup, Tables 1-2), Sect. 2 text (selection of the stabilised range, averaging), Table 3 (Fz per run)"
  digitised: false
  measured: true
  note: "Values read directly; one hole per condition (single measurement, Sect. 2). No scatter is stated; the curve uncertainty is est. (3 %). Example in the text: a 5, f 0.1, vc 50 gives Fz 349.35 N (Table 3: 349.67 N)."
setup:
  operation: drilling
  material:
    db: al7075-t7351
    note: "Al 2024-T351 (Table 1: Cu 3.8-4.9, Mg 1.2-1.8, Mn 0.3-0.9 %); not in the DB: the over-aged 7075-T7351 entry is taken as the nearest high-strength wrought alloy; use 2024-T351 data when available"
  tool:
    src: craciun-2024-al2024-drilling-forces
    page: Sect. 2
    type: twist_drill
    tool_class: hss
    tool_material: HSS-Co5
    diameter_mm: [6, 8, 10]
    lip_count: {value: 2, src: est, note: "assumed: two-flute twist drill"}
    point_angle_deg: {value: 118, src: est, note: "assumed: not stated (common point of general-purpose HSS drills)"}
    helix_deg: {value: 30, src: est, note: "assumed: not stated"}
    web_thickness: {value: "0.15 D", src: est, note: "assumed: not stated"}
    assumed_inputs: [lip_count, point_angle_deg, helix_deg, web_thickness]
  machine:
    src: craciun-2024-al2024-drilling-forces
    page: Sect. 2
    model: HAAS VF-1 vertical machining centre
    dynamometer: "Kistler 9257B, DynoWare 2825A, 2500 Hz; stabilised range of each signal selected and averaged (normal-distribution fit)"
  conditions:
    src: craciun-2024-al2024-drilling-forces
    page: Table 2, Table 3
    feed_mm_rev: [0.1, 0.25, 0.4]
    vc_m_min: [50, 60, 70]
    plan: "full factorial 3 x 3 x 3; the source's 'cutting depth' a = D/2 (3, 4, 5 mm)"
    coolant: {value: dry, src: est, note: "assumed: no coolant is mentioned in the source"}
    hole_depth_mm: {value: 15, src: est, note: "assumed: not stated in the text (shown only in the sample drawing, Fig. 4b, not read)"}
    assumed_inputs: [coolant, hole_depth_mm]
  dynamics: null
  program: null
reference_values: []
reference_curves:
  - {name: Fz_D6_vc50, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 180.47], [0.25, 436.2], [0.4, 690.35]]}
  - {name: Fz_D6_vc60, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 187.51], [0.25, 444.28], [0.4, 704.86]]}
  - {name: Fz_D6_vc70, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 191.19], [0.25, 462.28], [0.4, 700.69]]}
  - {name: Fz_D8_vc50, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 404.73], [0.25, 819.25], [0.4, 1235.76]]}
  - {name: Fz_D8_vc60, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 419.72], [0.25, 849.16], [0.4, 1236.58]]}
  - {name: Fz_D8_vc70, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 423.93], [0.25, 851.75], [0.4, 1227.1]]}
  - {name: Fz_D10_vc50, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 349.67], [0.25, 688.92], [0.4, 1064.77]]}
  - {name: Fz_D10_vc60, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 349.9], [0.25, 717.74], [0.4, 1073.97]]}
  - {name: Fz_D10_vc70, x_name: f, x_unit: mm/rev, y_name: 'Fz (thrust, steady mean)', y_unit: N, points: [[0.1, 352.24], [0.25, 735.42], [0.4, 1090.48]]}
notes: "Caution: the 8 mm drill gives higher thrust than the 10 mm drill at every feed and speed (e.g. 1236 against 1065 N at f 0.4, vc 50), which a geometric model cannot reproduce with equal drill geometry; the drills' point geometry, web and wear state are not given, so the three diameters may differ in point design. The cutting speed has little effect (2-7 % over 50-70 m/min). The source's handbook models miss the measured values by -5 to -459 % (Table 9). Paired torque data: torque-drill-al2024-craciun2024-hss."
