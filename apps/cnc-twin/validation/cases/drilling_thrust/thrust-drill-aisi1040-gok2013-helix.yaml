# Gok et al. (2013): AISI 1040 drilled with 10 mm HSS-E (10 % Co) twist drills of 20, 25 and 30 deg helix, point
# 118 deg, web 3.2 mm, at vc 18 m/min and f 0.1 mm/rev: measured thrust (Table 5).
format: cnctwin-validation-case
version: 1
id: thrust-drill-aisi1040-gok2013-helix
quantity: drilling_thrust
reference:
  src: gok-2013-aisi1040-drilling-thrust-torque
  location: "Sect. 2.1-2.2 (setup, Table 2), Table 5 (measured and predicted force and torque per helix angle), Sect. 3 text (condition of Table 5)"
  digitised: false
  measured: true
  note: "Table 5 does not print its cutting condition; it is taken as vc 18 m/min, f 0.1 mm/rev because the text quotes the 0.38 % prediction error of Table 5 (helix 20 deg) 'for 0.1 mm/rev at cutting speed of 18 m/min' and the FE run of Fig. 7 uses the same condition. Each test repeated twice; values are the average of the signal between 1/4 and 3/4 of the drilling depth."
setup:
  operation: drilling
  material:
    db: aisi1045
    note: "AISI 1040 (not 1045), 'heat treatment applied before testing' (not specified); Table 3: yield 353.4 MPa, UTS 518.8 MPa (simulation inputs). The DB 1045 entry is stronger; scale the flow stress when comparing"
  tool:
    src: gok-2013-aisi1040-drilling-thrust-torque
    page: Sect. 2.1, Table 2
    type: twist_drill
    tool_class: hss
    tool_material: "HSS-E (TS 95/1, 10 % Co), made by Karcan"
    diameter_mm: 10
    point_angle_deg: 118
    helix_deg: [20, 25, 30]
    web_thickness_mm: 3.2
    lip_count: {value: 2, src: est, note: "assumed: standard two-flute twist drill"}
    regrinding: "re-sharpened identically before each test (point angle, clearance, chisel concentricity within tolerance)"
    assumed_inputs: [lip_count]
  machine:
    src: gok-2013-aisi1040-drilling-thrust-torque
    page: Sect. 2.1-2.2
    model: TEZSAN M20MS milling machine (9 kW, 7500 rpm)
    dynamometer: "Kistler 9257BA/9272A two-component (thrust and torque) dynamometer, Advantech ADAM 3016 amplifiers, PCI-1712 card"
  conditions:
    src: gok-2013-aisi1040-drilling-thrust-torque
    page: Table 2, Sect. 2.2
    vc_m_min: {value: 18, note: "condition of Table 5 inferred from the text (see reference.note); the full plan is vc 18/22/28 m/min and f 0.1/0.2/0.3 mm/rev"}
    spindle_rpm: {value: 573, src: est, note: "computed here from vc 18 m/min and D 10 mm"}
    feed_mm_rev: 0.1
    hole_depth_mm: 30
    pilot: "small conical centre hole drilled first to prevent the point from sliding"
    coolant: {value: dry, src: est, note: "assumed: no coolant is mentioned in the source"}
    assumed_inputs: [spindle_rpm, coolant]
  dynamics: null
  program: null
reference_values:
  - {name: Fz_helix20, value: 1290, unit: N, x: 20, x_name: helix angle, x_unit: deg}
  - {name: Fz_helix25, value: 1250, unit: N, x: 25, x_name: helix angle, x_unit: deg}
  - {name: Fz_helix30, value: 1120, unit: N, x: 30, x_name: helix angle, x_unit: deg}
reference_curves: []
notes: "The measured torques of the same table (20.68, 19.45, 18.86 Nm) are not used: for a 10 mm drill at 0.1 mm/rev in a medium-carbon steel the lip torque M = kc f D^2 / 8 is of the order of 2-3 Nm (computed here, est.), so the printed torques are probably in another unit (e.g. kgf cm) or mislabelled. The thrust values (1.1-1.3 kN) are plausible for a 3.2 mm web (thick chisel edge). Figs. 4-6 of the source show the other speeds and feeds (not digitised). Quality: a short conference-style paper with a partly inconsistent text; low weight."
