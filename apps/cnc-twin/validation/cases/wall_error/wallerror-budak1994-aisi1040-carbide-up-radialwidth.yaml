# Budak (1994, PhD thesis; data taken from the thesis, the later Budak & Altintas journal papers were not read):
# measured maximum normal force and maximum surface error versus radial width (1, 3.35, 5.5 mm) and
# feed (0.01, 0.06, 0.1 mm/tooth), up milling of free-machining steel with a 19.05 mm 4-flute carbide end mill.
format: cnctwin-validation-case
version: 1
id: wallerror-budak1994-aisi1040-carbide-up-radialwidth
quantity: wall_error
reference:
  src: budak-1994-thin-wall-milling-thesis
  location: "Sect. 5.3-5.4.2 (optimal-immersion method and tests), Table 5.1 case 3, Fig. 5.9 (maximum normal force) and Fig. 5.10 (maximum surface error), both digitised (thesis pp. 120-121)"
  digitised: true
  uncertainty_pct: 8                 # +-2 to 3 um on errors of 5-81 um, +-10 to 15 N on forces of 70-670 N (scanned figures)
  measured: true
setup:
  operation: peripheral_milling
  material: {db: aisi1045, note: "AISI 1040 free-machining steel in the source (Table 5.1 / Sect. 5.4.2); 1045 is the nearest database entry; the cutting coefficients below are the source's own"}
  tool:
    type: square_endmill
    tool_class: carbide
    coating: {value: none, src: est, note: "not stated"}
    diameter_mm: 19.05
    flutes: 4
    helix_deg: 30
    gauge_length_mm: 50.0
    clamping_stiffness_N_mm: 25000   # measured, stiffer power chuck
    equivalent_radius_ratio: {value: 0.8, note: "model parameter of the author's deflection model (Re = s R, s about 0.8)"}
  holder: {type: "power chuck", note: "Table 5.1: stiffer power chuck"}
  conditions:
    direction: up
    ap_mm: 19.05
    ae_mm_levels: [1.0, 3.35, 5.5]
    exit_angle_deg_levels: [26.5, 49.5, 65.0]   # immersion angles for the three widths (Table 5.1)
    feed_mm_tooth_levels: [0.01, 0.06, 0.10]
    spindle_rpm: 478
    cutting_speed_m_min: 28
    coolant: {value: dry, src: est, note: "not stated"}
  dynamics:
    model: "static: cantilever beam on a collet spring, distributed helical-flute forces"
    cutting_coefficients: {law: "Kt = KT ha^-p (MPa, ha in mm), Kr = Fr/Ft = KR ha^-q; ha = average chip thickness per flute period", KT_MPa: 1140, p: 0.28, KR: 0.47, q: 0.079, note: "Table 5.1, case 3"}
  program: null
reference_values:
  - {name: max_surface_error_st0.01, value: 4.4, unit: um, uncertainty: 2, x: 1.0, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.01, value: 5.3, unit: um, uncertainty: 2, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.01, value: 15.8, unit: um, uncertainty: 2, x: 5.5, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.06, value: 10.1, unit: um, uncertainty: 3, x: 1.0, x_name: radial_width, x_unit: mm, note: "marker partly hidden in the thick simulation line"}
  - {name: max_surface_error_st0.06, value: 15.0, unit: um, uncertainty: 2, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.06, value: 50.8, unit: um, uncertainty: 2, x: 5.5, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.10, value: 14.5, unit: um, uncertainty: 2, x: 1.0, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.10, value: 20.5, unit: um, uncertainty: 2, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_surface_error_st0.10, value: 80.9, unit: um, uncertainty: 2, x: 5.5, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.01, value: 73, unit: N, uncertainty: 10, x: 1.0, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.01, value: 74, unit: N, uncertainty: 10, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.01, value: 99, unit: N, uncertainty: 10, x: 5.5, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.06, value: 166, unit: N, uncertainty: 15, x: 1.0, x_name: radial_width, x_unit: mm, note: "marker partly hidden under the st 0.1 marker"}
  - {name: max_normal_force_st0.06, value: 159, unit: N, uncertainty: 15, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.06, value: 408, unit: N, uncertainty: 15, x: 5.5, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.10, value: 201, unit: N, uncertainty: 10, x: 1.0, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.10, value: 196, unit: N, uncertainty: 10, x: 3.35, x_name: radial_width, x_unit: mm}
  - {name: max_normal_force_st0.10, value: 667, unit: N, uncertainty: 10, x: 5.5, x_name: radial_width, x_unit: mm}
reference_curves: []
notes: "Up milling, so the error is an overcut (absolute values plotted). The test verifies the author's optimal-immersion rule: up to b = 3.35 mm (exit angle 49.5 deg) the maximum error stays at 4-21 um although the material removal rate more than triples from b = 1 mm, while b = 5.5 mm roughly triples-to-quadruples it; error and maximum normal force are nearly proportional at this axial depth. Fig. 5.9's legend swaps the circle and square symbols relative to Fig. 5.10 (circle = 0.1 and square = 0.01 mm/tooth); the squares lie on the st = 0.1 simulation curve and above the st = 0.06 diamonds at every width, so squares are taken as 0.1 and circles as 0.01 mm/tooth in both figures. Digitised from the scanned pages rendered at 6x: axes calibrated on the tick marks, with a correction for the scan rotation (bottom frame 6-11 px lower on the right); marker centres from narrow vertical dark-pixel profiles. The SMSE values of Fig. 5.11 are derived quantities and the simulation curves are model results; neither is stored."
