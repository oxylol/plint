# Budak (1994, PhD thesis): measured surface (form) error profile along the axial depth after half-immersion
# DOWN milling of Al7075 with a 19.05 mm 4-flute HSS end mill (54.5 mm gauge length), axial depth 21.6 mm.
format: cnctwin-validation-case
version: 1
id: wallerror-budak1994-al7075-hss-halfimmersion-down
quantity: wall_error
reference:
  src: budak-1994-thin-wall-milling-thesis
  location: "Sect. 5.4.1 (test description), Table 5.1 case 2 (conditions, coefficients, gauge length, clamping stiffness), Eq. 4.4-4.5 (force law), Fig. 5.6 (measured profiles, digitised; thesis p. 117)"
  digitised: true
  uncertainty_pct: 3                 # about +-3 um and +-0.3 mm (scanned figure)
  measured: true
setup:
  operation: peripheral_milling
  material: {db: al7075-t6, note: "7075 aluminium alloy, temper not stated"}
  tool:
    type: square_endmill
    tool_class: hss
    coating: none
    diameter_mm: 19.05
    flutes: 4
    helix_deg: 30
    gauge_length_mm: 54.5
    clamping_stiffness_N_mm: 10200
    equivalent_radius_ratio: {value: 0.8, note: "the author's deflection model uses Re = s R with s about 0.8 (after Kops et al.); a model parameter, not measured on this tool"}
  holder: {type: "regular (collet) chuck", note: "Table 5.1"}
  conditions:
    direction: down
    radial_immersion_ratio: 0.5
    ae_mm: 9.525
    ap_mm: 21.59
    spindle_rpm: 478
    cutting_speed_m_min: 28
    feed_mm_tooth_per_curve: [0.02, 0.06, 0.10, 0.14]
    coolant: {value: dry, src: est, note: "not stated"}
    measurement: "surface profile measured with a dial gauge from a reference finish surface marked beforehand by precision machining; z = 0 at the free end (tip) of the end mill"
  dynamics:
    model: "static: cantilever beam on a collet spring, distributed helical-flute forces, 50 axial nodes"
    cutting_coefficients: {law: "Kt = KT ha^-p (MPa, ha in mm), Kr = Fr/Ft = KR ha^-q; ha = average chip thickness per flute period", KT_MPa: 437, p: 0.343, KR: 0.180, q: 0.249, note: "identified for down milling (Table 5.1, case 2)"}
  program: null
reference_values: []
reference_curves:
  - {name: surface_error_st0.02, x_name: axial_position_from_tip, x_unit: mm, y_name: surface_error, y_unit: um, uncertainty: 3, points: [[3.05, -73.6], [4.94, -74.5], [10.05, -71.7], [11.31, -71.7], [12.59, -71.6], [13.82, -72.9], [15.08, -74.3], [16.35, -74.1], [17.55, -76.7], [18.79, -79.3], [20.05, -81.7]]}
  - {name: surface_error_st0.06, x_name: axial_position_from_tip, x_unit: mm, y_name: surface_error, y_unit: um, uncertainty: 3, points: [[2.48, -165.1], [3.09, -159.9], [3.74, -157.5], [4.99, -157.5], [5.67, -157.6], [6.29, -157.5], [6.91, -147.4], [7.55, -152.3], [8.16, -157.4], [8.76, -152.9], [10.13, -152.2], [11.37, -152.2], [12.63, -154.7], [13.89, -154.6], [15.11, -154.8], [16.41, -149.7], [17.61, -152.1], [18.86, -157.3], [20.12, -157.3]]}
  - {name: surface_error_st0.10, x_name: axial_position_from_tip, x_unit: mm, y_name: surface_error, y_unit: um, uncertainty: 3, points: [[2.62, -209.4], [3.58, -203.0], [4.77, -205.6], [5.53, -192.8], [6.11, -185.7], [6.8, -189.8], [7.44, -192.8], [8.02, -197.8], [8.69, -197.7], [9.96, -197.7], [11.26, -205.4], [12.5, -205.4], [13.77, -207.8], [15.02, -210.3], [16.24, -207.7], [17.48, -205.2], [18.73, -210.3], [19.97, -210.3]]}
  - {name: surface_error_st0.14, x_name: axial_position_from_tip, x_unit: mm, y_name: surface_error, y_unit: um, uncertainty: 3, points: [[2.59, -264.0], [3.24, -253.3], [3.82, -258.9], [10.23, -253.6], [11.48, -256.3], [12.75, -253.5], [14.0, -266.3], [15.26, -256.2], [16.51, -258.6], [17.72, -261.0], [18.98, -266.3], [20.23, -268.8]]}
notes: "Sign: negative = undercut (material left on the wall): in down milling the normal force deflects the cutter away from the finished surface; the error is nearly constant along z because the force intensity is highest where the cutter is stiffest. Digitised from the scanned thesis page rendered at 6x (6.80 px/um, 34.2 px/mm), markers isolated by morphological opening and assigned by position; markers merged with the simulation curves are missing: st 0.14 between z = 4.5 and 9.5 mm (about -265 to -285 um, on and left of the curve) and a cluster of overlapping st 0.02 markers between z = 5.5 and 9 mm (about -71 to -82 um) could not be separated. The thesis gives the maximum model-measurement difference as about 15 %; the simulation curves are model results and are not stored. Caption: a = 21.6 mm, V = 28 m/min."
