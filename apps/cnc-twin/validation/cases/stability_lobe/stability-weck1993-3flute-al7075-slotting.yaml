notes: "Value = axial depth of cut, x = spindle speed. For each speed only the two bracketing tests are stored: stable_test = deepest stable cut, chatter_test or light_chatter_test = shallowest unstable cut; in this data set every depth below the deepest stable cut was stable and every depth above the shallowest unstable cut chattered, so the bracket carries the whole column. Symbols classified on the scanned thesis page rendered at 6x: open circle = stable, filled circle with a white speck = light chatter, solid = chatter (legend of Fig. 8.10); each marker located on the regular grid and judged by the white area inside a 9 px radius (open > 85 px, light chatter about 5-80 px, chatter 0), ambiguous markers checked on enlarged tiles. Light chatter and chatter differ only by a small speck in the scan, so that distinction is less certain than stable/unstable (it matters only for the label, both are unstable). The tests were first reported by Weck, Altintas and Beer, CAD assisted chatter free NC tool path generation in milling (thesis reference 162, listed as accepted for publication in the International Journal of Machine Tool Design and Research, 1993); that paper was not read here, the data are those reproduced in the thesis. Slotting is stable at 1.0 mm and unstable at 1.5 mm at every speed tested except 1600 rpm (light chatter already at 1.0 mm) and 4800 rpm (chatter at 1.0 mm); no depth below 1.0 mm was tested, so those two speeds have no stable test. The time-domain curve of Fig. 8.10 and the analytical lobes of Fig. 8.11 are model results and are not stored."
