# Weck, Altintas & Beer (1993) chatter tests as reproduced in Budak (1994, PhD thesis, Fig. 8.10; data taken
# from the thesis, no journal paper was read): 30 mm 3-flute end mill with one dominant mode per direction, AlZnMgCu1.5,
# SLOTTING (radial width b = 2R = 30 mm), 1000-4800 rpm in 200 rpm steps, depth in 0.5 mm steps.
format: cnctwin-validation-case
version: 1
id: stability-weck1993-3flute-al7075-slotting
quantity: stability_lobe
reference:
  src: budak-1994-thin-wall-milling-thesis
  location: "Sect. 8.4.2 'Example: milling of a rigid workpiece with 2 DOF end mill' (tool, coefficients, modal parameters, test procedure; thesis p. 221), Fig. 8.10 (test markers, classified from the scanned page; p. 222)"
  digitised: true
  uncertainty_pct: 0                 # tests sit on a regular 200 rpm x 0.5 mm grid; only the symbol class is read
  measured: true
setup:
  operation: peripheral_milling
  material: {db: al7075-t6, note: "AlZnMgCu1.5 (EN AW-7075 type) in the source; temper not stated; the cutting coefficients below are the source's own"}
  tool:
    type: square_endmill
    diameter_mm: 30
    flutes: 3
    helix_deg: 30
    gauge_length_mm: 110
    tool_class: {value: "not stated", src: est, note: "material of the end mill not given; the very low radial coefficient (Kr 0.07) implies a high rake angle"}
  conditions:
    direction: slot
    radial_immersion_ratio: 1.0
    ae_mm: 30
    feed_mm_tooth: 0.07
    spindle_rpm_grid: "1000-4800 in 200 rpm steps"
    depth_grid: "0.5 mm steps (1.0-2.5 mm shown)"
    coolant: {value: dry, src: est, note: "not stated"}
    test_site: "Machine Tool Laboratory (WZL), RWTH Aachen"
  dynamics:
    model: "2 DOF tool: one dominant mode in x (feed) and one in y; cross FRFs neglected"
    modes_x: [{natural_freq_Hz: 603, stiffness_N_mm: 5590, damping_ratio: 0.039}]
    modes_y: [{natural_freq_Hz: 666, stiffness_N_mm: 5715, damping_ratio: 0.035}]
    mode_note: "printed as k = 5590 N/mm, zeta 0.039, omega 3788 rad/s (603 Hz) in x and k = 5715 N/mm, zeta 0.035, omega 4161 rad/s (666 Hz) in y; modal tests on the end mill"
    cutting_coefficients: {Kt_N_mm2: 600, Kr: 0.07, note: "measured milling force coefficients Kt = 600 MPa (tangential) and Kr = 0.07 (radial / tangential ratio)"}
  program: null
