notes: "Value = axial depth of cut of a test, x = spindle speed. Circles = stable, crosses = quasi-periodic chatter, diamonds = period-doubling chatter (Fig. 7 caption). Stability was judged from laser-measured tool deflections, sound and surface roughness. Markers that are not legible in the raster figure of this copy were left out: 10 krpm / 0.2 mm, 11 and 17 krpm / 0.4 mm (filled-looking symbols on the 0.4 mm line), 12.5 and 17.5 krpm / 0.4 mm, 18 krpm and 24 krpm / 0.4 mm. The theoretical boundary (semi-discretisation) in the same panel is a model result and is not stored. Same rig and parameters as the wall_error cases wallerror-insperger2006-sle-*."
