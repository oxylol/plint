reference_curves: []
notes: "Value = axial depth of cut b of a test, x = spindle speed. stable_test: the once-per-revolution sampled tool position settled to a constant value; chatter_test: unstable cut; border_test: marked '+' (border) by the authors. Labelled points A-H come from the text; the other markers were digitised from a 5x render of the manuscript figure (axes calibrated on the frame and the tick marks). The authors' predicted boundary (FEAT, E = 4) is drawn in the same figure but is a model result and is not stored. Displacement sampled at 12 800 samples/s by an eddy-current sensor on the flexure; tests were run first in predicted-stable regions, then near lobes, then in predicted-unstable regions. Two border markers overlap at about 3545 and 3553 rpm, 1.4 mm (read as two tests)."
