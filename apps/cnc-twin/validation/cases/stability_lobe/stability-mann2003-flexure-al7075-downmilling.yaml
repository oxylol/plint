notes: "Value = axial depth of cut b of a test, x = spindle speed. stable_test: the once-per-revolution sampled tool position settled to a constant value; chatter_test: unstable cut; border_test: marked '+' (border) by the authors. Labelled points A-H come from the text; the other markers were digitised from a 5x render of the manuscript figure (axes calibrated on the frame and the tick marks). The authors' predicted boundary (FEAT, E = 4) is drawn in the same figure but is a model result and is not stored. Displacement sampled at 12 800 samples/s by an eddy-current sensor on the flexure; tests were run first in predicted-stable regions, then near lobes, then in predicted-unstable regions. The vertical marker lines of E and H sit at about 3456 and 4106 rpm in the figure while the text gives 3450 and 4100 rpm; the text values are used for E and H."
