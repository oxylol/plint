# Słodki, Zębala & Struzikiewicz (2019): chip-form grade of a Sandvik CNMG120404-SF (H13A) insert in finish
# turning of Ti6Al4V ELI with 70 bar emulsion through a PCLNR..HP holder, over a 4 x 4 grid of feed and depth.
