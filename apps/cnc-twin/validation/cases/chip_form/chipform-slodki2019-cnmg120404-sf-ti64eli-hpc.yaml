notes: "Grade coded +1 (+ preferred), 0 (acceptable), -1 (- unacceptable) from Table 9; AD = cut cross-section f x ap as printed. The pattern the authors describe: for small cross-sections (AD below about 0.06 mm2) the 70 bar jet itself cracks the thin chip, giving preferred or acceptable chips; between about 0.06 and 0.08-0.1 mm2 the chip is too strong for the jet but does not yet fill the groove, giving long chips; above about 0.08-0.1 mm2 the groove is filled and the chip is broken by hitting the tool or workpiece. Table 9 is titled 'SM chip breaker' while Sect. 2 names CNMG120404-SF inserts; the SF breaker of Sect. 2 is used here. The cutting speed differs between cells (Taguchi plan), so the grid mixes 40 and 80 m/min. Mean forces of the same 16 trials are in Table 4 of the paper (Fc 52.5-417.6 N)."
