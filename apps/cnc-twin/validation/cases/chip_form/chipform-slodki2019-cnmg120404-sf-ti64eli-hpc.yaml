    tool_class: carbide
    coating: none
    nose_radius_mm: 0.4
    holder: PCLNR2020K12HP
    chipbreaker_backwall_deg: {value: [3.5, 27.3], note: "measured elevation angle of the rear wall of the chip groove in the cutting position, 3.5 deg at ap 0.25 mm to 27.3 deg at ap 1.0 mm; back-wall height about three times larger at ap 1.0 than at 0.5 mm (Figs. 3-4)"}
