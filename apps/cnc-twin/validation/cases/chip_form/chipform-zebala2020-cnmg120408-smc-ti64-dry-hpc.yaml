notes: "Mean chip lengths as printed in Tables 8 (dry) and 9 (70 bar); the number of chips averaged is not stated. With 70 bar all chips were short and broken; dry, the chip changed from long to short as feed and depth increased (better filling of the SMC groove), with a fair/poor window at 0.15-0.20 mm/rev and ap 1 mm. The tables also list a cutting power Pc for each cell that is higher with HPC than dry; it is not stored here (the force test plan of Table 3 mixes pressure and depth in a Taguchi array, so the per-cell power may come from a fitted model). The Ra results of the paper (Fig. 7) are only plotted."
