notes: "One measured area per feed (Table 3; Rp, Rv, Rc, Rt and Rq are also printed there). Ra does not rise monotonically with fz: with the measured axial mounting errors only three inserts (2, 4, 5) form the surface at low feed, and the effective feed per cutting edge changes as more inserts engage (all five above 0.12 mm/tooth, Table 1), so a face-milling roughness model has to include axial runout of the individual inserts to reproduce the pattern; the authors find the lowest and most stable values at 0.20-0.22 mm/tooth. The tool-workpiece relative displacement (laser interferometer, Table 2: rms 2.6-4.8 um) is also available in the paper. The individual axial and radial errors of the inserts are not printed; only their effect (load per insert) is."
