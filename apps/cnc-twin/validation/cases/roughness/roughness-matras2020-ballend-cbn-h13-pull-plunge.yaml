notes: "x = run number 1-16 of the L16 plan; the run's step-over ae, lead and tilt angles and feed are listed in setup.conditions (run_* lists, same order) and in each Ra note. Feed per tooth = feed / (27 000 x 2) = 0.013-0.036 mm. Measurement uncertainty, instrument and cut-off are not given in the paper; values are averages as printed. The four kinematics cases share the 16 parameter sets: compare across cases to test the effect of the tool inclination direction. The paper's Table 8 machining times are CAM-calculated, not measured."
