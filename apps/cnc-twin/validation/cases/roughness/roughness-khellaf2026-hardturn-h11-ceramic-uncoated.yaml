notes: "Name = nose radius in mm, x = feed; each value is one run of the L36 plan (runs 1/4, 2/5, 3/6 and the other repeated level combinations are replicate runs). In Table 2 the column headers 'f (mm/rev)' and 'Vc (m/min)' are interchanged: the levels stored here make the printed MRR = vc f ap and Kc = Fc / (f ap) agree for all 36 runs, and they put Ra in line with the feed-mark law (f^2/(32 r) gives 0.25, 0.77, 1.56 um at r 0.8 mm), while the header order would contradict both. The paper says feed explains most of the Ra variance (88.7 % coated, 67.0 % uncoated). Ra range of the uncoated insert: 0.20-1.36 um. The insert designation printed (SNGA120408T01020) is the r = 0.8 mm size; the 1.2 mm insert (SNGA120412 in the same family) is not named. Measurement repeat count and uncertainty are not given."
