# Sultana & Dhar (2023): Ra after end milling Ti-6Al-4V with a 12 mm 4-flute HSS-E-PM end mill at
# vc 16-32 m/min and fz 0.08-0.16 mm, dry and with two high-pressure oil supplies (same runs as
# coolant-sultana2023-ti64-endmill-hpc-vs-dry).
format: cnctwin-validation-case
version: 1
id: roughness-sultana2023-endmill-ti64-hss
quantity: roughness
reference:
  src: sultana-2023-ti64-hpc-milling
  location: "Sect. 2 and Table 4 (setup), Sect. 2 text (Surtronic 3+, 0.8 mm sampling length), Table 5 (Ra per run)"
  digitised: false
  measured: true
setup:
  operation: peripheral_milling
  material: {db: ti6al4v, note: "Ti-6Al-4V grade 5, 37 HRC"}
  tool:
    type: square_endmill
    maker_tool: "DORMER HSS-E-PM solid end mill (finishing type)"
    tool_class: hss
    coating: none
    diameter_mm: 12
    flutes: 4
    helix_deg: 30
    rake_deg: 5
    clearance_deg: 15
    tool_state: {value: new, src: est, note: "not stated; wear was studied in separate long runs (Fig. 20)"}
  machine: {model: "vertical knee and column milling machine (Sunlike, China)", power_hp: 7.5}
  coolant:
    cases: "dry; HPC: VG-68 oil, 80 bar, 2.0 L/min, one external 2 mm nozzle 20 mm from the edge; RHPC: same oil, pressure and total flow through a rotary applicator with four 0.5 mm nozzles"
  conditions:
    cutting_speed_m_min: [16, 24, 32]
    feed_mm_tooth: [0.08, 0.12, 0.16]
    ap_mm: 1.0
    ae_mm: 6.0
    measured_surface: "not stated (the paper says Ra was measured 'for each slot'); with ap = 1 mm and ae = 6 mm the floor is cut by the end teeth and the wall by the flank teeth"
    roughness_instrument: "Taylor Hobson Surtronic 3+ portable stylus, sampling length 0.8 mm"
  program: null
