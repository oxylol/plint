notes: "One measurement per run of the 27-run full factorial (Table 5); name = coolant case and cutting speed in m/min, x = feed per tooth. Measurement uncertainty and the number of traces are not given. The text of Sect. 3 quotes dry 1.81 um and HPC 1.32 um at 32 m/min and 0.08 mm/tooth, which disagrees with Table 5 (1.32 and 1.18 um, runs 21 and 11); the table values are stored. The kinematic feed-mark roughness of a sharp end mill at these feeds is far below the measured values, so the case mainly tests the non-kinematic part (built-up edge in dry cutting of Ti-6Al-4V with HSS, which the paper reports, runout, vibration and coolant lubrication). The surface that was measured (floor or wall) is not stated."
