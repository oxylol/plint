notes: 'Weak reference: a tempering colour records the highest temperature the chip''s free surface held long enough to
  grow an oxide film while it cooled in air, not the tool-chip interface temperature. 360 C is the top of the colour scale,
  so 360 means ''at least 360 C'' (most low-speed and the 250-350 m/min tests). The informative values are the ones below
  360 C (50, 70, 150, 450, 500 m/min: 240-300 C). Compare with the simulated chip back-surface temperature after the chip
  leaves the contact, with an estimated +-30 C colour-reading resolution (est: steps of the colour table, not stated in
  the source).'
