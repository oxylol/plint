# Ck45 (AISI 1045) quasi-orthogonal turning, vc = 150 m/min, h 0.01-0.4 mm: measured chip thickness, chip ratio.
# Reference values are read from the source named under reference (see its location and notes).
format: cnctwin-validation-case
version: 1
id: chipratio-orth-ck45-klippel2022-vc150
