notes: 'The source reports high scatter of havg (manual measurement, chip misalignment in the mould, skewing of thin chips,
  Sect. 3.3), so single values may be off by 10-30 %. Trend: havg rises from 10 to ~70 m/min and falls again at higher speed
  (Fig. 27). Shear angle for rake 0 follows from tan(phi) = chip_ratio.'
