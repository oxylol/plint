notes: "Cch is the paper's chip breaking index (Table 5, mean of three repeats, min-max in each note), from the measured chip dimensions (Keyence VHX-7000); 0.01 per millimetre, so 0.29 means about 29 mm of chip length plus spiral diameter (or width plus height for arc chips). The grade in each note is Table 8 (+ correct up to 5 mm, 0 acceptable 5-20 mm, - unacceptable over 20 mm); grades and Cch agree for all 18 tests. Only long spiral and short arc chips occurred. What this case tests is whether a coolant model predicts that the jet direction, not just the pressure, decides whether the chip is broken: at 0.08 mm/rev only (alpha 30, beta 0) and (60, 30) gave short chips, at 0.13 mm/rev (30, 0), (30, 60) and (60, 30); a jet normal to the rake face (alpha 90) never broke the chip. The angle of incidence had no significant effect on the cutting force (ANOVA, Table 6), which rises about 77 % from 0.08 to 0.13 mm/rev. The exact reference line of beta is only drawn in Fig. 1b. The 2D FEM chip simulations of the paper (Fig. 7) are model results and are not stored."
