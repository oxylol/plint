# Struzikiewicz (2023): finish turning of Ti6Al4V ELI with a Sandvik CNGG120404-SGF insert and one external
# 150 bar emulsion jet (0.7 mm nozzle, 20 mm from the corner) aimed from nine directions (alpha x beta) at two
# feeds: measured chip size / breaking index, chip-form grade and cutting force.
format: cnctwin-validation-case
version: 1
id: coolant-struzikiewicz2023-ti64-jet-direction
quantity: coolant_reach
reference:
  src: struzikiewicz-2023-hpc-jet-direction
  location: "Sect. 2 (setup), Fig. 1b (nozzle geometry: 0.7 mm bore, 20 mm distance, alpha/beta definition), Table 1 (material), Tables 3 and 5 (plan, Fc and Cch per test), Table 8 (chip-form grade)"
  digitised: false
  measured: true
setup:
  operation: longitudinal_turning
  material: {db: ti6al4v, note: "Grade 5 ELI (extra-low interstitials) bar D 50 mm: Rm 902 MPa, Rp0.2 815 MPa, A 13 %, Z 49 %, 29 HRC (Table 1)"}
  stock: {diameter_mm: 50}
  tool:
    type: turning_insert
    iso_designation: CNGG120404-SGF
    chipbreaker: SGF
    grade: "Sandvik Coromant 1115"
    tool_class: carbide
    coating: "PVD-coated grade (Sandvik 1115)"
    nose_radius_mm: 0.4
    rake_land_deg: 15                # Fig. 1c, SGF profile
    holder: PCLNR2020K12HP
  machine: {model: "conventional lathe with a high-pressure plunger pump (150 MPa capacity)"}
  coolant:
    fluid: "Blaser Blasocut 2000 universal, 10 % emulsion"
    pressure_bar: 150
    nozzles: 1
    nozzle_diameter_mm: 0.7
    nozzle_distance_mm: 20           # from the insert corner along the jet axis (Fig. 1b)
    nozzle_setting_tolerance_deg: 2
    alpha_deg_levels: [30, 60, 90]   # jet elevation above the rake face; 90 deg = normal to the rake face (Fig. 1b)
    beta_deg_levels: [0, 30, 60]     # jet direction in the rake plane, measured from the reference line of Fig. 1b
    flow_l_min: {value: 2.7, src: est, note: "not stated; orifice estimate Q = Cd A sqrt(2 p / rho) with Cd 0.7, A of a 0.7 mm bore, p 150 bar, rho 1000 kg/m3"}
    aim: "jet onto the rake face, i.e. onto the outer (free) side of the forming chip"
  conditions:
    cutting_speed_m_min: 70
    ap_mm: 0.5
    feed_mm_rev: [0.08, 0.13]
    repeats: 3
    chip_grade_rule: "+ correct: chips up to 5 mm long; 0 acceptable: 5-20 mm; - unacceptable: over 20 mm (Sect. 2); Cch = 0.01 x (mean chip length + spiral diameter) or (width + height) in mm, capped at 1"
  program: null
