  - {name: T_rhpc_vc24, value: 392, unit: degC, x: 0.12, x_name: feed_per_tooth, x_unit: mm}
  - {name: T_rhpc_vc24, value: 504, unit: degC, x: 0.16, x_name: feed_per_tooth, x_unit: mm}
  - {name: T_rhpc_vc32, value: 380, unit: degC, x: 0.08, x_name: feed_per_tooth, x_unit: mm}
  - {name: T_rhpc_vc32, value: 488.17, unit: degC, x: 0.12, x_name: feed_per_tooth, x_unit: mm}
  - {name: T_rhpc_vc32, value: 559.03, unit: degC, x: 0.16, x_name: feed_per_tooth, x_unit: mm}
reference_curves: []
notes: "Each value is one run of the 27-run full factorial (Table 5; the run order is randomised in the paper). Name = coolant case and cutting speed in m/min, x = feed per tooth. The useful comparison for coolant reach is the temperature drop against dry at the same vc and fz: 11-22 % with the single external HPC jet and 15-27 % with the rotary four-nozzle applicator (computed from the table values); the HPC drop is smallest at the highest speed and feed (609 against 687 degC at 32 m/min and 0.16 mm, 11 %). The thermocouple reads an average interface temperature of the whole cut, so the absolute values are a lower bound of the peak edge temperature. The same runs give resultant force Fc and Ra (Table 5); Ra is stored in roughness-sultana2023-endmill-ti64-hss. The CFD part of the paper (Figs. 10-13) is a model result and is not stored."
