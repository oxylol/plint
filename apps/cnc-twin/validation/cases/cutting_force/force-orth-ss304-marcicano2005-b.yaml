notes: Total forces for a 1.5 mm width (depth of cut) of tool B; ap = 1.5 mm reproduces the printed flow stress of row B1
  (1170 MPa). Rows B8/B9 and B3/B10 are repeats at the same h and vc (Fc 650/652 N and 665/627 N). The source's analysis
  assumes continuous chips; at 13-67 m/min a built-up edge cannot be excluded (not discussed in the source).
