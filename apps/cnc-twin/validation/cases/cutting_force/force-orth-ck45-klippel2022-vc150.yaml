    page: Sect. 2.6 (p. 14)
    model: Applitec SCACL-2020X-09 (ISO 2216)
    entering_angle_deg: 90
    inclination_deg: 0
  machine:
    src: klippel-2022-arxiv-orthogonal-data
    page: Sect. 2.6 (p. 12)
    model: Schaublin 42L CNC lathe
    dynamometer: Kistler 9121A5 with 5019A charge amplifier, NI USB-6211
    force_lowpass_Hz: 30
    force_sampling_kHz: 1.1
    drift_correction: idle force recorded 1 mm before the cut and subtracted
  stock:
    src: klippel-2022-arxiv-orthogonal-data
    page: Sect. 2 and 2.6
    form: tube
    outer_diameter_mm: {value: 72, note: D ~ 72 mm (approximate in the source)}
    wall_thickness_mm: {value: 2, note: d ~ 2 mm (approximate in the source)}
    preparation: turned inside and outside in the same clamping from 80 mm bars
  conditions:
    src: klippel-2022-arxiv-orthogonal-data
    page: Sect. 2.6, Table 8, Tables A.12/A.13, Tables B.14/B.15
    test_ids: [V0091, V0092, V0148, V0149, V0150, V0151, V0152, V0093, V0094, V0095, V0154, V0155, V0156, V0096, V0097,
      V0098, V0172, V0173, V0174, V0100, V0101]
    kinematics: 'quasi-orthogonal longitudinal turning of a thin-walled tube end: feed per rev = uncut chip thickness h,
      width of cut = tube wall'
    width_of_cut_mm:
      value: 2
      note: wall thickness d ~ 2 mm (approximate in the source); all forces are reported normalised to w = 1 mm
    coolant: dry
    cut_length_per_test_mm: [21959, 21959, 3308, 3308, 3308, 3308, 3308, 4391, 4391, 4391, 3308, 3308, 3308, 2195, 2195,
