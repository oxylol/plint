    V0156, V0096, V0097, V0098, V0172, V0173, V0174, V0100, V0101
  digitised: false
  measured: true
  note: uncertainty of each value = standard deviation of the force signal during that test (sigma_Fc, sigma_Ff in the table),
    not the scatter between repeats; each combination was usually run three times with a fresh edge; only tests with status
    'ok' are used ('short', 'initially stable', 'questionable', 'saturation', 'instable' and 'error' tests are left out
    as the source advises)
setup:
  operation: orthogonal_turning
  material:
    db: aisi1045
    note: 'Ck45 (C45E) rolled bar, one batch for all tests: supplier tensile test Rm 671 MPa, Rp0.2 420 MPa, A5 22.2 % (Table
      2), ferritic-pearlitic; the outer scale and decarburised zone were turned off before the tests (Sect. 2.6). The DB
      entry is normalised AISI 1045 (+N, ~190 HB): use the batch strength above when calibrating flow stress.'
  tool:
    src: klippel-2022-arxiv-orthogonal-data
    page: Sect. 2.6 (p. 13-14), Table 7, Sect. 2.6.1
    type: turning_insert
    iso_code: CCMW 09T304
