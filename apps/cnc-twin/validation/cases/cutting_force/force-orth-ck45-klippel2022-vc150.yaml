notes: 'Feed sweep h = 0.01-0.4 mm at vc = 150 m/min, dry, uncoated carbide, rake 0. At this speed the source sees BUE traces
  on the chips only at f = 0.02 mm (Sect. 3.2, Table 10: BUE up to 50 m/min at f = 0.02-0.1 mm, none at 450 m/min); wear
  class is M from f = 0.06 mm. The two series at f = 0.2 mm (V0096-V0098, cut 2195 mm; V0172-V0174, cut 3308 mm) differ
  by ~5 % in Fc: this is the between-series repeatability. Fc and Ff are per 1 mm of width; Fp ~ 0 (quasi-orthogonal). Chip
  thickness, tempering colour and wear class for these tests are in chipratio-orth-ck45-klippel2022-vc150 and chiptemp-orth-ck45-klippel2022-temper.'
