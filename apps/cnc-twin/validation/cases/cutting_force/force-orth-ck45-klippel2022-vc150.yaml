# Ck45 (AISI 1045) quasi-orthogonal tube turning, feed sweep at vc = 150 m/min: Fc and Ff per mm width.
# Reference values are read from the source named under reference (see its location and notes).
format: cnctwin-validation-case
version: 1
id: force-orth-ck45-klippel2022-vc150
quantity: cutting_force
reference:
