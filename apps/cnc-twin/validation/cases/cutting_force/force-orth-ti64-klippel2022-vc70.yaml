# Ti6Al4V quasi-orthogonal tube turning, feed sweep at vc = 70 m/min: Fc and Ff per mm width.
# Reference values are read from the source named under reference (see its location and notes).
format: cnctwin-validation-case
version: 1
id: force-orth-ti64-klippel2022-vc70
quantity: cutting_force
reference:
  src: klippel-2022-arxiv-orthogonal-data
  location: Table B.14 (Ti6Al4V), tests V0402, V0403, V0404, V0383, V0385, V0405, V0406, V0407, V0411, V0412, V0413, V0386,
    V0387, V0388, V0408, V0409, V0410, V0389, V0390, V0391
  digitised: false
  measured: true
  note: uncertainty of each value = standard deviation of the force signal during that test (sigma_Fc, sigma_Ff in the table),
    not the scatter between repeats; each combination was usually run three times with a fresh edge; only tests with status
    'ok' are used ('short', 'initially stable', 'questionable', 'saturation', 'instable' and 'error' tests are left out
    as the source advises)
setup:
  operation: orthogonal_turning
  material:
    db: ti6al4v
    note: Ti6Al4V Grade 5, triple VAR, heat treated 750 C / 90 min, air cooled; supplier minimum Rm 952 MPa, Rp0.2 869 MPa,
      A 16.5 %, Z 39 %, 30.0 HRC (Table 2); equiaxed alpha+beta, grain size ~9-10 um (Sect. 4).
  tool:
    src: klippel-2022-arxiv-orthogonal-data
    page: Sect. 2.6 (p. 13-14), Table 7, Sect. 2.6.1
    type: turning_insert
    iso_code: CCMW 09T304
    grade: Sandvik Coromant H13A (uncoated WC-Co)
    tool_class: carbide
    coating: none
    rake_deg: 0
    clearance_deg: 7
    inclination_deg: 0
    entering_angle_deg: 90
    nose_radius_mm: 0.397
    ic_mm: 9.525
    cutting_edge_length_mm: 9.272
    edge_height_mm: 3.969
    edge_radius_um:
      value: 37.5
      note: mean over all 149 inserts (sd 4.9 um, range ~20-50 um along an edge); simulate each test with its own edge_radius_per_test_um
        (average over the ~2 mm cut width at the cut position, measured before the test by focus variation)
    edge_radius_per_test_um: [40.5, 37.7, 36.2, 41.6, 39.4, 36.6, 33.9, 35.9, 36.8, 38.1, 38.6, 39.4, 38.2, 43.9, 33.7,
      37.3, 37.6, 37.9, 40.5, 41.9]
