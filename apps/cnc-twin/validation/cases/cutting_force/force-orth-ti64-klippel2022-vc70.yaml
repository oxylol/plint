notes: Feed sweep h = 0.04-0.2 mm at vc = 70 m/min. All Ti6Al4V chips are segmented, no BUE (Sect. 3.2). The source fits
  a friction coefficient mu_fr ~ 0.3 after removing ploughing (Albrecht method, Sect. 3.4); the apparent friction coefficient
  is 0.4-0.6 at higher feeds.
