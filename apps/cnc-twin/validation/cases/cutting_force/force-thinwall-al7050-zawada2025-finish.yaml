# 7050-T7451 thin-wall finishing (wall 48 mm high, 1-2 mm thick) with a 12 mm four-flute TiB2-coated carbide end
# mill at ap 48 mm, ae 0.2 mm, fz 0.025 mm/tooth, vc 300-900 m/min, dry down-milling: absolute maximum of the
# force component normal to the wall in the first pass (Table A1).
format: cnctwin-validation-case
version: 1
id: force-thinwall-al7050-zawada2025-finish
quantity: cutting_force
reference:
  src: zawada-2025-al7050-thin-wall-forces
  location: "Sect. 2 (setup, Tables 3-5), Sect. 3 (definition of Fx1: absolute maximum of Fx in the first pass, temporary chatter extremes omitted), Table A1 (13 runs of the face-centred central composite design)"
  digitised: false
  uncertainty_pct: 2
  measured: true
  note: "uncertainty_pct is the scatter of the five centre-point repeats (t 1.5 mm, vc 600 m/min: Fx1 281.5, 280.0, 274.1, 284.2, 285.8 N, standard deviation 4.5 N = 1.6 %, computed here); the source gives a coefficient of variation of 2.42 % for its Fx1 model."
setup:
  operation: peripheral_milling
  material:
    db: al7075-t7351
    note: "7050-T7451 plate (AMS 4050K), Table 3: Cu 2.20, Mg 2.10, Zn 6.30, Zr 0.10 %; Rm 520, Rp0.2 450 MPa, A5 13 %. Not in the DB: the over-aged 7075-T7351 entry is the closest (similar strength level); use 7050 data when available."
  stock:
    src: zawada-2025-al7050-thin-wall-forces
    page: Sect. 2
    form: "rectangular sample 100 x 65 mm cut from 50 mm plate, screwed to a mounting plate on the dynamometer"
    wall_height_mm: 48
    wall_thickness_mm: [1, 1.5, 2]
    wall_length_mm: {value: 100, src: est, note: "assumed equal to the sample length; not stated explicitly"}
    base_mm: {value: 2, note: "2 mm thick base left under the wall"}
    assumed_inputs: [wall_length_mm]
  tool:
    src: zawada-2025-al7050-thin-wall-forces
    page: Table 5
    type: square_endmill
    designation: Kyocera SGS 44748 (thin-wall finishing end mill)
    tool_class: carbide
    diameter_mm: 12
    flutes: 4
    helix_deg: 41
    flute_length_mm: 48
    overall_length_mm: 100
    coating: TiB2
    rake_deg: {value: 15, src: est, note: "assumed: not stated (typical of aluminium end mills)"}
    assumed_inputs: [rake_deg]
  holder:
    src: zawada-2025-al7050-thin-wall-forces
    page: Sect. 2
    type: shrink_fit
    designation: ERICKSON AHPVTTMQL1C 12090M, HSK63
  machine:
    src: zawada-2025-al7050-thin-wall-forces
    page: Sect. 2
    model: Avia VMC 800HS machining centre
    dynamometer: "Kistler 9257B on the table, 5070A amplifier, DAQ 5697A, DynoWare"
  conditions:
    src: zawada-2025-al7050-thin-wall-forces
    page: Table 4, Table A1
    vc_m_min: [300, 600, 900]
    spindle_rpm: {value: [7958, 15915, 23873], src: est, note: "computed here from vc and D 12 mm; not stated"}
    fz_mm_tooth: 0.025
    ap_mm: 48
    ae_mm: 0.2
    direction: down
    coolant: dry
    pass_sequence: "two finishing passes, the first along +y on the left side of the wall, the second in the opposite direction on the right side; roughing beforehand with a 16 mm three-flute 44985 end mill left 0.2 mm per side"
    force_frame: "Fx along the machine x axis, normal to the wall; Fy along the feed; Fz axial"
    assumed_inputs: [spindle_rpm]
  dynamics: null
  program: null
reference_values: []
reference_curves:
  - {name: Fx1_max_t1.0, x_name: vc, x_unit: m/min, y_name: "Fx1 (absolute maximum, first pass)", y_unit: N, uncertainty: 4.5, points: [[300, 124.46], [600, 269.05], [900, 210.23]], note: "runs 1, 8, 4"}
  - {name: Fx1_max_t1.5, x_name: vc, x_unit: m/min, y_name: "Fx1 (absolute maximum, first pass)", y_unit: N, uncertainty: 4.5, points: [[300, 149.76], [600, 281.12], [900, 243.26]], note: "runs 2, (3, 6, 10, 12, 13 mean), 7"}
  - {name: Fx1_max_t2.0, x_name: vc, x_unit: m/min, y_name: "Fx1 (absolute maximum, first pass)", y_unit: N, uncertainty: 4.5, points: [[300, 156.49], [600, 305.15], [900, 274.74]], note: "runs 9, 5, 11"}
notes: "Peak (not mean) force normal to a compliant wall. In the first pass the opposite side still carries its 0.2 mm allowance (inferred here from the pass sequence); the second pass (Fx2 in Table A1) is less stable and is not used. Caution on the data: in eight of the thirteen runs Fx2 differs from Fx1 by exactly 10, 14, 20 or 30 N, which looks like a transcription artefact, one more reason to use Fx1 only. The non-monotonic speed effect (maximum at 600 m/min, about twice the 300 m/min value) and the chatter extremes reported in the second pass point to wall and tool dynamics, so a rigid-workpiece force model is expected to miss this case; it is a check for the coupled wall-deflection model. The source also lists natural-thermocouple cutting temperatures (301-362 C) for the same runs (Table A1), not used here."
