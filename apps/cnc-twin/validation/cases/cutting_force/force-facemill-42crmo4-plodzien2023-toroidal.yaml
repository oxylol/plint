notes: "The source does not say whether the tabulated forces are peak or mean values of the recorded signals. With one insert engaged over about a quarter of each revolution, a mean over the revolution would be several times smaller than the values given (e.g. FfN 525 N at fz 0.1, ap 1.5 mm, where the largest chip section is only about 0.15 mm2), so they are taken as per-pass maxima: compare with the simulated peak of each component (est., not stated in the source). The entering angle of the round insert changes with ap (source Fig. 1), which makes this case a test of the local-edge (chip thickness along the curved edge) model. Built-up material was observed on the dry-cut surfaces. The source's FEM (AdvantEdge power law) differed by -9 % (FfN), -12 % (Ff) and +4 % (Fa) on average."
