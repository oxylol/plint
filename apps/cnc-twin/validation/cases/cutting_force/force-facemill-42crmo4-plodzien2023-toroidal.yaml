  - name: FfN_fz0.05
    x_name: ap
    x_unit: mm
    y_name: FfN
    y_unit: N
    uncertainty: 8
    points: [[0.5, 172], [1.5, 372], [2.5, 588]]
    note: "tests 6, 3, 9"
  - name: FfN_fz0.10
