notes: "Caveats: the effective cutting speed is low (about 12 m/min at the 3.9 mm engaged diameter of the 0.5 mm deep slot, computed here) and the ball centre cuts at zero speed, so the axial force is dominated by indentation; Fy (normal to the feed) is larger than Fx (feed) and grows almost linearly with fz, which a mechanistic model must reproduce with the source's frame and rotation sense. The fitted coefficients of the source (Table 2: Ktc -15935, Krc -6636, Kac 8949 N/mm2) carry signs of its frame and are not used. The orthogonal tests of Tables 9-10 (800-1400 rpm, fz 0.015-0.06, ap 0.1-0.4 mm) are not included because their radial engagement is not stated."
