# Inconel 718 slot milling with an 8 mm carbide ball-end mill (Sandvik 1B240-0800-XA 1630), 1000 rpm,
# depth 0.5 mm: measured average Fx, Fy, Fz for fz 0.02-0.12 mm/tooth (Table 1).
format: cnctwin-validation-case
version: 1
