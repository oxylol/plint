- {name: Fa A7, value: 185, unit: N, x: 0.097, x_name: h, x_unit: mm, note: vc 24 m/min (thrust force)}
- {name: Fc A8, value: 1114, unit: N, x: 0.428, x_name: h, x_unit: mm, note: vc 24 m/min}
