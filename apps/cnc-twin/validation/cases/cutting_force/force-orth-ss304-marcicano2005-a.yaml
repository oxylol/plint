reference_curves: []
notes: 'Total forces for a 1 mm width (depth of cut) of tool A. Width and column alignment were checked against the source''s
  own stress column: sqrt(3) sin(phi)(Fc cos(phi) - Fa sin(phi))/(ap t0) with ap = 1 mm reproduces the printed 1165 MPa
  for row A1. Chip thickness of these tests: chipratio-orth-ss304-marcicano2005.'
