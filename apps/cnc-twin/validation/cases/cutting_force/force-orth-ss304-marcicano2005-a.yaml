# AISI 304 (annealed) orthogonal tube turning, TPGN uncoated carbide (maker A), width 1 mm: Fc and thrust.
# Reference values are read from the source named under reference (see its location and notes).
format: cnctwin-validation-case
version: 1
id: force-orth-ss304-marcicano2005-a
quantity: cutting_force
reference:
  src: marcicano-2005-aisi304-cutting-tests
  location: 'Table 3 (insert of maker A, width 1 mm): Fa, Fc, Vc, t0'
  digitised: false
  measured: true
  note: no measurement uncertainty is stated
setup:
  operation: orthogonal_turning
  material:
    db: aisi304
    note: annealed AISI 304 tubes; quasi-static compression gives JC A 360 MPa, B 1244 MPa, n 0.72 (Table 1); hardness not
      stated
  tool:
    src: marcicano-2005-aisi304-cutting-tests
    page: Sect. 3.2
    type: turning_insert
    iso_code: TPGN 160308
    grade: ISO M-type carbide, uncoated, no chip breaker
    maker: A (not named)
    tool_class: carbide
    coating: none
    rake_deg: 5
    clearance_deg:
      value: 6
      src: est
      note: 'assumed: not stated: ISO 1832 letter P = 11 deg insert clearance (code convention, standard not read) minus
        the 5 deg positive tilt that gives the stated rake'
    edge_radius_um:
      value: 15
      src: est
      note: 'assumed: not stated; typical of a ground (G-tolerance) uncoated insert edge (est.)'
    nose_radius_mm:
      value: 0.8
      src: est
      note: 'assumed: ISO code ''08'' = 0.8 mm corner radius (code convention); outside the cut when the tube wall lies
        on the straight edge'
    assumed_inputs: [clearance_deg, edge_radius_um, nose_radius_mm]
  machine:
    src: marcicano-2005-aisi304-cutting-tests
    page: Sect. 3.2
    model: ROMI S-30 lathe
    dynamometer: load-cell type dynamometer with PC acquisition (make not given)
  stock:
    src: marcicano-2005-aisi304-cutting-tests
    page: Sect. 3.2
    form: machined tube (dimensions not given)
  conditions:
    src: marcicano-2005-aisi304-cutting-tests
    page: Sect. 3.2, Tables 3-4
    test_ids: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11]
    h_per_test_mm: [0.097, 0.428, 0.428, 0.097, 0.06, 0.06, 0.097, 0.428, 0.205, 0.205, 0.205]
    vc_per_test_m_min: [38, 38, 60, 60, 60, 24, 24, 24, 24, 38, 60]
    width_of_cut_mm: 1.0
    kinematics: 'orthogonal tube turning: feed per rev = uncut chip thickness t0, depth of cut = width'
    coolant: {value: dry, src: est, note: 'assumed: not stated; dry orthogonal tests are implied by the analysis'}
    assumed_inputs: [coolant]
  dynamics: null
  program: null
reference_values:
- {name: Fc A1, value: 360, unit: N, x: 0.097, x_name: h, x_unit: mm, note: vc 38 m/min}
- {name: Fa A1, value: 341, unit: N, x: 0.097, x_name: h, x_unit: mm, note: vc 38 m/min (thrust force)}
- {name: Fc A2, value: 983, unit: N, x: 0.428, x_name: h, x_unit: mm, note: vc 38 m/min}
