notes: Orthogonal turning of Ti6Al4V with a 20 deg rake grooving insert, dry. The source's FE model (DEFORM, JC set identified
  analytically in its ref. [21], Coulomb mu 0.7) matches Fc within 8 % in most cases (<2 % at low feed) but the back force
  only within 42 % (Sect. 2.3). Fp (called back force) is the second, in-plane component the source reports, i.e. the thrust
  of this orthogonal cut (the kinematics are not described; for a radial plunge the thrust is radial); it is small (45-75
  N) at a 20 deg rake.
