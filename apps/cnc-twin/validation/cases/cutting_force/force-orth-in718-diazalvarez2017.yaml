notes: Orthogonal disc-edge cutting of Inconel 718 with an uncoated, 25 um-honed, 0 deg rake insert, dry. The thrust force
  is of the same order as the cutting force at f = 0.05 mm (edge radius ~ h), so this case tests the edge/ploughing model.
  Forces are totals for the 2 mm width.
