# Inconel 718 orthogonal disc cutting, uncoated carbide, vc 60-180 m/min, f 0.05-0.1 mm: Fc, Ft (digitised).
# Reference values are read from the source named under reference (see its location and notes).
format: cnctwin-validation-case
version: 1
id: force-orth-in718-diazalvarez2017
quantity: cutting_force
reference:
  src: diazalvarez-2017-in718-orthogonal
  location: Fig. 8a (cutting force) and Fig. 8b (thrust force) vs cutting speed, markers digitised from the 737 x 231 px
    figure (5.6 N/px in a, 4.0 N/px in b)
  digitised: true
  uncertainty_pct: 3
  measured: true
  note: digitisation uncertainty +-1.5 px on the marker centres (+-8 N on Fc, +-6 to +-10 N on Ft where markers overlap);
    no measurement uncertainty stated
setup:
  operation: orthogonal_turning
  material:
    db: inconel718
    note: Inconel 718 disc; heat-treatment condition not stated ('heat-treatable Inconel 718 disk', Sect. 2.3)
  tool:
    src: diazalvarez-2017-in718-orthogonal
    page: Sect. 2.1
    type: turning_insert
    iso_code: TCMW 16T308
    grade: Sandvik H13A (uncoated carbide)
    tool_class: carbide
    coating: none
    rake_deg: 0
    clearance_deg: 7
    edge_radius_um: 25
    nose_radius_mm:
      value: 0.8
      src: est
      note: 'assumed: ISO code ''08'' = 0.8 mm corner radius (code convention); outside the cut on a 2 mm disc'
    assumed_inputs: [nose_radius_mm]
  machine:
    src: diazalvarez-2017-in718-orthogonal
    page: Sect. 2.1
    model: Pinacho Smart lathe 6/165
    dynamometer: Kistler 9257B
    other_sensor: two-colour fibre-optic pyrometer in the tool holder (machined-surface temperature)
  stock:
    src: diazalvarez-2017-in718-orthogonal
    page: Sect. 2.1
    form: disc
    outer_diameter_mm: 100
    thickness_mm: 2
  conditions:
    src: diazalvarez-2017-in718-orthogonal
    page: Table 1, Sect. 2.1
    vc_m_min: [60, 90, 120, 180]
    feed_mm_rev: [0.05, 0.08, 0.1]
    width_of_cut_mm: {value: 2, note: '''depth of pass'' 2 mm = disc thickness'}
    coolant: dry
    note: Table 1 also lists 30 m/min; Fig. 8 shows 60-180 m/min only
  dynamics: null
  program: null
reference_values: []
reference_curves:
