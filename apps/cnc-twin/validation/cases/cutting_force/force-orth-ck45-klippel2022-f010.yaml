notes: Speed sweep vc = 10-500 m/min at h = 0.1 mm. In the listed values Fc is 310-325 N/mm at 10 m/min, 253-262 N/mm at
  30-50 m/min (BUE regime, large signal sd), peaks at 70 m/min (380-387 N/mm, with Ff > Fc), then falls to 259-265 N/mm
  at 450-500 m/min. The source describes the rise to medium speeds and the drop beyond (Sect. 3.1), links the friction changes
  to BUE formation and chip segmentation (Sect. 3.4) and mentions dynamic strain ageing for the Kienzle-coefficient rise
  near 300 m/min (Sect. 3.7). A model without BUE/DSA should not be expected to follow the part below ~70 m/min. vc = 100
  and 200 m/min exist only as 'short' tests at this feed and are omitted.
