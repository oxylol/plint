# Wei et al. (2023): axial (Z) thermal error of the spindle of a Vcenter-55 vertical machining centre,
# spindle idling at 2000, 4000 and 6000 rpm for at least 6 h, ISO 230-3 test, ambient band below 13.2 degC
# (batches K7, K1, K3). Measured with capacitive sensors (1 um).
format: cnctwin-validation-case
version: 1
id: spindlegrowth-wei2023-vcenter55-ambient-cold
quantity: spindle_growth
reference:
  src: wei-2023-vcenter55-thermal-error
  location: "Sect. 2.1-2.3, Tables 1-3 (Table 2: K1 3.7 degC initial ambient, 2.2 K rise; K3 6.2 degC, 3.8 K rise), Fig. 4 Z panel (curves K7, K1, K3, digitised)"
  digitised: true
  uncertainty_pct: 3                 # about +-1 um on 34-58 um curves (markers of neighbouring curves overlap); sensor accuracy 1 um
  measured: true
setup:
  operation: spindle_warmup
  machine:
    model: "Vcenter-55 three-axis vertical machining centre"
    maker: "not named in the paper (Vcenter-55 is a Victor Taichung model name)"
    spindle: "not described: drive type, taper, bearing arrangement, preload, cooling and maximum speed are not stated"
    temperature_sensors: "ten Pt100 (0.1 degC): T1-T5 front spindle bearing, T7-T8 spindle motor, T6 and T9 spindle box, T10 machine frame (ambient)"
  conditions:
    test_standard: "ISO 230-3:2020, five-point method (two capacitive sensors in X, two in Y, one in Z, 1 um accuracy); thermal error = displacement minus its initial value"
    spindle_rpm_per_curve: [2000, 4000, 6000]
    load: "spindle idling (no cutting); worktable reciprocating along X and Y at constant feed during the test"
    table_feed_mm_min: 1500
    duration_min: {value: 360, note: "each batch lasted at least 6 h (Sect. 2.2); the plotted curves run to 440-455 min"}
    sample_interval_min: 5
    machine_state_at_start: {value: "cold: the machine had cooled for 2 days before each batch", src: wei-2022-vcenter55-year-round, page: "Sect. 3.1"}
    ambient_band_degC: [3.7, 13.2]
    initial_ambient_K1_degC: 3.7
    ambient_rise_K1_dK: 2.2
    initial_ambient_K3_degC: 6.2
    ambient_rise_K3_dK: 3.8
    ambient_note: "initial ambient of K7 is not given (Table 2 is printed truncated); K7 lies in the band below 13.2 degC (Table 3, condition 1); 3.7 degC is the lowest initial ambient of the series"
  program: null
reference_values:
  - {name: Z_growth_max, value: 34.8, unit: um, uncertainty: 1.0, x: 2000, x_name: spindle_speed, x_unit: rpm, note: "K7, plateau maximum at about 300 min (curve partly hidden behind K32 at 220-270 min)"}
  - {name: Z_growth_max, value: 49.5, unit: um, uncertainty: 1.0, x: 4000, x_name: spindle_speed, x_unit: rpm, note: "K1, plateau maximum at 180-220 min"}
  - {name: Z_growth_max, value: 58.2, unit: um, uncertainty: 1.0, x: 6000, x_name: spindle_speed, x_unit: rpm, note: "K3, plateau maximum at 160-240 min; the largest of all nine curves"}
reference_curves:
  - name: Z_thermal_error_K7_2000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 16.4], [35, 18.0], [40, 19.5], [50, 22.4], [60, 24.8], [70, 26.7], [80, 28.2], [90, 29.6], [100, 30.1], [120, 32.2], [140, 33.3], [160, 34.0], [180, 34.3], [200, 34.5], [300, 34.8], [330, 34.6], [360, 33.9], [390, 33.1]]
  - name: Z_thermal_error_K1_4000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 30.4], [35, 32.3], [40, 34.1], [50, 37.7], [60, 40.1], [70, 42.3], [80, 44.0], [90, 45.3], [100, 46.3], [120, 47.7], [140, 48.6], [160, 49.2], [180, 49.5], [200, 49.3], [220, 49.5], [240, 49.2], [270, 48.8], [300, 48.4], [330, 47.7], [360, 47.3], [390, 46.2], [420, 45.8], [450, 45.4]]
  - name: Z_thermal_error_K3_6000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 37.4], [35, 39.1], [40, 41.1], [50, 45.7], [60, 48.7], [70, 50.9], [80, 52.8], [90, 54.1], [100, 55.3], [120, 56.6], [140, 57.3], [160, 58.1], [180, 58.2], [200, 58.1], [220, 58.0], [240, 57.8], [270, 57.4], [300, 56.8], [330, 56.1], [360, 55.9], [390, 55.5], [420, 55.1], [450, 54.1], [470, 54.0]]
notes: "Digitised from the colour raster of Fig. 4 (Z panel, 707 px wide): axes calibrated on the tick marks (1.16 px/min, 7.62 px/um), each colour separated by its RGB mask, the three curves of a colour separated by vertical clustering and averaged over five pixel columns around each sampled time. Points before 30 min are not given because the 5-min markers of all nine curves overlap there; the curves start at 0 by definition (ISO 230-3 relative displacement) and rise steeply over the first 30 min. The measured Z value is the relative tool-to-table displacement of the whole machine (spindle shaft growth plus headstock and column deformation), not the shaft alone, and the paper states no sign convention (values as plotted). Ambient temperature matters: within one speed the Z error is larger in cold ambient (see spindlegrowth-wei2023-vcenter55-ambient-mid and -warm for the other two bands of the same series). K7 between 220 and 270 min is hidden behind the red K32 curve (both about 35 um) and is not given there. The paper's text names K5 and K44 as the largest and smallest curves; those labels belong to the earlier paper's numbering (wei-2022-vcenter55-year-round, same 46 batches): in this paper's Fig. 4 and Table 2 the largest curve is K3 and the smallest K46."
