# Wei et al. (2023): axial (Z) thermal error of the spindle of a Vcenter-55 vertical machining centre,
# spindle idling at 2000, 4000 and 6000 rpm for at least 6 h, ISO 230-3 test, ambient band above 22.7 degC
# (batches K46, K32, K45). Measured with capacitive sensors (1 um).
format: cnctwin-validation-case
version: 1
id: spindlegrowth-wei2023-vcenter55-ambient-warm
quantity: spindle_growth
reference:
  src: wei-2023-vcenter55-thermal-error
  location: "Sect. 2.1-2.3, Tables 1-3 (Table 2: K45 28.9 degC initial ambient, 0.8 K rise; K46 32.2 degC, 1.5 K rise), Fig. 4 Z panel (curves K46, K32, K45, digitised)"
  digitised: true
  uncertainty_pct: 4                 # about +-1 um on 17-46 um curves (markers of neighbouring curves overlap); sensor accuracy 1 um
  measured: true
setup:
  operation: spindle_warmup
  machine:
    model: "Vcenter-55 three-axis vertical machining centre"
    maker: "not named in the paper (Vcenter-55 is a Victor Taichung model name)"
    spindle: "not described: drive type, taper, bearing arrangement, preload, cooling and maximum speed are not stated"
    temperature_sensors: "ten Pt100 (0.1 degC): T1-T5 front spindle bearing, T7-T8 spindle motor, T6 and T9 spindle box, T10 machine frame (ambient)"
  conditions:
    test_standard: "ISO 230-3:2020, five-point method (two capacitive sensors in X, two in Y, one in Z, 1 um accuracy); thermal error = displacement minus its initial value"
    spindle_rpm_per_curve: [2000, 4000, 6000]
    load: "spindle idling (no cutting); worktable reciprocating along X and Y at constant feed during the test"
    table_feed_mm_min: 1500
    duration_min: {value: 360, note: "each batch lasted at least 6 h (Sect. 2.2); the plotted curves run to 440-455 min"}
    sample_interval_min: 5
    machine_state_at_start: {value: "cold: the machine had cooled for 2 days before each batch", src: wei-2022-vcenter55-year-round, page: "Sect. 3.1"}
    ambient_band_degC: [22.7, 32.2]
    initial_ambient_K45_degC: 28.9
    ambient_rise_K45_dK: 0.8
    initial_ambient_K46_degC: 32.2
    ambient_rise_K46_dK: 1.5
    ambient_note: "initial ambient of K32 is not given (Table 2 is printed truncated); K32 lies in the band above 22.7 degC (Table 3, condition 8); 32.2 degC is the highest initial ambient of the series"
  program: null
reference_values:
  - {name: Z_growth_max, value: 17.7, unit: um, uncertainty: 1.0, x: 2000, x_name: spindle_speed, x_unit: rpm, note: "K46, plateau maximum at about 270 min; the smallest of all nine curves"}
  - {name: Z_growth_max, value: 35.0, unit: um, uncertainty: 1.0, x: 4000, x_name: spindle_speed, x_unit: rpm, note: "K32, plateau maximum at 180-270 min"}
  - {name: Z_growth_max, value: 46.1, unit: um, uncertainty: 1.0, x: 6000, x_name: spindle_speed, x_unit: rpm, note: "K45, plateau maximum at about 220 min"}
reference_curves:
  - name: Z_thermal_error_K46_2000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 6.8], [35, 7.5], [40, 8.1], [50, 9.7], [60, 11.6], [70, 12.5], [80, 13.2], [90, 13.6], [100, 14.8], [120, 15.3], [140, 15.8], [160, 16.7], [180, 16.9], [200, 17.2], [220, 17.5], [240, 17.4], [270, 17.7], [300, 16.8], [330, 16.8], [360, 16.6], [390, 16.3], [420, 15.9], [450, 15.9], [470, 15.1]]
  - name: Z_thermal_error_K32_4000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 19.2], [35, 21.4], [40, 22.6], [50, 25.3], [60, 27.3], [70, 29.3], [80, 30.5], [90, 31.3], [100, 32.1], [120, 33.3], [140, 33.9], [160, 34.7], [180, 34.8], [200, 35.0], [220, 34.9], [240, 34.6], [270, 34.8], [300, 34.3], [330, 33.9], [360, 33.1], [390, 32.1]]
  - name: Z_thermal_error_K45_6000rpm
    x_name: time
    x_unit: min
    y_name: Z_thermal_error
    y_unit: um
    uncertainty: 1.0
    points: [[0, 0], [30, 27.1], [35, 29.2], [40, 30.6], [50, 34.4], [60, 37.1], [70, 38.8], [80, 40.1], [90, 41.1], [100, 42.8], [120, 43.4], [140, 44.6], [160, 44.8], [180, 45.5], [200, 45.0], [220, 46.1], [240, 45.1], [270, 45.3], [300, 44.7], [330, 44.2], [360, 43.0], [390, 42.7]]
notes: "Digitised from the colour raster of Fig. 4 (Z panel, 707 px wide): axes calibrated on the tick marks (1.16 px/min, 7.62 px/um), each colour separated by its RGB mask, the three curves of a colour separated by vertical clustering and averaged over five pixel columns around each sampled time. Points before 30 min are not given because the 5-min markers of all nine curves overlap there; the curves start at 0 by definition (ISO 230-3 relative displacement) and rise steeply over the first 30 min. The measured Z value is the relative tool-to-table displacement of the whole machine (spindle shaft growth plus headstock and column deformation), not the shaft alone, and the paper states no sign convention (values as plotted). Ambient temperature matters: within one speed the Z error is larger in cold ambient (see spindlegrowth-wei2023-vcenter55-ambient-cold and -mid for the other two bands of the same series). The paper's text names K5 and K44 as the largest and smallest curves; those labels belong to the earlier paper's numbering (wei-2022-vcenter55-year-round, same 46 batches): in this paper's Fig. 4 and Table 2 the largest curve is K3 and the smallest K46."
