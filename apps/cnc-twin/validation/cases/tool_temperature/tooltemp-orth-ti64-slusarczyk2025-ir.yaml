reference_curves: []
notes: 'What is measured: the mean apparent temperature of a 2 x 1 mm area on the tool, seen from the side (the source writes
  ''tool flank'') next to the chip-tool contact, recorded at 30 Hz during stable cutting. It is not the peak rake-face temperature:
  the source''s own contact model gives 24-73 C higher maximum values (~17 %). A simulator should average its tool side-face
  temperature over the same 2 x 1 mm window at the cutting edge. The camera position was chosen so that the flowing chip
  does not obstruct the window (Sect. 3.2).'
