[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cnctwin"
version = "1.0.0"
description = "One-to-one CNC machining simulator: a physical twin of machine, controller, tool, workpiece, chips and coolant"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0,<2.3",
  "scipy>=1.13",
  "numba>=0.60",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "matplotlib>=3.8",
  "pillow>=10",
  "weasyprint>=61",
  "imageio-ffmpeg>=0.4.9",
  "cadquery-ocp>=7.7",
  "asyncua>=1.0",
]

[project.optional-dependencies]
gpu = ["numba-cuda>=0.4"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
twin = "cnctwin.cli:main"

[tool.setuptools.packages.find]
include = ["cnctwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running (regression projects, validation, convergence)",
  "ui: browser UI tests (Playwright)",
  "gpu: needs a CUDA device or the CUDA simulator",
]
addopts = "-m 'not slow and not ui' --import-mode=importlib"
