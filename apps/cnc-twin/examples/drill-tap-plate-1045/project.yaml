# CNC Twin example: drilled and rigid-tapped AISI 1045 plate on the Haas VF-2SS (README.md, EXPECTED.md).
# Frames as in db/_templates/project.yaml: fixture_pose and work offsets in machine coordinates (table
# top at Z -610). PMI (datums, hole positions, hole sizes) is in part.step; the thread class is by hand.
format: cnctwin-project
version: 1
name: "Drill and tap plate, AISI 1045"
description: "6 x M8 on a 50 mm bolt circle and 4 x M10, through: spot/countersink, carbide drills with through-spindle coolant in G83, 90 deg countersink, rigid tapping G84 with spiral-point taps"
seed: 2045

machine: haas-vf2ss                          # TSC (21 bar) is a VF-2SS option listed in the machine file: used here
controller_overrides: {}

material:
  id: aisi1045
  batch:
    kc_scale_sigma: 0.04
    hardness_sigma_pct: 3

environment:
  ambient_degC: 20
  coolant_degC: 22
  machine_state: warm
  time_between_ops_min: 10

stock:
  kind: block
  size_mm: [160, 80, 16]                     # 1045 flat bar 80 x 16, sawn to 160
  tolerance_mm: [0.3, 0.2, 0.1]
  non_squareness_deg: 0.1
  form: hot_rolled_bar
  mesh: null

cad:
  path: part.step                            # make_cad.py; AP242 with semantic PMI
  units: mm
  placement: {translate_mm: [0, 0, 0], rotate_deg: [0, 0, 0], order: xyz}
  datums:                                    # the same three datums are in the STEP PMI
    - {label: A, feature: {face: plane, normal: [0, 0, -1], near_mm: [80, 40, 0]}}
    - {label: B, feature: {face: plane, normal: [-1, 0, 0], near_mm: [0, 40, 8]}}
    - {label: C, feature: {face: plane, normal: [0, -1, 0], near_mm: [80, 0, 8]}}
  tolerances:                                # threads by hand (6H); PMI carries the same positions and the minor-diameter limits
    - {id: m8-1, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [105, 40, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [105, 40], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m8-2, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [92.5, 61.651, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [92.5, 61.651], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m8-3, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [67.5, 61.651, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [67.5, 61.651], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m8-4, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [55, 40, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [55, 40], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m8-5, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [67.5, 18.349, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [67.5, 18.349], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m8-6, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [92.5, 18.349, 8], radius_mm: 3.4}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [92.5, 18.349], diameter_mm: {nominal: 8, fit: 6H}}
    - {id: m10-1, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [35, 25, 8], radius_mm: 4.25}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [35, 25], diameter_mm: {nominal: 10, fit: 6H}}
    - {id: m10-2, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [125, 25, 8], radius_mm: 4.25}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [125, 25], diameter_mm: {nominal: 10, fit: 6H}}
    - {id: m10-3, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [125, 55, 8], radius_mm: 4.25}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [125, 55], diameter_mm: {nominal: 10, fit: 6H}}
    - {id: m10-4, kind: position, feature: {face: cylinder, axis: [0, 0, 1], near_mm: [35, 55, 8], radius_mm: 4.25}, tolerance_mm: 0.1, datums: [A, B, C], basic_mm: [35, 55], diameter_mm: {nominal: 10, fit: 6H}}

tools:
  library: null
  list:
    - number: 1
      tool: osg-62910-nc-lds-10x90           # HSSE spot drill D10 x 90 deg (centering 22-30 m/min, 0.10-0.18 mm/rev in 1045)
      holder: haimer-40-720-16               # ER16 CAT40
      stickout_mm: 45
      length_offset_mm: 115.000
      radius_offset_mm: 5.0
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 1, limit_min: 120, used_min: 20, sister_of: null}
      initial_wear: {VB_mm: 0.02}
      comment: "D10 90DEG SPOT DRILL"
    - number: 2
      tool: osg-8690680-ado-3d-6.8           # carbide, internal coolant, 3D (80-160 m/min, 0.14-0.26 mm/rev)
      holder: haimer-40-720-16               # through-coolant needs a sealed ER16 collet (not in the database)
      stickout_mm: 40
      length_offset_mm: 110.000
      radius_offset_mm: 3.4
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 2, limit_min: 60, used_min: 5, sister_of: null}
      initial_wear: {VB_mm: 0.01}
      comment: "D6.8 CARBIDE DRILL"
    - number: 3
      tool: osg-8690850-ado-3d-8.5
      holder: haimer-40-720-16
      stickout_mm: 50
      length_offset_mm: 120.000
      radius_offset_mm: 4.25
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 3, limit_min: 60, used_min: 5, sister_of: null}
      initial_wear: {VB_mm: 0.01}
      comment: "D8.5 CARBIDE DRILL"
    - number: 4
      tool: harvey-18032                     # 1/2 in 90 deg pointed chamfer cutter, M-42 HSS-Co
      holder: haimer-40-720-32               # ER32 CAT40
      stickout_mm: 35
      length_offset_mm: 105.000
      radius_offset_mm: 6.35
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 4, limit_min: 120, used_min: 30, sister_of: null}
      initial_wear: {VB_mm: 0.0}
      comment: "D12.7 90DEG CHAMFER MILL"
    - number: 5
      tool: osg-8325107-a-pot-m8x1.25        # spiral point, through holes (15-50 m/min in S45C)
      holder: haimer-40-720-16
      stickout_mm: 45
      length_offset_mm: 115.000
      radius_offset_mm: 4.0
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 5, limit_min: null, used_min: 0, limit_parts: 400, sister_of: null}
      initial_wear: {VB_mm: 0.0}
      comment: "M8X1.25 TAP"
    - number: 6
      tool: osg-8325117-a-pot-m10x1.5
      holder: haimer-40-720-16
      stickout_mm: 50
      length_offset_mm: 120.000
      radius_offset_mm: 5.0
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 6, limit_min: null, used_min: 0, limit_parts: 400, sister_of: null}
      initial_wear: {VB_mm: 0.0}
      comment: "M10X1.5 TAP"

coolant:
  fluid: emulsion-8pct                       # flood (M08) for spot, countersink and taps; TSC (M88) for the drills
  concentration_pct: 8
  tank_fill_fraction: 0.9

operations:
  - name: OP10
    program: op10.nc
    setup:
      # workholding frame: the plate's lower-left-bottom corner on the parallels (= stock frame); the plate
      # lies on two 25 mm parallels under y 2..10 and 70..78 (clear of every hole), four straps on T-slot
      # studs in the table clamp the plate ends over the parallels (noses 5 mm onto the plate)
      workholding:
        - {device: carrlane-strap-m12, label: "strap front left", pose: {translate_mm: [5, 6, 16], rotate_deg: [0, 0, 0]}, input_torque_Nm: 47.5, parallels_mm: 25}
        - {device: carrlane-strap-m12, label: "strap back left", pose: {translate_mm: [5, 74, 16], rotate_deg: [0, 0, 0]}, input_torque_Nm: 47.5, parallels_mm: 25}
        - {device: carrlane-strap-m12, label: "strap front right", pose: {translate_mm: [155, 6, 16], rotate_deg: [0, 0, 180]}, input_torque_Nm: 47.5, parallels_mm: 25}
        - {device: carrlane-strap-m12, label: "strap back right", pose: {translate_mm: [155, 74, 16], rotate_deg: [0, 0, 180]}, input_torque_Nm: 47.5, parallels_mm: 25}
      stock_pose: {translate_mm: [0, 0, 0], rotate_deg: [0, 0, 0]}
      work_offsets_mm: {G54: [-461.0, -243.2, -569.0]}      # plate corner, top (edge-found X/Y, touched-off Z)
      fixture_pose: {translate_mm: [-461.0, -243.2, -585.0], rotate_deg: [0, 0, 0]}   # parallels' top, plate centred on the table
    from_previous: null
    nozzle_positions: {}

production:
  parts: 1
  operator: {load_s: 60, unload_s: 40, door_s: 4, clean_s: 20, inspect_every: 0, inspect_s: 90}

physics:
  tick_s: 1.0e-6
  max_deg_per_step: 0.5                      # 5150 rpm: dt <= 16 us -> l0 stride 10 ticks
  steps_per_tooth: 96
  macro_ipo: 10
  lag_macro: 1
  lattice_mm: 0.1                            # thread pitch 1.25 / 0.1 = 12.5 samples per pitch on the hole walls
  refine: []
  edge_element_mm: 0.25
  memory_bins: 720
  polar_theta_bins: 720
  particles_per_tooth: 0.1
  tol_mass: 1.0e-9
  tol_energy: 1.0e-6
  thermal: {every_n_macro: 5, cell_mm: 2.0}
  structure: {every_n_macro: 50, max_dof: 50000}
  coolant: {every_n_macro: 1, rays_per_jet: 64}
  resolved: {}

recording:
  fast: windows
  fast_window_revs: 4
  fast_period_s: 1.0
  keyframe_period_s: 0.5

outputs:
  report: [html, pdf]
  images: true
  video: {fps: 25, speed: 10}
  audio: true

uncertainty:
  runs: 20
  method: lhs
  vary: {stock_size: true, tool_offsets_um: 5, runout_um: 3, kc_scale_sigma: 0.04, clamping_force_rel: 0.1}

machine_data: null
