# CNC Twin example: pocket with two islands in 6061-T6 plate on the Haas VF-2SS (README.md, EXPECTED.md).
# Frames (db/_templates/project.yaml, docs/models/sanity.md): fixture_pose and the work offsets are written
# in machine coordinates (the table frame of a 3-axis mill: X/Y = axis values that put the spindle over
# the point, Z = spindle gauge line on the point; the table top is at Z -610, haas-vf2ss spindle_nose).
format: cnctwin-project
version: 1
name: "Pocket with islands, Al 6061-T6"
description: "3-axis pocket 84 x 64 x 10 with two islands (rectangle and obround, tops 4 mm below the stock top): probe Z set, trochoidal full-depth roughing D10, floor/top/wall finishing D12 with G41"
seed: 1234

machine: haas-vf2ss
controller_overrides: {}

material:
  id: al6061-t6
  batch:                                     # 1-sigma batch variation for the uncertainty runs
    kc_scale_sigma: 0.04
    hardness_sigma_pct: 3

environment:
  ambient_degC: 20
  coolant_degC: 22
  machine_state: warm
  time_between_ops_min: 10

stock:
  kind: block
  size_mm: [100, 80, 30]                     # 6061-T651 plate 30 mm, sawn to 100 x 80
  tolerance_mm: [0.2, 0.2, 0.1]
  non_squareness_deg: 0.05
  form: rolled_plate
  mesh: null

cad:
  path: part.step                            # written by make_cad.py; CAD frame = stock frame (corner origin, z up)
  units: mm
  placement: {translate_mm: [0, 0, 0], rotate_deg: [0, 0, 0], order: xyz}
  datums:
    - {label: A, feature: {face: plane, normal: [0, 0, -1], near_mm: [50, 40, 0]}}      # bottom, on the vise steps
    - {label: B, feature: {face: plane, normal: [-1, 0, 0], near_mm: [0, 40, 15]}}      # left end face (G54 X0)
    - {label: C, feature: {face: plane, normal: [0, -1, 0], near_mm: [50, 0, 15]}}      # front face (G54 Y0)
  tolerances:
    - {id: pocket-depth, kind: distance, between: [{face: plane, normal: [0, 0, 1], near_mm: [50, 4, 30]},
       {face: plane, normal: [0, 0, 1], near_mm: [50, 16, 20]}], nominal_mm: 10, plus_mm: 0.05, minus_mm: 0.05}
    - {id: island-top-depth, kind: distance, between: [{face: plane, normal: [0, 0, 1], near_mm: [50, 4, 30]},
       {face: plane, normal: [0, 0, 1], near_mm: [33, 40, 26]}], nominal_mm: 4, plus_mm: 0.05, minus_mm: 0.05}
    - {id: island-1-flatness, kind: flatness, feature: {face: plane, normal: [0, 0, 1], near_mm: [33, 40, 26]}, tolerance_mm: 0.02}
    - {id: island-2-flatness, kind: flatness, feature: {face: plane, normal: [0, 0, 1], near_mm: [67, 40, 26]}, tolerance_mm: 0.02}
    - {id: wall-position-x, kind: distance, between: [{face: plane, normal: [-1, 0, 0], near_mm: [0, 40, 15]},
       {face: plane, normal: [1, 0, 0], near_mm: [8, 40, 25]}], nominal_mm: 8, plus_mm: 0.03, minus_mm: 0.03}
    - {id: wall-position-y, kind: distance, between: [{face: plane, normal: [0, -1, 0], near_mm: [50, 0, 15]},
       {face: plane, normal: [0, 1, 0], near_mm: [50, 8, 25]}], nominal_mm: 8, plus_mm: 0.03, minus_mm: 0.03}
    - {id: pocket-width, kind: distance, between: [{face: plane, normal: [1, 0, 0], near_mm: [8, 40, 25]},
       {face: plane, normal: [-1, 0, 0], near_mm: [92, 40, 25]}], nominal_mm: 84, plus_mm: 0.03, minus_mm: 0.03}
    - {id: floor-finish, kind: roughness, feature: {face: plane, normal: [0, 0, 1], near_mm: [50, 16, 20]}, Ra_um: 1.6}

tools:
  library: null
  list:
    - number: 1                              # roughing
      tool: helical-59766-mh35al-025-31000   # D10 3FL, LOC 25, uncoated carbide
      holder: haimer-40-720-32               # ER32 collet chuck CAT40, gauge length 70
      stickout_mm: 32
      length_offset_mm: 102.000              # gauge length 70 + stickout 32 (tool setter)
      radius_offset_mm: 5.0
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5                           # HAIMER high-precision ER32 collet accuracy
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 1, limit_min: 60, used_min: 12, sister_of: null}
      initial_wear: {VB_mm: 0.02}
      comment: "D10 3FL CARBIDE ENDMILL"
    - number: 2                              # finishing
      tool: helical-59744-mh35al-020-31200   # D12 3FL, LOC 24, uncoated carbide
      holder: haimer-40-720-32
      stickout_mm: 34
      length_offset_mm: 104.000
      radius_offset_mm: 0.0                  # wear compensation: the program is the tool-centre path, D02 holds the wear only
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 5
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 2, limit_min: 60, used_min: 3, sister_of: null}
      initial_wear: {VB_mm: 0.0}
      comment: "D12 3FL CARBIDE ENDMILL"
    # T20 is the machine's spindle probe (haas-vf2ss probes.spindle_probe, Renishaw OMP40-2, 6 mm ball):
    # H20 to the ball's bottom (the program also sets it with G10 L10), D20 the calibrated effective radius
    - {number: 20, kind: probe, probe: spindle_probe, length_offset_mm: 125.000, radius_offset_mm: 2.999,
       comment: "RENISHAW OMP40-2 SPINDLE PROBE"}

coolant:
  fluid: emulsion-8pct
  concentration_pct: 8
  tank_fill_fraction: 0.9

operations:
  - name: OP10
    program: op10.nc                         # written by make_program.py (with the probe macros O9810/O9811)
    setup:
      workholding:
        - {device: lang-48120-46, pose: {translate_mm: [0, 0, 0], rotate_deg: [0, 0, 0]}, jaw_opening_mm: 80,
           input_torque_Nm: 60, grip_depth_mm: 3, parallels_mm: null}
      # workholding frame: vise centre on the jaw seat (the stock bottom); the self-centring vise centres
      # the 80 mm width across the jaws (y) and the stock is set centred in x by the operator
      stock_pose: {translate_mm: [-50, -40, 0], rotate_deg: [0, 0, 0]}
      # G54 X/Y at the stock's lower-left corner; Z set by hand 0.20 mm above the real top (-480.000): the
      # probe in N10 corrects it to the measured top
      work_offsets_mm: {G54: [-431.0, -243.2, -479.8]}
      fixture_pose: {translate_mm: [-381.0, -203.2, -510.0], rotate_deg: [0, 0, 0]}   # jaw seat 100 mm above the table (riser + vise, est.)
    from_previous: null
    nozzle_positions: {}                     # no P-Cool: the flex nozzles n1/n2 are aimed by hand

production:
  parts: 1
  operator: {load_s: 30, unload_s: 20, door_s: 4, clean_s: 15, inspect_every: 0, inspect_s: 60}

physics:
  tick_s: 1.0e-6
  max_deg_per_step: 0.5                      # 12 000 rpm: dt <= 6.9 us -> l0 stride 5 ticks
  steps_per_tooth: 96
  macro_ipo: 10
  lag_macro: 1
  lattice_mm: 0.075                          # <= min(ae)/4 = 0.3/4 (wall finishing); 2.4 M dexels
  refine: []
  edge_element_mm: 0.25                      # <= the 0.2-0.3 mm finishing depths/widths
  memory_bins: 720
  polar_theta_bins: 720
  particles_per_tooth: 0.1
  tol_mass: 1.0e-9
  tol_energy: 1.0e-6
  thermal: {every_n_macro: 5, cell_mm: 2.0}
  structure: {every_n_macro: 50, max_dof: 50000}
  coolant: {every_n_macro: 1, rays_per_jet: 64}
  resolved: {}

recording:
  fast: windows
  fast_window_revs: 4
  fast_period_s: 1.0
  keyframe_period_s: 0.5

outputs:
  report: [html, pdf]
  images: true
  video: {fps: 25, speed: 10}
  audio: true

uncertainty:
  runs: 20
  method: lhs
  vary: {stock_size: true, tool_offsets_um: 5, runout_um: 3, kc_scale_sigma: 0.04, clamping_force_rel: 0.1}

machine_data: null
