# CNC Twin example: full-width slot plus finishing pass in Ti-6Al-4V with 40 bar through-tool coolant on the
# DMG MORI DMU 50 (SINUMERIK 840D sl). README.md describes the job, EXPECTED.md the physics a run must show.
# Frames (db/_templates/project.yaml, docs/models/sanity.md "Setup geometry convention"): fixture_pose and the
# work offsets are written in machine coordinates at B0 C0 (X/Y = axis values that put the spindle over the
# point, Z = spindle gauge line on the point). On this machine the table top is at Z -625 (machine file:
# spindle nose 625 mm above the table top at Z0) and X0 Y0 is the C-axis centre.
format: cnctwin-project
version: 1
name: "Ti-6Al-4V slot, through-tool coolant, DMU 50 / 840D sl"
description: "Open slot 26 +0.05/0 x 8 deep along a Ti-6Al-4V plate: two full-width slotting passes (ap 3.9) and one climb finishing pass around both walls, TungForce-Rec D25 indexable end mill in a SK40 shrink chuck, ICS 40 bar through the tool"
seed: 6061

machine: dmg-dmu50-3rd-siemens
controller_overrides: {}

material:
  id: ti6al4v
  batch:
    kc_scale_sigma: 0.05                     # titanium heats vary more than aluminium plate
    hardness_sigma_pct: 3

environment:
  ambient_degC: 20
  coolant_degC: 22
  machine_state: warm
  time_between_ops_min: 10

stock:
  kind: block
  size_mm: [100, 70, 30]                     # Ti-6Al-4V AMS 4911 plate 30 mm, sawn and milled square to 100 x 70
  tolerance_mm: [0.1, 0.1, 0.05]
  non_squareness_deg: 0.05
  form: rolled_plate
  mesh: null

cad:
  path: part.step                            # make_cad.py; CAD frame = stock frame (corner origin, z up, top at z 30)
  units: mm
  placement: {translate_mm: [0, 0, 0], rotate_deg: [0, 0, 0], order: xyz}
  datums:
    - {label: A, feature: {face: plane, normal: [0, 0, -1], near_mm: [50, 35, 0]}}     # bottom (vise seat)
    - {label: B, feature: {face: plane, normal: [0, -1, 0], near_mm: [50, 0, 15]}}     # front face (fixed jaw side)
    - {label: C, feature: {face: plane, normal: [-1, 0, 0], near_mm: [0, 35, 15]}}     # left end face
  tolerances:
    - {id: slot-width, kind: distance, between: [{face: plane, normal: [0, 1, 0], near_mm: [50, 21.9875, 26]},
       {face: plane, normal: [0, -1, 0], near_mm: [50, 48.0125, 26]}], nominal_mm: 26.0, plus_mm: 0.05, minus_mm: 0.0}
    - {id: slot-depth, kind: distance, between: [{face: plane, normal: [0, 0, 1], near_mm: [50, 10, 30]},
       {face: plane, normal: [0, 0, 1], near_mm: [50, 35, 22]}], nominal_mm: 8.0, plus_mm: 0.05, minus_mm: 0.05}
    - {id: slot-position, kind: distance, between: [{face: plane, normal: [0, -1, 0], near_mm: [50, 0, 15]},
       {face: plane, normal: [0, 1, 0], near_mm: [50, 21.9875, 26]}], nominal_mm: 21.9875, plus_mm: 0.05, minus_mm: 0.05}
    - {id: floor-flatness, kind: flatness, feature: {face: plane, normal: [0, 0, 1], near_mm: [50, 35, 22]}, tolerance_mm: 0.02}
    - {id: floor-parallel-A, kind: parallelism, feature: {face: plane, normal: [0, 0, 1], near_mm: [50, 35, 22]},
       tolerance_mm: 0.03, datums: [A]}
    - {id: wall-a-parallel-B, kind: parallelism, feature: {face: plane, normal: [0, 1, 0], near_mm: [50, 21.9875, 26]},
       tolerance_mm: 0.03, datums: [B]}
    - {id: wall-a-finish, kind: roughness, feature: {face: plane, normal: [0, 1, 0], near_mm: [50, 21.9875, 26]}, Ra_um: 1.6}
    - {id: wall-b-finish, kind: roughness, feature: {face: plane, normal: [0, -1, 0], near_mm: [50, 48.0125, 26]}, Ra_um: 1.6}
    - {id: floor-finish, kind: roughness, feature: {face: plane, normal: [0, 0, 1], near_mm: [50, 35, 22]}, Ra_um: 3.2}

tools:
  library: null
  list:
    - number: 1
      tool: tungaloy-epav12m025c250r04-avmt1204-ah3225   # TungForce-Rec D25, 4 x AVMT120408PDER-MM AH3225, coolant holes
      holder: haimer-40-445-25-3             # HAIMER Power Shrink SK40 bore 25, gauge length 75, nose 45.5
      stickout_mm: 60                        # clamped 55 of the 80 mm shank (clamping length 48-58)
      length_offset_mm: 135.000              # gauge length 75 + stickout 60 (presetter)
      radius_offset_mm: 12.500
      wear_offsets_mm: {length: 0.0, radius: 0.0}
      runout_um: 12                          # radial TIR of the four inserts, measured on the presetter
      runout_phase_deg: 0
      tilt_urad: 0
      life: {group: 1, limit_min: 30, used_min: 0, sister_of: null}
      initial_wear: {VB_mm: 0.0}             # new edges indexed for this job
      comment: "D25 TUNGFORCE-REC, 4 INSERTS, ICS"

coolant:
  fluid: emulsion-8pct
  concentration_pct: 8
  tank_fill_fraction: 0.9

operations:
  - name: OP10
    program: ti_slot.mpf
    setup:
      workholding:
        # workholding frame H: centre of the vise jaw seat (the stock bottom), 88 mm above the table top
        - {device: lang-45600, pose: {translate_mm: [0, 0, -88], rotate_deg: [0, 0, 0]}, label: "Quick-Point 52 grid plate on the table"}
        - {device: lang-48085-46, pose: {translate_mm: [0, 0, -61], rotate_deg: [0, 0, 0]}, jaw_opening_mm: 70,
           input_torque_Nm: 60, grip_depth_mm: 4, parallels_mm: null, label: "Makro-Grip 77, jaws on y = 0 / 70"}
      stock_pose: {translate_mm: [-50, -35, 0], rotate_deg: [0, 0, 0]}
      # G54 = plate top centre: H (0, 0, 30) -> machine X0 Y0 Z(88 + 30 - 625)
      work_offsets_mm: {G54: [0.0, 0.0, -507.0]}
      fixture_pose: {translate_mm: [0.0, 0.0, -537.0], rotate_deg: [0, 0, 0]}   # plate 27 + vise 65 - grip 4 = 88 above the table
    from_previous: null
    nozzle_positions: {}

production:
  parts: 1
  operator: {load_s: 30, unload_s: 20, door_s: 4, clean_s: 20, inspect_every: 0, inspect_s: 90}

physics:
  tick_s: 1.0e-6
  max_deg_per_step: 0.5                      # S700 (x 1.2 override) = 5040 deg/s -> dt <= 99 us
  steps_per_tooth: 96                        # 4 teeth at 700 rpm: 21.4 ms per tooth -> 223 us (angle rule decides)
  macro_ipo: 10                              # 10 x 2 ms IPO = 20 ms macro step
  lag_macro: 1
  lattice_mm: 0.5                            # base lattice; the slot is refined below
  refine:
    - {box: {min_mm: [-1.0, 20.5, 20.5], max_mm: [101.0, 49.5, 30.5]}, factor: 4}   # 0.125 mm <= min(ae)/4 = 0.512/4
  edge_element_mm: 0.2                       # 6 elements on the R0.8 corner; floor stock 0.2 mm
  memory_bins: 720
  polar_theta_bins: 720
  particles_per_tooth: 0.1
  tol_mass: 1.0e-9
  tol_energy: 1.0e-6
  thermal: {every_n_macro: 5, cell_mm: 2.0}
  structure: {every_n_macro: 50, max_dof: 50000}
  coolant: {every_n_macro: 1, rays_per_jet: 64}
  controller:
    m_codes:
      # machine-builder assignment of the ICS pump (machine file coolant.pumps[id=ics], 40 bar); M8/M9 keep
      # their standard meaning. Assumed: check against the M-code list of the actual machine.
      M7: {kind: coolant, pump: ics, on: true, note: "internal coolant supply (IKZ) through the spindle"}
  resolved: {}

recording:
  fast: windows
  fast_window_revs: 4
  fast_period_s: 1.0
  keyframe_period_s: 0.5

outputs:
  report: [html, pdf]
  images: true
  video: {fps: 25, speed: 10}
  audio: true

uncertainty:
  runs: 20
  method: lhs
  vary: {stock_size: true, tool_offsets_um: 5, runout_um: 4, kc_scale_sigma: 0.05, clamping_force_rel: 0.1}

machine_data: null
