colour: {value: "black", src: balzers-web-dlc}
hardness_HV: {value: 2000, range: [2000, 2800], src: balzers-2010-hq040, page: "p. 21, BALINIT DLC microhardness HK0.01 > 2000", note: "lower bound as printed; Ionbond 41 a-C:H:W + a-C:H 2000-2800 HV"}
