# OSG NC-LDS HSSE starter (spot) drills, read from the OSG General Catalogue 2025-2026 on 2026-11-03.
# Values without src: est are as printed (p. 324 dimensions and icons, p. 441 cutting conditions).
format: cnctwin-tool
version: 1
series_id: osg-nc-lds-starter-drill
maker: "OSG Corporation"
series: "NC-LDS HSSE starter drill (NC spot drill), 90 deg (countersinking) and 120 deg (centering) points"
src: osg-2025-gc-drilling-threading
notes: "OSG states that the 90 deg point is for countersinking (45 deg chamfer) and 120 / 130 deg points are for centering EX-GOLD drills on curved and inclined surfaces. Point angle tolerance 90 +/-1 deg, 120 +/-2 deg, 130 +/-2 deg. Bright HSSE (TIN-NC-LDS is the TiN-coated version). Shank tolerance h7, helix 20 deg (icons p. 324). Cutting conditions p. 441 are for water-soluble coolant; with non-water-soluble oil reduce the speed by 20 %; for long-shank versions reduce the feed; for countersinking the speed may be raised up to 2x the centering speed."
defaults:
  type: spot_drill
  hand: right
  tool_material: {class: hss, grade: "HSSE (cobalt HSS, grade not stated)", id: hss-m42, src: est, note: "OSG prints only 'HSSE'; mapped to the cobalt HSS entry (M42 reference), the closest of the two HSS ids"}
  coating: {id: none}
items:
  - id: osg-62906-nc-lds-6x90
    order_code: "NC-LDS 6 x 90 deg (EDP 62906)"
    geometry:
      diameter_mm: 6
      flutes: {value: 2, note: "two lips in the end-view drawing on p. 324"}
      point_angle_deg: 90
      tip_angle_deg: 90
      tip_diameter_mm: {value: 0, src: est, note: "pointed spot drill (no flat); a chisel edge remains, see web_thickness_mm"}
      helix_deg: 20
      cutting_length_mm: 20
      flute_length_mm: 20
      shank: {diameter_mm: 6, length_mm: 52, form: plain}
      overall_length_mm: 72
      web_thickness_mm: {value: 0.36, src: est, note: "spot drills are ground with a small chisel; 0.06 D (db/models/tooling.yaml spot_drill_web_ratio), not published"}
      centre_cutting: true
      coolant_holes: null
      note: "LCF 20, OAL 72, DCON 6, LS 52, point length PL 3, minimum pre-drilled hole for chamfering 1.5 mm (p. 324)"
    max_rpm: null
    balance_grade: null
    mass_g: 16
    price_eur: null
    regrinds: {value: 3, src: est, note: "HSS spot drills are reground on the point; OSG offers resharpening but publishes no count"}
