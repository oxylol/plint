    geometry:
      insert:
        iso_code: "CNMG120408-TSF"
        shape: C
        included_angle_deg: 80
        ic_mm: 12.7
        thickness_mm: 4.76
        nose_radius_mm: 0.8
        clearance_deg: 0
        wiper: false
        chip_breaker: {name: TSF, rake_deg: {value: 13, page: "B030 pictogram"}, window: {f_mm: [0.08, 0.4], ap_mm: [0.2, 1.5]}, page: "B004 finishing row"}
        page: "B054"
