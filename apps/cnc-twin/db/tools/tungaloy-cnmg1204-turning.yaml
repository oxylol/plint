# Tungaloy CNMG120408 negative 80 deg rhombic turning inserts with chipbreakers TF / TSF / TM / TH
# (steel), SM (stainless), CH (cast iron) and the FW / AFW wipers, each in the PCLNR2525M12E
# lever-lock holder. Read from the Tungaloy General Catalogue 2023-2024 on 2026-11-03.
format: cnctwin-tool
version: 1
series_id: tungaloy-cnmg1204-turning
maker: "Tungaloy Corporation"
series: "CNMG120408 with chipbreakers TF, TSF, TM, TH, SM, CH and wipers FW / AFW in PCLNR2525M12E (95 deg)"
src: tungaloy-2023-gc-insert
notes: "Insert dimensions (B054-B057): RE 0.8, IC 12.7, S 4.76, D1 5.16 mm, negative (0 deg clearance), double-sided M-class. Chipbreaker rake angle and land width are the pictogram values of the chipbreaker overview (B030-B036). The chipbreaker window is the depth-of-cut and feed range of Tungaloy's standard cutting conditions (B004 steel, B006 stainless, B008 cast iron), not the shaded chip-control chart, except for the wipers (no tabulated conditions; window digitised from the B034 chart). Tungaloy's counterparts of the Sandvik -PF/-MF, -PM and -PR/-MR breakers are TSF, TM and TH (steel) and SF, SM and SH (stainless). Holder PCLNR2525M12E (C018): H 25, B 25, LF 150, LH 28, HF 25, WF 32 mm, standard RE 0.8, clamping torque 3 N m, 95 deg approach; Tungaloy prints no rake / inclination for the lever-lock holders (db/models/tooling.yaml negative-holder defaults apply). The overhang is a set-up value, estimated."
defaults:
  type: turning_insert
  hand: right
  tool_material: {class: carbide, grade: "CVD-coated carbide (substrate not stated)", id: carbide-p30, src: est, note: "Tungaloy gives ISO ranges and coating only; CVD P/M/K grades are mapped to the P30 substrate entry"}
