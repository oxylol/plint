# Tungaloy TungCut DTR300-150 ground full-radius insert (R 1.5 mm, CW 3 mm) used as a form tool in
# the CTER2525-3T20 holder, read from the Tungaloy General Catalogue 2023-2024 on 2026-11-03
# (F014, F030, F039, F043, A002).
format: cnctwin-tool
version: 1
series_id: tungaloy-dtr-full-radius-form
maker: "Tungaloy Corporation"
series: "TungCut DTR300-150 full-radius profiling insert (high-precision ground, RE 1.5, CW 3) in CTER2525-3T20"
src: tungaloy-2023-gc-parting-grooving
notes: "Insert DTR300-150 (F039, 'profiling and undercutting, for high precision'): seat size 3, CW 3 +/-0.02 mm, RE 1.5 mm (full radius), INSL 20, h 5 mm, 7 deg clearance (drawing), grades T9225, AH7025, AH725, GH130, NS9530. The cutting edge profile is the semicircle RE 1.5 over the 3 mm width: profile_mm lists [z, x] points of that arc every 15 deg in the tool frame (tip at x = 0, z across the width, x <= 0 behind the tip). Holder CTER2525-3T20 (F014): H 25, B 25, LF 150, LH 38.5, HF 25, WF 25.3 mm, CDX 20. Speeds F043; feed and depth from the DTR standard feed and DoC chart (F030, CW 3 region, digitised). The overhang is a set-up value, estimated."
