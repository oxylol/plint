# Tungaloy deep-hole drills: DeepTri-Drill MCTR indexable gundrill (single effective edge + guide pads,
# L/D 10, for lathes and machining centres) and SLJ brazed gundrills for gundrill machines, read from
# the Tungaloy General Catalogue 2023-2024 on 2026-11-03 (J092, J094, J108, J112, J113, L089, A002).
format: cnctwin-tool
version: 1
series_id: tungaloy-deeptri-gundrills
maker: "Tungaloy Corporation"
series: "DeepTri-Drill MCTR16.00XM25A-10 with TOHT080305R-NDL, and SLJ brazed gundrills 7 and 10 mm (L 1000)"
src: tungaloy-2023-gc-drilling
notes: "Deep-hole drill guide (J092): MCTR dia 10-40, 1 effective cutting edge, L/D 8-45, internal coolant, hole IT10-11, straightness 0.1/100, first choice for P and K; SLJ brazed gundrill dia 3-12.2, length 400-1650 mm, IT7-8, straightness 0.1/100, first choice for K and N, for gundrill machines. Gundrill nomenclature (L089): single lip with outer and inner cutting edge meeting at the apex, guide pads (wear surfaces), V-flute, primary clearance 8-15 deg. The outer / inner edge angles and the apex position are not published: the db/models/tooling.yaml standard gundrill grind (outer 30 deg, inner 20 deg, apex at D/4) applies, which gives the 130 deg 'point angle' stored here (est)."
