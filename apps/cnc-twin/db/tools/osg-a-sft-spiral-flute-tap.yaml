# OSG A-SFT V-coated spiral fluted taps (blind holes), read from the OSG General Catalogue 2025-2026
# on 2026-11-03 (p. 587-589 dimensions and icons, p. 845 cutting speeds, PDF p. 597 tap limits).
format: cnctwin-tool
version: 1
series_id: osg-a-sft-spiral-flute-tap
maker: "OSG Corporation"
series: "A-SFT high-efficiency multi-purpose V-coated spiral fluted tap (blind holes), M6x1 / M8x1.25 / M10x1.5, 6H"
src: osg-2025-gc-drilling-threading
notes: "Icons p. 587: CPM below M27, HSSE from M27; V coating; 45 deg helix. Grade 'STD' = OSG's recommended tap for class 2 / 6H internal threads (PDF p. 597), tap limit OH3. Chamfer 2.5P (also offered with 1.5P and 1P short chamfers). Cutting speeds p. 845 (A-SFT, up to M24, 2.5P): advisable (red) and possible (beige) ranges for water-soluble oil; min/max below are the advisable range, the possible range is in the note. Rake and chamfer relief are not published (db/models/tooling.yaml defaults apply)."
defaults:
  type: tap_cutting
  hand: right
  tool_material: {class: hss, grade: "CPM powder-metallurgy HSS (sizes < M27)", id: hss-m42, src: est, note: "OSG prints 'CPM < M27'; mapped to the cobalt HSS entry (M42 reference)"}
  coating: {id: ticn, src: est, note: "OSG 'V coating'; chemistry and thickness not stated, mapped to TiCN"}
