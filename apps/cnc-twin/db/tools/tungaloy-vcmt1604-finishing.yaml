maker: "Tungaloy Corporation"
series: "VCMT160404-PS (T9215) and -PSS (NS9530 cermet) in SVJCR2525M16 (93 deg) for finishing and profiling"
src: tungaloy-2023-gc-insert
notes: "Insert (B155): VC = 35 deg rhombic, 7 deg clearance, with hole; VCMT160404: RE 0.4, IC 9.525, S 4.76, D1 4.4 mm. Pictograms B155: PS 10 deg rake (no land), PSS 0.15 mm land with 10 deg rake. Window = ap and f of the positive-insert standard cutting conditions for steel (B016). Holder SVJCR2525M16 (C048): H 25, B 25, LF 150, LH 40, HF 25, WF 32 mm, insert VC**1604, standard RE 0.8, 93 deg approach, 50 deg back clearance (cutting edge style J). VBMT (5 deg clearance) inserts are listed with Tungaloy's internal toolholders (B152) and were not paired here. No holder rake / inclination printed; the overhang is a set-up value, estimated."
defaults:
  type: turning_insert
  hand: right
