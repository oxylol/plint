# Tungaloy VCMT160404 positive 35 deg rhombic finishing inserts (PS, PSS chipbreakers) in the
# SVJCR2525M16 screw-on holder, read from the Tungaloy General Catalogue 2023-2024 on 2026-11-03
# (B155, B016, C048, A002).
format: cnctwin-tool
version: 1
