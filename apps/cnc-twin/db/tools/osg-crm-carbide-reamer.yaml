      - {iso_group: N, material_hint: "aluminium alloy castings A7075, ADC", material: al7075-t6, operation: [reaming], vc_m_min: {min: 15, max: 30}, f_mm: {min: 0.08, max: 0.18}, page: "p. 453, 8 mm row", note: "removal amount 0.1-0.2 mm"}
      - {iso_group: H, material_hint: "hardened steel SKT, SKD up to 40 HRC", operation: [reaming], vc_m_min: {min: 6, max: 12}, f_mm: {min: 0.06, max: 0.13}, page: "p. 453, 8 mm row", note: "removal amount 0.1-0.2 mm"}
