# OSG CRM solid carbide straight-flute machine reamers, read from the OSG General Catalogue 2025-2026
# on 2026-11-03 (p. 375-378 dimensions and icons, p. 453 cutting conditions).
format: cnctwin-tool
version: 1
series_id: osg-crm-carbide-reamer
maker: "OSG Corporation"
series: "CRM carbide straight reamer (machine reamer for H7 holes), 8 mm and 10 mm"
src: osg-2025-gc-drilling-threading
notes: "Icons p. 375: carbide (uncoated), diameter tolerance 0 / +0.005 mm (inside the H7 band of 0 / +0.015 mm for 6-10 mm and 0 / +0.018 mm for 10-18 mm), shank h6; drawing: 30 deg lead chamfer of length PLGL, straight flutes; 6 flutes (ZEFP) from 4.01 mm. Sizes are stocked in 0.01 mm steps (EDP 8900000 + DC x 100). Cutting conditions p. 453: feed per rev and removal amount (reaming allowance) by reamer diameter; apply cutting fluid generously, use a rigid, accurate holder. Land (margin) width and rake are not published (db/models/tooling.yaml defaults apply)."
defaults:
  type: reamer
  hand: right
  tool_material: {class: carbide, grade: "uncoated carbide (grade not stated)", id: carbide-submicron-10co, src: est, note: "OSG states only 'carbide'; mapped to the submicron rod grade used for solid round tools"}
  coating: {id: none}
items:
  - id: osg-8900800-crm-8
    order_code: "CRM 8 (EDP 8900800)"
    geometry:
      diameter_mm: 8
      flutes: 6
      helix_deg: 0
      cutting_length_mm: {value: 40, note: "L, flute length"}
      flute_length_mm: 40
      corner_chamfer_mm: {value: 0.8, note: "PLGL, axial length of the lead chamfer"}
      tip_angle_deg: {value: 60, note: "30 deg lead chamfer to the axis as drawn on p. 375, stored as the included angle"}
      shank: {diameter_mm: 8, form: plain}
      overall_length_mm: 90
      centre_cutting: false
      coolant_holes: null
      note: "OAL 90, L 40, PLGL 0.8, DCON 8, ZEFP 6, 61 g (p. 378); diameter tolerance 0 / +0.005 mm"
    max_rpm: null
    mass_g: 61
    price_eur: null
    regrinds: {value: 1, src: est, note: "carbide reamers can be reground on the chamfer only, reducing the diameter after a few regrinds; no count published"}
    cutting_data:
      - {iso_group: P, material_hint: "low carbon / mild steel S15C, SS400 (AISI 1015)", operation: [reaming], vc_m_min: {min: 12, max: 20}, f_mm: {min: 0.08, max: 0.15}, page: "p. 453, 8 mm row", note: "removal amount 0.1-0.2 mm"}
