      web_thickness_mm: {value: 1.02, src: est, note: "minimum web thickness kmin of DIN 1414 test values (YG-1 p. A399 Fig. 2, line from 0.2 mm at d = 1 mm to 10 mm at d = 100 mm: kmin = 0.2 d^0.85); R thinning shortens the chisel at the point; OSG publishes no web thickness"}
      chisel_edge_angle_deg: {value: 125, src: est, note: "conventional 115-135 deg range (db/models/tooling.yaml drill_chisel_angle_rad); not published"}
      margin_width_mm: {value: 0.49, src: est, range: [0.34, 0.69], note: "DIN 1414 guide value of the margin width (YG-1 p. A398 Fig. 4, digitised: guide b = 0.125 d^0.71, lower 0.08 d^0.75, upper 0.17 d^0.73); not published by OSG"}
