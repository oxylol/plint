# OSG EX-GDR TiN-coated HSS-Co twist drills, regular length, read from the OSG General Catalogue
# 2025-2026 on 2026-11-03 (p. 293-294 dimensions and icons, p. 431 cutting conditions).
format: cnctwin-tool
version: 1
series_id: osg-ex-gdr-hss-drill
maker: "OSG Corporation"
series: "EX-GDR EX-GOLD TiN coated HSS-Co drill, regular length (tap drills 6.8 mm for M8 and 8.5 mm for M10)"
src: osg-2025-gc-drilling-threading
notes: "Icons p. 293: HSS-Co, TiN, diameter tolerance h8, shank h7, 30 deg helix; drawing: 130 deg point, X thinning below 4 mm and R thinning from 4 mm. The shank is stepped (DCON larger than DC for these sizes). The EX-GOLD point produces short broken chips (p. 12). Web thickness and margin width are not published by OSG: the values given are the DIN 1414 test values reproduced in the YG-1 technical data (minimum web thickness and guide margin width), marked est. Cutting conditions p. 431 are for water-soluble coolant (dilution <= 20x); with neat oil or > 20x dilution reduce the speed by 20 %; for depths > 4D reduce speed and feed."
defaults:
  type: twist_drill
  hand: right
  tool_material: {class: hss, grade: "HSS-Co (grade not stated)", id: hss-m42, src: est, note: "OSG prints 'HSS-Co'; mapped to the cobalt HSS entry (M42 reference)"}
  coating: {id: tin, note: "TiN coated (product name 'TiN Coated Drill Regular Length'); thickness not published", thickness_um: {value: 2.5, src: est, note: "OSG Corporation publishes no coating thickness: the mean of the typical thickness of db/coatings/tin.yaml (1-4 um, balzers-2010-hq040 p. 21), the value the wear model takes for a coated tool without its own"}}
items:
