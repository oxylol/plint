# Tungaloy TungDrillTwisted TDX-F L/D=3 indexable drills with XPMT-DJ inserts (two effective edges:
# central + peripheral insert), read from the Tungaloy General Catalogue 2023-2024 on 2026-11-03
# (J070, J076, J078, L085, A002).
format: cnctwin-tool
version: 1
series_id: tungaloy-tdx-indexable-drill
maker: "Tungaloy Corporation"
series: "TungDrillTwisted TDX-F L/D=3 indexable drill (flat cotter shank) with XPMT-DJ inserts, 20 and 25 mm"
src: tungaloy-2023-gc-drilling
notes: "Bodies (J070): DC, DCONMS (shank), DCSFMS (flange), LU (max drilling depth), LS, LCF, LF, OAL, max radial offset (the drill can be offset on a lathe to enlarge the hole), mass. Inserts XPMT (J076): 11 deg clearance, one insert designation for both central and peripheral pockets; DJ = general-purpose breaker; DS = sharp breaker for low-carbon / low-alloy / stainless / S materials, DW = wiper / troubleshooting. Recommended insert and grade per material and the standard cutting conditions are on J078 (the conditions are per drill, the first-choice insert is given in each note). Feed f is per revolution; 2D/3D and 4D/5D series have different feed ranges. Use the low end of the feed range at the small end of a diameter range; for difficult materials set the speed 25 % below carbon steel; high-feed machining: 1.5x the standard feed (J078 notes). Cutting forces for SCM440 at 100 m/min: guideline chart L085. The entering angle of the inserts is not published (est)."
defaults:
  type: indexable_drill
  hand: right
  tool_material: {class: carbide, grade: "AH6030 PVD-coated carbide (substrate not stated)", id: carbide-submicron-10co, src: est, note: "PVD grade M25-M35 / S15-S30 (A002); substrate mapped to the fine-grain 10 % Co entry"}
  coating: {id: tialn, src: est, note: "AH6030: (Ti,Al)N (A002); thickness not read"}
