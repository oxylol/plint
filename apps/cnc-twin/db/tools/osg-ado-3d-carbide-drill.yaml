# OSG ADO-3D EgiAs-coated carbide drills with internal coolant (3D type), read from the OSG General
# Catalogue 2025-2026 on 2026-11-03 (p. 145-146 dimensions and icons, p. 392 cutting conditions).
format: cnctwin-tool
version: 1
series_id: osg-ado-3d-carbide-drill
maker: "OSG Corporation"
series: "ADO-3D EgiAs coated carbide drill with internal coolant supply, 3D type (tap drills 6.8 mm for M8 and 8.5 mm for M10)"
src: osg-2025-gc-drilling-threading
notes: "Icons p. 145: carbide, EgiAs coating, diameter tolerance h8, 30 deg helix, shank for shrink fit; drawing: 140 deg point, R gash (R thinning), coolant holes exiting at the point. Two shank versions per size: DC - DCON (shank one size up, EDP 869xxxx, used here) and DCON = next even size (EDP 870xxxx). LU is the effective flute length (usable drilling depth), LCF the flute length. Cutting conditions p. 392 are for water-soluble coolant (dilution <= 20x) or MQL; with neat oil or > 20x dilution reduce the speed by 30 %. Web thickness, chisel and margin geometry are not published; the db/models/tooling.yaml defaults apply."
defaults:
  type: twist_drill
  hand: right
  tool_material: {class: carbide, grade: "carbide (grade not stated)", id: carbide-submicron-10co, src: est, note: "OSG states only 'carbide'; solid drills are made from fine-grain WC-Co rod, mapped to the submicron 10 % Co entry"}
  coating: {id: tialn, src: est, note: "EgiAs is OSG's proprietary PVD coating; chemistry and thickness not stated, mapped to TiAlN"}
