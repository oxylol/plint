      - {iso_group: M, material_hint: "stainless steel SUS304, SUS420", material: aisi304, operation: [tapping], vc_m_min: {min: 5, max: 15}, f_mm: {value: 1.0, note: "pitch"}, coolant: "water-soluble", page: "p. 846", note: "possible up to 30 m/min"}
