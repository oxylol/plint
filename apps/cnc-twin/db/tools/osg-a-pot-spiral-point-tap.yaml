# OSG A-POT V-coated CPM (powder HSS) spiral pointed taps, read from the OSG General Catalogue
# 2025-2026 on 2026-11-03 (p. 661-662 dimensions, p. 846 cutting speeds, PDF p. 597 tap limits).
format: cnctwin-tool
version: 1
series_id: osg-a-pot-spiral-point-tap
maker: "OSG Corporation"
series: "A-POT high-efficiency multi-purpose V-coated CPM spiral pointed tap (through holes), M6x1 / M8x1.25 / M10x1.5, 6H"
src: osg-2025-gc-drilling-threading
notes: "Icons p. 661: CPM (powder-metallurgy HSS), V coating. Grade 'STD' is OSG's recommended tap for class 2 / 6H internal threads (PDF p. 597); the tap itself is marked with its OH limit (OH3 for M6 and M8, OH4 for M10). Chamfer 5P (spiral point / gun nose, chips pushed ahead: through holes). Columns p. 662: l_c chamfer, LF overall length, THLGTH thread length, LU length under the shank, DCON shank diameter, NOF flutes. Cutting speeds p. 846 are bar charts of an advisable (red) and a possible (beige) range for water-soluble oil; min/max below are the advisable range, the possible range is in the note. Rake angle, chamfer relief and the gun-nose angle are not published (db/models/tooling.yaml defaults apply)."
defaults:
  type: tap_cutting
  hand: right
  tool_material: {class: hss, grade: "CPM powder-metallurgy HSS", id: hss-m42, src: est, note: "OSG prints 'CPM'; powder HSS is cobalt-alloyed, mapped to the cobalt HSS entry (M42 reference)"}
  coating: {id: ticn, src: est, note: "OSG 'V coating'; chemistry and thickness not stated in the catalogue, mapped to TiCN"}
items:
  - id: osg-8325097-a-pot-m6x1
    order_code: "A-POT STD OH3 M6x1 (EDP 8325097)"
    geometry:
      diameter_mm: 6
      flutes: 3
      thread: {standard: "ISO metric coarse", pitch_mm: 1.0, form_angle_deg: {value: 60, src: iso-68-1-1998}, class: "6H (OSG STD, tap limit OH3)", diameter_mm: 6, hand: right, starts: 1}
      tap_kind: cutting
      spiral: point
      chamfer_threads: 5
      cutting_length_mm: {value: 19, note: "THLGTH thread length"}
      overall_length_mm: 62
      shank: {diameter_mm: 6, form: plain}
      centre_cutting: false
      coolant_holes: null
      note: "LU 29 (length under shank), external centre: yes, 12 g (p. 662); square drive per p. 1047 (not read)"
    max_rpm: null
    mass_g: 12
    price_eur: null
    regrinds: {value: 0, src: est, note: "taps are normally used until worn; no regrind count published"}
    cutting_data:
      - {iso_group: P, material_hint: "medium / high carbon steel S45C", material: aisi1045, operation: [tapping], vc_m_min: {min: 15, max: 50}, f_mm: {value: 1.0, note: "feed per rev = pitch"}, coolant: "water-soluble", page: "p. 846 A-POT chart", note: "possible 5-75 m/min"}
