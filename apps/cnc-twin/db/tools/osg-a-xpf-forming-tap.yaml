src: osg-2025-gc-drilling-threading
notes: "Icons p. 545: CPM (powder HSS), VI coating. Grade 'STD' = recommended tap for class 2 / 6H internal threads (PDF p. 597); the tap limit of the forming tap is RH7. Chamfer 4P (also 2P / 1P). Type 1 has a neck (LU), type 2 none. Cutting speeds p. 847 (column up to M12) are for chlorine-free water-soluble coolant. The number of lobes and the pilot-hole diameter for forming are not on these pages: forming_tap_lobes in db/models/tooling.yaml applies, and a forming tap needs a larger pilot hole than a cutting tap (OSG's drill selection tables, not read)."
