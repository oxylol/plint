# Tungaloy TungThread 16ER15ISO full-profile ISO metric threading insert (laydown) in the CER2525M16DT
# external threading holder, read from the Tungaloy General Catalogue 2023-2024 on 2026-11-03
# (E018, E036, E066, E067, L029, A002).
format: cnctwin-tool
version: 1
series_id: tungaloy-tungthread-16er
maker: "Tungaloy Corporation"
series: "TungThread 16ER15ISO (AH725) full-profile external ISO metric 1.5 mm insert in CER2525M16DT"
src: tungaloy-2023-gc-threading
notes: "Insert 16ER15ISO (E018): insert size 16, pitch 1.5 mm, right hand, external, IC 9.525, PDX 0.9, PDY 0.7, RE 0.19 mm; grades AH8015, AH725, T313V, TH10. Full-profile inserts also finish the thread crest, so the major diameter is turned with about 0.1 mm stock (L029). Holder CER2525M16DT (E036): H 25, B 25, LF 150, LH 28, HF 25, WF 32 mm, 16ER/L inserts; L029: the rake angle of Tungaloy's threading toolholders is -10 deg for external and -15 deg for internal holders. Infeed (E066, external metric threads): 1.5 mm pitch is cut in 7 passes of 0.3, 0.25, 0.15, 0.1, 0.05, 0.05, 0.02 mm (total 0.92 mm = H2; H = 1.299 mm). The overhang is a set-up value, estimated."
defaults:
  type: threading_insert
  hand: right
