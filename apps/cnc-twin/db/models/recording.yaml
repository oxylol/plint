# Recording, keyframes and checkpoints of a run (cnctwin.core.recorder, .keyframes, .checkpoint;
# docs/formats.md "Run directory", "Keyframes"). Read with cnctwin.db.models.params("recording");
# names carry the SI unit, `unit:` is the unit the value is written in. The project's `recording:`
# section (fast, fast_window_revs, fast_period_s, keyframe_period_s) is read from the project.
format: cnctwin-model-params
version: 1
model: recording
description: "Fast-tier ring and windows, series buffering, checkpoint cadence and retention, keyframe snapshots and coarse fields"
params:
  ring_buffer_s:
    value: 0.5
    unit: s
    src: cnctwin-architecture-2026
    note: "the fast (L0) ring holds the last half second of samples, so a window around a finding can reach back into steps already ended; findings raised later than that get their window by replay from a checkpoint"
  ring_max_bytes:
    value: 33554432
    unit: "-"
    range: [1048576, 268435456]
    src: est
    note: "32 MiB: architecture 10 caps all recording buffers at 50 MB; the ring takes at most 32 MiB and leaves 18 MB for the three tier row buffers (3 x 4 MiB) and the keyframe writer; with many fast columns the ring is shortened below ring_buffer_s (never below one macro step plus one L1 tick)"
  series_buffer_max_bytes:
    value: 4194304
    unit: "-"
    range: [65536, 67108864]
    src: est
    note: "4 MiB of rows per tier are buffered before they are written as one Parquet row group into the open part file; bounds memory, and rows are grouped by count only, so the file bytes do not depend on wall time"
  fast_window_min_s:
    value: 0.01
    unit: s
    range: [0.001, 0.1]
    src: est
    note: "shortest fast window (spindle stopped or slow): one default macro step (10 ms = 10 IPO ticks of 1 ms), so a window always spans at least the step it was cut in"
  fast_window_max_s:
    value: 0.25
    unit: s
    range: [0.01, 0.5]
    src: est
    note: "longest fast window: half the ring, so a window centred on a finding reaches back at most 0.125 s and stays inside the 0.5 s ring; with 4 revolutions per window it caps windows below 960 rpm"
  fast_min_spacing_s:
    value: 0.25
    unit: s
    range: [0.0, 10.0]
    src: est
    note: "first-revolution windows of engagements start at least this far apart: interrupted cuts that re-enter the material many times per second (peck drilling, trochoidal and adaptive paths) get a sample of their entries, not a copy of the run"
  fast_max_windows_per_second:
    value: 2
    unit: "-"
    range: [0, 1000]
    src: est
    note: "at most two engagement windows per whole second of the base clock; with 4-revolution windows at 10 000 rpm (24 ms) the fast tier then holds about 5 % of the L0 steps (finding and periodic windows are not capped)"
  checkpoint_interval_s:
    value: 10.0
    unit: s
    src: cnctwin-architecture-2026
    note: "a checkpoint (and the close of every series part) at least every 10 s of simulated time; a resumed run repeats at most this much"
  checkpoints_keep_last:
    value: 2
    unit: "-"
    src: cnctwin-architecture-2026
    note: "the last two committed checkpoints are kept, plus the one written at each operation end"
  keyframe_full_every:
    value: 20
    unit: "-"
    src: cnctwin-architecture-2026
    note: "every 20th keyframe holds every non-empty brick, so a viewer rebuilds the workpiece at any keyframe from one full snapshot and at most 19 sets of changed bricks"
  keyframe_field_max_cell_m:
    value: 8
    unit: mm
    src: cnctwin-architecture-2026
    note: "coarse 3-D fields of a keyframe (workpiece temperatures) are block-averaged to cells of at most 8 mm (the largest integer multiple of the solver cell not above it) and stored as float16"
