# Statistical settings of uncertainty studies (cnctwin.uncertainty, docs/models/uncertainty.md):
# how stated spreads become distributions, which quantiles and capability indices are reported,
# and the confidence of the intervals. SI values as written (all dimensionless).
format: cnctwin-model-params
version: 1
model: uncertainty
description: "Distributions of stated tolerances and batch spreads, capability indices, confidence intervals and sensitivity measures"
params:
  normal_truncation_sigma:
    value: 3.0
    unit: "-"
    range: [2.0, 6.0]
    src: est
    note: "a stated 1-sigma batch spread (kc scale, hardness, flow stress, conductivity) is drawn from a normal truncated at +-3 sigma: 0.27 % of the probability mass is removed and the standard deviation shrinks by 1.3 %; a batch beyond 3 sigma is a different material, not the scatter of the stated one (JCGM 101 6.4.7 lets a truncated normal stand for a bounded quantity)"
  min_scale_factor:
    value: 0.1
    unit: "-"
    range: [0.01, 0.5]
    src: est
    note: "a sampled scale factor (force coefficients, hardness, flow stress, conductivity, clamping force, coolant reach) is never below this, whatever the stated spread: a non-positive force coefficient or clamping force is unphysical, and a tenth of the nominal is far outside any batch or setting scatter"
  confidence_level:
    value: 0.95
    unit: "-"
    range: [0.5, 0.999]
    src: jcgm-100-2008
    note: "two-sided coverage of every interval a study reports (probabilities of findings, Cpk, means): the 95 % coverage the GUM uses for expanded uncertainties (coverage factor about 2)"
  percentile_levels:
    value: [0.00135, 0.025, 0.05, 0.5, 0.95, 0.975, 0.99865]
    unit: "-"
    src: iso-22514-2-2017
    note: "the 0.135 % and 99.865 % quantiles bound the natural process spread (the +-3 sigma equivalent of ISO 22514-2 for any distribution), with the median and the 90 % and 95 % central intervals"
  capability_target:
    value: 1.33
    unit: "-"
    range: [1.0, 2.0]
    src: aiag-spc-2005
    note: "Cpk at or above 1.33 is the usual acceptance of a capable process (AIAG SPC manual); below 1.0 the tolerance is narrower than the natural spread"
  prcc_min_dof:
    value: 3
    unit: "-"
    range: [1, 50]
    src: est
    note: "partial rank correlations are reported only when n - k - 2 >= this (n samples, k varied factors): with fewer residual degrees of freedom the regression on the other factors' ranks fits noise (Marino et al. 2008 recommend n well above k)"
  min_samples_capability:
    value: 10
    unit: "-"
    range: [3, 1000]
    src: bissell-1990
    note: "below 10 samples Cp and Cpk are not reported: the 95 % interval of Cpk (Bissell's normal approximation) is then wider than about +-50 % of the estimate"
