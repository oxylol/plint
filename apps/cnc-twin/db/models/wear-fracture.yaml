# Chipping, coating spallation, thermal cracking, fatigue and breakage of cnctwin.wear
# (docs/models/wear.md sections 7-10). Names carry the SI unit; `unit:` is the unit written.
format: cnctwin-model-params
version: 1
model: wear-fracture
description: "Weibull reference specimen, entry-contact geometry, crack and fatigue constants"
params:
  trs_specimen_width_m:
    value: 6.5
    unit: mm
    src: est
    note: "width of the three-point bend test piece the transverse rupture strength (TRS) of tool materials refers to: ISO 3327 type B as commonly described (5.25 x 6.5 x 20 mm, span 14.5 mm); the standard itself (iso-3327-2009) was not read, so the dimensions are marked as estimates"
  trs_specimen_height_m:
    value: 5.25
    unit: mm
    src: est
    note: "height (loaded direction) of the test piece, see trs_specimen_width_m"
  trs_span_m:
    value: 14.5
    unit: mm
    src: est
    note: "support span of the test piece, see trs_specimen_width_m"
  entry_contact_ratio:
    value: 2.0
    unit: "-"
    range: [1.0, 5.0]
    src: est
    note: "tool-chip contact length at first full contact / uncut chip thickness (the steady contact of 2-4 h is still forming at entry)"
  chip_size_ratio:
    value: 1.0
    unit: "-"
    range: [0.3, 3.0]
    src: est
    note: "depth of an edge chip / entry contact length (the fragment is bounded by the tensile region behind the contact)"
  exit_stress_factor:
    value: 1.0
    unit: "-"
    range: [0.5, 2.0]
    src: est
    note: "tensile wedge stress of exit, breakout and breakthrough rows relative to an entry with the same force; pekelharing-1978-exit-failure shows exits to be as damaging as entries"
  min_wedge_angle_rad:
    value: 20.0
    unit: deg
    src: est
    note: "numerical guard: wedge angles are clipped to [min, max]"
  max_wedge_angle_rad:
    value: 160.0
    unit: deg
    src: est
    note: "numerical guard (strongly negative rakes)"
  crack_shape_factor:
    value: 1.1215
    unit: "-"
    src: tada-paris-irwin-2000-cracks
    note: "edge crack in a semi-infinite plate, K = 1.1215 sigma sqrt(pi a)"
  crack_growth_damage:
    value: 1.0
    unit: "-"
    range: [0.2, 5.0]
    src: est
    note: "Miner damage beyond initiation over which comb cracks grow from the initial flaw toward the thermal penetration depth: a = a0 + (delta - a0)(1 - exp(-(D - 1) / this))"
  hardmetal_fatigue_ratio:
    value: 0.7
    unit: "-"
    src: nakajima-2006-wc-co-fatigue
    note: "fatigue limit / flexural strength of WC-Co at 1e7 cycles; with sigma_f' = TRS at one reversal the Basquin exponent is b = ln(0.7) / ln(2e7) = -0.0212; applied to cermets, ceramics, PCBN and PCD too (no S-N data read for them)"
  hardmetal_fatigue_cycles:
    value: 1.0e7
    unit: "-"
    src: nakajima-2006-wc-co-fatigue
    note: "cycles of the fatigue limit above"
  steel_basquin_exponent:
    value: -0.09
    unit: "-"
    src: muralidharan-manson-1988-universal-slopes
    note: "Basquin exponent of the modified universal slopes (high-speed steels)"
  steel_basquin_coeff:
    value: 0.623
    unit: "-"
    src: muralidharan-manson-1988-universal-slopes
    note: "sigma_f' = coeff x E x (sigma_u / E)^exponent, with the TRS for sigma_u (bend fracture strength of hardened tool steel)"
  steel_basquin_strength_exponent:
    value: 0.832
    unit: "-"
    src: muralidharan-manson-1988-universal-slopes
    note: "exponent of sigma_u / E in sigma_f'"
  thermal_fatigue_ratio:
    value: 0.25
    unit: "-"
    range: [0.1, 0.7]
    src: est
    note: "thermal-cycle (comb-crack) fatigue of hardmetal-type tool materials: stress amplitude / TRS at thermal_fatigue_cycles. Thermal cycling of the edge (binder plasticity at the hot surface, oxidation) is far more damaging than isothermal bend fatigue (nakajima-2006-wc-co-fatigue: 0.7 TRS at 1e7 cycles), so a separate curve is used: chosen so that a 500 K surface range on WC-Co (alpha E dT / (2 (1 - nu)) about 1 GPa, a quarter of a 4 GPa TRS) initiates comb cracks after about 5000 entries, about a minute of 4-flute milling at 10 000 rpm, the order in which comb cracks appear in interrupted cutting with coolant (trent-wright-2000-metal-cutting ch. 7 for the mechanism); uncertain by a factor 10 in cycles"
  thermal_fatigue_cycles:
    value: 5000
    unit: "-"
    range: [100, 1.0e6]
    src: est
    note: "cycles of thermal_fatigue_ratio (see there); high-speed steels use their isothermal Basquin curve"
  coating_impact_strength_Pa:
    value: 4000.0
    unit: MPa
    range: [1000.0, 10000.0]
    src: est
    note: "Weibull characteristic contact pressure at first full contact for spallation of a hard PVD/CVD coating per impact; impact tests of coated carbide (bouzakis-2012-coated-tools) fail coatings after many impacts at contact pressures of a few GPa; per-impact value assumed"
  coating_weibull_modulus:
    value: 6.0
    unit: "-"
    range: [2.0, 20.0]
    src: est
    note: "scatter of the spallation strength (adhesion and coating defects scatter more than the substrate strength)"
  default_weibull_modulus:
    value: 10.0
    unit: "-"
    range: [3.0, 30.0]
    src: est
    note: "Weibull modulus when the tool material gives none (roebuck-2009-npl-mgpg20: hardmetals 10-20, cermets <= 10)"
