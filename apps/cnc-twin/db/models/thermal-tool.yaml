# Tool, holder and cutting-edge thermal model (cnctwin/thermal/toolmodel.py, edge.py;
# docs/models/thermal.md "Tool"). Names carry the SI unit; `unit:` is the unit written.
format: cnctwin-model-params
version: 1
model: thermal-tool
description: "Edge contact sizes, fluted-body section, contact conductances, holder and taper geometry"
params:
  poletika_exponent:
    value: 1.5
    unit: "-"
    range: [1.0, 2.0]
    src: est
    note: "tool-chip contact length l_c = h * zeta^n (zeta = chip compression ratio) after Poletika (1969) as quoted in astakhov-2006-tribology-cutting ch. 3; exponent recalled, not re-read in this session"
  default_compression_ratio:
    value: 2.5
    unit: "-"
    range: [1.2, 5.0]
    src: est
    note: "used only when ProcessCoefficients carries no chip ratio; typical of steels at carbide speeds (trent-wright-2000-metal-cutting ch. 3 reports 1.5-4)"
  max_contact_ratio:
    value: 12.0
    unit: "-"
    src: est
    note: "upper bound of l_c / h (very low chip ratios are clipped); numerical guard"
  flank_contact_edge_factor:
    value: 1.0
    unit: "-"
    range: [0.5, 2.0]
    src: est
    note: "flank contact width = VB + factor * edge radius (the rounded edge rubs the new surface over about one hone radius)"
  fluted_solid_fraction:
    value: 0.65
    unit: "-"
    range: [0.5, 0.8]
    src: est
    note: "solid fraction of the fluted cross-section when the tool gives neither gullet_area nor core_diameter (2-6 flute end mills, from catalogue cross-sections)"
  fluted_perimeter_factor:
    value: 1.6
    unit: "-"
    range: [1.2, 2.2]
    src: est
    note: "wetted perimeter of the fluted section / (pi D): flute faces add surface"
  shank_contact_conductance_W_m2K:
    value: 5000.0
    unit: W_m2K
    range: [1000.0, 20000.0]
    src: est
    note: "shank-to-bore contact under clamping pressure (shrink fit, hydraulic, collet); metallic contacts at 10-100 MPa lie in 1e3-1e5 W/m2K (madhusudana-2014-contact-conductance ch. 1)"
  taper_contact_conductance_W_m2K:
    value: 3000.0
    unit: W_m2K
    range: [1000.0, 10000.0]
    src: est
    note: "holder taper to spindle bore, drawbar clamped; as above, lower pressure"
  steep_taper_sizes:
    value: [30, 40, 50]
    unit: "-"
    src: iso-7388-1-2007-steep-taper
    note: "7/24 taper sizes (SK, BT, CAT share the taper)"
  steep_taper_gauge_diameter_m:
    value: [31.75, 44.45, 69.85]
    unit: mm
    src: est
    note: "nominal gauge diameter d1 of the 7/24 taper per size (ISO 7388-1); recalled, not re-read in this session"
  steep_taper_length_m:
    value: [47.8, 68.4, 101.75]
    unit: mm
    src: est
    note: "nominal taper length per size (ISO 7388-1); recalled, not re-read"
  hsk_sizes:
    value: [40, 50, 63, 80, 100]
    unit: "-"
    src: iso-12164-1-2001-hsk
    note: "HSK nominal sizes"
  hsk_gauge_diameter_m:
    value: [30.0, 38.0, 48.0, 60.0, 75.0]
    unit: mm
    src: est
    note: "taper diameter d1 at the gauge face per size (ISO 12164-1); recalled, not re-read"
  hsk_length_m:
    value: [20.0, 26.0, 32.0, 40.0, 50.0]
    unit: mm
    src: est
    note: "taper length per size (ISO 12164-1); recalled, not re-read"
  holder_material:
    value: aisi4140-qt30
    unit: "-"
    src: est
    note: "toolholder bodies are through- or case-hardened alloy steels; 42CrMo4 QT is used as the representative (density, k, cp, CTE from db/materials)"
  holder_nose_diameter_ratio:
    value: 2.0
    unit: "-"
    src: est
    note: "holder outer diameter / shank diameter when the holder gives no nose_diameter or profile"
  holder_clamp_ratio:
    value: 3.0
    unit: "-"
    src: est
    note: "clamped shank length / shank diameter when the holder gives no clamp_length"
  far_field_radius_ratio:
    value: 1.0
    unit: "-"
    range: [0.5, 2.0]
    src: est
    note: "radius (in units of the element radius) beyond which the 1-D body model represents the tool; the analytic edge field is cut there (spreading resistance to the cross-section mean)"
  min_wedge_angle_rad:
    value: 30.0
    unit: deg
    src: est
    note: "lower clamp of the wedge angle used in the edge correction (pi/2)/beta"
  max_wedge_angle_rad:
    value: 180.0
    unit: deg
    src: est
    note: "upper clamp (half space)"
  default_insert_ic_m:
    value: 12.7
    unit: mm
    src: est
    note: "inscribed circle of a turning insert whose tool item gives none (ISO size 12, e.g. CNMG 1204)"
  default_insert_thickness_m:
    value: 4.76
    unit: mm
    src: est
    note: "insert thickness when not given (ISO thickness code 04)"
  default_bar_section_m:
    value: 25.0
    unit: mm
    src: est
    note: "square shank of a turning or boring holder when not given"
  default_bar_overhang_m:
    value: 30.0
    unit: mm
    src: est
    note: "holder overhang from the turret clamp when not given"
  insert_seat_area_ratio:
    value: 0.6
    unit: "-"
    range: [0.3, 1.0]
    src: est
    note: "insert-to-seat contact area / ic^2 (rhombic and triangular inserts cover part of the square)"
  bar_clamp_length_ratio:
    value: 2.0
    unit: "-"
    src: est
    note: "clamped length of a turning holder / its shank section (turret or tool block clamp)"
  class_names:
    value: [carbide, hss, cermet, ceramic, cbn, pcd]
    unit: "-"
    src: est
    note: "tool material classes of db/tools (tool_material.class)"
  class_materials:
    value: [carbide-submicron-10co, hss-m2, cermet-ticn, ceramic-al2o3-tic, cbn-low, pcd]
    unit: "-"
    src: est
    note: "db/tool_materials item used for a class when the tool names no tool_material.id (one representative grade per class)"
