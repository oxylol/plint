# Numerical settings of the geometry library (cnctwin.geom, docs/models/geom.md). These are not physical
# coefficients: they set how finely curved surfaces are tessellated, how the bounding-volume trees are
# built and how tolerant the CAD face selectors are. Read in SI by cnctwin.db.models.params("geom"); every
# geometry function also takes the value as an argument, these are the defaults.
format: cnctwin-model-params
version: 1
model: geom
description: "Tessellation chord error, STEP meshing, BVH build constants, CAD face-selector and query tolerances"
params:
  # ------------------------------------------------------------------ tessellation
  tessellation_chordal_tolerance_m:
    value: 0.01
    unit: mm
    range: [0.001, 0.1]
    src: est
    note: "largest distance between a tessellated primitive (machine, fixture, holder envelope) and the true surface; 10 um is below the 25 um rough smoothing band of a control and well below a collision clearance worth reporting, and costs about 70 segments on a 10 mm radius"
  tessellation_min_segments:
    value: 12
    unit: "-"
    range: [6, 64]
    src: est
    note: "fewest segments per full circle, so radii below about 0.3 mm (where the chord rule asks for fewer) keep their shape; a 12-gon misses 4.5 % of the circle's area"
  step_chordal_tolerance_m:
    value: 0.005
    unit: mm
    range: [0.0005, 0.05]
    src: est
    note: "BRepMesh linear deflection of a STEP import (occt-8-reference): the part mesh is used for selectors, inspection and display; 5 um is a quarter of a typical IT7 tolerance at 10-18 mm (18 um), so tessellation stays below the tolerances it is checked against"
  step_angular_tolerance_rad:
    value: 10
    unit: deg
    range: [1, 30]
    src: est
    note: "BRepMesh angular deflection (largest angle between adjacent facet normals); with the 5 um chord rule it only binds on radii above about 0.75 mm / (1 - cos 5 deg), i.e. large flat-ish freeform faces"
  # ------------------------------------------------------------------ bounding-volume trees
  bvh_leaf_size:
    value: 4
    unit: "-"
    src: pharr-2016-pbrt
    note: "triangles per leaf above which a node is always split (pbrt's maxPrimsInNode default)"
  bvh_bins:
    value: 12
    unit: "-"
    src: pharr-2016-pbrt
    note: "SAH buckets per split evaluation (pbrt 4.3.2; Wald 2007 reports 8-32 buckets within a few percent of the full sweep)"
  bvh_traversal_cost:
    value: 0.125
    unit: "-"
    src: pharr-2016-pbrt
    note: "cost of visiting a node relative to one ray-triangle test in the surface area heuristic (pbrt 4.3.2)"
  # ------------------------------------------------------------------ CAD face selectors (project 'cad' features)
  selector_angle_tolerance_rad:
    value: 1.0
    unit: deg
    range: [0.01, 10]
    src: est
    note: "a selector's normal/axis matches a face whose normal/axis lies within this angle; hand-written selectors use unit vectors along machine axes, CAD faces are exact to 1e-9 rad, 1 deg admits a rounded vector such as [0, 0.017, 1]"
  selector_radius_tolerance_m:
    value: 0.01
    unit: mm
    range: [0.001, 0.1]
    src: est
    note: "a selector's radius_mm matches a cylinder/sphere/torus/cone face within this distance (nominal radii written to 0.01 mm)"
  feature_merge_distance_m:
    value: 0.001
    unit: mm
    range: [0.0001, 0.01]
    src: est
    note: "adjacent B-rep faces on the same analytic surface (a cylinder split at its seam, a plane split by an edge) form one feature when their surface parameters agree within this distance; STEP exporters work at 1e-4 to 1e-3 mm modelling tolerance"
  feature_merge_angle_rad:
    value: 0.01
    unit: deg
    range: [0.001, 0.1]
    src: est
    note: "the angular counterpart of feature_merge_distance_m for plane normals and axes"
  # ------------------------------------------------------------------ queries
  clearance_z_tolerance_m:
    value: 1.0e-6
    unit: mm
    range: [1.0e-7, 1.0e-4]
    src: kiefer-1953-golden
    note: "golden-section search interval (along the solid's axis) at which the radial clearance between a triangle and a revolved envelope is taken as found; the clearance error is below this times the profile slope plus the triangle's slope, i.e. nanometres"
  point_in_mesh_rays:
    value: 3
    unit: "-"
    range: [1, 9]
    src: est
    note: "non-degenerate parity rays whose majority decides inside/outside; one ray suffices on a watertight mesh, three outvote a single leak through a hole of a scanned or exported mesh"
