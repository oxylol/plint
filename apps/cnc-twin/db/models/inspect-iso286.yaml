# ISO 286 code system for tolerances on linear sizes (cnctwin.inspect.fits286, docs/models/inspect.md "Size
# limits"): the standard tolerance grades IT1-IT18 and the fundamental deviations of the shaft positions the
# inspection evaluates, for nominal sizes up to 500 mm. Hole positions follow from the shafts by the general and
# special rules of ISO 286-1:2010 5.3 (EI = -es for A-H; ES = -ei (+ delta) for K-S), so they need no table.
# Read in SI by cnctwin.db.models.params("inspect-iso286"): every deviation list is in metres after reading.
format: cnctwin-model-params
version: 1
model: inspect-iso286
description: "ISO 286-1 standard tolerance grades IT1-IT18 and ISO 286-2 shaft fundamental deviations a-g, k, m, n, p, r, s up to 500 mm"
src: iso-286-1-2010
