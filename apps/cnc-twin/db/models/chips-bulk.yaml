# Settled chips (cnctwin.chips, docs/models/chips.md "Pile"): bulk volume ratio and angle of repose by
# ISO 3685 chip form (codes of cnctwin.core.bus.CHIP_FORMS), which forms are long/stringy, fines.
format: cnctwin-model-params
version: 1
model: chips-bulk
description: "Bulk volume ratio R (bulk / solid volume) and angle of repose by chip form; long and wrapping forms"
params:
  bulk_ratio_by_form:
    value: {11: 100, 12: 100, 13: 100, 21: 60, 22: 30, 23: 100, 31: 10, 32: 10, 41: 60, 42: 30, 43: 100,
            51: 60, 52: 30, 62: 3, 70: 3}
    unit: "-"
    src: chemie-de-span
    note: "Spanraumzahl R by chip form as tabulated: ribbon (Bandspan) and snarled (Wirrspan) > 100 (the lower bound 100 is used), helical (Schraubenspan) 60, short helical 30, spiral (Spiralspan) 10, short broken chips 3. Mapping to ISO 3685 codes: ribbon 11-13 and snarled 23/43 -> 100, long tubular/washer/conical helical 21/41/51 -> 60, short ones 22/42/52 -> 30, spiral 31/32 -> 10, loose arc 62 and elemental 70 -> 3. Cross-check: screw-conveyor bulk densities (kws-bulk-material-table) give R = 11-24 for dry aluminium chips, 2.2-3.5 for cast-iron chips and 3.3-4.9 for crushed steel turnings"
  bulk_ratio_estimated:
    value: {61: 5, 80: 3, 90: 2, 95: 1.5}
    unit: "-"
    src: est
    note: "forms the table does not list: connected arcs 61 between spiral pieces and broken chips; needles 80 pack like broken chips; dust 90 like a powder (bulk fraction about 0.5); molten or smeared lumps 95 nearly solid"
  bulk_ratio_default:
    value: 30
    unit: "-"
    src: est
    note: "for an unknown form code (a short helical chip)"
  repose_deg_by_form:
    value: {11: 70, 12: 60, 13: 75, 21: 60, 22: 50, 23: 75, 31: 45, 32: 45, 41: 55, 42: 45, 43: 75, 51: 55, 52: 45,
            61: 42, 62: 40, 70: 38, 80: 40, 90: 35, 95: 45}
    unit: deg
    src: est
    note: "angle of repose of chip heaps (read in degrees, converted by cnctwin.chips.params): free-flowing short chips and fines 35-42 degrees like coarse granular solids; long, curled and snarled chips interlock and stand much steeper (nests of 60-75 degrees); no measured chip data were read"
  repose_default_rad:
    value: 45
    unit: deg
    src: est
    note: "for an unknown form code"
  long_forms:
    value: [11, 12, 13, 21, 23, 41, 43, 51]
    unit: "-"
    src: est
    note: "long, unbroken chip forms (ribbon, long and snarled tubular and washer-type helical, long conical helical) that nest around tools and parts; ISO 3685 Annex G names the forms (iso-3685-1993), the long/short split follows its subclass 1 (long) and 3 (snarled)"
  wrap_forms:
    value: [11, 12, 13, 21, 22, 23, 43]
    unit: "-"
    src: est
    note: "forms that can wrap around a rotating tool or bar: ribbons and tubular chips (straight strips that hook), snarled helices"
  fines_thickness_m:
    value: 0.05
    unit: mm
    src: est
    note: "chips thinner than this count as fines (fire risk for magnesium and titanium) when the material's ignition data give no critical_chip_thickness"
  powder_dust_fraction:
    value: 0.05
    unit: "-"
    range: [0.01, 0.2]
    src: est
    note: "mass fraction of the removed material leaving as airborne dust for materials whose chip tendency is 'powder' (grey cast iron graphite fines) when the material file gives no composite dust_mass_fraction"
