      note: "shape assumed: the flux saturates in parts thinner than about half the pole size, so pressure rises roughly with thickness and reaches the 157 N/cm2 maximum (tecnomagnete-web-milltec) at about 25 mm for low-carbon steel; the 10 mm point follows the stated thin-part limit of the /SC version. Not a published curve; scale down for alloy steels and cast iron, zero for non-ferrous"
    pole_pitch_mm: null
    jaw_friction: {value: 0.2, src: est, note: "steel part on ground steel poles; not published. Lateral capacity = friction x magnetic force"}
