  - {code: "SP0741", text: "RIGID TAP ALARM : EXCESS ERROR", trigger: rigid_tap, cause: "The positional deviation of the moving spindle has exceeded the set value during rigid tapping.", page: "728"}
  - {code: "SP0742", text: "RIGID TAP ALARM : LSI OVERFLOW", trigger: rigid_tap, cause: "An LSI overflow has occurred for the spindle during rigid tapping.", page: "728"}
  - {code: "SP1231", text: "SPINDLE EXCESS ERROR (MOVING)", trigger: spindle, cause: "The position deviation during spindle rotation was greater than the value set in parameters.", page: "730"}
  - {code: "SP1232", text: "SPINDLE EXCESS ERROR (STOP)", trigger: spindle, cause: "The position deviation during spindle stop was greater than the value set in parameters.", page: "730"}
  - {code: "DS0050", text: "TOO MANY SIMULTANEOUS AXES", trigger: illegal_axis, cause: "A movement was performed along more axes than can be controlled by simultaneous axis control. Check whether a command in the program is specified for more axes than can be controlled by simultaneous axis control.", page: "734"}
  - {code: "DS0405", text: "ZERO RETURN END NOT ON REF", trigger: reference_return, cause: "The axis specified in automatic zero return was not at the correct zero point when positioning was completed. [...]", page: "736"}
  - {code: "DS1512", text: "EXCESS VELOCITY", trigger: transformation, cause: "The feedrate of the linear axis during polar coordinate interpolation exceeded the maximum cutting feedrate.", page: "737"}
  - {code: "SP9001", text: "MOTOR OVERHEAT", trigger: spindle, cause: "The internal temperature of the motor exceeds the specified level. The motor is used in excess of the continuous rating, or the cooling component is abnormal.", page: "777"}
  - {code: "SP9002", text: "EX DEVIATION SPEED", trigger: spindle, cause: "The motor speed cannot follow a specified speed. An excessive motor load torque is detected. The acceleration/deceleration time in parameter No. 4082 is insufficient.", page: "777"}
  - {code: "SP9029", text: "OVERLOAD", trigger: spindle, cause: "Excessive load has been applied continuously for a certain period of time. (This alarm is issued also when the motor shaft has been locked in the excitation state.)", page: "779"}
  - {code: "SP9031", text: "MOTOR LOCK", trigger: spindle, cause: "The motor cannot rotate at a specified speed. (A level not exceeding the SST level for the rotation command has existed continuously.)", page: "779"}

messages:
  src: est
  note: "custom macro B conventions as generally documented for FANUC controls, except where an entry cites the FANUC catalogue"
  "#3000": {value: "#3000 = n (MESSAGE) raises a macro alarm; the 0i-F Plus numbers macro alarms 3000-3200 (alarm = 3000 + n, n = 0-200) and shows the message; the program stops", src: fanuc-cnc-functions-catalog-2024, page: "504", note: "range 3000-3200 from the catalogue (external PMC alarm messages are 1000-1999); 'alarm = 3000 + n' and the stop behaviour from general FANUC knowledge"}
  "#3006": "#3006 = 1 (MESSAGE) stops like M00 and displays the message; CYCLE START continues"
  M00: "program stop"
  M01: "optional stop"

timing:
  src: est
  note: "FANUC publishes no interpolation period or block processing time for the 0i-F in the documents available this session; each value carries its own derivation note"
  ipo_period_ms: {value: 1.0, note: "not published; 1 ms assumed (typical of current CNCs), same as fanuc-0i-mf"}
  block_processing_ms: {value: 1.0, note: "not published; 1 ms per block assumed"}
  lookahead_blocks: {value: 40, note: "standard look-ahead of the 0i-TF Plus without AI contour control is not given in the catalogue; 40 blocks assumed. With the AI Contour Control II option (A02B-0349-S808, catalogue p. 245) the look-ahead is 200 blocks (p. 246-247); AI Contour Control I (A02B-0349-J665, p. 244) is also an option"}
  smoothing:
    - code: "G61 / G64 / G09"
      name: exact_stop_and_cutting_mode
      note: "G61 exact stop mode, G64 cutting mode, G09 exact stop for one block (lathe G code system A). Estimate."

words:
  src: est
  note: "standard FANUC T-series G code system A list from general knowledge; entries with their own src are from the FANUC catalogue G-code system table (p. 267-268) or function pages; group numbers not listed"
  G:
    "00": "positioning (rapid traverse)"
    "01": "linear interpolation (cutting feed)"
    "02": "circular interpolation CW"
    "03": "circular interpolation CCW"
    "04": "dwell (P ms, X/U s)"
    "07.1": "cylindrical interpolation (also G107; cylindrical interpolation is basic in 0i-TF Plus, catalogue p. 163)"
    "10": "programmable data input"
    "11": "programmable data input mode cancel"
    "12.1": "polar coordinate interpolation mode (also G112; polar coordinate interpolation is basic in 0i-TF Plus, catalogue p. 162)"
    "13.1": "polar coordinate interpolation cancel (also G113)"
    "17": "XpYp plane selection"
    "18": "ZpXp plane selection (default)"
    "19": "YpZp plane selection"
    "20": {value: "inch input (system A; G20 in B, G70 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "21": {value: "metric input (system A; G21 in B, G71 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "22": "stored stroke check function on"
    "23": "stored stroke check function off"
    "25": "spindle speed fluctuation detection off"
    "26": "spindle speed fluctuation detection on"
    "27": "reference position return check"
    "28": "return to reference position"
    "29": "movement from reference position"
    "30": "2nd, 3rd, 4th reference position return"
    "31": "skip function"
    "32": {value: "thread cutting (system A; G33 in B and C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "34": "variable lead threading (variable lead thread cutting is basic in 0i-TF Plus, catalogue p. 225)"
    "36": "automatic tool offset X (option)"
    "37": "automatic tool offset Z (option)"
    "40": "tool nose radius compensation cancel"
    "41": "tool nose radius compensation left"
    "42": "tool nose radius compensation right"
    "50": {value: "coordinate system setting or maximum spindle speed clamp (system A; G92 in B and C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "50.3": {value: "workpiece coordinate system preset (system A; G92.1 in B and C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "52": "local coordinate system setting"
    "53": "machine coordinate system selection"
    "53.2": {value: "positioning in the machine coordinate system with feedrate, G53.2 G01 IP_ F_ (option A02B-0349-R553)", src: fanuc-cnc-functions-catalog-2024, page: "265"}
    "54-59": {value: "standard workpiece coordinate systems 1-6 (basic in 0i-F Plus)", src: fanuc-cnc-functions-catalog-2024, page: "262"}
    "65": "custom macro call"
    "66": "custom macro modal call"
    "67": "custom macro modal call cancel"
    "70": {value: "finishing cycle (system A and B; G72 in C); multiple repetitive cycles G70-G76 are basic in 0i-TF Plus", src: fanuc-cnc-functions-catalog-2024, page: "267, 278"}
    "71": {value: "stock removal in turning (A and B; G73 in C); Multiple Repetitive Cycles II (pockets in G71/G72) basic in 0i-TF Plus", src: fanuc-cnc-functions-catalog-2024, page: "267, 279"}
    "72": {value: "stock removal in facing (A and B; G74 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "73": {value: "pattern repeating cycle (A and B; G75 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "74": {value: "end face peck drilling cycle (A and B; G76 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "75": {value: "outer diameter / internal diameter drilling cycle (A and B; G77 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "76": {value: "multiple-thread cutting cycle (A and B; G78 in C); feed hold during G76 retracts with chamfering to the cycle start point (thread cutting retract, basic in 0i-TF Plus)", src: fanuc-cnc-functions-catalog-2024, page: "267, 226"}
    "80": "canned cycle for drilling cancel"
    "83": "face drilling cycle"
    "84": "face tapping cycle"
    "85": "face boring cycle"
    "87": "side drilling cycle"
    "88": "side tapping cycle"
    "89": "side boring cycle"
    "90": {value: "outer diameter / internal diameter cutting cycle (system A; G77 in B, G20 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "92": {value: "threading cycle (system A; G78 in B, G21 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "94": {value: "end face turning cycle (system A; G79 in B, G24 in C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "96": "constant surface speed control"
    "97": "constant surface speed control cancel"
    "98": {value: "feed per minute (system A; G94 in B and C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
    "99": {value: "feed per revolution (system A; G95 in B and C)", src: fanuc-cnc-functions-catalog-2024, page: "267"}
  M:
    "00": "program stop"
    "01": "optional stop"
    "02": "end of program"
    "30": "end of program and rewind"
    "98": "subprogram call"
    "99": "end of subprogram / return"
    "03-09, 19, 29": "machine-builder M codes; conventional meanings: M03/M04/M05 spindle CW/CCW/stop, M08/M09 coolant on/off, M19 spindle orientation, M29 rigid tapping (parameter-defined)"
  addresses: [O, N, G, X, Z, U, W, Y, V, C, H, I, K, R, P, Q, F, E, S, T, M, ",C", ",R", ",A"]
  system_a:
    "X/U Z/W C/H Y/V": {value: "in G code system A absolute or incremental programming is specified by the address word (X/U, Z/W, C/H, Y/V), not by G90/G91; only the initial level is provided as return point of drilling canned cycles. G-code system B/C (selectable by parameter) is basic in 0i-TF Plus", src: fanuc-cnc-functions-catalog-2024, page: "268"}
    "chamfering / corner R": {value: "chamfering / corner rounding inserts a 45-degree chamfer or a radius between two single-axis linear blocks that meet at a right angle (basic in 0i-TF Plus); direct drawing dimension programming (angles, chamfers, corner radii from the drawing) is basic too (p. 266). Address letters (C, R, ,C, ,R) from general knowledge", src: fanuc-cnc-functions-catalog-2024, page: "270"}

