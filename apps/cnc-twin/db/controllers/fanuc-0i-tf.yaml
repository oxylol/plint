# FANUC Series 0i-TF Plus (lathe, G code system A, custom macro B).
#
# SOURCES: as for fanuc-0i-mf.yaml, only FANUC's function catalogue (fanuc-cnc-functions-catalog-2024)
# could be read; the operator/alarm manuals (B-64604EN-1 lathe, B-64694EN, B-64605EN/B-64695EN)
# were not obtainable and web search was exhausted. The catalogue's G-code system A/B/C table
# (p. 267-268) sources the lathe-specific codes marked with src; the rest is src est.
#   * alarms (second pass, 2026-11-03): the 0i-F alarm list (B-64605EN / B-64695EN, common to the M and T
#     series) still could not be read. The numbers and texts below were read in the FANUC Series
#     30i/31i/32i-MODEL B Plus MAINTENANCE MANUAL B-64725EN/01 (bibliography fanuc-30ibplus-maint-2019,
#     Appendix A ALARM LIST; page = printed page there), the same list as db/controllers/fanuc-31i-b.yaml,
#     including the lathe cycle alarms PS0061-PS0069 and PS0315-PS0330 (G70-G76, G90/G92/G94). They are
#     carried over on the assumption that the 0i-F uses the same numbers and messages as the 30i-B (same
#     FANUC generation), so they inherit src est from the file. Three builtin 0i-F texts of the dialect
#     differ from the 30i-B Plus wording and win no longer: PS0080, PS0111, PS0122 (see fanuc-0i-mf.yaml);
#     PS0023 ILLEGAL RADIUS COMMAND and PS0113 IMPROPER COMMAND are not in the 30i-B Plus list and keep
#     their builtin text. Left out (kept only in fanuc-31i-b.yaml): tool centre point control (the
#     catalogue p. 374 lists TCP only for the 30i/31i/32i-B Plus) and, as a precaution because their 0i-TF
#     availability was not checked, tilted working plane, 3-D coordinate conversion and 3-D cutter
#     compensation, malfunction prevention (DS0004), interference check avoidance (PS5446-PS5448),
#     abnormal spindle load (DS0095) and lowercase-character (PS1090) alarms; also the machining-centre-only
#     alarms (tool length offset type C, G45-G48). The macro alarm display (MC3001 on the 30i-B Plus) is not carried over.
# In G code system A there is no G90/G91: absolute or incremental is chosen by the address
# (X/U, Z/W, C/H, Y/V) and drilling canned cycles return only to the initial level.
format: cnctwin-controller
version: 1
id: fanuc-0i-tf
dialect: fanuc
name: "FANUC Series 0i-TF Plus (lathe)"
src: est
note: "no FANUC 0i-F operator or alarm manual could be read (not publicly hosted by FANUC; not found in a second search round); entries without their own src are estimates from general FANUC T-series knowledge and must be verified against B-64604EN-1 / B-64694EN / B-64605EN. The alarms (code, text, cause, page) are taken unchanged from FANUC Series 30i/31i/32i-MODEL B Plus MAINTENANCE MANUAL B-64725EN/01 Appendix A (fanuc-30ibplus-maint-2019; page = printed page of that manual) and are estimates for the 0i-TF only in that they assume the 0i-F shows the same number and message as the 30i-B Plus"

alarms:
  - {code: "PS0003", text: "TOO MANY DIGIT", trigger: syntax, cause: "Data entered with more digits than permitted in the NC instruction word. The number of permissible digits varies according to the function and the word.", page: "665"}
  - {code: "PS0004", text: "INVALID BREAK POINT OF WORDS", trigger: syntax, cause: "NC word(s) address + numerical value not in word format. This alarm is also generated when a custom macro does not contain a reserved word, or does not conform to the syntax.", page: "665"}
  - {code: "PS0005", text: "NO DATA AFTER ADDRESS", trigger: syntax, cause: "NC word(s) address + numerical value not in word format. This alarm is also generated when a custom macro does not contain a reserved word, or does not conform to the syntax.", page: "665"}
  - {code: "PS0006", text: "ILLEGAL USE OF MINUS SIGN", trigger: syntax, cause: "A minus sign (–) was specified at an NC instruction word or system variable where no minus signal may be specified.", page: "665"}
  - {code: "PS0007", text: "ILLEGAL USE OF DECIMAL POINT", trigger: syntax, cause: "A decimal point (.) was specified at an address where no decimal point may be specified, or two decimal points were specified.", page: "665"}
  - {code: "PS0009", text: "IMPROPER NC-ADDRESS", trigger: syntax, cause: "An illegal address was specified, or parameter 1020 is not set.", page: "665"}
  - {code: "PS0010", text: "IMPROPER G-CODE", trigger: illegal_g_code, cause: "1) An unusable G code is specified. 2) The groove cutting by continuous circle motion option parameter is not effective. 3) The groove cutting by continuous circle motion enable signal is \"0\".", page: "665"}
  - {code: "PS0011", text: "FEED ZERO ( COMMAND )", trigger: feed_zero, cause: "1) The cutting feedrate instructed by an F code has been set to 0. 2) This alarm is also generated if the F code instructed for the S code is set extremely small in a rigid tapping instruction as the tool cannot cut at the programmed lead. [...]", page: "665"}
  - {code: "PS0015", text: "TOO MANY SIMULTANEOUS AXES", trigger: illegal_axis, cause: "A move command was specified for more axes than can be controlled by simultaneous axis control. Either add on the simultaneous axis control extension option, or divide the number of programmed move axes into two blocks.", page: "666"}
  - {code: "PS1013", text: "ILLEGAL POS. OF PROGRAM NO.", trigger: syntax, cause: "Address O or N is specified in an illegal location (e.g. after a macro statement).", page: "692"}
  - {code: "PS1014", text: "ILLEGAL FORMAT OF PROGRAM NO.", trigger: syntax, cause: "Address O or N is not followed by a number.", page: "692"}
  - {code: "PS5006", text: "TOO MANY WORD IN ONE BLOCK", trigger: syntax, cause: "The number of words in a block exceeds the maximum. The maximum is 26 words. However, this figure varies according to NC options. Divide the instruction word into two blocks.", page: "702"}
  - {code: "PS5010", text: "END OF RECORD", trigger: syntax, cause: "The EOR (End of Record) code is specified in the middle of a block. This alarm is also generated when the percentage at the end of the NC program is read.", page: "702"}
  - {code: "PS5073", text: "NO DECIMAL POINT", trigger: syntax, cause: "No decimal point has been specified for an address requiring a decimal point.", page: "704"}
  - {code: "PS5074", text: "ADDRESS DUPLICATION ERROR", trigger: duplicate_address, cause: "The same address has been specified two or more times in a single block. Alternatively, two or more G codes in the same group have been specified in a single block.", page: "704"}
  - {code: "PS0020", text: "OVER TOLERANCE OF RADIUS", trigger: arc_radius_tolerance, cause: "An arc was specified for which the difference in the radius at the start and end points exceeds the value set in parameter No. 3410. Check arc center codes I, J and K in the program. [...]", page: "666"}
  - {code: "PS0021", text: "ILLEGAL PLANE SELECT", trigger: plane_selection, cause: "The plane selection instructions G17 to G19 are in error. Reprogram so that same 3 basic parallel axes are not specified simultaneously. [...]", page: "666"}
  - {code: "PS0022", text: "R OR I,J,K COMMAND NOT FOUND", trigger: arc_definition, cause: "The command for circular interpolation lacks arc radius R or coordinate I, J, or K of the distance between the start point to the center of the arc.", page: "666"}
  - {code: "PS0025", text: "CIRCLE CUT IN RAPID (F0)", trigger: arc_definition, cause: "F0 (rapid traverse in inverse feed or feed specified by an F code with 1–digit number) was specified during circular interpolation (G02, G03) or involute interpolation (G02.2, G03.2).", page: "666"}
  - {code: "PS0232", text: "TOO MANY HELICAL AXIS COMMAND", trigger: arc_definition, cause: "Three or more axes were specified as helical axes in the helical interpolation mode. Five or more axes were specified as helical axes in the helical interpolation B mode.", page: "677"}
  - {code: "PS0144", text: "ILLEGAL PLANE SELECTED", trigger: plane_selection, cause: "The coordinate rotation plane and arc or tool radius⋅tool nose radius compensation plane must be the same. Modify the program.", page: "672"}
  - {code: "PS0029", text: "ILLEGAL OFFSET VALUE", trigger: tool, cause: "Illegal offset No.", page: "666"}
  - {code: "PS0030", text: "ILLEGAL OFFSET NUMBER", trigger: tool, cause: "An illegal offset No. was specified. This alarm is also generated when the tool shape offset No. exceeds the maximum number of tool offset sets in the case of tool offset memory B. [...]", page: "666"}
  - {code: "PS0245", text: "T-CODE NOT ALLOWED IN THIS BLOCK", trigger: tool, cause: "One of the G codes, G50, G10, G04, G28, G28.2, G29, G30, and G30.2,G30.1,G53, which cannot be specified in the same block as a T code, was specified with a T code.", page: "677"}
  - {code: "PS0509", text: "TOOL OFFSET COMMAND IS NOT AVAILABLE", trigger: tool, cause: "- Tool offset (for the lathe system) was specified in the thread cutting block. - Tool offset was specified (lathe system) in the scaling mode, coordinate system rotation mode, or programmable mirror image mode.", page: "687"}
  - {code: "PS0031", text: "ILLEGAL P COMMAND IN G10", trigger: data_setting, cause: "The relevant data input or option could not be found for the L No. of G10. No data setting address such as P or R was specified. An address command not concerned with data setting was specified. [...]", page: "666"}
  - {code: "PS0032", text: "ILLEGAL OFFSET VALUE IN G10", trigger: data_setting, cause: "In setting an offset amount by G10 or in writing an offset amount by system variables, the offset amount was excessive.", page: "666"}
  - {code: "PS1144", text: "G10 FORMAT ERROR", trigger: data_setting, cause: "The G10 L No. contains no relevant data input or corresponding option. Data setting address P or R is not specified. An address not relating to the data setting is specified. [...]", page: "693"}
  - {code: "PS0231", text: "ILLEGAL FORMAT IN G10 L52", trigger: data_setting, cause: "Errors occurred in the specified format at the programmable-parameter input.", page: "677"}
  - {code: "PS1301", text: "MISSING ADDRESS", trigger: data_setting, cause: "The axis No. was not specified even though the parameter is an axis–type while loading parameters or pitch error compensation data from a tape or by entry of the G10 parameter. [...]", page: "694"}
  - {code: "PS1302", text: "ILLEGAL DATA NUMBER", trigger: data_setting, cause: "A non–existent data No. was found while loading parameters or pitch error compensation data from a tape or by entry of the G10 parameter. [...]", page: "694"}
  - {code: "PS1305", text: "DATA OUT OF RANGE", trigger: data_setting, cause: "Out–of–range data was found while loading parameters or pitch error compensation data from a tape. The values of the data setting addresses corresponding to L Nos. during data input by G10 was out of range. [...]", page: "695"}
  - {code: "PS0033", text: "NO INTERSECTION AT CUTTER COMPENSATION", trigger: cutter_comp_no_solution, cause: "The intersection cannot be obtained by the intersection calculation in tool radius/tool nose radius compensation. Modify the program.", page: "666"}
  - {code: "PS0034", text: "NO CIRC ALLOWED IN STUP/EXT BLK", trigger: cutter_comp_start_end, cause: "In tool radius/tool nose radius compensation, a startup or cancellation is performed in the G02 or G03 mode. Modify the program.", page: "667"}
  - {code: "PS0037", text: "CAN NOT CHANGE PLANE IN G41/G42", trigger: cutter_comp_start_end, cause: "The compensation plane G17/G18/G19 was changed during cutter or tool-nose radius compensation. Modify the program.", page: "667"}
  - {code: "PS0041", text: "INTERFERENCE IN CUTTER COMPENSATION", trigger: cutter_comp_interference, cause: "In tool radius/tool nose radius compensation, excessive cutting may occur. Modify the program.", page: "667"}
  - {code: "PS5257", text: "G41/G42 NOT ALLOWED IN MDI MODE", trigger: cutter_comp_start_end, cause: "Tool radius/tool nose radius compensation was specified in MDI mode. (Depending on the setting of the bit 4 (MCR) of parameter No. 5008)", page: "707"}
  - {code: "PS5445", text: "CAN NOT COMMAND MOTION IN G39", trigger: cutter_comp_start_end, cause: "Corner circular interpolation (G39) of tool radius/tool nose radius compensation is not specified alone but is specified with a move command.", page: "713"}
  - {code: "PS0035", text: "CAN NOT COMMANDED G31", trigger: probing, cause: "- G31 cannot be specified. This alarm is generated when a G code (such as for tool radius/tool nose radius compensation) of group 07 is not canceled. - A torque limit skip was not specified in a torque limit skip command (G31P98 or P99). [...]", page: "667"}
  - {code: "PS0080", text: "G37 MEASURING POSITION REACHED SIGNAL IS NOT PROPERLY INPUT", trigger: probing, cause: "- For machining center series When the tool length measurement function (G37) is performed, a measuring position reached signal goes 1 in front of the area determined by the ε value specified in parameter No.6254. [...]", page: "669"}
  - {code: "PS0081", text: "G37 OFFSET NO. UNASSIGNED", trigger: probing, cause: "- For machining center series The tool length measurement function (G37) is specified without specifying an H code. Correct the program. [...]", page: "669"}
  - {code: "PS0082", text: "G37 SPECIFIED WITH H CODE", trigger: probing, cause: "- For machining center series The tool length measurement function (G37) is specified together with an H code in the same block. Correct the program. [...]", page: "670"}
  - {code: "PS0083", text: "G37 IMPROPER AXIS COMMAND", trigger: probing, cause: "- For machining center series An error has been found in axis specification of the tool length measurement function (G37). Alternatively, a move command is specified as an incremental command. Correct the program. [...]", page: "670"}
  - {code: "PS0369", text: "G31 FORMAT ERROR", trigger: probing, cause: "- No axis is specified or tow or more axes are specified in the torque limit switch instruction (G31P98/P99). - The specified torque Q value in the torque limit switch instruction is out of range. The torque Q range is 1 to 254. [...]", page: "682"}
  - {code: "PS0370", text: "G31P/G04Q ERROR", trigger: probing, cause: "1) The specified address P value for G31 is out of range. The address P range is 1 to 4 in a multistage skip function. 2) The specified address Q value for G04 is out of range. The address Q range is 1 to 4 in a multistage skip function. [...]", page: "682"}
  - {code: "PS5068", text: "FORMAT ERROR IN G31P90", trigger: probing, cause: "No travel axis was specified. Two or more travel axes were specified.", page: "704"}
  - {code: "PS0044", text: "G27-G30 NOT ALLOWED IN FIXED CYC", trigger: cycle_parameter, cause: "The command which relates to the reference position return is commanded in canned cycle mode. Modify the program.", page: "667"}
  - {code: "PS0045", text: "ADDRESS Q NOT FOUND (G73/G83)", trigger: cycle_parameter, cause: "In a high-speed peck drilling cycle (G73) or peck drilling cycle (G83), the amount of each-time cutting is not specified by address Q, or Q0 is specified. Modify the program.", page: "667"}
  - {code: "PS0549", text: "CANNOT CHANGE PLANE(DRILL MODE)", trigger: cycle_parameter, cause: "Plane selection command is specified during drilling mode of canned cycle for drilling. Modify the program.", page: "691"}
  - {code: "PS0550", text: "CANNOT DRILL CYCLE IN PLANE CONV", trigger: cycle_parameter, cause: "Canned cycle for drilling is specified during plane conversion. Modify the program.", page: "691"}
  - {code: "PS5329", text: "M98 AND NC COMMAND IN SAME BLOCK", trigger: cycle_parameter, cause: "A subprogram call which is not a single block was commanded during canned cycle mode.", page: "708"}
  - {code: "PS1196", text: "ILLEGAL DRILLING AXIS SELECTED", trigger: cycle_parameter, cause: "An illegal axis was specified for drilling in a canned cycle for drilling. [...]", page: "694"}
  - {code: "PS0061", text: "P OR Q COMMAND IS NOT IN THE MULTIPLE REPETIVE CYCLES BLOCK", trigger: cycle_parameter, cause: "Address P or Q is not specified in multiple repetitive cycle (G70, G71, G72, or G73) command.", page: "668"}
  - {code: "PS0062", text: "THE CUTTING AMOUNT IS ILLEGAL IN THE ROUGH CUTTING CYCLE", trigger: cycle_parameter, cause: "A zero or a negative value was specified in a multiple repetitive canned rough-cutting cycle (G71 or G72) as the depth of cut.", page: "668"}
  - {code: "PS0063", text: "THE BLOCK OF A SPECIFIED SEQUENCE NUMBER IS NOT FOUND", trigger: cycle_parameter, cause: "The sequence number specified by addresses P and Q in multiple repetitive cycle (G70, G71, G72, or G73) command cannot be searched.", page: "668"}
  - {code: "PS0064", text: "THE FINISHING SHAPE IS NOT A MONOTONOUS CHANGE(FIRST AXES)", trigger: cycle_parameter, cause: "In a shape program for the multiple repetitive canned rough-cutting cycle (G71 or G72), the command for the first plane axis was not a monotonous increase or decrease.", page: "668"}
  - {code: "PS0065", text: "G00/G01 IS NOT IN THE FIRST BLOCK OF SHAPE PROGRAM", trigger: cycle_parameter, cause: "In the first block of the shape program specified by P of the multiple repetitive canned cycle (G70, G71, G72, or G73), G00 or G01 was not specified.", page: "668"}
  - {code: "PS0066", text: "UNAVAILABLE COMMAND IS IN THE MULTIPLE REPETIVE CYCLES BLOCK", trigger: cycle_parameter, cause: "An unavailable command was found in a multiple repetitive canned cycle (G70, G71, G72, or G73) command block.", page: "668"}
  - {code: "PS0067", text: "THE MULTIPLE REPETIVE CYCLES IS NOT IN THE PART PROGRAM STORAGE", trigger: cycle_parameter, cause: "A multiple repetitive canned cycle (G70, G71, G72, or G73) command is not registered in a tape memory area.", page: "668"}
  - {code: "PS0069", text: "LAST BLOCK OF SHAPE PROGRAM IS AN ILLEGAL COMMAND", trigger: cycle_parameter, cause: "In a shape program in the multiple repetitive canned cycle (G70, G71, G72, or G73), a command for the chamfering or corner R in the last block is terminated in the middle.", page: "668"}
  - {code: "PS0315", text: "ILLEGAL NOSE ANGLE COMMAND IS IN THE THREAD CUTTING CYCLE", trigger: cycle_parameter, cause: "An invalid tool tip angle is specified in a multiple repetitive canned threading cycle (G76).", page: "679"}
  - {code: "PS0316", text: "ILLEGAL CUTTING AMOUNT IS IN THE THREAD CUTTING CYCLE", trigger: cycle_parameter, cause: "A minimum depth of cut higher than the thread height is specified in a multiple repetitive canned threading cycle (G76).", page: "679"}
  - {code: "PS0317", text: "ILLEGAL THREAD COMMAND IS IN THE THREAD CUTTING CYCLE", trigger: cycle_parameter, cause: "A zero or a negative value is specified in a multiple repetitive canned threading cycle (G76) as the thread height or the depth of cut.", page: "679"}
  - {code: "PS0318", text: "ILLEGAL RELIEF AMOUNT IS IN THE DRILLING CYCLE", trigger: cycle_parameter, cause: "Although an escape directions is set in a multiple repetitive canned cutting-off cycle (G74 or G75), a negative value is specified for Δd.", page: "679"}
  - {code: "PS0319", text: "THE END POINT COMMAND IS ILLEGAL IN THE DRILLING CYCLE", trigger: cycle_parameter, cause: "Although the Δi or Δk travel distance is set to 0 in a multiple repetitive canned cutting-off cycle (G74 or G75), a value other than 0 us specified for a U or W.", page: "679"}
  - {code: "PS0320", text: "ILLEGAL MOVEMENT AMOUNT/CUTTING AMOUNT IS IN THE DRILLING CYCLE", trigger: cycle_parameter, cause: "A negative value is specified in a multiple repetitive canned cutting-off cycle (G74 or G75) as Δi or Δk (travel distance/the depth of cut).", page: "679"}
  - {code: "PS0321", text: "ILLEGAL REPEATED TIME IS IN THE PATTERN REPEATING CYCLE", trigger: cycle_parameter, cause: "A zero or a negative value is specified in a multiple repetitive canned closed loop cycle (G73) as a repeated time.", page: "679"}
  - {code: "PS0322", text: "FINISHING SHAPE WHICH OVER OF STARTING POINT", trigger: cycle_parameter, cause: "An invalid shape which is over the cycle starting point is specified in a shape program for a multiple repetitive canned rough-cutting cycle (G71 or G72).", page: "679"}
  - {code: "PS0323", text: "THE FIRST BLOCK OF SHAPE PROGRAM IS A COMMAND OF TYPE II", trigger: cycle_parameter, cause: "Type II is specified in the first block of the shape program specified by P in a multiple repetitive canned rough-cutting cycle (G71 or G72). Z (W) command is for G71. X (U) command is for G72.", page: "679"}
  - {code: "PS0324", text: "THE INTERRUPTION TYPE MACRO WAS DONE IN THE MULTIPLE REPETIVE CYCLES", trigger: cycle_parameter, cause: "An interruption type macro was issued during the multiple repetitive canned cycle (G70, G71, G72, or G73).", page: "679"}
  - {code: "PS0325", text: "UNAVAILABLE COMMAND IS IN SHAPE PROGRAM", trigger: cycle_parameter, cause: "1) An usable command was issued in a shape program for a multiple repetitive cycle (G70, G71, G72, or G73). [...]", page: "679"}
  - {code: "PS0326", text: "LAST BLOCK OF SHAPE PROGRAM IS A DIRECT DRAWING DIMENSIONS", trigger: cycle_parameter, cause: "In a shape program in the multiple repetitive canned cycle (G70, G71, G72, or G73), a command for direct input of drawing dimensions in the last block is terminated in the middle.", page: "680"}
  - {code: "PS0327", text: "MODAL THAT MULTIPLE REPETIVE CYCLES CANNOT BE DONE", trigger: cycle_parameter, cause: "A multiple repetitive canned cycle (G70, G71, G72, or G73) was commanded in a modal state in which a multiple repetitive canned cycle could not be commanded.", page: "680"}
  - {code: "PS0328", text: "ILLEGAL WORK POSITION IS IN THE TOOL NOSE RADIUS COMPENSATION", trigger: cycle_parameter, cause: "The specification for the blank side for a tool nose radius compensation (G41 or G42) is incorrect in a multiple repetitive canned cycle (G71 or G72).", page: "680"}
  - {code: "PS0329", text: "THE FINISHING SHAPE IS NOT A MONOTONOUS CHANGE(SECOND AXES)", trigger: cycle_parameter, cause: "In a shape program for the multiple repetitive canned rough-cutting cycle (G71 or G72), the command of the second plane axis was not a monotonous increase or decrease.", page: "680"}
  - {code: "PS0330", text: "ILLEGAL AXIS COMMAND IS IN THE TURNING CANNED CYCLE", trigger: cycle_parameter, cause: "An axis other than the plane is specified n a canned cycle (G90, G92, or G94).", page: "680"}
  - {code: "PS0538", text: "OFFSET IS NOT CANCELED", trigger: cycle_parameter, cause: "In the multiple repetitive cycle (G70), when the tool nose radius compensation can be commanded in the target figure program (parameter NT2 (No.5106#3)=1), G40 is not commanded at the end block in the target figure program.", page: "691"}
  - {code: "PS0313", text: "ILLEGAL LEAD COMMAND", trigger: cycle_parameter, cause: "The variable-lead threading increment specified in address K exceeds the specified maximum value in variable-lead threading. Or, a negative lead value was specified.", page: "678"}
  - {code: "PS0046", text: "ILLEGAL REFERENCE RETURN COMMAND", trigger: reference_return, cause: "A command for a return to the second, third or fourth reference position is error. (The address P command is in error.) [...]", page: "667"}
  - {code: "PS0090", text: "REFERENCE RETURN INCOMPLETE", trigger: reference_return, cause: "1. The reference position return cannot be performed normally because the reference position return start point is too close to the reference position or the speed is too slow. [...]", page: "670"}
  - {code: "PS0092", text: "ZERO RETURN CHECK (G27) ERROR", trigger: reference_return, cause: "The axis specified in G27 has not returned to zero. Reprogram so that the axis returns to zero.", page: "670"}
  - {code: "PS0224", text: "ZERO RETURN NOT FINISHED", trigger: reference_return, cause: "A reference return has not been performed before the start of automatic operation. (Only when bit 0 (ZRNx) of parameter No. 1005 is 0) Perform a reference position return.", page: "676"}
  - {code: "PS0304", text: "G28 IS COMMANDED WITHOUT ZERO RETURN", trigger: reference_return, cause: "Although a reference position was not set, an automatic return to the reference position (G28) was commanded.", page: "678"}
  - {code: "PS0305", text: "INTERMEDIATE POSITION IS NOT ASSIGNED", trigger: reference_return, cause: "Although a G28 (automatic return to the reference position), G30 (return to the second, third, or fourth reference position), or G30/1 (return to the floating reference position) command was not issued after power-up, G29 (return from the [...]", page: "678"}
  - {code: "PS0142", text: "ILLEGAL SCALE RATE", trigger: transformation, cause: "The scaling rate is 0 times or 10000 times or more. Modify the setting of the scaling rate. (G51P_ … or G51I_J_K_ … or parameter No. 5411 or 5421)", page: "672"}
  - {code: "PS0143", text: "COMMAND DATA OVERFLOW", trigger: transformation, cause: "An overflow occurred in the storage length of the CNC internal data. This alarm is also generated when the result of internal calculation of scaling, coordinate rotation and cylindrical interpolation overflows the data storage. [...]", page: "672"}
  - {code: "PS0300", text: "ILLEGAL COMMAND IN SCALING", trigger: transformation, cause: "An illegal G code was specified during scaling. Modify the program. For the T system, one of the following functions is specified during scaling, this alarm is generated. - Finishing cycle (G70 or G72) [...]", page: "677"}
  - {code: "PS0145", text: "ILLEGAL USE OF G12.1/G13.1", trigger: transformation, cause: "The axis No. of plane selection parameter No. 5460 (linear axis) and No. 5461(axis of rotation) in the polar coordinate interpolation mode is out of range (1 to number of controlled axes).", page: "672"}
  - {code: "PS0146", text: "ILLEGAL USE OF G-CODE", trigger: transformation, cause: "The modal G code group contains an illegal G code in the polar coordinate interpolation mode or when a mode was canceled. [...]", page: "673"}
  - {code: "PS0175", text: "ILLEGAL G07.1 AXIS", trigger: transformation, cause: "An axis which cannot perform cylindrical interpolation was specified. More than one axis was specified in a G07.1 block. An attempt was made to cancel cylindrical interpolation for an axis that was not in the cylindrical interpolation mode. [...]", page: "674"}
  - {code: "PS0176", text: "ILLEGAL G-CODE USE(G07.1 MODE)", trigger: transformation, cause: "A G code was specified that cannot be specified in the cylindrical interpolation mode. This alarm also is generated when an 01 group G code was in the G00 mode or code G00 was instructed. [...]", page: "674"}
  - {code: "PS5391", text: "CAN NOT USE G92", trigger: transformation, cause: "Workpiece coordinate system setting G92 (or G50 for the lathe system G-code system A) cannot be specified. [...]", page: "711"}
  - {code: "PS0050", text: "CHF/CNR NOT ALLOWED IN THRD BLK", trigger: rounding_chamfer, cause: "Chamfering or corner R is commanded in the thread cutting block. Modify the program.", page: "667"}
  - {code: "PS0051", text: "MISSING MOVE AFTER CNR/CHF", trigger: rounding_chamfer, cause: "Improper movement or the move distance was specified in the block next to the chamfering or corner R block. Modify the program.", page: "667"}
  - {code: "PS0052", text: "CODE IS NOT G01 AFTER CHF/CNR", trigger: rounding_chamfer, cause: "The block next to the chamfering or corner R block is not G01 (or vertical line). Modify the program.", page: "667"}
  - {code: "PS0053", text: "TOO MANY ADDRESS COMMANDS", trigger: rounding_chamfer, cause: "In the chamfering and corner R commands, two or more of I, J, K and R are specified.", page: "667"}
  - {code: "PS0054", text: "NO TAPER ALLOWED AFTER CHF/CNR", trigger: rounding_chamfer, cause: "A block in which chamfering in the specified angle or the corner R was specified includes a taper command. Modify the program.", page: "667"}
