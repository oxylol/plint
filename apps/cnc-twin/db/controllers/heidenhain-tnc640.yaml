# HEIDENHAIN TNC 640, NC software 34059x-18 (10/2023): NC error messages, Klartext and ISO words,
# timing, Q parameters and FN 18 system data.
#
# Alarms: number and text exactly as in HEIDENHAIN "NC Error Messages" (xxxxxx-18, 10/2023), the
# list the control's error window and HELP use. The list is shared by TNC7/TNC 640/TNC 620/TNC 320/
# TNC 128; only messages for functions documented for the TNC 640 are kept here (the IF/WHILE/FOR
# control-structure errors 160-0315..031F exist in the list but those structures are not in the
# TNC 640 SW18 Klartext manual, so they are left out). "%1", "%2" are run-time parameters the control
# fills in (axis name, sign, tool number ...). cause = the list's "Cause of error" text (shortened
# where it ended in "[...]"); page = page of the PDF. trigger = simulator condition the alarm
# belongs to (same vocabulary in every db/controllers/*.yaml file).
# The same control runs ISO (DIN/ISO) programs: dialect heidenhain_iso uses this file too; ISO words
# are under words.G / words.addresses, Klartext words under words.klartext / plane / tcpm / fn.
format: cnctwin-controller
version: 1
id: heidenhain-tnc640
dialect: heidenhain_klartext
name: "HEIDENHAIN TNC 640 (NC software 34059x-18)"
src: heidenhain-nc-errors-2023

alarms:
  - {code: "160-0003", text: "Block format incorrect", trigger: syntax, cause: "Keyword or G function not programmed.", page: "70"}
  - {code: "160-0036", text: "NC block not found", trigger: syntax, cause: "The block specified for mid-program startup was not found.", page: "74"}
  - {code: "160-00CF", text: "NC command not available", trigger: illegal_function, cause: "The given command is not available because the corresponding configuration data are missing. It is probably not supported on this machine.", page: "92"}
  - {code: "160-00C3", text: "M function not permitted", trigger: illegal_m_code, cause: "An M function was programmed with a number that is not permitted on this control.", page: "90"}
  - {code: "160-0122", text: "Contradictory M functions", trigger: illegal_m_code, cause: "In the same block, you tried to output multiple effective M functions that cancel each other. For example, you cannot program M3 and M4 in the same NC block because both go into effect at beginning of the block. [...]", page: "109"}
  - {code: "1A0-0008", text: "Axis double programmed", trigger: duplicate_address, cause: "In a circle-center block or a pole block (CC, ISO: I,J,K) you programmed the same axis twice.", page: "129"}
