  - {code: "160-011C", text: "Touch probe not defined", trigger: probing, cause: "- You called a touch probe that is not defined in the touch probe table. - The touch probe table is write-protected or it does not exist.", page: "108"}
  - {code: "280-0431", text: "Mid-program startup active", trigger: restart, cause: "Mid-program startup is not permitted with the programmed function.", page: "883"}
  - {code: "1A0-0070", text: "Mid-program startup not possible", trigger: restart, cause: "The target position of the mid-program startup is within a thread or measuring cycle.", page: "148"}
  - {code: "1A0-0087", text: "Mid-program startup not allowed", trigger: restart, cause: "Mid-program startup not allowed after an approach block that was programmed immediately before the program end.", page: "152"}
  - {code: "280-05FA", text: "Tool change during mid-program startup not possible", trigger: restart, cause: "Tool change not possible during mid-program startup. The active tool is not in the spindle for program run after mid-program startup.", page: "928"}
  - {code: "1A0-00AA", text: "Incorrect tool at start of block scan (current T%1, programmed T%2)", trigger: restart, cause: "Mid-program startup with incorrect tool.", page: "160"}
  - {code: "1A0-00AB", text: "Block scan cannot jump over probing functions", trigger: restart, cause: "A probing function was found before the block being searched for with the block scan.", page: "160"}
  - {code: "1A0-00E9", text: "Program resumption not possible", trigger: restart, cause: "The program cannot be continued from the point of interruption.", page: "172"}
  - {code: "280-044A", text: "Contradictory workpc. blank dim.", trigger: blank_form, cause: "The workpiece blank dimensions you have defined in a fixed cycle are smaller than the dimensions of the finished part.", page: "889"}
  - {code: "1A0-011E", text: "Workpiece blank definition: contour is not closed", trigger: blank_form, cause: "The start point and end point do not agree in the definition for the workpiece blank contour.", page: "185"}
  - {code: "292-0006", text: "Thread cutting: Spindle synchronized too late (distance, position controller)", trigger: spindle, cause: "During thread cutting with controlled spindle, the control could not synchronize the spindle soon enough.", page: "999"}

messages:
  src: heidenhain-tnc640-klartext-2023
  page: "300-301, 313-314, 622"
  FN 14: "FN 14: ERROR = n (ISO: D14) interrupts program run and shows the message; the NC program must be restarted. Ranges: 0-999 machine-dependent dialog, 1000-2999 control-dependent dialog, 3000-9999 machine-dependent dialog, 10000 and higher control-dependent dialog (input range in the specification table: 0 to 1199). Numbers 1000-1199 are HEIDENHAIN's predefined texts; they correspond to NC errors 280-03E8 ... (hexadecimal of n, e.g. FN 14: ERROR = 1000 -> 280-03E8, 1001 -> 280-03E9). The two documents word some texts differently (FN 14 table 1000 'Spindle?', error list 280-03E8 'Spindle must be turning'); a number without a defined text shows 280-0064 'FN 14: error code %1'."
  FN 16: "FN 16: F-PRINT <mask file> / SCREEN: shows a text window the operator has to react to before continuing (variable values allowed); FN 16: F-PRINT / SCLR: closes the window; M_CLOSE or M_TRUNCATE in the mask overwrites instead of appending."
  STOP: "a STOP block interrupts program run or test run at that block (an M function may be entered in it); M0 program stop, M1 optional program stop."

timing:
  src: heidenhain-tnc640-setup-2023
  page: "620 (14.3 Specifications)"
  ipo_period_ms: {value: 0.2, src: est, note: "HEIDENHAIN publishes no separate path-interpolation period; set equal to the published position-controller cycle time (200 us standard, 100 us with option 49, setup manual p. 620)"}
  block_processing_ms: {value: 0.5, note: "block processing time for a 3-D straight line without radius compensation"}
  lookahead_blocks: {value: 1000, src: est, note: "depth of the motion (feed-rate profile) look-ahead is not given in the manuals read (the Klartext manual p. 526 only says ADP 'expands the conventional look-ahead'); 1000 blocks kept for consistency with db/machines/dmg-dmu50-3rd.yaml"}
  position_controller_cycle_ms: {value: 0.2, note: "0.1 ms with option 49"}
  speed_controller_cycle_ms: {value: 0.2, note: "0.1 ms with option 49"}
  current_controller_cycle_ms: {value: 0.1, note: "minimum; minimum 0.05 ms with option 49"}
  radius_comp_lookahead_blocks: {value: 99, src: heidenhain-tnc640-klartext-2023, page: "242", note: "M120 LA<n>: radius-compensated contour calculated up to 99 NC blocks ahead to remove undercuts and path intersections; the more blocks, the longer the block processing time; reset by M120 LA0, M120 without LA, R0 or a DEP block"}
  arc_end_point_tolerance_mm: {value: 0.016, src: heidenhain-tnc640-klartext-2023, page: "166", note: "maximum input tolerance for start and end point of an arc lying on the circle, set by the machine maker in machine parameter circleDeviation (no. 200901); beyond it error 1A0-0084 'Circle incorrectly programmed'"}
  min_circle_mm: {value: 0.016, src: heidenhain-tnc640-klartext-2023, page: "166", note: "smallest possible circle the control can traverse"}
  input_resolution_linear_um: {value: 0.01, note: "input resolution and display step 'as fine as 0.01 um' for linear axes"}
  input_resolution_rotary_deg: {value: 0.00001, note: "'as fine as 0.000 01 deg' for rotary axes"}
  smoothing:
    - code: "CYCL DEF 32.0 TOLERANCE / 32.1 T<t> / 32.2 HSC-MODE:<0|1> TA<ta>  (ISO: G62)"
      name: tolerance
      src: heidenhain-tnc640-cycles-2023
      page: "448-451"
      tolerance_range_mm: [0, 10]
      rotary_tolerance_range_deg: [0, 10]
      note: "T = permitted contour deviation in mm (inch in an inch program); 0 or NO ENT = the machine maker's value from machine parameters. The control smooths between any two contour elements (compensated or not) and also on arcs, reducing the programmed feed so that it never leaves the tolerance; larger T = faster, smaller T can force strong slow-downs. HSC-MODE 0 = finishing filter (contour accuracy), 1 = roughing filter (feed rate). TA = permitted position error of rotary axes in degrees with M128/FUNCTION TCPM (0 = machine value), the TCP position being corrected. DEF-active; reset by redefining cycle 32 and answering the tolerance prompt with NO ENT or by selecting a new NC program. Best smoothing with T between 110% and 200% of the CAM chord error. As T grows the diameter of circular movements usually decreases unless HSC filters are active."

words:
  src: heidenhain-tnc640-klartext-2023
  klartext:
    page: "160-171, 132-134, 276-301, 502-503"
    "BEGIN PGM": "first block: program name and unit of measure (MM or INCH)"
    "END PGM": "last block of the NC program"
    "BLK FORM 0.1": "workpiece blank: tool axis and MIN point (BLK FORM 0.1 Z X.. Y.. Z..)"
    "BLK FORM 0.2": "workpiece blank: MAX point (absolute or incremental)"
    "BLK FORM CYLINDER": "cylindrical workpiece blank"
    "BLK FORM ROTATION": "rotationally symmetric blank defined by a contour subprogram (label)"
    "TOOL DEF": "define number, length L and radius R of a tool in the program; with tool tables: preselect the next tool"
    "TOOL CALL": "call tool (number, name or QS) with tool axis, spindle speed S, feed F and deltas DL/DR/DR2 (e.g. TOOL CALL 5.2 Z S2500 F350 DL+0.2 DR-1)"
    L: "straight line to the end point"
    CHF: "chamfer of given side length between two straight lines"
    CC: "circle centre or pole (no motion)"
    C: "circular arc around CC to the end point, direction DR+ / DR-"
    CR: "circular arc with radius R to the end point (R<0 = arc > 180 deg), direction DR+ / DR-"
    CT: "circular arc tangential to the preceding element, to the end point"
    RND: "corner rounding arc of radius R, tangential to both adjacent elements"
    LP: "straight line in polar coordinates (PR radius, PA angle about the pole CC)"
    CP: "circular arc around the pole in polar coordinates (PA, DR; helix with incremental tool-axis coordinate)"
    CTP: "tangential arc in polar coordinates"
    FL: "FK free contour programming: straight line"
    FLT: "FK: straight line with tangential connection"
    FC: "FK: circular arc"
    FCT: "FK: circular arc with tangential connection"
    FPOL: "FK: pole for free contour programming"
    "APPR LT": "approach on a straight line tangential to the contour"
    "APPR LN": "approach on a straight line perpendicular to the contour"
    "APPR CT": "approach on a circular arc tangential to the contour"
    "APPR LCT": "approach on a tangential arc connected by a straight line"
    "APPR PLT / PLN / PCT / PLCT": "approach variants with polar coordinates"
    "DEP LT": "depart on a tangential straight line"
    "DEP LN": "depart on a straight line perpendicular to the contour"
    "DEP CT": "depart on a tangential circular arc"
    "DEP LCT": "depart on a tangential arc and a straight line"
    "DEP PLT / PLN / PCT / PLCT": "departure variants with polar coordinates"
    R0: "no tool radius compensation"
    RL: "tool radius compensation, tool left of the contour"
    RR: "tool radius compensation, tool right of the contour"
    "R+ / R-": "paraxial positioning block lengthened / shortened by the tool radius"
    F: "feed rate (mm/min, or with FZ per tooth, FU per revolution)"
    FMAX: "rapid traverse, effective only in its block"
    FAUTO: "feed rate from the TOOL CALL block"
    "DR+ / DR-": "arc direction counterclockwise / clockwise"
    "LBL": "label (number 0-65535 or name in quotes); LBL 0 ends a subprogram"
    "CALL LBL": "call subprogram / program-section repeat (CALL LBL n REP m)"
    "CALL PGM": "call another NC program as a subprogram"
    "SEL PGM / CALL SELECTED": "select a program (QS allowed) and call it later"
    "CYCL DEF": "define a fixed cycle (DEF-active cycles take effect at once)"
    "CYCL CALL": "call the last defined CALL-active cycle"
    "CYCL CALL POS": "call the cycle at the given position"
    "CYCL CALL PAT": "call the cycle at every point of PATTERN DEF / SEL PATTERN"
    "PATTERN DEF": "define a point pattern (point, row, pattern, frame, circle, pitch circle)"
    "TRANS DATUM": "datum shift (AXIS, TABLE, RESET)"
    "TRANS MIRROR": "mirroring about axes"
    "TRANS ROTATION": "rotation in the working plane (ROT)"
    "TRANS SCALE": "scaling factor"
    "FUNCTION MODE": "switch milling / turning mode"
    "FUNCTION FEED DWELL / FUNCTION DWELL": "cyclic dwell during feed / dwell time"
    "STOP": "program stop"
  plane:
    src: heidenhain-tnc640-klartext-2023
    page: "679-697"
    "PLANE SPATIAL": "tilt the working plane by spatial angles SPA, SPB, SPC"
    "PLANE PROJECTED": "tilt by projection angles PROPR, PROMIN and rotation ROT"
    "PLANE EULER": "tilt by Euler angles EULPR, EULNU, EULROT"
    "PLANE VECTOR": "tilt by base vector BX BY BZ and normal vector NX NY NZ"
    "PLANE POINTS": "tilt by three points P1, P2, P3 of the plane"
    "PLANE RELATIV": "incremental spatial angle on the active tilted plane"
    "PLANE AXIAL": "tilt by axis angles A, B, C"
    "PLANE RESET": "reset the tilted working plane"
    "MOVE / TURN / STAY": "positioning: rotate with compensating tool motion / rotate only / do not move (rotary axes positioned later)"
    "SEQ+ / SEQ-": "choose the solution with the master axis in the positive / negative tilting range"
    "TABLE ROT / COORD ROT": "optional transformation type: orientation of the working-plane coordinate system through the position of a free rotary axis (one parallel to the tool axis)"
  tcpm:
    src: heidenhain-tnc640-klartext-2023
    page: "501-503"
    "FUNCTION TCPM": "tool centre point management (option 9), an improvement of M128; options: F TCP / F CONT (feed at tool tip or contouring feed), AXIS POS / AXIS SPAT (rotary values are axis positions or spatial angles), PATHCTRL AXIS / PATHCTRL VECTOR (orientation interpolation), REFPNT TIP-TIP / TIP-CENTER / CENTER-CENTER, optional feed limit F"
