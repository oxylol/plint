messages:
  src: est
  note: "SINUMERIK message and alarm statements as generally documented; verify"
  MSG: "MSG(\"text\") shows an operator message without stopping (with the next motion block; MSG() clears it)"
  SETAL: "SETAL(n) sets a cycle/user alarm n (user cycle alarms in the 6xxxx range) and stops according to the alarm's reaction"
  M0: "programmed stop"
  M1: "conditional (optional) stop"

timing:
  src: est
  note: "the 840D sl IPO cycle, block change time and look-ahead depth are set by the machine maker through machine data and were not read in a source this session; values kept equal to db/machines/dmg-dmu50-3rd-siemens.yaml"
  ipo_period_ms: {value: 2.0, note: "IPO cycle = basic system clock x ratio, set in machine data by the machine builder (typically 1-4 ms); 2 ms assumed"}
  block_processing_ms: {value: 1.0, note: "minimum block change time assumed 1 ms"}
  lookahead_blocks: {value: 500, note: "number of blocks in the velocity look-ahead (machine data dependent) assumed 500 with COMPCAD/CYCLE832"}
  smoothing:
    - code: "G60 + G601 / G602 / G603, G9"
      name: exact_stop
      note: "exact stop modal (G60) with fine / coarse exact stop window or end of interpolation; G9 exact stop for one block. Estimate."
    - code: "G64 / G641 ADIS= / G642 / G643 / G644 / G645"
      name: continuous_path
      note: "G64 continuous path with speed reduction by overload factor; G641 smoothing with a programmable rounding distance ADIS (ADISPOS for rapid); G642 smoothing within the axial tolerances (machine data / CTOL, OTOL, ATOL); G643 block-internal smoothing; G644 smoothing with maximum dynamics; G645 smoothing of corners and tangential transitions within tolerance. Estimate."
    - code: "CYCLE832(S_TOL, S_TOLM, S_OTOL) / COMPCAD / COMPCURV / COMPSURF / COMPOF"
      name: high_speed_settings
      note: "call format, S_TOL contour tolerance and the S_TOLM technology codes (_OFF, _FINISH, _SEMIFIN, _ROUGH, _ORI_...) read in the Job Planning manual 08/2018 (see words.cycle_parameters.CYCLE832, siemens-840dsl-jobplan-ru-2018 pp. 825-827). Estimate (not read): which functions the cycle switches, i.e. G642 (or G645), the compressor (COMPCAD / COMPSURF), feed forward (FFWON), jerk limitation (SOFT) and the tolerances CTOL/OTOL; COMPCAD compresses short linear blocks into polynomials within the compressor tolerance."

words:
  src: est
  note: "frames, path keywords and program-control statements from general SINUMERIK knowledge; verify. words.G: G command, group and modality read in table 17.4 'G commands' of the Programming Manual Fundamentals 08/2018 (siemens-840dsl-fund-ru-2018, meanings translated from Russian); words.cycles and cycle_parameters: Programming Manual Job Planning 08/2018 (siemens-840dsl-jobplan-ru-2018)"
  G:
    src: siemens-840dsl-fund-ru-2018
    note: "G command, explanation (translated) and group number / modality as printed in table 17.4; group 15 also holds G93-G97 feed types, group 8 the settable zero offsets"
    "0": {value: "rapid traverse motion, group 1, modal", page: "537"}
    "1": {value: "linear interpolation, group 1, modal", page: "537"}
    "2": {value: "circular interpolation clockwise, group 1, modal", page: "537"}
    "3": {value: "circular interpolation counterclockwise, group 1, modal", page: "537"}
    "4": {value: "dwell time, preset by time, group 2, non-modal", page: "538"}
    "9": {value: "exact stop, group 11, non-modal", page: "541"}
    "17": {value: "plane selection 1st - 2nd geometry axis, group 6, modal", page: "539"}
    "18": {value: "plane selection 3rd - 1st geometry axis, group 6, modal", page: "539"}
    "19": {value: "plane selection 2nd - 3rd geometry axis, group 6, modal", page: "539"}
    "25": {value: "minimum working area limitation / spindle speed limitation, group 3, non-modal", page: "538"}
    "26": {value: "maximum working area limitation / spindle speed limitation, group 3, non-modal", page: "539"}
    "33": {value: "thread cutting with constant pitch, group 1, modal", page: "537"}
    "331": {value: "tapping, group 1, modal", page: "537"}
    "332": {value: "retraction (tapping), group 1, modal", page: "537"}
    "40": {value: "no tool radius compensation, group 7, modal", page: "540"}
