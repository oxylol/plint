  - {code: "14900", text: "[Channel %1: ] Block %2 center point and end point programmed simultaneously", trigger: arc_definition, cause: "When programming a circle by means of the opening angle, the circle center point was programmed together with the circle end point. This is too much information for the circle. Only one of the two points is allowed.", page: "129"}
  - {code: "14910", text: "[Channel %1: ] Block %2 invalid angle of aperture for programmed circle", trigger: arc_definition, cause: "When programming a circle by means of the opening angle, a negative opening angle or an opening angle greater than or equal to 360 degrees has been programmed.", page: "129"}
  - {code: "14920", text: "[Channel %1: ] Block %2 intermediate point of circle incorrect", trigger: arc_definition, cause: "When programming a circle by means of an intermediate point (CIP) all 3 points (initial, end and intermediate points) are on a straight line and the intermediate point (programmed by means of interpolation parameters I, J, K) is [...]", page: "130"}
  - {code: "15380", text: "[Channel %1: ] Block %2 illegal incremental programming in axis %3", trigger: syntax, cause: "The first axis programming after \"search to block end point\" is performed incrementally. [...]", page: "135"}
  - {code: "15420", text: "[Channel %1: ] Block %2 instruction in current mode not allowed", trigger: illegal_function, cause: "The alarm is output in the following situation: The interpreter has detected an illegal instruction (e.g. a motion command) while processing an INI file or a definition file (macro or GUD). [...]", page: "136"}
  - {code: "15800", text: "[Channel %1: ] Block %2 wrong starting conditions for CONTPRON/CONTDCON", trigger: cycle_parameter, cause: "There is an error in the start conditions for CONTPRON/CONDCON: - G40 not active - SPLINE or POLY active - Unknown machining type programmed - Transferred machining direction not defined - Definition of LUDs in incorrect [...]", page: "137"}
  - {code: "15810", text: "[Channel %1: ] Block %2 wrong array dimension for CONTPRON/CONTDCON", trigger: cycle_parameter, cause: "The number of columns for the array created for CONTPRON/CONTDCON does not conform to the current programming guide.", page: "137"}
  - {code: "15900", text: "[Channel %1: ] Block %2 touch probe not allowed", trigger: probing, cause: "Measure with deletion of distance-to-go In the part program, an illegal probe has been programmed with the command MEAS (measure with deletion of distance-to-go). [...]", page: "138"}
  - {code: "15950", text: "[Channel %1: ] Block %2 no traverse motion programmed", trigger: probing, cause: "Measure with deletion of distance-to-go In the part program, no axis or a traversing path of zero has been programmed with the command MEAS (measure with deletion of distance-to-go).", page: "138"}
  - {code: "15960", text: "[Channel %1: ] Block %2 no traverse motion programmed", trigger: probing, cause: "Measure without deletion of distance-to-go In the part program, no axis or a traversing path of zero has been programmed with the command MEAW (measure without deletion of distance-to-go).", page: "139"}
  - {code: "16100", text: "[Channel %1: ] Block %2 spindle %3 not available in the channel", trigger: spindle, cause: "Incorrect programming: This channel does not recognize the spindle number. The alarm can occur together with a dwell or a spindle function.", page: "139"}
  - {code: "16105", text: "[Channel %1: ] Block %2 spindle %3 cannot be assigned", trigger: spindle, cause: "Mistake in programming: The programmed spindle is not assigned a real spindle by the spindle number converter. The alarm can be issued after improper use of SD42800 $SC_SPIND_ASSIGN_TAB[].", page: "140"}
  - {code: "16111", text: "[Channel %1: ] Block %2 spindle %3 No speed programmed", trigger: spindle, cause: "Programming of a speed is expected.", page: "140"}
  - {code: "16200", text: "[Channel %1: ] Block %2 spline and polynominal interpolation not available", trigger: illegal_function, cause: "The spline and polynomial interpolation are options that are not contained in the basic version of the control.", page: "140"}
  - {code: "16410", text: "[Channel %1: ] Block %2 axis %3 is not a geometry axis", trigger: illegal_axis, cause: "A geometry axis has been programmed that cannot be imaged on any machine axis in the current transformation (possibly there is no transformation active at the moment). [...]", page: "141"}
  - {code: "16420", text: "[Channel %1: ] Block %2 axis %3 programmed repeatedly", trigger: duplicate_address, cause: "It is not allowed to program an axis more than once.", page: "141"}
  - {code: "16430", text: "[Channel %1: ] Block %2 geometry axis %3 cannot traverse as positioning axis in rotated coordinate system", trigger: transformation, cause: "In the rotated coordinate system, traversing of a geometry axis as positioning axis (i.e. along its axis vector in the rotated coordinate system) would mean traversing of several machine axes. [...]", page: "141"}
  - {code: "16440", text: "[Channel %1: ] Block %2 rotation programmed for non-existent geometry axis", trigger: transformation, cause: "A rotation of a geometry axis which does not exist was programmed.", page: "142"}
  - {code: "16500", text: "[Channel %1: ] Block %2 chamfer or rounding negative", trigger: rounding_chamfer, cause: "A negative chamfer or rounding has been programmed under the keywords CHF= ..., RND=... or RNDM=...", page: "142"}
  - {code: "16510", text: "[Channel %1: ] Block %2 no facing axis for diameter programming available", trigger: units, cause: "Diameter programming has been activated although no transverse axis with diameter programming has been applied. [...]", page: "142"}
  - {code: "16700", text: "[Channel %1: ] Block %2 axis %3 invalid feed type", trigger: thread, cause: "In a thread cutting function, the feed has been programmed in a unit that is impermissible. G33 (thread with constant lead) and the feed have not been programmed with G94 or G95. [...]", page: "142"}
  - {code: "16715", text: "[Channel %1: ] Block %2 axis %3 spindle not in standstill", trigger: spindle, cause: "In the applied function (G74, reference point approach), the spindle must be stationary.", page: "143"}
  - {code: "16720", text: "[Channel %1: ] Block %2 axis %3 thread pitch is zero", trigger: thread, cause: "No pitch was programmed in a thread block with G33 (thread with constant pitch) or G331 (rigid tapping).", page: "143"}
  - {code: "16730", text: "[Channel %1: ] Block %2 axis %3 wrong parameter", trigger: thread, cause: "In G33 (tapping with constant pitch) the pitch parameter was not assigned to the axis that determines the velocity. [...]", page: "143"}
  - {code: "16740", text: "[Channel %1: ] Block %2 no geometry axis programmed", trigger: thread, cause: "No geometry axis was programmed for tapping (G33) or for rigid tapping (G331, G332). The geometry axis is, however, essential if an interpolation parameter has been specified. [...]", page: "144"}
  - {code: "16750", text: "[Channel %1: ] Block %2 axis %3 SPCON not programmed", trigger: spindle, cause: "For the programmed function (rotary axis, positioning axis), the spindle must be in position control mode.", page: "144"}
  - {code: "16751", text: "[Channel %1: ] Block %2 spindle/axis %3 SPCOF not executable", trigger: spindle, cause: "For the programmed function, the spindle must be in the open-loop control mode. In the positioning or axis mode, the position control must not be deselected.", page: "144"}
  - {code: "16760", text: "[Channel %1: ] Block %2 axis %3 S value missing", trigger: spindle, cause: "No spindle speed has been given for rigid tapping (G331 or G332).", page: "145"}
  - {code: "16762", text: "[Channel %1: ] Block %2 spindle %3 thread function is active", trigger: spindle, cause: "Incorrect programming: the spindle function can currently not be executed. This alarm occurs when the spindle (master spindle) is linked with the axes by an interpolation function.", page: "145"}
  - {code: "16763", text: "[Channel %1: ] Block %2 axis %3 programmed speed is illegal (zero or negative)", trigger: spindle, cause: "A spindle speed (S value) was programmed with the value zero or with a negative value.", page: "145"}
  - {code: "16800", text: "[Channel %1: ] Block %2 traverse instruction DC/CDC for axis %3 not allowed", trigger: illegal_axis, cause: "The keyword DC (Direct Coordinate) can only be used for rotary axes. This causes approach of the programmed absolute position along the shortest path. Example: N100 C=DC(315)", page: "148"}
  - {code: "16810", text: "[Channel %1: ] Block %2 traverse instruction ACP for axis %3 not allowed", trigger: illegal_axis, cause: "The keyword ACP (Absolute Coordinate Positive) is only allowed for \"modulo axes\". It causes approach of the programmed absolute position in the specified direction.", page: "148"}
  - {code: "16820", text: "[Channel %1: ] Block %2 traverse instruction ACN for axis %3 not allowed", trigger: illegal_axis, cause: "The keyword ACN (Absolute Coordinate Negative) is only allowed for \"modulo axes\". It causes approach of the programmed absolute position in the specified direction.", page: "148"}
  - {code: "16830", text: "[Channel %1: ] Block %2 incorrect position programmed for axis/spindle %3", trigger: illegal_axis, cause: "A position beyond the range of 0 - 359.999 has been programmed for a modulo axis.", page: "149"}
  - {code: "17020", text: "[Channel %1: ] Block %2 illegal array index 1", trigger: macro_error, cause: "General: A read or write access has been programmed to an array variable with an invalid 1st array index. The valid array indices must lie within the defined array size and the absolute limits (0 - 32,766). [...]", page: "161"}
  - {code: "17030", text: "[Channel %1: ] Block %2 illegal array index 2", trigger: macro_error, cause: "General: A read or write access has been programmed to an array variable with an invalid 2nd array index. The valid array indices must lie within the defined array size and the absolute limits (0 - 32,766). [...]", page: "161"}
  - {code: "17040", text: "[Channel %1: ] Block %2 illegal axis index", trigger: macro_error, cause: "A read or write access has been programmed to an axial variable in which the axis name cannot be unambiguously imaged on a machine axis. [...]", page: "162"}
  - {code: "17050", text: "[Channel %1: ] Block %2 illegal value", trigger: macro_error, cause: "A value has been programmed that exceeds the value range or the limit value of a variable or a machine data. Example: - in a string variable (e.g. [...]", page: "162"}
  - {code: "17070", text: "[Channel %1: ] Block %2 data is write-protected", trigger: macro_error, cause: "An attempt was made to write into a write-protected variable (e.g. a system variable).", page: "163"}
  - {code: "17080", text: "[Channel %1: ] Block %2 %3 value below lower limit", trigger: macro_error, cause: "An attempt was made to write into a machine data with a value smaller than the defined lower limit.", page: "163"}
  - {code: "17090", text: "[Channel %1: ] Block %2 %3 value exceeds upper limit", trigger: macro_error, cause: "An attempt was made to write into a machine data with a value greater than the defined upper limit.", page: "163"}
  - {code: "17095", text: "[Channel %1: ] Block %2 invalid value", trigger: macro_error, cause: "An attempt was made to write an invalid value, e.g. zero, into a machine data.", page: "163"}
  - {code: "17160", text: "[Channel %1: ] Block %2 no tool selected", trigger: tool, cause: "An attempt has been made to access the current tool offset data via the system variables: $P_AD [n]: Contents of the parameter (n: 1 - 25) $P_TOOL: Active D number (tool edge number) $P_TOOLL [n]: Active tool length (n: 1- 3) [...]", page: "165"}
  - {code: "17180", text: "[Channel %1: ] Block %2 illegal D number", trigger: tool, cause: "In the displayed block, access is made to a D number that is not defined and therefore is not available.", page: "166"}
  - {code: "17181", text: "[Channel %1: ] Block %2 T no.= %3, D no.= %4 not existing", trigger: tool, cause: "A programmed D number was not recognized by the NC. By default, the D number refers to the specified T number. If the flat D number function is active, T= 1 is output.", page: "167"}
  - {code: "17190", text: "[Channel %1: ] Block %2 illegal T number %3", trigger: tool, cause: "In the displayed block, access is made to a tool that is not defined and therefore not available. The tool has been named by its T number, its name or its name and duplo number.", page: "168"}
  - {code: "17191", text: "[Channel %1: ] Block %2 T= %3 not existing, program %4", trigger: tool, cause: "A tool identifier which the NCK does not recognize was programmed.", page: "168"}
  - {code: "17194", text: "[Channel %1: ] Block %2 no suitable tool found", trigger: tool, cause: "- An attempt was made to access a tool which has not been defined. - The specified tool does not permit access. - A tool with the desired properties is not available.", page: "168"}
  - {code: "17500", text: "[Channel %1: ] Block %2 axis %3 is not an indexing axis", trigger: illegal_axis, cause: "An indexing axis position has been programmed for an axis with the keywords CIC, CAC or CDC that has not been defined as indexing axis in the machine data.", page: "170"}
  - {code: "17600", text: "[Channel %1: ] Block %2 preset on transformed axis %3 not possible", trigger: transformation, cause: "The programmed PRESET axis is involved in the current transformation. This means that setting the actual value memory (PRESET) is not possible for this axis. [...]", page: "170"}
  - {code: "17610", text: "[Channel %1: ] Block %2 axis %3 involved in the transformation, action cannot be carried out", trigger: transformation, cause: "The axis is involved in the active transformation. It can therefore not execute the demanded action, traversing as positioning axis, enable for axis exchange.", page: "170"}
  - {code: "17620", text: "[Channel %1: ] Block %2 approaching fixed point for transformed axis %3 not possible", trigger: transformation, cause: "In the displayed block, an axis is programmed for the fixed point approach (G75) that is involved in the active transformation. Fixed point approach is not performed with this axis!", page: "171"}
  - {code: "17630", text: "[Channel %1: ] Block %2 referencing for transformed axis %3 not possible", trigger: transformation, cause: "In the displayed block, an axis is programmed for reference point approach (G74) that is involved in the active transformation. Reference point approach is not performed with this axis!", page: "171"}
  - {code: "17640", text: "[Channel %1: ] Block %2 spindle operation for transformed axis %3 not possible", trigger: transformation, cause: "The axis programmed for the spindle operation is involved in the current transformation as geometry axis. This is not allowed.", page: "171"}
  - {code: "17650", text: "[Channel %1: ] Block %2 machine axis %3 not programmable", trigger: illegal_axis, cause: "The machine axis cannot be used in an active transformation. You may be able to program the function in a different coordinate system. [...]", page: "172"}
  - {code: "17900", text: "[Channel %1: ] Block %2 axis %3 is no machine axis", trigger: illegal_axis, cause: "At this point, the block context calls for a machine axis. [...]", page: "172"}
  - {code: "18300", text: "[Channel %1: ] Block %2 frame: fine shift not possible", trigger: transformation, cause: "Allocation of a fine shift to settable frames or the basic frame is not possible since MD18600 $MN_MM_FRAME_FINE_TRANS is not equal to 1.", page: "174"}
  - {code: "18310", text: "[Channel %1: ] Block %2 frame: illegal rotation", trigger: transformation, cause: "Rotations are not possible with NCU global frames.", page: "174"}
  - {code: "18311", text: "[Channel %1: ] Block %2 frame: illegal instruction", trigger: transformation, cause: "An attempt was made to read or write a frame which does not exist.", page: "175"}
  - {code: "18313", text: "[Channel %1: ] Block %2 frame: illegal switchover of geometry axes", trigger: transformation, cause: "It is not allowed to change the geometry axis assignment because the current frame contains rotations.", page: "175"}
  - {code: "18314", text: "[Channel %1: ] Block %2 frame: type conflict", trigger: transformation, cause: "It is not possible to chain global frames and channel-specific frames. The alarm occurs if a global frame is programmed with a channel axis name and no machine axis on this NCU is assigned to the channel axis. [...]", page: "175"}
  - {code: "20057", text: "[Channel %1: ] Block %2 revolutional feedrate for axis/spindle %3 is <= zero", trigger: feed_zero, cause: "Revolutional feed has been programmed for an axis/spindle, but the velocity was not programmed or the programmed value is smaller than or equal to zero.", page: "182"}
  - {code: "21614", text: "[Channel %1: ] Axis %2 hardware limit switch %3", trigger: overtravel, cause: "The signal V380x 1000.1 und .0 (Hardware limit switch plus/minus) has been set at the NC/PLC interface.", page: "188"}
  - {code: "21700", text: "[Channel %1: ] Block %3 axis %2 touch probe already deflected, edge polarity not possible", trigger: probing, cause: "The probe programmed under the keyword MEAS or MEAW is already deflected and has switched. For a further measuring operation, the probe signal must first be canceled (quiescent state of the probe). [...]", page: "190"}
  - {code: "21701", text: "[Channel %1: ] Block %3 axis %2 measurement not possible", trigger: probing, cause: "Measurement level 2 (MEASA, MEAWA, MEAC). There is an error in the programmed measurement task. [...]", page: "190"}
  - {code: "21702", text: "[Channel %1: ] Block %3 axis %2 measurement aborted", trigger: probing, cause: "The measurement block has ended (the programmed end position of the axis has been reached) but the activated touch probe has not yet responded. [...]", page: "191"}
  - {code: "21703", text: "[Channel %1: ] Block %3 axis %2 touch probe not deflected, illegal edge polarity", trigger: probing, cause: "The selected probe is not (!) deflected and therefore cannot record any measured value from the deflected to the nondeflected state. [...]", page: "191"}
  - {code: "22000", text: "[Channel %1: ] Block %3 spindle %2 gear stage change not possible", trigger: spindle, cause: "A gear stage change for the spindle will not be possible, if: - thread cutting (G33, G34, G35) is active - the spindle is active as master or slave spindle in a coupling - the spindle is being positioned", page: "193"}
  - {code: "22010", text: "[Channel %1: ] Block %3 spindle %2 actual gear stage differs from requested gear stage", trigger: spindle, cause: "The requested gear stage change has been concluded. The actual gear stage reported by the PLC as being engaged is not the same as the required gear stage called for by the NC. [...]", page: "193"}
  - {code: "22011", text: "[Channel %1: ] Block %3 spindle %2 change to programmed gear stage not possible", trigger: spindle, cause: "With the 'DryRun', 'ProgramTest' and 'SearchRunByProgTest' functions deselected, it is not possible in the Repos module to carry out a gear stage change to a previously programmed gear stage. [...]", page: "193"}
  - {code: "22040", text: "[Channel %1: ] Block %3 spindle %2 is not referenced with zero marker", trigger: spindle, cause: "The current position is not referenced with the measuring system position although reference is made to it.", page: "194"}
  - {code: "22050", text: "[Channel %1: ] Block %3 spindle %2 no transition from speed control mode to position control mode", trigger: spindle, cause: "- An oriented spindle stop (SPOS/SPOSA) has been programmed or the position control of the spindle was switched on with SPCON but no spindle encoder has been defined. - When switching on the position control, the spindle speed is [...]", page: "195"}
  - {code: "22051", text: "[Channel %1: ] Block %3 spindle %2 reference mark not found", trigger: spindle, cause: "When referencing, the spindle turned through a greater distance than given in the axis-specific MD34060 $MA_REFP_MAX_MARKER_DIST, without receiving a reference mark signal. [...]", page: "195"}
  - {code: "22052", text: "[Channel %1: ] Block %3 spindle %2 no standstill on block change", trigger: spindle, cause: "The displayed spindle has been programmed as spindle or as axis even though a positioning operation is still running from the previous block (with SPOSA ... spindle positioning beyond block limits). [...]", page: "195"}
  - {code: "22055", text: "[Channel %1: ] Block %3 spindle %2 configured positioning speed is too high", trigger: spindle, cause: "The current position is not referenced with the measuring system position although reference is made to it.", page: "196"}
  - {code: "22100", text: "[Channel %1: ] Block %3 spindle %2 chuck speed exceeded", trigger: spindle, cause: "The actual spindle speed is higher than the maximum speed configured in MD35100 $MA_SPIND_VELO_LIMIT plus a tolerance of 10 percent (fixed setting). [...]", page: "197"}
  - {code: "22200", text: "[Channel %1: ] Spindle %2 axis stopped during tapping", trigger: rigid_tap, cause: "When tapping with compensating chuck (G63) the drilling axis was stopped via the NC/PLC interface and the spindle continues to rotate. The thread and possibly also the tap were damaged as a result.", page: "198"}
  - {code: "22250", text: "[Channel %1: ] Spindle %2 axis stopped during thread cutting", trigger: thread, cause: "The thread cutting axis has been stopped while a thread block was active. The stop can be caused by VDI signals that cause the feed to be interrupted.", page: "198"}
  - {code: "22270", text: "[Channel %1: ] Block %2 maximum tapping speed reached", trigger: rigid_tap, cause: "The following additional parameters are output in order to ascertain the problem: 1. 'Position' (without a preceding axis identifier): The maximum feed of the thread axis is reached at the displayed axis position. [...]", page: "198"}
  - {code: "22275", text: "[Channel %1: ] Block %2 zero velocity of thread axis at position %3 reached", trigger: thread, cause: "An axis standstill was reached at the specified position during thread cutting with G35 due to the linear decrease in the thread pitch. [...]", page: "199"}
  - {code: "22280", text: "[Channel %1: ] In block %2: Prog. acceleration path too short %3, %4 required", trigger: thread, cause: "In order to stay within the programmed acceleration path, the acceleration caused an overload on the thread axis. [...]", page: "199"}
  - {code: "25040", text: "Axis %1 standstill monitoring", trigger: servo, cause: "The NC monitors to ensure that the position is held at zero speed. Monitoring is started after a time that can be set for a specific axis in the MD36040 $MA_STANDSTILL_DELAY_TIME after interpolation has ended. [...]", page: "203"}
  - {code: "25050", text: "Axis %1 contour monitoring", trigger: servo, cause: "The NCK calculates for each interpolation point (setpoint) of an axis the actual value that should result based on an internal model. [...]", page: "203"}
  - {code: "25060", text: "Axis %1 speed setpoint limitation", trigger: servo, cause: "The speed setpoint has exceeded its upper limit for a longer period than allowed. The maximum speed setpoint is limited to a certain percentage by the axis-specific MD36210 $MA_CTRLOUT_LIMIT. [...]", page: "204"}
  - {code: "25080", text: "Axis %1 positioning monitoring", trigger: servo, cause: "For blocks in which \"exact stop\" is effective, the axis must have reached the exact stop window after the positioning time given in the axis-specific MD36020 $MA_POSITIONING_TIME. [...]", page: "205"}
  - {code: "61000", text: "[Channel %1: ] Block %2: No tool offset active", trigger: tool, cause: "Alarm triggered by following cycles: LONGHOLE, SLOT1, SLOT2, POCKET1 through POCKET4, CYCLE71, CYCLE72, CYCLE90, CYCLE93 through CYCLE96.", page: "219"}
  - {code: "61001", text: "[Channel %1: ] Block %2: Thread pitch incorrectly defined", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE84, CYCLE840, CYCLE96, CYCLE97.", page: "219"}
  - {code: "61002", text: "[Channel %1: ] Block %2: Type of machining incorrectly defined", trigger: cycle_parameter, cause: "The value of the VARI parameter for the machining has been incorrectly specified. Alarm triggered by following cycles: SLOT1, SLOT2, POCKET1 to POCKET4, CYCLE71, CYCLE72, CYCLE76, CYCLE77, CYCLE93, CYCLE95, CYCLE97, CYCLE98.", page: "219"}
  - {code: "61003", text: "[Channel %1: ] Block %2: No feed programmed in cycle", trigger: cycle_parameter, cause: "The parameter for the feed has been incorrectly specified. Alarm triggered by following cycles: CYCLE71, CYCLE72.", page: "219"}
  - {code: "61004", text: "[Channel %1: ] Block %2: Incorrect configuration of geometry axes", trigger: cycle_parameter, cause: "The geometry-axes sequence is wrong. CYCLE328", page: "220"}
  - {code: "61005", text: "[Channel %1: ] Block %2: 3rd geometry axis not available", trigger: cycle_parameter, cause: "With an application on the lathe with no Y-axis in the G18 plane. Alarm triggered by following cycle: CYCLE86.", page: "220"}
  - {code: "61006", text: "[Channel %1: ] Block %2: Tool radius too large", trigger: tool, cause: "The tool radius is too large for machining. Alarm triggered by following cycles: CYCLE930, CYCLE951, E_CP_CE, E_CP_CO, E_CP_DR, E_PO_CIR, E_PO_REC, F_CP_CE, F_CP_CO, F_CP_DR, F_PO_CIR, F_PO_REC.", page: "220"}
  - {code: "61007", text: "[Channel %1: ] Block %2: Tool radius too small", trigger: tool, cause: "The tool radius is too small for machining. Alarm triggered by following cycles: CYCLE92, E_CP_CO, E_SL_CIR, F_CP_CO, F_PARTOF, F_SL_CIR.", page: "220"}
  - {code: "61008", text: "[Channel %1: ] Block %2: No tool active", trigger: tool, cause: "Alarm triggered by following cycles:", page: "221"}
  - {code: "61009", text: "[Channel %1: ] Block %2: Active tool number = 0", trigger: tool, cause: "No tool (T) has been programmed before the cycle call. Alarm triggered by following cycles: CYCLE71, CYCLE72.", page: "221"}
  - {code: "61010", text: "[Channel %1: ] Block %2: Finishing allowance too large", trigger: cycle_parameter, cause: "The finishing allowance for the base is greater than the total depth. Alarm triggered by following cycle: CYCLE72.", page: "221"}
  - {code: "61011", text: "[Channel %1: ] Block %2: Scaling not permissible", trigger: cycle_parameter, cause: "A scale factor is active which is illegal for this cycle. Alarm triggered by following cycles: CYCLE71, CYCLE72.", page: "221"}
  - {code: "61012", text: "[Channel %1: ] Block %2: Different scaling in planes", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE76, CYCLE77.", page: "222"}
  - {code: "61014", text: "[Channel %1: ] Block %2: Return plane exceeded", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE72.", page: "222"}
  - {code: "61015", text: "[Channel %1: ] Block %2: Contour is not defined", trigger: cycle_parameter, page: "222"}
  - {code: "61017", text: "[Channel %1: ] Block %2: function %4 not present in NCK", trigger: illegal_function, page: "223"}
  - {code: "61018", text: "[Channel %1: ] Block %2: function %4 not executable with NCK", trigger: illegal_function, page: "223"}
  - {code: "61019", text: "[Channel %1: ] Block %2: Parameter %4 incorrectly defined", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE60, CYCLE83.", page: "223"}
  - {code: "61020", text: "[Channel %1: ] Block %2: Machining not possible with active TRANSMIT/TRACYL", trigger: transformation, page: "224"}
  - {code: "61021", text: "[Channel %1: ] Block %2: Parameter %4 value too high", trigger: cycle_parameter, page: "224"}
  - {code: "61022", text: "[Channel %1: ] Block %2: Parameter %4 value too low", trigger: cycle_parameter, page: "224"}
  - {code: "61023", text: "[Channel %1: ] Block %2: Parameter %4 value must be unequal to zero", trigger: cycle_parameter, page: "224"}
  - {code: "61024", text: "[Channel %1: ] Block %2: Parameter %4 check value", trigger: cycle_parameter, page: "225"}
  - {code: "61025", text: "[Channel %1: ] Block %2: Check tool carrier position", trigger: tilted_plane, page: "225"}
  - {code: "61026", text: "[Channel %1: ] Block %2: Cycle cannot be executed with NC function %4.", trigger: illegal_function, page: "225"}
  - {code: "61101", text: "[Channel %1: ] Block %2: Reference plane incorrectly defined", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE71, CYCLE72, CYCLE81 to CYCLE90, CYCLE840, SLOT1, SLOT2, POCKET1 to POCKET4, LONGHOLE.", page: "226"}
  - {code: "61102", text: "[Channel %1: ] Block %2: No spindle direction programmed", trigger: cycle_parameter, cause: "Alarm triggered by following cycles: CYCLE86, CYCLE87, CYCLE88, CYCLE840, POCKET3, POCKET4.", page: "226"}
  - {code: "61103", text: "[Channel %1: ] Block %2: Number of holes is zero", trigger: cycle_parameter, cause: "No value for the number of holes has been programmed. Alarm triggered by following cycles: HOLES1, HOLES2.", page: "226"}
