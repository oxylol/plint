    "500": {value: "deactivation of the settable zero offset (G54 ... G57, G505 ... G599), group 8, modal", page: "540"}
    "53": {value: "suppression of the current frames: programmable frame including the system frame for TOROT and TOFRAME, and the active settable frame (G54 ... G57, G505 ... G599), group 9, non-modal", page: "540"}
    "153": {value: "as G53, and also suppression of all channel-specific and/or NCU-global basic frames, group 9, non-modal", page: "540"}
    "54": {value: "1st settable zero offset, group 8, modal", page: "540"}
    "55": {value: "2nd settable zero offset, group 8, modal", page: "540"}
    "56": {value: "3rd settable zero offset, group 8, modal", page: "540"}
    "57": {value: "4th settable zero offset, group 8, modal", page: "540"}
    "505-599": {value: "5th to 99th settable zero offset (G505 ... G599), group 8, modal", page: "540"}
