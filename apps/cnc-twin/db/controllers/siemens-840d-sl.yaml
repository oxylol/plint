# SIEMENS SINUMERIK 840D sl (SINUMERIK Operate): alarms, supported words, timing, system variables.
#
# STATUS (second research round, 2026-11-03):
#   * alarms: the English 840D sl Diagnostics Manual is only offered through support.industry.siemens.com,
#     which refuses automated access; its Chinese edition (01/2022, CNC software 4.95 SP1) is on the open
#     Siemens download server. The numbers and English texts below were read in the SINUMERIK 802D sl
#     Diagnostics Manual 03/2011 (siemens-802dsl-diag-2011; page = printed page there), whose NCK and
#     cycle alarms come from the same solution-line NCK/cycle software, and every number listed was
#     confirmed to exist in the 840D sl 01/2022 alarm list (siemens-840dsl-diag-zh-2022); eight 802D sl
#     alarms missing from the 840D sl list were left out (10600, 10607, 10765, 10800, 14198, 15910,
#     22060, 22260). The English 840D sl wording itself was not read, so the alarms inherit src est from
#     the file. Spot checks against the Chinese edition show that the wording drifts in some alarms:
#     12550 (840D sl: 'name %3 unknown or not defined'), 22270 (840D sl: 'thread cutting: maximum
#     velocity %4 of axis %3 exceeded'), and cycle alarms there carry an optional prefix
#     '%[[Channel %1: ] Block %2: %]'. Texts are as printed, with the run-time parameters %1, %2 ...
#     ('[Channel %1: ]' is shown only on multi-channel controls). Spaces that the PDF text layer split
#     inside words were restored from a second text layer. cause = the manual's 'Definitions' text,
#     shortened at a sentence boundary ('[...]'). Only alarms a part program can cause are listed
#     (10xxx channel, 12xxx syntax, 14xxx program run, 15xxx-18xxx, the 2xxxx main-run alarms of
#     thread cutting, tapping, spindle and probing, the 25xxx axis monitoring alarms, 61xxx cycle
#     alarms and 62xxx cycle messages); ShopMill/ShopTurn step-program alarms (612xx) are left out.
#   * words.cycles and words.cycle_parameters: read in the SINUMERIK 840D sl/828D Programming Manual
#     Job Planning 08/2018, Russian edition (siemens-840dsl-jobplan-ru-2018), chapter 20.1 external
#     programming of technology cycles; parameter names and order are language-neutral, the meanings
#     were translated from Russian.
#   * the rest (other words, timing, variables) is still src est from general knowledge of SINUMERIK
#     programming; verify against the Programming Manuals Fundamentals / Job Planning and Lists
#     System Variables.
format: cnctwin-controller
version: 1
id: siemens-840d-sl
dialect: siemens840d
name: "SIEMENS SINUMERIK 840D sl (SINUMERIK Operate)"
src: est
note: "entries without their own src are estimates from general SINUMERIK knowledge and must be verified against the 840D sl manuals. The alarms (code, text, cause, page) are taken unchanged from the SINUMERIK 802D sl Diagnostics Manual 03/2011 (siemens-802dsl-diag-2011; page = printed page of that manual); each number was confirmed in the 840D sl / SINAMICS S120 Alarms Diagnostics Manual 01/2022 (Chinese edition, siemens-840dsl-diag-zh-2022). They are estimates only in that the English 840D sl wording was not read and may differ in detail (known: 12550, 22270, cycle-alarm prefixes)"

alarms:
  - {code: "10203", text: "[Channel %1: ] NC start without reference point (action=%2<ALNX>)", trigger: reference_return, cause: "NC start has been activated in the MDI or AUTOMATIC mode and at least one axis that needs to be referenced has not reached its reference point.", page: "43"}
  - {code: "10601", text: "[Channel %1: ] Block %2 zero velocity at block end point during thread cutting", trigger: thread, cause: "This alarm occurs only when several blocks with G33 follow in succession. The block end velocity in the specified block is zero, although a further thread cutting block follows. [...]", page: "44"}
  - {code: "10604", text: "[Channel %1: ] Block %2 thread pitch increase too high", trigger: thread, cause: "The thread pitch increase is causing an axis overload. A spindle override of 100% is assumed during verification.", page: "44"}
  - {code: "10605", text: "[Channel %1: ] Block %2 thread pitch decrease too high", trigger: thread, cause: "The thread pitch decrease is causing an axis standstill in the thread block.", page: "45"}
  - {code: "10620", text: "[Channel %1: ] Block %3 axis %2 at software limit switch %4", trigger: overtravel, cause: "During the traversing motion, the system detected that the software limit switch would be traversed in the direction indicated. [...]", page: "46"}
  - {code: "10621", text: "[Channel %1: ] Axis %2 rests on software limit switch %3%4", trigger: overtravel, cause: "The specified axis is already positioned at the displayed software end delimiter.", page: "46"}
  - {code: "10630", text: "[Channel %1: ] Block %2 axis %3 at working area limit %4", trigger: overtravel, cause: "The specified axis violates the working area limitation. This is recognized only in the main run either because the minimum axis values could not be measured before the transformation or because there is a motion overlay.", page: "46"}
  - {code: "10631", text: "[Channel %1: ] Axis %2 rests at working area limit %3%4", trigger: overtravel, cause: "The specified axis reaches the working area limitation in JOG mode.", page: "47"}
  - {code: "10720", text: "[Channel %1: ] Block %3 axis %2 software limit switch %4", trigger: overtravel, cause: "The path programmed for the axis violates the currently valid software limit switch. The alarm is activated when preparing the part program block. [...]", page: "51"}
  - {code: "10721", text: "[Channel %1: ] Block %3 axis %2 software limit switch %4", trigger: overtravel, cause: "The motion planned for the axis violates the currently valid software limit switch. The alarm is activated during the preprocessing of approach or rest blocks for REPOS. [...]", page: "51"}
  - {code: "10730", text: "[Channel %1: ] Block %3 axis %2 working area limitation %4", trigger: overtravel, cause: "This alarm is generated if it is determined during block preparation that the programmed path of the axis violates the working area limitation. [...]", page: "52"}
  - {code: "10731", text: "[Channel %1: ] Block %3 axis %2 working area limitation %4", trigger: overtravel, cause: "The motion planned for the axis violates the currently active working area limit. The alarm is activated during the preparation of approach or rest blocks for REPOS. [...]", page: "52"}
  - {code: "10740", text: "[Channel %1: ] Block %2 too many empty blocks in WAB programming", trigger: approach_retract, cause: "It is not allowed to program more blocks than specified by MD20202 $MC_WAB_MAXNUM_DUMMY_BLOCKS between the WAB block and the block determining the approach and retraction tangent.", page: "52"}
  - {code: "10741", text: "[Channel %1: ] Block %2 direction reversal with WAB infeed motion", trigger: approach_retract, cause: "A safety distance which has been programmed is located perpendicular to the machining plane and not between the start and end point of the WAB contour.", page: "53"}
  - {code: "10742", text: "[Channel %1: ] Block %2 WAB distance invalid or not programmed", trigger: approach_retract, cause: "Possible causes: In a WAB block, the parameter DISR has not been specified or its value is less than or equal to 0. [...]", page: "53"}
  - {code: "10743", text: "[Channel %1: ] Block %2 WAB programmed several times", trigger: approach_retract, cause: "An attempt has been made to activate a WAB motion before a previously activated WAB motion was terminated.", page: "53"}
  - {code: "10744", text: "[Channel %1: ] Block %2 no valid WAB direction defined", trigger: approach_retract, cause: "The tangent direction for smooth approach or retraction is not defined. Possible causes: In the program, no block with travel information follows the approach block. [...]", page: "54"}
  - {code: "10745", text: "[Channel %1: ] Block %2 WAB end position not clear", trigger: approach_retract, cause: "In the WAB block and in the following block, the position has been programmed perpendicular to the machining direction. In the WAB block, no position has been indicated in the machining plane.", page: "54"}
  - {code: "10747", text: "[Channel %1: ] Block %2 retraction direction not defined for WAB", trigger: approach_retract, cause: "In a WAB retraction block with quarter circle or semi-circle (G248 or G348), the end point in the machining plane was not programmed, and either G143 or G140 without tool radius compensation is active.", page: "55"}
  - {code: "10748", text: "[Channel %1: ] Block %2 illegal retract plane with WAB", trigger: approach_retract, cause: "By means of DISRP a position of the retraction plane has been programmed which is not situated between the safety distance (DISCL) and the starting point (during approach) and/or end point (during retraction) of the WAB movement.", page: "55"}
  - {code: "10750", text: "[Channel %1: ] Block %2 tool radius compensation activated without tool number", trigger: cutter_comp_start_end, cause: "A tool T... must be selected so that the control can make allowance for the associated compensation values. [...]", page: "55"}
  - {code: "10751", text: "[Channel %1: ] Block %2 danger of collision due to tool radius compensation", trigger: cutter_comp_interference, cause: "The \"Bottleneck detection\" (calculation of intersection for the following compensated traversing blocks) has not been able to calculate a point of intersection for the reviewed number of traversing blocks. [...]", page: "56"}
  - {code: "10752", text: "[Channel %1: ] Block %2 overflow of local block buffer with tool radius compensation", trigger: cutter_comp_no_solution, cause: "The cutter radius compensation must buffer a variable number of intermediate blocks in order to enable calculation of the equidistant tool path for each NC block. The size of the buffer cannot be determined by simple means. [...]", page: "56"}
  - {code: "10753", text: "[Channel %1: ] Block %2 selection of the tool radius compensation only possible in linear block", trigger: cutter_comp_start_end, cause: "Selection of tool radius compensation with G41/G42 may only be performed in blocks where the G function G00 (rapid traverse) or G01 (feed) is active. [...]", page: "56"}
  - {code: "10754", text: "[Channel %1: ] Block %2 deselection of the tool radius compensation only possible in linear block", trigger: cutter_comp_start_end, cause: "Deselection of tool radius compensation with G40 can only be performed in blocks where the G function G00 (rapid traverse) or G01 (feed) is active. In the block with G40, at least one axis in the plane G17 to G19 must be written. [...]", page: "57"}
  - {code: "10755", text: "[Channel %1: ] Block %2 selection of the tool radius compensation via KONT not possible at the current starting point", trigger: cutter_comp_start_end, cause: "When activating the cutter radius compensation with KONT the starting point of the approach block is within the compensation circle and therefore already violates the contour. [...]", page: "57"}
  - {code: "10756", text: "[Channel %1: ] Block %2 deselection of the tool radius compensation via KONT not possible at the programmed end point", trigger: cutter_comp_start_end, cause: "On deselection of the cutter radius compensation, the programmed end point is within the compensation circle. If this point were in fact to be approached without compensation, there would be a contour violation. [...]", page: "58"}
  - {code: "10757", text: "[Channel %1: ] Block %2 changing the compensation plane while tool radius compensation is active not possible", trigger: cutter_comp_start_end, cause: "In order to change the compensation plane (G17, G18 or G19) it is first necessary to deselect the cutter radius compensation with G40.", page: "58"}
  - {code: "10758", text: "[Channel %1: ] Block %2 curvature radius with variable compensation value too small", trigger: cutter_comp_interference, cause: "The current cutter radius compensation (the cutter used) is too large for the programmed path radius. [...]", page: "58"}
  - {code: "10760", text: "[Channel %1: ] Block %2 helical axis is not parallel to tool orientation", trigger: cutter_comp_no_solution, cause: "With active tool radius compensation a helix is only permissible if the helix axis is parallel to the tool, i.e. the circle plane and the compensation plane must be identical.", page: "59"}
  - {code: "10761", text: "[Channel %1: ] Block %2 tool radius compensation for ellipse with more than one revolution not possible", trigger: cutter_comp_no_solution, cause: "When machining the inside of an ellipse, in parts of the ellipse the curvature radii are greater than or smaller than the cutter radius compensation. [...]", page: "59"}
  - {code: "10762", text: "[Channel %1: ] Block %2 too many empty blocks between two traversing blocks with active tool radius compensation", trigger: cutter_comp_no_solution, cause: "The maximum permissible number of empty blocks is limited by a machine data.", page: "59"}
  - {code: "10763", text: "[Channel %1: ] Block %2 path component of the block in the compensation plane becomes zero", trigger: cutter_comp_no_solution, cause: "Due to collision monitoring with active tool radius compensation, the path component of the block in the compensation plane becomes zero. [...]", page: "60"}
  - {code: "10764", text: "[Channel %1: ] Block %2 discontinuous path with active tool radius compensation", trigger: cutter_comp_no_solution, cause: "This alarm occurs when, with active tool radius compensation, the starting point used for calculating the compensation is not identical to the end point of the preceding block. [...]", page: "60"}
  - {code: "10776", text: "[Channel %1: ] Block%2 axis %3 must be geometry axis if tool radius compensation is active", trigger: cutter_comp_start_end, cause: "This alarm occurs when an axis that is required for tool radius compensation is not a geometry axis. [...]", page: "61"}
  - {code: "10777", text: "[Channel %1: ] Block %2 tool radius compensation: too many blocks with suppression of compensation", trigger: cutter_comp_no_solution, cause: "The maximum permissible number of blocks with active compensation suppression with tool radius compensation is limited by MD20252 $MC_CUTCOM_MAXNUM_SUPPR_BLOCKS.", page: "61"}
  - {code: "10778", text: "[Channel %1: ] Block %2 preprocessing stop with active tool radius compensation", trigger: cutter_comp_no_solution, cause: "If a preprocessing stop is detected with active tool radius compensation (either programmed by the user or generated internally) and the SD42480 $SC_STOP_CUTCOM_STOPRE is set, then this warning is issued because in this situation [...]", page: "61"}
  - {code: "10780", text: "[Channel %1: ] Block %2 impermissible change of a turning or grinding tool with active tool radius compensation", trigger: cutter_comp_start_end, cause: "A tool change on which the edge offset (difference between edge center and edge reference point) changes, is only permissible in straight and polynomial blocks. [...]", page: "62"}
  - {code: "10790", text: "[Channel %1: ] Block %2 plane change during linear programming with angles", trigger: contour_definition, cause: "The active plane was changed between the first and second subblock when programming two straight lines with angle parameters.", page: "62"}
  - {code: "10791", text: "[Channel %1: ] Block %2 invalid angle during linear programming", trigger: contour_definition, cause: "No intermediate point was found when programming a contour consisting of two straight lines and an angle specification.", page: "63"}
  - {code: "10792", text: "[Channel %1: ] Block %2 illegal interpolation type during linear programming with angles", trigger: contour_definition, cause: "Only spline or linear interpolation is permitted for programming two straight lines with angle specification. Circular or polynomial interpolation is not allowed.", page: "63"}
  - {code: "10793", text: "[Channel %1: ] Block %2 second block missing during linear programming with angles", trigger: contour_definition, cause: "The second block is missing during programming of two straight lines with angle specification. [...]", page: "63"}
  - {code: "10794", text: "[Channel %1: ] Block %2 angle specification missing in 2nd block during linear interpolation with angles", trigger: contour_definition, cause: "The angle is missing from the second block during programming of two straight lines with angle specification. [...]", page: "64"}
  - {code: "10795", text: "[Channel %1: ] Block %2 end point specification during angle programming contradictory", trigger: contour_definition, cause: "During programming of a straight line, both positions of the active plane and an angle were specified (the position of the end point is over-specified), or the position of the programmed coordinate cannot be reached with the [...]", page: "64"}
  - {code: "10810", text: "[Channel %1: ] Block %2 master spindle not defined", trigger: spindle, cause: "The function \"Revolutional feedrate\" (with G95 or G96), or \"Rigid tapping\" (with G331/G332) has been programmed, although no master spindle is defined from which the speed could be derived. [...]", page: "65"}
  - {code: "10820", text: "[Channel %1: ] Rotary axis/spindle %2 not defined", trigger: illegal_axis, cause: "Revolutional feed has been programmed for contouring and synchronous axes or for an axis/spindle. However, the rotary axis/spindle from which the feed is to be deduced is not available.", page: "65"}
  - {code: "10860", text: "[Channel %1: ] Block %2 feedrate not programmed", trigger: feed_zero, cause: "Cause: A traversing velocity has not been programmed for the displayed traversing block. [...]", page: "65"}
  - {code: "10861", text: "[Channel %1: ] Block %3 velocity of positioning axis %2 is zero", trigger: feed_zero, cause: "No axis velocity has been programmed and the positioning velocity set in the machine data is zero.", page: "66"}
  - {code: "10862", text: "[Channel %1: ] Block %2 master spindle also used as path axis", trigger: spindle, cause: "A contour has been programmed that also includes the master spindle as contouring axis. However, the velocity of the contour is derived from the rotational speed of the master spindle (e.g. G95).", page: "66"}
  - {code: "10870", text: "[Channel %1: ] Block %2 facing axis for constant velocity not defined", trigger: spindle, cause: "Constant cutting speed was selected although no transverse axis was applied as reference axis for constant cutting speed or assigned through SCC[AX]. [...]", page: "67"}
  - {code: "10880", text: "[Channel %1: ] Block %2 too many empty blocks between two traversing blocks when inserting chamfers or radii", trigger: rounding_chamfer, cause: "Between 2 blocks containing contour elements and which are to be joined with a chamfer or a radius (CHF, RND), more blocks without contour information have been programmed than provided for in the MD20200 [...]", page: "67"}
  - {code: "10881", text: "[Channel %1: ] Block %2 overflow of local block buffer in the case of chamfers or radii", trigger: rounding_chamfer, cause: "Between 2 blocks containing the contour elements and to be joined with a chamfer or a radius (CHF, RND), so many dummy blocks have been programmed without contour information that the internal buffer is too small.", page: "67"}
  - {code: "10882", text: "[Channel %1: ] Block %2 activation of chamfers or radii (non-modal) without traversing movement in the block", trigger: rounding_chamfer, cause: "No chamfer or radius has been inserted between 2 linear or circle contours (edge breaking) because: There is no straight line or circle contour in the plane There is a movement outside the plane A plane change has taken place The [...]", page: "68"}
  - {code: "10883", text: "[Channel %1: ] Block %2 chamfer or fillet has to be reduced", trigger: rounding_chamfer, cause: "This alarm is output, if at least one of the relevant blocks when inserting chamfers or radii is so short, that the contour element to be inserted must be reduced against its originally programmed value. [...]", page: "68"}
  - {code: "10900", text: "[Channel %1: ] Block %2 no S value programmed for constant cutting speed", trigger: spindle, cause: "If G96 is active, the constant cutting speed under address S is missing.", page: "68"}
  - {code: "10911", text: "[Channel %1: ] Block %2 transformation prohibits to traverse the pole", trigger: transformation, cause: "The given curve passes through the pole of the transformation.", page: "69"}
  - {code: "10914", text: "[Channel %1: ] Block %2: movement not possible while transformation active.", trigger: transformation, cause: "The machine kinematics does not allow the specified motion. Transformation-dependent error causes can be in: TRANSMIT: A (circular) area exists around the pole, where positioning is not possible. [...]", page: "70"}
  - {code: "10930", text: "[Channel %1: ] Block %2 interpolation type not allowed in stock removal contour", trigger: cycle_parameter, cause: "The following types of interpolation are allowed in the contour program for stock removal: G00, G01, G02, G03, CIP, CT", page: "70"}
  - {code: "10931", text: "[Channel %1: ] Block %2 incorrect stock removal contour", trigger: cycle_parameter, cause: "The following errors occurred in the subroutine for the contour during stock removal: - Full circle - Overlapping contour elements - Wrong start position", page: "70"}
  - {code: "10932", text: "[Channel %1: ] Block %2 preparation of contour has been restarted", trigger: cycle_parameter, cause: "The first contour preparation/contour decoding run must be terminated with EXECUTE.", page: "71"}
  - {code: "10933", text: "[Channel %1: ] Block %2 contour programm does not contain enough contour blocks", trigger: cycle_parameter, cause: "The contour program contains: - Less than 3 contour blocks with CONTPRON - No contour blocks with CONTDCON", page: "71"}
  - {code: "10934", text: "[Channel %1: ] Block %2 array for contour segmentation is set too small", trigger: cycle_parameter, cause: "During contour segmentation (activated with the keyword CONTPRON), the field for the contour table has been detected as too small. [...]", page: "71"}
  - {code: "12000", text: "[Channel %1: ] Block %2 address %3 programmed repeatedly", trigger: duplicate_address, cause: "Most addresses (address types) may only be programmed once in an NC block, so that the block information remains unambiguous (e.g. X... T... F... etc. - exception: G and M functions).", page: "72"}
  - {code: "12010", text: "[Channel %1: ] Block %2 address %3 address type programmed too often", trigger: duplicate_address, cause: "The number of times each address type may occur in a NC block is defined internally (for instance, all axes together form one address type to which a block limit also applies).", page: "72"}
  - {code: "12020", text: "[Channel %1: ] Block %2 illegal address modification", trigger: syntax, cause: "Valid address types are 'IC', 'AC', 'DC', 'CIC', 'CAC', 'ACN', 'ACP', 'CACN', 'CACP'. Not each of these address modifications can be used for each address type. [...]", page: "73"}
  - {code: "12040", text: "[Channel %1: ] Block %2 expression %3 is not of data type 'AXIS'", trigger: macro_error, cause: "Some keywords require that the data in their parameters be written in variables of the type \"AXIS\". [...]", page: "73"}
  - {code: "12050", text: "[Channel %1: ] Block %2 DIN address %3 not configured", trigger: syntax, cause: "The name of the DIN address (e.g. X, U, X1) is not defined in the control. In addition to the fixed DIN addresses, the control also has variable addresses. Refer to \"Variable addresses\" in the Programming Guide. [...]", page: "74"}
  - {code: "12060", text: "[Channel %1: ] Block %2 same G group programmed repeatedly", trigger: illegal_g_code, cause: "The G functions that can be used in the part program are divided into groups that are syntax defining or non-syntax defining. Only one G function may be programmed from each G group. [...]", page: "74"}
  - {code: "12070", text: "[Channel %1: ] Block %2 too many syntax-defining G functions", trigger: illegal_g_code, cause: "Syntax defining G functions determine the structure of the part program block and the addresses contained in it. Only one syntax defining G function may be programmed in each NC block. [...]", page: "74"}
  - {code: "12080", text: "[Channel %1: ] Block %2 syntax error in text %3", trigger: syntax, cause: "At the text position shown, the grammar in the block is incorrect. The precise reason for this error cannot be specified in more detail because there are too many possibilities. [...]", page: "75"}
  - {code: "12090", text: "[Channel %1: ] Block %2 unexpected parameter %3", trigger: syntax, cause: "The programmed function has been predefined; no parameters are allowed in its call. The first unexpected parameter is displayed. [...]", page: "75"}
  - {code: "12100", text: "[Channel %1: ] Block %2 number of passes %3 not permissible", trigger: macro_error, cause: "The subroutines called with MCALL are modal, i.e. after each block with positional information a routine run is automatically performed once. For this reason, programming of the number of passes under address P is not allowed. [...]", page: "75"}
  - {code: "12110", text: "[Channel %1: ] Block %2 block syntax cannot be interpreted", trigger: syntax, cause: "The addresses programmed in the block are not permissible together with the valid syntax defining G function, e.g. G1 I10 X20 Y30 F1000. An interpolation parameter must not be programmed in the linear block.", page: "76"}
  - {code: "12120", text: "[Channel %1: ] Block %2 G function not separately programmed", trigger: illegal_g_code, cause: "The G function programmed in this block must be alone in the block. No general addresses or synchronous actions may occur in the same block. [...]", page: "76"}
  - {code: "12140", text: "[Channel %1: ] Block %2 functionality %3 not implemented", trigger: illegal_function, cause: "In the full configuration of the control functions are possible that are not yet implemented in the current version.", page: "76"}
  - {code: "12150", text: "[Channel %1: ] Block %2 operation %3 not compatible with data type", trigger: macro_error, cause: "The data types are not compatible with the required operation (within an arithmetic expression or in a value assignment). [...]", page: "77"}
  - {code: "12160", text: "[Channel %1: ] Block %2 Value %3 lies beyond the value range", trigger: macro_error, cause: "The programmed constant or the variable lies beyond the value range that has previously been established by the definition of the data type. [...]", page: "77"}
  - {code: "12170", text: "[Channel %1: ] Block %2 name %3 defined several times", trigger: macro_error, cause: "The symbol shown in the error message has already been defined in the active part program. [...]", page: "78"}
  - {code: "12180", text: "[Channel %1: ] Block %2 illegal chaining of operators %3", trigger: macro_error, cause: "Operator chaining means the writing in sequence of binary and unary operators without using any form of parentheses. Example: N10 ERG = VARA - (- VARB) ; correct notation N10 ERG = VARA - - VARB ; error!", page: "78"}
  - {code: "12190", text: "[Channel %1: ] Block %2 variable of type ARRAY has too many dimensions", trigger: macro_error, cause: "Array with variables of type STRING may be no more than 1-dimensional, and with all other variables no more than 2-dimensional.", page: "78"}
  - {code: "12200", text: "[Channel %1: ] Block %2 symbol %3 cannot be created", trigger: macro_error, cause: "The symbol to be created with the DEF instruction cannot be created because: - it has already been defined (e.g. as variable or function) - the internal memory location is no longer sufficient (e.g. with large arrays)", page: "79"}
  - {code: "12210", text: "[Channel %1: ] Block %2 string %3 too long", trigger: macro_error, cause: "- In the definition of a variable of type STRING, it has been attempted to initialize more than 100 characters. - In an allocation, it has been found that the string does not fit in the given variable.", page: "79"}
  - {code: "12260", text: "[Channel %1: ] Block %2 too many initialization values specified %3", trigger: macro_error, cause: "In the initialization of an array (array definition and value assignments to individual array elements) there are more initialization values than array elements. Example: N10 DEF INT OTTO[2,3]=(..., ..., {more than 6 values})", page: "80"}
  - {code: "12261", text: "[Channel %1: ] Block %2 initialization of %3 not allowed", trigger: macro_error, cause: "Frame type variables cannot be initialized in the definition. Example: DEF FRAME LOCFRAME = CTRANS(X,200) Equally, no default values can be programmed for axes in the program run during field initialization via SET. [...]", page: "80"}
  - {code: "12270", text: "[Channel %1: ] Block %2 macro identifier %3 already defined", trigger: macro_error, cause: "The name of the macro to be selected by the instruction DEFINE is already defined in the control as: Macro name Keyword Variable Configured identifier.", page: "81"}
  - {code: "12280", text: "[Channel %1: ] Block %2 maximum macro length %3 exceeded", trigger: macro_error, cause: "The string of instructions on the right side of the macro is limited to 256 characters. [...]", page: "81"}
  - {code: "12290", text: "[Channel %1: ] Block %2 arithmetic variable %3 not defined", trigger: macro_undefined_variable, cause: "Only the R parameters are predefined as arithmetic variables. All other arithmetic variables must be defined with the DEF instruction before being used. The number of arithmetic parameters is defined via machine data. [...]", page: "81"}
  - {code: "12300", text: "[Channel %1: ] Block %2 call-by-reference parameter missing on subroutine call %3", trigger: macro_error, cause: "In the subroutine definition, a formal REF parameter (call-by-reference parameter) has been specified with no actual parameter assigned to it. [...]", page: "82"}
  - {code: "12310", text: "[Channel %1: ] Block %2 axis parameter missing on procedure call %3", trigger: macro_error, cause: "When calling the subroutine, an AXIS parameter is missing which, according to the EXTERN declaration, should be present. [...]", page: "82"}
  - {code: "12320", text: "[Channel %1: ] Block %2 parameter %3 is no variable", trigger: macro_error, cause: "A constant or the result of a mathematical expression has been assigned to a REF parameter instead of a variable at the time of the subroutine call, even though only variable identifiers are allowed. [...]", page: "83"}
  - {code: "12330", text: "[Channel %1: ] Block %2 type of parameter %3 incorrect", trigger: macro_error, cause: "When calling a procedure (a subroutine) it is found that the type of the actual parameter cannot be converted into the type of the formal parameter. [...]", page: "83"}
