    "700": {value: "inch input system: inch, inch/min (lengths + velocities + system variables), group 13, modal", page: "541"}
    "710": {value: "metric input system: mm, mm/min (lengths + velocities + system variables), group 13, modal", page: "541"}
    "74": {value: "reference point approach with synchronization, group 2, non-modal", page: "538"}
    "75": {value: "fixed point approach, group 2, non-modal", page: "538"}
    "90": {value: "absolute dimensions, group 14, modal", page: "542"}
    "91": {value: "incremental dimensions, group 14, modal", page: "542"}
