  cycle_parameters:
    src: siemens-840dsl-jobplan-ru-2018
    note: "call syntax as printed in chapter 20.1 (parameter names and order are language-neutral); the meanings are translated from the Russian edition and shortened. Mode parameters are decimal-digit coded: the 1st digit is the units digit."
    CYCLE81:
      value: "CYCLE81(RTP, RFP, SDIS, DP, DPR, DTB, _GMODE, _DMODE, _AMODE)"
      page: "784"
      note: "RTP retraction plane (abs.); RFP reference point (abs.); SDIS safety distance (added to the reference point, unsigned); DP drilling depth (abs.) or centering diameter (abs.), see _GMODE; DPR drilling depth (incr.); DTB dwell time at final drilling depth, see _AMODE; _GMODE 2nd digit centering by depth (0, compatibility) or by diameter (1); _DMODE 1st digit machining plane: 0 = plane active before the call (compatibility), 1 = G17, 2 = G18, 3 = G19 (active only in the cycle); _AMODE 1st digit drilling depth: 0 = from DP/DPR (compatibility), 1 = incremental, 2 = absolute; 2nd digit dwell DT: 0 = from the sign of DTB (> 0 seconds, < 0 revolutions), 1 = seconds, 2 = revolutions"
    CYCLE82:
      value: "CYCLE82(RTP, RFP, SDIS, DP, DPR, DTB, _GMODE, _DMODE, _AMODE, _VARI, S_ZA, S_FA, S_ZD, S_FD)"
      page: "785-787"
      note: "RTP...DTB as CYCLE81 (DP, DPR drilling depth); _GMODE 2nd digit depth to the drill tip (0) or to the shank (1); _DMODE as CYCLE81 (5th digit technology scaling in the cycle masks); _AMODE as CYCLE81 plus 3rd digit ZA incr./abs., 4th digit entry feed FA in % of the drilling feed / F per min / F per rev, 5th digit ZD incr./abs., 6th digit remaining feed FD in % / per min / per rev; _VARI 4th digit through drilling no (0) / yes (1), 5th digit entry drilling no (0) / yes (1); S_ZA entry drilling depth (incr. from the reference point or abs.); S_FA entry drilling feed (value or %); S_ZD remaining drilling depth (incr. from the final depth or abs.); S_FD remaining drilling feed (value or %)"
    CYCLE83:
      value: "CYCLE83(RTP, RFP, SDIS, DP, DPR, FDEP, FDPR, _DAM, DTB, DTS, FRF, VARI, _AXN, _MDEP, _VRT, _DTD, _DIS1, _GMODE, _DMODE, _AMODE)"
      page: "787-790"
      note: "RTP, RFP, SDIS as CYCLE81; DP / DPR final drilling depth (abs. / incr.); FDEP / FDPR 1st drilling depth (abs. / incr.); _DAM degression amount or percentage for each further infeed; DTB dwell at drilling depth; DTS dwell at the start point (chip removal only); FRF percentage feed for the first infeed; VARI 1st digit 0 = chip breaking, 1 = chip removal; _AXN tool axis 0 = 3rd, 1 = 1st, 2 = 2nd geometry axis (> 2 = 3rd); _MDEP minimum depth infeed (only with percentage degression); _VRT retraction amount after each infeed (chip breaking); _DTD dwell at final drilling depth; _DIS1 advance clearance (chip removal only); _GMODE, _DMODE, _AMODE mode words as in the other drilling cycles"
    CYCLE84:
      value: "CYCLE84(RTP, RFP, SDIS, DP, DPR, DTB, SDAC, MPIT, PIT, POSS, SST, SST1, _AXN, _PITA, _TECHNO, _VARI, _DAM, _VRT, _PITM, _PTAB, _PTABA, _GMODE, _DMODE, _AMODE)"
      page: "790-793"
      note: "DP / DPR drilling depth = final depth (abs. / incr.); DTB dwell at drilling depth in seconds; SDAC direction of rotation after the cycle; MPIT thread size for ISO metric only (pitch derived from it); PIT thread pitch as a value, unit see _PITA; POSS spindle position for oriented spindle stop; SST spindle speed for tapping; SST1 spindle speed for retraction; _AXN drilling axis (0 = 3rd, 1 = 1st, 2 = 2nd geometry axis); _PITA pitch unit 1 = mm (PIT), 2 = TPI, 3 = inch (PIT), 4 = MODUL (PIT); _TECHNO 1st digit exact stop (0 as before, 1 G601, 2 G602, 3 G603), 2nd digit feedforward (0 as before, 1 FFWON, 2 FFWOF), 3rd digit acceleration (0 as before, 1 SOFT, 2 BRISK, 3 DRIVE), 4th digit spindle mode after MCALL; _VARI 1st digit 0 = one pass, 1 = chip breaking, 2 = chip removal (deep-hole tapping); _DAM maximum depth infeed (chip removal / chip breaking only); _VRT retraction amount after each infeed (chip breaking only); _PITM string marker for the pitch input; _PTAB thread table ('', 'ISO', 'BSW', 'BSP', 'UNC'); _PTABA selection in the thread table (e.g. 'M 10')"
    CYCLE85:
      value: "CYCLE85(RTP, RFP, SDIS, DP, DPR, DTB, FFR, RFF, _GMODE, _DMODE, _AMODE)"
      page: "793"
      note: "RTP...DTB as CYCLE81; FFR feed; RFF retraction feed; _GMODE reserved; _DMODE machining plane as CYCLE81; _AMODE drilling depth and dwell units as CYCLE81"
    CYCLE86:
      value: "CYCLE86(RTP, RFP, SDIS, DP, DPR, DTB, SDIR, RPA, RPO, RPAP, POSS, _GMODE, _DMODE, _AMODE)"
      page: "794-795"
      note: "RTP...DTB as CYCLE81; SDIR direction of rotation 3 = M3, 4 = M4; RPA / RPO / RPAP retraction amount in X / Y / Z; POSS spindle position for the oriented spindle stop before retraction; _GMODE 0 = lift-off (compatibility), 1 = no lift-off; _DMODE, _AMODE as CYCLE81"
    CYCLE840:
      value: "CYCLE840(RTP, RFP, SDIS, DP, DPR, DTB, SDR, SDAC, ENC, MPIT, PIT, _AXN, _PITA, _TECHNO, _PITM, _PTAB, _PTABA, _GMODE, _DMODE, _AMODE)"
      page: "829-831"
      note: "DTB dwell at drilling depth / at the safety distance; SDR direction of rotation for retraction; SDAC direction of rotation after the cycle; ENC tapping with spindle encoder (G33) or without encoder; MPIT, PIT, _AXN, _PITA, _TECHNO, _PITM, _PTAB, _PTABA as CYCLE84"
    CYCLE800:
      value: "CYCLE800(_FR, _TC, _ST, _MODE, _X0, _Y0, _Z0, _A, _B, _C, _X1, _Y1, _Z1, _DIR, _FR_I, _DMODE)"
      page: "810-813"
      note: "_FR retraction mode: 0 = none, 1 = machine axis Z, 2 = machine axis Z then XY, 3 = reserved, 4 = maximum in tool direction, 5 = incremental in tool direction; _TC name of the swivel data record (STRING[32]; '' if only one record, '0' deselects the swivel data record and deletes the swivel frame); _ST state: 1st digit 0 = new swivel plane, 1 = additive to the active one; 2nd digit tool tip tracking (TRAORI) no/yes; 3rd digit align tool (0 no, 1 align, 2 align turning tool, 3 align milling tool with B-axis turning kinematics); 5th digit swivel yes (0) / no with direction minus (1) / plus (2); 6th digit direction selection optimisation; _MODE swivel mode, bit coded: bits 7-6 00 axis by axis (_A, _B, _C), 01 solid angle (_A, _B), 10 projection angle (_A, _B, _C), 11 rotary axes direct (_A, _B); bits 5-0 axis order of the 1st/2nd/3rd rotation (01 X, 10 Y, 11 Z); _X0, _Y0, _Z0 reference point before rotation; _A, _B, _C 1st, 2nd, 3rd rotation per _MODE; _X1, _Y1, _Z1 zero point after rotation; _DIR -1 = position to the smaller value of rotary axis 1 or 2 (default), +1 = larger value, 0 = no rotary axis motion (frame only); _FR_I incremental retraction in tool direction; _DMODE display mode"
    CYCLE832:
      value: "CYCLE832(S_TOL, S_TOLM, S_OTOL)"
      page: "825-827"
      note: "S_TOL contour tolerance (= axis tolerance of the geometry axes); S_TOLM machining mode: 1st digit 0 = deselection, 1 = finishing, 2 = semi-finishing, 3 = roughing; 2nd digit 0 = compatibility / no orientation tolerance, 1 = orientation tolerance in S_OTOL; 7th digit 0 = compatibility (best available mould-making function: Advanced Surface, or Top Surface with smoothing when the Top Surface option is active), 1 = Top Surface without smoothing, 2 = Top Surface with smoothing; plain-text values (names of G group 59): _OFF 0, _FINISH 1, _SEMIFIN 2, _ROUGH 3, _ORI_FINISH 11, _ORI_SEMIFIN 12, _ORI_ROUGH 13, _TOP_SURFACE_SMOOTH_OFF 1000000, _TOP_SURFACE_SMOOTH_ON 2000000 (e.g. CYCLE832(0.1, _TOP_SURFACE_SMOOTH_OFF+_ORI_FINISH, 1)); S_OTOL orientation tolerance or CYCLE832 version identifier, must be programmed (S_OTOL = 1 on 3-axis machines without tool orientation); CYCLE832() is also allowed for deselection"
  control_structures:
    "IF / ELSE / ENDIF": "conditional block"
    "LOOP / ENDLOOP": "endless loop"
    "FOR / TO / ENDFOR": "counting loop"
    "WHILE / ENDWHILE": "loop with test at the start"
    "REPEAT / UNTIL": "loop with test at the end"
    "CASE / OF / DEFAULT": "branch on an expression"
    "GOTOF / GOTOB / GOTO / GOTOC": "jump forward / backward / search both ways / jump without alarm if the label is missing"
    "LABEL:": "jump label"
    "REPEAT <label> P=<n>": "program section repetition"
    "DEF": "define a local user variable (INT, REAL, BOOL, CHAR, STRING, AXIS, FRAME)"
    "PROC": "subprogram with parameters"
    "CALL / PCALL / MCALL": "subprogram call / with path / modal call"
  M:
    "0": "programmed stop"
    "1": "conditional stop"
    "2": "end of main program, return to start"
    "30": "end of program (as M2)"
    "17": "end of subprogram"
    "3": "spindle clockwise"
    "4": "spindle counterclockwise"
    "5": "spindle stop"
    "6": "tool change"
    "40": "automatic gear stage selection"
    "41-45": "gear stage 1-5"
    "70": "switch spindle to axis mode"
  addresses: [N, G, X, Y, Z, A, B, C, I, J, K, CR, AR, AP, RP, F, S, T, D, M, H, R, P, L]

variables:
  src: est
  note: "SINUMERIK system variables as generally documented ($P_ = preprocessing / programmed values, $A_/$AA_/$AC_ = main-run / actual values, $TC_ = tool data, $M.._ machine data, $S.._ setting data); reading $A_/$AA_ variables in the part program causes an implicit preprocessing stop. Verify against 'Lists System Variables'."
  list:
    - {var: "R0-R99", access: rw, meaning: "arithmetic parameters (number set in machine data)"}
    - {var: "DEF INT/REAL/BOOL/CHAR/STRING/AXIS/FRAME", access: rw, meaning: "local user variables (LUD), global user data GUD"}
    - {var: "$P_EP[axis]", access: r, meaning: "programmed end point (preprocessing)"}
    - {var: "$P_F", access: r, meaning: "programmed feed"}
    - {var: "$P_TOOLNO", access: r, meaning: "active tool number"}
    - {var: "$P_TOOL", access: r, meaning: "active D (cutting edge) number"}
    - {var: "$TC_DP1[t,d]-$TC_DP25[t,d]", access: rw, meaning: "tool edge data: type, lengths, radius, wear (e.g. $TC_DP3 length 1, $TC_DP6 radius)"}
    - {var: "$P_UIFR[n]", access: rw, meaning: "settable frames (n = 1 -> G54 ...)"}
    - {var: "$P_IFRAME / $P_PFRAME / $P_ACTFRAME", access: rw, meaning: "current settable / programmable / total frame"}
    - {var: "$AA_IW[axis]", access: r, meaning: "actual position in workpiece coordinates (main run)"}
    - {var: "$AA_IM[axis]", access: r, meaning: "actual position in machine coordinates (main run)"}
    - {var: "$AA_MM[axis]", access: r, meaning: "measured (probe) position, machine coordinates"}
    - {var: "$AA_MW[axis]", access: r, meaning: "measured (probe) position, workpiece coordinates"}
    - {var: "$AC_MEA[n]", access: r, meaning: "probe n has switched (1) after MEAS/MEAW"}
    - {var: "$AC_TIME", access: r, meaning: "time since block start"}
    - {var: "$A_YEAR / $A_MONTH / $A_DAY / $A_HOUR / $A_MINUTE / $A_SECOND", access: r, meaning: "date and time"}
    - {var: "$P_SEARCH", access: r, meaning: "block search active"}
    - {var: "$P_DRYRUN", access: r, meaning: "dry run feed active"}
    - {var: "$MN_.. / $MC_.. / $MA_..", access: r, meaning: "general / channel / axis machine data"}
    - {var: "$SN_.. / $SC_.. / $SA_..", access: rw, meaning: "general / channel / axis setting data"}
