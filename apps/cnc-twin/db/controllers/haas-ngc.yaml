# Haas Next Generation Control (NGC), mills and lathes: alarms, supported words, timing, macro
# variables. Read in the NGC Mill and Lathe Operator's Manuals (96-8210 / 96-8910 Rev N, 12/2020).
#
# Alarms: the operator's manuals quote only a few alarm numbers (listed below, text written as the
# manual writes it; the control's own capitalisation may differ). The full NGC alarm list is on
# haascnc.com (service / alarm pages), which refused automated access this session: GAP.
# trigger = simulator condition the alarm belongs to (same vocabulary in every db/controllers/*.yaml).
# The lathe G/M-code lists differ from the mill lists and are under words.lathe.
format: cnctwin-controller
version: 1
id: haas-ngc
dialect: haas
name: "Haas Next Generation Control (NGC), mill and lathe"
src: haas-ngc-mill-om-2020

alarms:
  - {code: "312", text: "Program End", trigger: subprogram_not_found, cause: "a subprogram does not end with M99", page: "197"}
  - {code: "314", text: "Subprogram Not In Memory", trigger: subprogram_not_found, cause: "G150: the pocket subprogram given by P is found neither as an internal N block nor as an external program (the manual describes the same search for M98 calls, Setting 251 giving the external location)", page: "379 (G150)"}
  - {code: "332", text: "H and T Not Matched", trigger: tool, cause: "Setting 15 is ON and the Tnn and Hnn of a block do not match", page: "194"}
  - {code: "370", text: "Pocket Definition Error", trigger: cycle_parameter, cause: "G150 general-purpose pocket: the subprogram geometry is not a fully closed shape, or the X-Y start point of the G150 block is not inside it", page: "211 (pocket milling note)"}
  - {code: "467", text: "", trigger: arc_definition, cause: "scaling Settings 188-190 in effect (G51) and a G02 or G03 programmed; only G01 is allowed while scaling is active. The manual gives no alarm text.", page: "463 (Settings 188-190)"}
  - {code: "973", text: "Fixture Clamp Incomplete", trigger: machine, cause: "fixture clamp input monitoring on (#709 or #10709 = 1, M90) and the spindle is commanded on while the clamp input is not made", page: "422 (M90/M91)"}
  - {code: "253", text: "ELECTRONICS OVERHEAT", trigger: machine, cause: "control cabinet temperature reaches or exceeds the recommended level (clogged air filters)", page: "94"}
  - {code: "560", text: "", trigger: overtravel, src: haas-ngc-lathe-om-2020, cause: "lathe with Y axis: X axis commanded home while the Y axis is above spindle centreline (positive Y); home Y first. The manual gives no alarm text.", page: "293"}
  - {code: "605", text: "Invalid Tool Nose Angle", trigger: cycle_parameter, src: haas-ngc-lathe-om-2020, cause: "lathe: a G76 A value (tool angle) containing a decimal point is found during program execution", page: "442"}
  - {code: "9109", text: "TAILSTOCK NOT IN PART HOLD POSITION", trigger: machine, src: haas-ngc-lathe-om-2020, cause: "lathe: Setting 145 Tailstock At Part for Cycle Start is ON and the tailstock is not pressing against the part when CYCLE START is pressed; the program does not start", page: "441"}
  - {code: "9111", text: "INVALID G CODE FOR LIVE TOOL TYPE", trigger: illegal_g_code, src: haas-ngc-lathe-om-2020, cause: "lathe: Setting 368 Live Tooling Type is Axial and a radial live-tooling canned cycle is commanded, or it is Radial and an axial one is commanded", page: "459"}
  - {code: "1000-1999", text: "<text of the comment following #3000 = n>", trigger: user_alarm, cause: "#3000 = n (n = 1-999) in a macro: alarm number 1000 + n with the next comment as its text; all motion stops and the program must be reset", page: "266"}

messages:
  src: haas-ngc-mill-om-2020
  page: "266, 268"
  "#3000": "#3000 = n (MESSAGE) with n 1-999 raises programmable alarm 1000 + n; the comment is placed in the alarm list; motion stops, reset required"
  "#3006": "#3006 = n (comment) is a programmable stop like M00: the control stops, shows the comment on the lower centre of the screen and continues with the next block on CYCLE START"
  M00: "stop program"
  M01: "optional program stop (only with OPTION STOP on)"
  M109: "interactive user input"

timing:
  src: haas-ngc-mill-om-2020
  ipo_period_ms: {value: 1.0, src: est, note: "Haas does not publish the NGC interpolation period; 1 ms kept as in db/machines/haas-*.yaml"}
  block_processing_ms: {value: 1.0, src: est, note: "not published; 1 ms per block kept as in db/machines/haas-*.yaml"}
  lookahead_blocks: {value: 80, src: est, note: "the manual gives no look-ahead depth (HSM uses 'full look-ahead', p. 226; G103 can only limit it to 0-15 blocks); 80 kept as in db/machines/haas-*.yaml"}
  lookahead_limit_range_blocks: {value: [0, 15], page: "370", note: "G103 Pn limits block look-ahead to n blocks (range 0-15); G103 or G103 P0 removes the limit; macro expressions are interpreted during look-ahead, G103 P1 makes them interpreted one block ahead; G103 affects cutter compensation and high-speed machining"}
  hsm_max_contouring_feed_ipm: {value: 1200, page: "226", note: "high-speed machining option: acceleration before interpolation with full look-ahead, contouring feeds up to 1200 ipm (30.5 m/min) without distortion of the programmed path"}
  corner_rounding_default_in: {value: 0.025, page: "456", note: "Setting 85 Maximum Corner Rounding, initial default 0.0250 inch (0.635 mm): the control keeps corner radii no bigger than this and adjusts feeds around corners in all 3 axes to meet it; 0 = exact stop in every motion block"}
  smoothing:
    - code: "G187 P1 / P2 / P3 Ennnn"
      name: accuracy_control
      page: "393, 456, 463"
      note: "P = smoothness level P1 rough, P2 medium, P3 finish (temporarily overrides Setting 191 Default Smoothness, factory default MEDIUM); E = maximum corner rounding (temporarily overrides Setting 85). G187 Pm leaves E unchanged, G187 Ennnn leaves P unchanged, G187 alone cancels E and returns to Setting 191. Cancelled by RESET, M30, M02, end of program or EMERGENCY STOP. The tolerance belonging to each P level is not published."
    - code: "G61 / G64 / G09"
      name: exact_stop
      note: "G61 exact stop mode (group 15), G64 cancels G61, G09 exact stop for one block"

