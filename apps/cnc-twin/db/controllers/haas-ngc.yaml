variables:
  src: haas-ngc-mill-om-2020
  page: "253-263 (macro argument tables, 6.13.7 Macro Variables Table), 264-270 (system variables in depth)"
  notes: "NGC variable numbers; legacy (Classic Haas control) numbers in 'legacy' (#100 and #10100 address the same data). access: r = marked '(read only)' in the table or described only as read; w = set to trigger an action; rw = described as settable (or local/general-purpose storage); unspecified = the manual says neither (tool offsets are assumed writable as on Fanuc-style controls, but the manual does not say so). #5021-#5026 and #5041-#5046 cannot be read while the machine is in motion; reading any work offset stops the interpretation look-ahead until that block is executed. Lathe tool offset variables differ and are listed under lathe_tool_offsets."
  g65_arguments: {A: "#1", B: "#2", C: "#3", I: "#4", J: "#5", K: "#6", D: "#7", E: "#8", F: "#9", H: "#11", M: "#13", Q: "#17", R: "#18", S: "#19", T: "#20", U: "#21", V: "#22", W: "#23", X: "#24", Y: "#25", Z: "#26", "G L N O P": "not usable as arguments"}
  list:
    - {var: "#0", access: r, meaning: "not a number (read only)"}
    - {var: "#1-#33", access: rw, meaning: "macro call arguments (local)"}
    - {var: "#10000-#10149", legacy: "#100-#149", access: rw, meaning: "general-purpose variables saved on power off"}
    - {var: "#10150-#10199", legacy: "#150-#199", access: rw, meaning: "probe values (if installed)"}
    - {var: "#10200-#10499", access: rw, meaning: "general-purpose variables saved on power off"}
    - {var: "#10500-#10549", legacy: "#500-#549", access: rw, meaning: "general-purpose variables saved on power off"}
    - {var: "#10550-#10599", legacy: "#550-#599", access: rw, meaning: "probe calibration data (if installed)"}
    - {var: "#10600-#10699", legacy: "#600-#699", access: rw, meaning: "general-purpose variables saved on power off"}
    - {var: "#700-#749", access: none, meaning: "hidden variables for internal use only"}
    - {var: "#709", access: r, meaning: "fixture clamp input (do not use for general purpose); = 1 with M90 active and spindle commanded on gives alarm 973"}
    - {var: "#10800-#10999", legacy: "#800-#999", access: rw, meaning: "general-purpose variables saved on power off"}
    - {var: "#11000-#11063", access: r, meaning: "64 discrete inputs"}
    - {var: "#1064-#1068", access: unspecified, meaning: "maximum axis loads X, Y, Z, A, B"}
    - {var: "#1080-#1087", access: r, meaning: "raw analog to digital inputs"}
    - {var: "#1090-#1098", access: r, meaning: "filtered analog to digital inputs (#1098 spindle load with Haas vector drive)"}
    - {var: "#1601-#1800", access: unspecified, meaning: "number of flutes on tools 1-200"}
    - {var: "#1801-#2000", access: unspecified, meaning: "maximum recorded vibrations of tools 1-200"}
    - {var: "#2001-#2200", access: unspecified, meaning: "tool length offsets (mill)"}
    - {var: "#2201-#2400", access: unspecified, meaning: "tool length wear (mill)"}
    - {var: "#2401-#2600", access: unspecified, meaning: "tool diameter/radius offsets (mill)"}
    - {var: "#2601-#2800", access: unspecified, meaning: "tool diameter/radius wear (mill)"}
    - {var: "#3000", access: w, meaning: "programmable alarm (alarm 1000 + n)"}
    - {var: "#3001", access: rw, meaning: "millisecond timer (ms since power on; can be set)"}
    - {var: "#3002", access: rw, meaning: "hour timer (can be set)"}
    - {var: "#3003", access: rw, meaning: "single block suppression"}
    - {var: "#3004", access: rw, meaning: "override FEED HOLD control"}
    - {var: "#3006", access: w, meaning: "programmable stop with message"}
    - {var: "#3011", access: unspecified, meaning: "year, month, day"}
