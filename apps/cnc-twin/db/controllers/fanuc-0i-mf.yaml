  - {code: "PS0129", text: "USE 'G' AS ARGUMENT", trigger: macro_error, cause: "Illegal address is commanded in a custom macro call. Please confirm whether the address is valid in the macro call. When using the axis name expansion, please confirm the setting of the parameter (No.11647).", page: "672"}
