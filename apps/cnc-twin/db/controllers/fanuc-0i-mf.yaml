messages:
  src: est
  note: "custom macro B conventions as generally documented for FANUC controls, except where an entry cites the FANUC catalogue"
  "#3000": {value: "#3000 = n (MESSAGE) raises a macro alarm; the 0i-F Plus numbers macro alarms 3000-3200 (so alarm = 3000 + n, n = 0-200) and shows the message text; the program stops", src: fanuc-cnc-functions-catalog-2024, page: "504", note: "the catalogue gives the alarm-number range 3000-3200 for macro alarms (#3000) and 1000-1999 for external (PMC) alarm messages; 'alarm = 3000 + n' and the stop behaviour are from general FANUC knowledge"}
  "#3006": "#3006 = 1 (MESSAGE) stops like M00 and displays the message; CYCLE START continues"
  M00: "program stop"
  M01: "optional stop"
  "(...)": "comments in parentheses are ignored by the interpreter (shown on the screen)"

timing:
  src: est
  note: "FANUC publishes no interpolation period or block processing time for the 0i-F in the documents available this session; each value carries its own derivation note"
  ipo_period_ms: {value: 1.0, note: "not published; 1 ms assumed (typical of current CNCs)"}
  block_processing_ms: {value: 1.0, note: "not published; 1 ms per block assumed with AI contour control II active (the catalogue only says the 30i-B Plus High-Speed Processing option improves block processing time)"}
  lookahead_blocks: {value: 200, src: fanuc-cnc-functions-catalog-2024, page: "245, 247", note: "AI Contour Control II is a basic function of the 0i-MF Plus (Type 0, 1 and 3); its look-ahead is 200 blocks ('expands the number of look-ahead blocks for AI contour control II from 200 blocks to 400 blocks')"}
  lookahead_option_blocks: {value: 400, src: fanuc-cnc-functions-catalog-2024, page: "247", note: "option Maximum Look-Ahead Blocks 400 (A02B-0350-R386), only for the 0i-MF Plus; in a 2-path system 400 blocks in path 1 and 5 blocks in path 2"}
  smoothing:
    - code: "G05.1 Q1 / G05.1 Q0 (activation command est)"
      name: ai_contour_control_ii
      src: fanuc-cnc-functions-catalog-2024
      page: "245"
      note: "AI Contour Control II+: 'suppresses path errors due to acceleration/deceleration delay, servo positioning delay, and mechanical and electro-mechanical machine performance constraints', optimises speed with smooth acceleration/deceleration and removes corner clipping that grows with feed; basic in 0i-MF Plus (Type 0, 1, 3). It is a look-ahead feed/acceleration control, not a geometric tolerance band. The G05.1 Q1 on / Q0 off command is from general FANUC knowledge (not in the catalogue)."
    - code: "Smooth Tolerance+ Control (command not given in the catalogue)"
      name: smooth_tolerance
      src: fanuc-cnc-functions-catalog-2024
      page: "174"
      note: "converts a sequence of small blocks automatically into a smooth curve that approximates it within a given tolerance; corners are detected automatically and converted into a smooth curve within a distinct (corner) tolerance; the user defines the two tolerances. Basic in 0i-MF Plus (Type 0, 1, 3) and 0i-LF Plus. Part of the basic High-Speed and High-Quality Machining Package (AICC II, Smooth Tolerance Control, Jerk Control, Machining Quality Level Adjustment, p. 173). Nano smoothing is listed only for 30i/31i/32i-B Plus."
    - code: "G61 / G64 / G09 / G62 / G63"
      name: exact_stop_and_cutting_modes
      note: "G61 exact stop mode, G64 cutting mode (default), G09 exact stop for one block, G62 automatic corner override (basic in 0i-MF Plus per catalogue p. 282), G63 tapping mode. Codes from general knowledge (est)."

words:
  src: est
  note: "standard FANUC M-series G code list from general knowledge; entries with their own src are confirmed by the FANUC catalogue; group numbers are not listed because they were not verified"
  G:
    "00": "positioning (rapid traverse)"
    "01": "linear interpolation (cutting feed)"
    "02": "circular interpolation / helical interpolation CW"
    "03": "circular interpolation / helical interpolation CCW"
    "04": "dwell (P ms or X s), exact stop"
    "05.1": "AI contour control (Q1 on, Q0 off)"
    "07.1": "cylindrical interpolation (also G107; catalogue p. 163: basic in 0i-MF Plus Type 0, 1)"
    "08": "AI contour control, compatible command (P1 on, P0 off)"
    "09": "exact stop (one block)"
    "10": "programmable data input (offsets, work offsets, parameters)"
    "11": "programmable data input mode cancel"
    "15": "polar coordinates command cancel"
    "16": "polar coordinates command (polar coordinate command is basic in 0i-MF Plus, catalogue p. 261)"
    "17": "XpYp plane selection"
    "18": "ZpXp plane selection"
    "19": "YpZp plane selection"
    "20": "input in inch"
    "21": "input in mm"
    "22": "stored stroke check function on"
    "23": "stored stroke check function off"
    "27": "reference position return check"
    "28": "automatic return to reference position (via intermediate point)"
    "29": "movement from reference position"
    "30": "2nd, 3rd, 4th reference position return"
    "31": "skip function (position latched into #5061...)"
    "31 P90": {value: "continuous high-speed skip: coordinates at each high-speed skip signal are read into #5061-#5068 without stopping the axes (option A02B-0350-J770)", src: fanuc-cnc-functions-catalog-2024, page: "185"}
    "33": "threading"
    "37": "automatic tool length measurement (option)"
    "39": "corner circular interpolation"
    "40": "cutter compensation cancel"
    "41": "cutter compensation left"
    "42": "cutter compensation right"
    "43": "tool length compensation +"
    "44": "tool length compensation -"
    "43.4": "tool centre point control type 1 (5-axis; the catalogue p. 374 lists TCP only for 30i/31i/32i-B Plus, while Smooth TCP R639, tilted working plane indexing R522 and 3-D cutter compensation S667 are 0i-MF Plus options: verify availability)"
    "43.5": "tool centre point control type 2 (see G43.4)"
    "49": "tool length compensation cancel"
    "50": "scaling cancel"
    "51": "scaling (scaling is basic in 0i-MF Plus, catalogue p. 283)"
    "50.1": "programmable mirror image cancel"
    "51.1": "programmable mirror image"
