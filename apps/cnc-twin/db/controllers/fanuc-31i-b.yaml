messages:
  src: fanuc-30ibplus-om-2019
  page: "286 (M00/M01), 483-484 (#3000), 486 (#3006)"
  macro_alarm_format: "MC{number}"
  "#3000": "#3000 = n (ALARM MESSAGE); raises a macro alarm; the message (up to 60 characters, between control-out '(' and control-in ')') is shown, without a message a macro alarm text is used. With bit 1 (MCA) of parameter No. 6008 = 0, n = 0-200 and the alarm number shown after MC is 3000 + n (#3000 = 1 -> 'MC3001 ALARM MESSAGE'); with MCA = 1, n = 0-4095 and MC is followed by n itself ('MC0001 ALARM MESSAGE'). macro_alarm_format above is the default (MCA = 0). Bit 3 (NCM) of No. 6020 selects whether the first or the last comment is the message. #3000 cannot be written by the PMC window."
  "#3006": "#3006 = 1 (MESSAGE); executes the blocks up to the previous one and then stops; a message of up to 60 characters in the same block is displayed on the external operator message screen (not when single block stop is suppressed by #3003 = 1)"
  M00: "program stop: automatic operation stops after the block, modal information is kept, cycle start resumes"
  M01: "optional stop: as M00, only with the Optional Stop switch on"

timing:
  src: fanuc-30ibplus-om-2019
  ipo_period_ms: {value: 1.0, src: est, note: "the manuals read give no interpolation period; 1 ms assumed as for the other FANUC files"}
  block_processing_ms: {value: 1.0, src: est, note: "not published in the manuals read (the catalogue fanuc-cnc-functions-catalog-2024 p. 248 only says the High-Speed Processing option improves the block processing time); 1 ms assumed"}
  lookahead_blocks: {value: 200, page: "665", note: "Table 20.1 (a) Number of blocks read ahead: AI contour control I 40 (30 in systems with more than 2 paths), AI contour control II 200, AI contour control II with high-speed processing 600; 1 block when G08 is specified. AI contour control II assumed on the turn-mill machines (an option: A02B-0357-S808 31i-BP / A02B-0356-S808 31i-B5P, catalogue p. 245)"}
  lookahead_option_blocks: {value: 1000, page: "665", note: "AI contour control II with high-speed processing and the look-ahead blocks expansion function: 1000 blocks; AI contour control II alone can be expanded to 400 blocks by Look-ahead blocks expansion of AI contour control II (catalogue p. 246, A02B-0357-R468 31i-BP); in a 2-path system parameter No. 11604 sets the blocks read ahead per path and a total over 600 (1000) gives PW0020 HSP PARAMETER ERROR(MPATH)"}
  smoothing:
    - code: "G05.1 Q1 [R_] / G05.1 Q0"
      name: ai_contour_control
      page: "666-667"
      note: "AI contour control mode on/off; R = machining condition selecting level 1 to 10. Also accepted: G08 P1 [R_] / G08 P0 (advanced preview control compatible) and G05 P10000 [R_] / G05 P0 (AI contour control II only). Always in an independent block; switched off by the command that switched it on and by reset; bit 0 (SHP) of parameter No. 1604 switches it on at the start of automatic operation. The manual gives no geometric tolerance for it (look-ahead speed and acceleration control)."
    - code: "G61 / G62 / G63 / G64 (group 15), G09 (group 00)"
      name: exact_stop_and_cutting_modes
      page: "37, 39"
      note: "G61 exact stop mode, G62 automatic corner override mode, G63 tapping mode, G64 cutting mode; G09 exact stop for one block"

