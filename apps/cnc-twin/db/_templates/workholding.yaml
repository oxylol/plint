# Workholding device (catalogue item): db/workholding/<maker>-<series>.yaml, `items:` like tools
# (example: the Kurt D688 as in db/workholding/kurt-anglock.yaml; the clamping force is the top row of the
# manual's 'Manual Vise Clamping Force' table, 7968 lbf at 80 ft-lb)
format: cnctwin-workholding
version: 1
series_id: kurt-anglock
maker: "Kurt Manufacturing"
series: "AngLock D688 precision vise"
src: key
items:
  - id: kurt-d688
    type: vise                       # vise | clamp | fixture_plate | soft_jaws | vacuum | magnetic | adhesive | chuck_3jaw | chuck_4jaw | collet_chuck | collet | tailstock_centre | steady_rest | tabs
    jaw_width_mm: 152.4              # 6 in
    jaw_height_mm: 44.07             # jaw depth 1.735 in
    max_opening_mm: 223.5            # 8.8 in
    clamping_force_kN: {value: 35.4, at_handle_torque_Nm: 108.5, src: key}   # force vs input torque as published: 7968 lbf = 35.4 kN at 80 ft-lb = 108.5 Nm
    force_per_torque_N_per_Nm: {value: 327, src: key}  # if a linear relation is published (here 35.4 kN / 108.5 Nm at the top of the table)
    jaw_friction: {value: 0.19, src: key}          # jaw-to-part static friction coefficient (est with its derivation if not published)
    jaw_stiffness_N_um: {value: null}              # null: not published
    body_mm: [[-104.8, -212.7, -111.1], [104.8, 212.7, 0]]   # outline for collision, in the vise frame (z = 0 at the jaw top)
    mass_kg: null
    accuracy: {repeatability_um: 25.4, src: key}   # 0.001 in
  # chucks: {jaws: 3, max_rpm, gripping_force_kN, jaw_mass_kg, jaw_cg_radius_mm, centrifugal_loss_model: {...}, grip_length_mm, through_hole_mm, accuracy_um}
  # vacuum: {min_abs_pressure_kPa, seal: ..., area_utilisation}
  # magnetic: {holding_pressure_N_cm2: {table: [[thickness, N_cm2], ...], x: mm}, pole_pitch_mm}
  # adhesive: {shear_strength_MPa, peel_strength_N_mm, cure_s}
  # collet: {range_mm, grip_length_mm, gripping_force_kN, max_rpm}
  # tailstock_centre: {angle_deg: 60, live: true, max_rpm, radial_load_N}
  # steady_rest: {grip_range_mm, rollers: 3, roller_stiffness_N_um}
