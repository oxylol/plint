  # vacuum: {min_abs_pressure_kPa, seal: ..., area_utilisation}
  # magnetic: {holding_pressure_N_cm2: {table: [[thickness, N_cm2], ...], x: mm}, pole_pitch_mm}
  # adhesive: {shear_strength_MPa, peel_strength_N_mm, cure_s}
  # collet: {range_mm, grip_length_mm, gripping_force_kN, max_rpm}
