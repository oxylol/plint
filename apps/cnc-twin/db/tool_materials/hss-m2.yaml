format: cnctwin-tool-material
version: 1
id: hss-m2
class: hss
name: "HSS M2 (HS6-5-2C, 1.3343), hardened and tempered 62-65 HRC (BÖHLER S600 as the reference grade)"
src: bohler-2026-s600
composition: {value: "C 0.9, Cr 4.1, Mo 5, V 1.8, W 6.2 wt%", src: bohler-2026-s600, page: "p. 2"}
density_kg_m3: {value: 8070, src: bohler-2026-s600, page: "p. 4, 20 °C"}
youngs_modulus_GPa: {value: 219, src: bohler-2026-s600, page: "p. 4, 20 °C"}
poisson: {value: 0.29, src: est, note: "not in the BÖHLER sheet; typical value for hardened tool steels (0.28-0.30), 0.29 chosen"}
hardness_HV: {value: 820, range: [750, 870], src: est, note: "BÖHLER gives min. 62 HRC hardened and tempered (bohler-2026-s600 p. 2); usual cutting-tool hardness 63-65 HRC, converted with the ASTM E140 HRC-HV table (62 HRC ~ 750 HV, 65 HRC ~ 830 HV)"}
transverse_rupture_MPa: {value: 3800, range: [3000, 4500], src: est, note: "4-point bend fracture strength of conventionally melted M2 at 63-65 HRC; no number read in a source (the Vanadis 23 brochure shows bend strength only as a chart); engineering judgement"}
compressive_MPa: {value: 3200, range: [2900, 3500], src: est, note: "compressive yield strength of M2 at 63-65 HRC; no source read; engineering judgement"}
fracture_toughness_MPa_sqrt_m: {value: 16, range: [12, 20], src: est, note: "plane-strain K_IC of M2 at working hardness; no number read in a source"}
conductivity_W_mK:
  table: [[20, 21.8], [400, 25.4], [600, 24.5]]
  src: est
  note: "20 °C value 21.8 W/mK from bohler-2026-s600 p. 4; 400 and 600 °C scaled with the Vanadis 23 (HS6-5-3) ratios 28/24 and 27/24 from uddeholm-vanadis23-datasheet p. 4"
specific_heat_J_kgK:
  table: [[20, 433], [400, 526], [600, 619]]
  src: est
  note: "20 °C value 0.433 kJ/kgK from bohler-2026-s600 p. 4; 400 and 600 °C scaled with the Vanadis 23 ratios 510/420 and 600/420 (uddeholm-vanadis23-datasheet p. 4)"
expansion_1_K:
  table: [[100, 11.5e-6], [200, 11.7e-6], [300, 12.2e-6], [400, 12.4e-6], [500, 12.7e-6], [600, 13.0e-6], [700, 12.9e-6]]
  src: bohler-2026-s600
  page: "p. 4, mean expansion between 20 °C and T"
max_service_temp_degC: {value: 600, src: est, note: "HSS keeps its hardness up to about its tempering temperature; BÖHLER S600 tempering 550-570 °C (bohler-2026-s600 p. 2); 600 °C used as the softening limit"}
weibull_modulus: {value: 20, src: est, note: "no published value read; tool steels scatter less than hardmetals in bending, 20 assumed"}
thermal_shock_parameter: null
usui: []
notes: "Reference grade BÖHLER S600. Temperature dependence of conductivity and heat capacity is borrowed from the PM grade Vanadis 23 (HS6-5-3), the closest grade with a published 20/400/600 °C table."
