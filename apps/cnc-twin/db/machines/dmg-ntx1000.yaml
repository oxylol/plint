# DMG MORI (SEIKI) NTX 1000, type S: integrated mill-turn centre with B-axis milling head (turret 1 =
# tool spindle), main spindle 1 and opposed spindle 2, FANUC F31iB with MAPPS IV. Catalogue data valid
# March 2013 (1st generation). Frames: base origin = spindle-1 nose face on the spindle axis; +z toward
# spindle 2, +x radial toward the tool spindle (up), +y completes. Fixed rotations use
# rotate_deg = [rx, ry, rz] (intrinsic, degrees, applied x then y then z).
format: cnctwin-machine
version: 1
id: dmg-ntx1000
maker: "DMG MORI"
model: "NTX 1000 (S type: spindle 2, no turret 2)"
type: mill_turn
src: dmgmori-ntx1000-2013

controller:
  dialect: fanuc
  model: "FANUC F31iB with DMG MORI MAPPS IV (F31iB5 for simultaneous 5-axis)"
  alarms: fanuc-31i-b
  ipo_period_ms: {value: 1.0, src: est, note: "not published"}
  block_processing_ms: {value: 1.0, src: est, note: "not published"}
  lookahead_blocks: {value: 200, src: est, note: "AI contour control look-ahead, assumed"}
  least_input_increment_mm: {value: 0.001, src: est, note: "IS-B input unit assumed"}
  least_input_increment_deg: {value: 0.0001, note: "min. B-axis and spindle indexing increment 0.0001 deg (published)"}
  max_feed_mm_min: {value: 40000, src: est, note: "max cutting feed not read; X/Y rapid used"}
  rapid_mm_min: {X: 40000, Y: 40000, Z: 50000, A: 36000}
  smoothing:
    - {code: "G05.1 Q1 (AI contour control)", name: finish, tolerance_mm: 0.005, src: est, note: "FANUC look-ahead mode; tolerance set by parameters, assumed"}
  five_axis: {tcp: "G43.4 / G43.5 (tool centre point control, F31iB5)", tilted_plane: "G68.2", src: est, note: "FANUC syntax names; 5-axis simultaneous requires the F31iB5 (dmgmori-ntx1000-2013 p. 4)"}
  corner_default: {value: blend, src: est}
  in_position_mm: {value: 0.005, src: est, note: "exact-stop window 5 um: at the 5 um positioning accuracy (est) of the X/Y axes; the FANUC in-position width is a parameter set by the builder (not published)"}
  rapid_override_steps_pct: {value: [0, 25, 50, 100], src: est, note: "FANUC-style rapid override steps F0 (a parameter-set low speed, written 0), 25, 50 and 100 % assumed"}
  feed_override_range_pct: {value: [0, 200], src: est, note: "feed override 0-200 % assumed as on the other machines (the FANUC panel switch span; not read this session)"}
  tool_life_management: {value: true, src: est}
  probing: {value: true, src: est}

axes:
  X:
    type: linear
    travel_mm: [-380, 0]
    travel_note: "380 mm = 330 mm + 50 mm (published as '380 (330 + 50)')"
    rapid_mm_min: 40000
    max_feed_mm_min: {value: 40000, src: est, note: "max cutting feed not read: the 40 m/min X rapid taken as the limit (as controller.max_feed_mm_min)"}
    accel_m_s2: {value: 5.0, src: est, note: "not published"}
    jerk_m_s3: {value: 100, src: est, note: "100 m/s3 ramps to the 5 m/s2 acceleration in 50 ms, longer than one period of the 60 Hz ram mode (17 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 45, src: est, note: "position-loop gain 45 1/s (kv/2 pi = 7.2 Hz), 8 x below the 60 Hz velocity loop (cascade rule >= 5-10), as on the DMU 50"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains (0.74 mm at 40 m/min with kv 45 1/s); 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 60, src: est, note: "60 Hz for the 700 kg ram on box guideways: at the 60 Hz ram mode it must damp, 8 x the position-loop crossover"}
    backlash_um: {value: 1, src: est, note: "preloaded double ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "friction step at reversal (ISO 230-2 reversal value B 1-5 um): 2 um"}
    ballscrew: {diameter_mm: 40, pitch_mm: 20, length_mm: 650, fixed_end: both, src: est, note: "40 mm x 20 mm lead: the 40 m/min rapid needs 2000 rpm; length = 380 mm travel + nut + bearing ends"}
    positioning: {accuracy_um: 5, repeatability_um: 2.5, src: est, note: "not published"}
    motor_force_N: {value: 8000, src: est, note: "a 3 kW feed servo (about 14 Nm rated) through the 20 mm lead at 90 % gives 2 pi x 14 x 0.9 / 0.020 = 4.0 kN continuous and 2-3 x that peak; 8 kN taken as the usable peak (assumed motor size); X lifts the 700 kg ram (+x up), 700 x (5 + 9.81) = 10.4 kN at 5 m/s2, so upward accelerations use the peak"}
    moving_mass_kg: {value: 700, src: est, note: "octagonal ram with tool spindle and DDM B axis"}
    guideways: {value: "box (square) guideways, 4 located diagonally (octagonal ram construction)", src: dmgmori-ntx1000-2013, page: "p. 4"}
  Y:
    type: linear
    travel_mm: [-105, 105]
    rapid_mm_min: 40000
    max_feed_mm_min: {value: 40000, src: est, note: "not read: the 40 m/min Y rapid taken as the limit"}
    accel_m_s2: {value: 5.0, src: est, note: "0.5 g as X; the Y slide moves the 500 kg tool-spindle unit horizontally (8 kN peak: up to 16 m/s2)"}
    jerk_m_s3: {value: 100, src: est, note: "as X: 50 ms ramp to 5 m/s2, longer than one period of the 80 Hz y mode"}
    servo:
      kv_1_s: {value: 45, src: est, note: "as X: kv/2 pi = 7.2 Hz, 8 x below the 60 Hz velocity loop"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains (0.74 mm at 40 m/min with kv 45 1/s); 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 60, src: est, note: "as X: 60 Hz, below the 80 Hz y frame mode"}
    backlash_um: {value: 1, src: est, note: "as X: 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "as X: 2 um"}
    ballscrew: {diameter_mm: 32, pitch_mm: 16, length_mm: 450, fixed_end: both, src: est, note: "32 mm x 16 mm lead: the 40 m/min rapid needs 2500 rpm; length = 210 mm travel + nut + bearing ends"}
    positioning: {accuracy_um: 5, repeatability_um: 2.5, src: est, note: "as X: semi-closed-loop ballscrew axis without published scales: ISO 230-2 values typical of this machine class (not published)"}
    motor_force_N: {value: 8000, src: est, note: "as X: a 3 kW servo through the 16 mm lead gives 5 kN continuous, 8 kN taken as the usable peak"}
    moving_mass_kg: {value: 500, src: est, note: "Y slide with the B head and the tool spindle (the X ram's 700 kg less the ram body, about 200 kg), assumed"}
  Z:
    type: linear
    travel_mm: [-615, 0]
    travel_note: "460 mm + 155 mm for ATC (published)"
    rapid_mm_min: 50000
    max_feed_mm_min: {value: 50000, src: est, note: "not read: the 50 m/min Z rapid taken as the limit"}
    accel_m_s2: {value: 5.0, src: est, note: "0.5 g as X: 10 kN (est) on the 1200 kg saddle allows 8.3 m/s2"}
    jerk_m_s3: {value: 100, src: est, note: "as X: 50 ms ramp to 5 m/s2"}
    servo:
      kv_1_s: {value: 45, src: est, note: "as X: kv/2 pi = 7.2 Hz, 6 x below the 50 Hz velocity loop"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains (0.74 mm at 40 m/min with kv 45 1/s); 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 50, src: est, note: "50 Hz for the heaviest assembly (1200 kg saddle with ram and head), below X and Y"}
    backlash_um: {value: 1, src: est, note: "as X: 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "as X: 2 um"}
    ballscrew: {diameter_mm: 40, pitch_mm: 20, length_mm: 950, fixed_end: both, src: est, note: "40 mm x 20 mm lead: the 50 m/min rapid needs 2500 rpm; length = 615 mm travel + nut + bearing ends"}
    positioning: {accuracy_um: 6, repeatability_um: 3, src: est, note: "as X over the longer 615 mm travel: 6 um accuracy, 3 um repeatability (semi-closed-loop ballscrew axis without published scales: ISO 230-2 values typical of this machine class (not published))"}
    motor_force_N: {value: 10000, src: est, note: "a 4 kW servo (about 19 Nm rated) through the 20 mm lead: 5.4 kN continuous; 10 kN taken as the usable peak (assumed)"}
    moving_mass_kg: {value: 1200, src: est, note: "saddle carrying the X ram (700 kg) and its own casting, about 500 kg, assumed"}
  A:
    type: linear
    description: "spindle 2 travel along z"
    travel_mm: {value: [-470, 0], src: est, note: "spindle-2 stroke not given in the catalogue table; assumed from the 424 mm max turning length"}
    rapid_mm_min: 36000
    max_feed_mm_min: {value: 36000, src: est, note: "not read: the 36 m/min A (spindle-2) rapid taken as the limit"}
    accel_m_s2: {value: 4.0, src: est, note: "0.4 g: the spindle-2 slide (400 kg) is positioned rather than contoured; 8 kN (est) would allow 20 m/s2"}
    jerk_m_s3: {value: 80, src: est, note: "80 m/s3: 50 ms ramp to 4 m/s2"}
    servo:
      kv_1_s: {value: 40, src: est, note: "40 1/s (kv/2 pi = 6.4 Hz), 8 x below the 50 Hz velocity loop"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains (0.74 mm at 40 m/min with kv 45 1/s); 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 50, src: est, note: "50 Hz for the 400 kg spindle-2 slide, 8 x the position-loop crossover"}
    backlash_um: {value: 1, src: est, note: "as X: 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "as X: 2 um"}
    ballscrew: {diameter_mm: 32, pitch_mm: 16, length_mm: 700, fixed_end: both, src: est, note: "32 mm x 16 mm lead: 36 m/min needs 2250 rpm; length = 470 mm stroke + nut + bearing ends"}
    positioning: {accuracy_um: 6, repeatability_um: 3, src: est, note: "as Z: semi-closed-loop ballscrew axis without published scales: ISO 230-2 values typical of this machine class (not published)"}
    motor_force_N: {value: 8000, src: est, note: "as Y: a 3 kW servo through the 16 mm lead, 8 kN usable peak"}
    moving_mass_kg: {value: 400, src: est, note: "spindle-2 headstock with its built-in 7.5 kW motor and 5 in chuck on the slide, assumed"}
  B:
    type: rotary
    travel_deg: [-120, 120]
    continuous: false
    max_rpm: 100
    index_90deg_s: {value: 0.49, note: "published; clamp/unclamp time not included"}
    accel_rad_s2: {value: 60, src: est, note: "DDM torque motor; consistent with 90 deg in 0.49 s at a 100 rpm limit"}
    jerk_rad_s3: {value: 2000, src: est, note: "2000 rad/s3: the 60 rad/s2 acceleration is reached in 30 ms, longer than one period of the 120 Hz clamped B mode (8 ms)"}
    drive: {value: "DDM direct-drive motor, zero backlash", src: dmgmori-ntx1000-2013, page: "p. 4"}
    servo:
      kv_1_s: {value: 50, src: est, note: "direct-drive (DDM) torque motor without gear wind-up: 50 1/s (kv/2 pi = 8 Hz), 10 x below its 80 Hz velocity loop"}
      feedforward: {value: 0.95, src: est, note: "0.95 as the linear axes: no gear wind-up in the DDM drive"}
      velocity_bw_Hz: {value: 80, src: est, note: "80 Hz for the direct drive, below the 120 Hz clamped head mode"}
    backlash_arcsec: {value: 0, src: dmgmori-ntx1000-2013, note: "direct drive: 'zero backlash' (p. 4)"}
    brake:
      clamp_torque_Nm: {value: 1000, src: est, note: "not published: about 3 x the 300 Nm DDM torque (est), so cutting loads on the clamped head never drive it, rounded to 1000 Nm"}
      clamp_time_s: {value: 0.2, src: est, note: "hydraulic clamp of the DDM head: 0.2 s assumed, short against the published 0.49 s 90 deg index (which excludes clamping)"}
      unclamped_stiffness_Nm_rad: {value: 3.0e5, src: est, note: "torque-motor servo stiffness"}
      clamped_stiffness_Nm_rad: {value: 2.0e6, src: est, note: "k = J (2 pi f)^2 with the 120 Hz clamped mode (est) and J = 3.5 kg m2 of the B head with the tool spindle (assumed): 3.5 x 754^2 = 2.0e6 Nm/rad"}
    positioning: {accuracy_arcsec: 5, repeatability_arcsec: 2, src: est, note: "not published"}
    motor_torque_Nm: {value: 300, src: est, note: "DDM torque: J alpha = 3.5 kg m2 x 60 rad/s2 = 210 Nm for the assumed acceleration, plus the unbalance of the head: 300 Nm (assumed)"}
  C1:
    type: rotary
    description: "spindle 1 C axis"
    travel_deg: [0, 360]
    continuous: true
    max_rpm: {value: 250, note: "rapid traverse C 250 min-1"}
    accel_rad_s2: {value: 50, src: est, note: "50 rad/s2 reaches the 250 rpm C rapid (26 rad/s) in 0.52 s; the 223 Nm spindle motor would accelerate the 0.06 kg m2 spindle 70 x faster, so the value is the C-mode tuning (assumed)"}
    jerk_rad_s3: {value: 1000, src: est, note: "the 50 rad/s2 is reached in a/j = 50 ms"}
    servo:
      kv_1_s: {value: 40, src: est, note: "C mode of the built-in spindle motor: 40 1/s (kv/2 pi = 6.4 Hz), 6 x below its 40 Hz velocity loop"}
      feedforward: {value: 0.9, src: est, note: "0.9 for the spindle in C mode: the chuck and part inertia vary, so less feed-forward is used than on the feed axes"}
      velocity_bw_Hz: {value: 40, src: est, note: "40 Hz velocity loop of the spindle in C mode (the turning drive is tuned for speed, not position)"}
    backlash_arcsec: {value: 0, src: est, note: "built-in (DDS) spindle motor"}
    brake:
      clamp_torque_Nm: {value: 600, src: est, note: "spindle clamp for milling with C held: about 3 x the 223 Nm motor torque, rounded to 600 Nm (assumed)"}
      clamp_time_s: {value: 0.2, src: est, note: "hydraulic spindle clamp, 0.2 s assumed"}
      unclamped_stiffness_Nm_rad: {value: 3.8e3, src: est, note: "RE-DERIVED (was 1.0e5, not reconstructable): a built-in (DDS) spindle motor holds the C position only through its servo loop, whose dynamic stiffness near the velocity bandwidth is k = J (2 pi f_v)^2 = 0.06 kg m2 (rotor + 6 in chuck, est) x (2 pi x 40 Hz)^2 = 3.8e3 Nm/rad"}
      clamped_stiffness_Nm_rad: {value: 8.0e5, src: est, note: "clamped spindle: 8.0e5 Nm/rad assumed (a disc clamp of about 250 mm diameter with a tangential stiffness of about 5e7 N/m: 5e7 x 0.125^2)"}
    positioning: {accuracy_arcsec: 10, repeatability_arcsec: 5, src: est, note: "C indexing with the built-in motor and spindle encoder: 10 arcsec accuracy, 5 arcsec repeatability assumed (the B and spindle indexing increment is 0.0001 deg, published)"}
    motor_torque_Nm: 223
  C2:
    type: rotary
    description: "spindle 2 C axis"
    travel_deg: [0, 360]
    continuous: true
    max_rpm: {value: 250, src: est, note: "assumed equal to C1"}
    accel_rad_s2: {value: 80, src: est, note: "80 rad/s2 for the lighter spindle 2 (0.012 kg m2, 37 Nm): the C-mode tuning, as C1"}
    jerk_rad_s3: {value: 1500, src: est, note: "the 80 rad/s2 is reached in about 50 ms"}
    servo:
      kv_1_s: {value: 40, src: est, note: "as C1: 40 1/s"}
      feedforward: {value: 0.9, src: est, note: "as C1: 0.9"}
      velocity_bw_Hz: {value: 40, src: est, note: "as C1: 40 Hz"}
    backlash_arcsec: {value: 0, src: est, note: "built-in spindle motor, no gears: 0, as C1"}
    brake:
      clamp_torque_Nm: {value: 200, src: est, note: "about 5 x the 37 Nm motor torque of spindle 2, rounded to 200 Nm (assumed)"}
      clamp_time_s: {value: 0.2, src: est, note: "as C1: 0.2 s"}
      unclamped_stiffness_Nm_rad: {value: 7.6e2, src: est, note: "RE-DERIVED (was 3.0e4, not reconstructable): servo-held built-in spindle, k = J (2 pi f_v)^2 = 0.012 kg m2 (rotor + 5 in chuck, est) x (2 pi x 40 Hz)^2 = 760 Nm/rad, as C1"}
      clamped_stiffness_Nm_rad: {value: 2.0e5, src: est, note: "clamped spindle 2: a quarter of C1's 8.0e5 for the smaller 80 mm flat-nose spindle, 2.0e5 Nm/rad assumed"}
    positioning: {accuracy_arcsec: 10, repeatability_arcsec: 5, src: est, note: "as C1: 10 arcsec, 5 arcsec"}
    motor_torque_Nm: 37

kinematics:
  workpiece_chain:
    - {link: spindle1, axis: C1, axis_point_mm: [0, 0, 0], direction: [0, 0, -1]}
    - {link: chuck1_face, fixed: {translate_mm: [0, 0, 0]}}
  workpiece_chain_sub:
    - {link: spindle2_slide, axis: A, direction: [0, 0, 1]}
    - {link: spindle2, axis: C2, axis_point_mm: [0, 0, 900], direction: [0, 0, 1], src: est, note: "spindle 2 faces spindle 1, so its C sense is mirrored; position assumed (see chuck2_face)"}
    - {link: chuck2_face, fixed: {translate_mm: [0, 0, 900], rotate_deg: [0, 180, 0]}, src: est, note: "spindle-2 face 900 mm from spindle 1 at A = 0 (home), 430 mm at A min; assumed"}
  tool_chain:
    - {link: saddle, axis: Z, direction: [0, 0, 1]}
    - {link: ram, axis: X, direction: [1, 0, 0]}
    - {link: y_slide, axis: Y, direction: [0, 1, 0]}
    - {link: b_head, axis: B, axis_point_mm: [450, 0, 700], direction: [0, 1, 0], src: est, note: "B-axis centre at home assumed 450 mm from the spindle axis and 700 mm from the spindle-1 face"}
    - {link: spindle_nose, fixed: {translate_mm: [-120, 0, 0], rotate_deg: [0, 90, 0]}, src: est, note: "nose 120 mm from the B axis (assumed); at B = 0 the tool points toward -x (radial), so the nose z axis is base +x"}
  home_mm: {X: 0, Y: 0, Z: 0, A: 0, B: 0, C1: 0, C2: 0}
  tool_axis: [0, 0, 1]
  singularities: [{axis: C1, when: "B = 90 or -90 with Y = 0", behaviour: slow_down, note: "tool axis parallel to the spindle axis"}]

spindles:
  - id: main
    kind: turning
    nose: A2-5                       # A2-6 with the 65 mm bar option
    max_rpm: 6000
    drive: "built-in motor (DDS), 2 ranges by winding change-over"
    bore_mm: 61
    bar_capacity_mm: 52
    chuck_mm: {value: 152, note: "6-inch chuck standard, 8-inch optional"}
    bearing_id_mm: 100
    direction_reversible: {value: true, src: est}
    gear_ranges:
      - rpm: [0, 6000]
        rating: "40 % ED (S3-40 %)"
        src: est
        note: "no curve in the catalogue; built from the tabulated values (motor 11/11/7.5 kW at 40 % ED / 30 min / cont, torque 223/172/158 Nm): constant torque to P/T, then constant power. The two winding ranges are not resolved."
        power_kW: [[0, 0], [471, 11], [6000, 11]]
        torque_Nm: [[0, 223], [471, 223], [6000, 17.5]]
        additional_ratings:
          - {rating: "S2 30 min", src: est, note: "built from the tabulated S2 30 min values (11 kW, 172 Nm) like the 40 % ED curve: constant torque to 11 kW / 172 Nm = 611 rpm, then constant power", power_kW: [[0, 0], [611, 11], [6000, 11]], torque_Nm: [[0, 172], [611, 172], [6000, 17.5]]}
          - {rating: "S1 continuous", src: est, note: "built from the tabulated continuous values (7.5 kW, 158 Nm): constant torque to 453 rpm, then constant power", power_kW: [[0, 0], [453, 7.5], [6000, 7.5]], torque_Nm: [[0, 158], [453, 158], [6000, 11.9]]}
    tabulated: {motor_kW: [11, 11, 7.5], torque_Nm: [223, 172, 158], duties: ["40 % ED", "30 min", "cont"]}
    accel_time_s: {value: 1.2, src: est, note: "0-6000 rpm with J = 0.06 kg m2 (built-in rotor + 6 in chuck) at 11 kW"}
    decel_time_s: {value: 1.2, src: est, note: "regenerative braking at the same torque as the acceleration: symmetric 1.2 s"}
    gear_change_s: {value: 0, src: est, note: "electronic winding change-over"}
    orient_time_s: {value: 0.5, src: est, note: "M19 from rest: one turn at 223 Nm / 0.06 kg m2 = 3700 rad/s2 takes 0.08 s, plus 0.4 s of settle (assumed)"}
    rotor_inertia_kgm2: {value: 0.06, src: est, note: "built-in rotor and spindle of the A2-5 headstock (about 0.04 kg m2) plus the 6 in chuck (about 0.02 kg m2), assumed"}
    efficiency: {value: 0.85, src: est, note: "built-in induction spindle motor and drive at rated load: about 0.92 x 0.97 = 0.89, 0.85 for part load (assumed)"}
    idle_power_W: {value: 500, src: est, note: "no-load loss at 6000 rpm: bearing friction 400 W (thermal note) plus windage and iron loss about 100 W = 500 W"}
    runout_um: {value: 2, src: est, note: "spindle nose runout of a new A2-5 spindle, 2 um assumed (not published)"}
    frf_modes: []
    thermal:
      growth_um_at_max_rpm: {value: 15, src: est, note: "zero-centre-displacement spindle design keeps the centre in place radially (p. 5); axial growth assumed"}
      time_constant_min: {value: 30, src: est, note: "tau = C / G: built-in spindle and headstock near the bearings, about 120 kg x 460 J/kgK = 55 kJ/K, over G = 400 W / 13 K = 31 W/K (est) = 1780 s, about 30 min"}
      bearing_heat_W_at_max_rpm: {value: 400, src: est, note: "Palmgren speed term 1e-7 f0 (nu n)^(2/3) dm^3 (palmgren-1959-bearings) for the front set of the 100 mm bearing bore (dm about 125 mm), grease f0 = 1, nu = 20 mm2/s, n = 6000 rpm: (1.2e5)^(2/3) = 2430, 0.47 Nm per bearing x 2 = 0.95 Nm x 628 rad/s = 600 W; 400 W assumed for the oil-air version with f0 about 0.7"}
      thermal_comp: {value: true, src: est}
      comp_residual_fraction: {value: 0.3, src: est, note: "the thermal compensation leaves 30 % of the growth (as the other machines, assumed)"}
  - id: sub
    kind: sub
    nose: "flat nose dia 80 g6"
    max_rpm: 6000
    bore_mm: 38
    bearing_id_mm: 70
    chuck_mm: {value: 127, note: "5-inch chuck standard, 6-inch optional"}
    direction_reversible: {value: true, src: est}
    gear_ranges:
      - rpm: [0, 6000]
        rating: "25 % ED"
        src: est
        note: "built from the tabulated values: motor 7.5/5.5 kW (25 % ED / cont), torque 37/22 Nm"
        power_kW: [[0, 0], [1936, 7.5], [6000, 7.5]]
        torque_Nm: [[0, 37], [1936, 37], [6000, 11.9]]
        additional_ratings:
          - {rating: "S1 continuous", src: est, note: "built from the tabulated continuous values (5.5 kW, 22 Nm): constant torque to 2387 rpm, then constant power", power_kW: [[0, 0], [2387, 5.5], [6000, 5.5]], torque_Nm: [[0, 22], [2387, 22], [6000, 8.8]]}
    accel_time_s: {value: 0.8, src: est, note: "0-6000 rpm: J = 0.012 kg m2 on the 37 Nm / 7.5 kW curve takes 0.06 s to 1936 rpm and J (w2^2 - w1^2) / (2 P) = 0.012 x (628^2 - 203^2) / 15000 = 0.28 s to 6000 rpm; 0.8 s for the drive ramp (assumed)"}
    decel_time_s: {value: 0.8, src: est, note: "symmetric with the acceleration: 0.8 s"}
    orient_time_s: {value: 0.4, src: est, note: "M19 of spindle 2: one turn at 37 Nm / 0.012 kg m2 = 3100 rad/s2 takes 0.09 s, plus 0.3 s settle (assumed)"}
    rotor_inertia_kgm2: {value: 0.012, src: est, note: "built-in rotor of spindle 2 (70 mm bearings) about 0.007 kg m2 plus the 5 in chuck about 0.005 kg m2, assumed"}
    efficiency: {value: 0.85, src: est, note: "as spindle 1: 0.85"}
