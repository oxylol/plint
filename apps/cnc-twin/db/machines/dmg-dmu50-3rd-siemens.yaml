# DMG MORI DMU 50 3rd generation, 5-axis universal machining centre with NC swivel rotary table
# (B swivel -35/+110 deg, C 360 deg), SIEMENS SINUMERIK 840D sl version. Mechanics, spindle, geometry
# and all non-controller values are identical to dmg-dmu50-3rd.yaml (HEIDENHAIN TNC 640 version);
# the brochure lists both controls (dmgmori-dmu50-3rd-2018 p. 11).
# Frames: base origin = C-axis centre on the table top at B = 0 with X = Y = 0; +x right, +y toward
# the column, +z up. Cross-slide layout assumed: X and Y move the table, Z moves the spindle head.
format: cnctwin-machine
version: 1
id: dmg-dmu50-3rd-siemens
maker: "DMG MORI"
model: "DMU 50 3rd Generation (SIEMENS 840D sl)"
same_mechanics_as: dmg-dmu50-3rd
type: five_axis_mill
src: dmgmori-dmu50-3rd-2018

controller:
  dialect: siemens840d
  model: "SIEMENS SINUMERIK 840D solution line (ERGOline 21.5 in multi-touch, CELOS)"
  alarms: siemens-840d-sl
  ipo_period_ms: {value: 2.0, src: est, note: "IPO cycle is set by the machine builder (typically 1-4 ms); not published"}
  block_processing_ms: {value: 1.0, src: est, note: "assumed"}
  lookahead_blocks: {value: 500, src: est, note: "look-ahead depth with CYCLE832 / COMPCAD, assumed"}
  least_input_increment_mm: {value: 0.001, src: est, note: "default input resolution 1 um (machine data dependent)"}
  least_input_increment_deg: {value: 0.001, src: est, note: "as the linear 0.001 mm default input resolution (machine-data dependent): 0.001 deg assumed"}
  max_feed_mm_min: {value: 42000, src: est, note: "only the 42 m/min rapid is published; max programmable feed assumed equal"}
  rapid_mm_min: {X: 42000, Y: 42000, Z: 42000}
  smoothing:
    - {code: "CYCLE832(0.05,_ROUGH,1)", name: rough, tolerance_mm: 0.05, src: est, note: "CYCLE832 high-speed settings (tolerance + technology) switching G642/G645, COMPCAD/COMPSURF, FFWON, SOFT; tolerance values are typical user choices"}
    - {code: "CYCLE832(0.02,_SEMIFIN,1)", name: medium, tolerance_mm: 0.02, src: est, note: "the tolerance is the S_TOL argument of the call itself (CYCLE832 contour tolerance in mm, db/controllers/siemens-840d-sl.yaml, siemens-840dsl-jobplan-ru-2018 pp. 825-827); 0.02 mm is an example semi-finishing setting"}
    - {code: "CYCLE832(0.005,_FINISH,1)", name: finish, tolerance_mm: 0.005, src: est, note: "as the semi-finishing entry: S_TOL = 0.005 mm is the programmed finishing tolerance itself"}
  five_axis: {tcp: "TRAORI / TRAFOOF", tilted_plane: "CYCLE800", src: est, note: "SINUMERIK syntax names; not read in a source this session"}
  corner_default: {value: exact_stop, src: est, note: "G60 is the SINUMERIK default unless the machine builder sets G64 in machine data; assumed"}
  in_position_mm: {value: 0.002, src: est, note: "linear scales on all axes, tight exact-stop fine window assumed"}
  rapid_override_steps_pct: {value: [0, 100], src: est, note: "rapid traverse is reduced by the override switch of the machine control panel and never runs above 100 %: continuous 0-100 % assumed (not read this session)"}
  feed_override_range_pct: {value: [0, 120], src: est, note: "feed-override switch of a SINUMERIK machine control panel: 0-120 % assumed (the usual span of its stepped override switch; not read this session)"}
  tool_life_management: {value: true, src: est}
  probing: {value: true, src: est, note: "measuring cycles standard; probe hardware is an option"}
axes:
  X:
    type: linear
    travel_mm: {value: [-325, 325], src: est, note: "650 mm travel published; machine-coordinate origin assumed at the C axis"}
    rapid_mm_min: 42000
    max_feed_mm_min: {value: 42000, src: est, note: "only the 42 m/min rapid is published; the max programmable feed assumed equal (as controller.max_feed_mm_min)"}
    accel_m_s2: {value: 4.0, src: est, note: "not in the brochure; cross slide + swivel rotary table + 300 kg part vs 4.8 kN published thrust gives ~4.4 m/s2 at full load"}
    jerk_m_s3: {value: 80, src: est, note: "80 m/s3 ramps to the 4 m/s2 acceleration in a/j = 50 ms, longer than one period of the 85 Hz cross-slide mode (12 ms) and the 65 Hz column mode (15 ms) (biagiotti-melchiorri-2008: ramp time >= one natural period)"}
    servo:
      kv_1_s: {value: 45, src: est, note: "direct-driven ballscrews with linear scales (brochure p. 4); typical closed-loop gains 30-60 1/s"}
      feedforward: {value: 0.98, src: est, note: "velocity feed-forward 0.98, higher than on semi-closed-loop axes (0.95): with linear scales the position loop sees the table itself; 2 % of v/kv remains (0.31 mm at 42 m/min with kv 45 1/s)"}
      velocity_bw_Hz: {value: 80, src: est, note: "80 Hz: 11 x the position-loop crossover kv/2 pi = 7.2 Hz (cascade rule >= 5-10), just below the 85 Hz cross-slide mode of direct-driven ballscrew axes"}
    backlash_um: {value: 0.5, src: est, note: "closed loop on linear scales (brochure p. 4) removes screw backlash from the position"}
    reversal_spike_um: {value: 2, src: est, note: "friction quadrant glitch remains with scales"}
    ballscrew: {diameter_mm: 40, pitch_mm: 20, length_mm: 1100, fixed_end: motor, cooled_nut: true, src: est, note: "cooled ball-screw nuts and bearings are published (brochure p. 4); size/lead assumed (42 m/min at 2100 rpm)"}
    positioning: {accuracy_um: 6, repeatability_um: 3, src: est, note: "ISO 230-2 values not published in the 2018 brochure; typical for scale-equipped machines of this class"}
    motor_force_N: 4800
    moving_mass_kg: {value: 800, src: est, note: "X slide + swivel rotary table (cross-slide design, brochure p. 5)"}
  Y:
    type: linear
    travel_mm: {value: [-260, 260], src: est, note: "520 mm published; origin assumed at the C axis"}
    rapid_mm_min: 42000
    max_feed_mm_min: {value: 42000, src: est, note: "as X: the max programmable feed assumed equal to the published 42 m/min rapid"}
    accel_m_s2: {value: 3.5, src: est, note: "heavier stack (Y slide carries X slide + table)"}
    jerk_m_s3: {value: 70, src: est, note: "70 m/s3: the 3.5 m/s2 acceleration is reached in 50 ms, longer than one period of the 75 Hz y column mode"}
    servo:
      kv_1_s: {value: 45, src: est, note: "as X: closed loop on the linear scales, kv/2 pi = 7.2 Hz, 10 x below the 70 Hz velocity loop"}
      feedforward: {value: 0.98, src: est, note: "velocity feed-forward 0.98, higher than on semi-closed-loop axes (0.95): with linear scales the position loop sees the table itself; 2 % of v/kv remains (0.31 mm at 42 m/min with kv 45 1/s)"}
      velocity_bw_Hz: {value: 70, src: est, note: "70 Hz for the heavier Y stack (1200 kg: Y slide with the X slide and the swivel table), below X's 80 Hz"}
    backlash_um: {value: 0.5, src: est, note: "as X: the position is read on the linear scale, so screw backlash does not reach it; 0.5 um residual"}
    reversal_spike_um: {value: 2, src: est, note: "as X: the friction quadrant glitch remains with scales, 2 um"}
    ballscrew: {diameter_mm: 40, pitch_mm: 20, length_mm: 950, fixed_end: motor, cooled_nut: true, src: est, note: "as X: 40 mm x 20 mm lead (42 m/min at 2100 rpm), cooled nut (brochure p. 4); length = 520 mm travel + nut + bearings"}
    positioning: {accuracy_um: 6, repeatability_um: 3, src: est, note: "as X: ISO 230-2 values typical of scale-equipped machines of this class (not published in the 2018 brochure)"}
    motor_force_N: 4800
    moving_mass_kg: {value: 1200, src: est, note: "Y slide carrying the X slide and the swivel table: X's 800 kg plus the Y slide, about 400 kg (assumed); 1200 kg x 3.5 m/s2 = 4.2 kN of the 4.8 kN published feed force"}
  Z:
    type: linear
    travel_mm: {value: [-475, 0], src: est, note: "475 mm published; Z0 at the upper limit assumed"}
    rapid_mm_min: 42000
    max_feed_mm_min: {value: 42000, src: est, note: "as X: the max programmable feed assumed equal to the published 42 m/min rapid"}
    accel_m_s2: {value: 5.0, src: est, note: "0.5 g as the other 5-axis machines; lifting the 450 kg head at 5 m/s2 against gravity needs 450 x (5 + 9.81) = 6.7 kN, 1.4 x the published 4.8 kN feed force, which is read as the continuous rating (servo peak torque is 2-3 x continuous); assumed"}
    jerk_m_s3: {value: 100, src: est, note: "100 m/s3: the 5 m/s2 acceleration is reached in 50 ms, longer than one period of the 140 Hz z mode"}
    servo:
      kv_1_s: {value: 45, src: est, note: "as X: kv/2 pi = 7.2 Hz on the linear scales, 13 x below the 90 Hz velocity loop"}
      feedforward: {value: 0.98, src: est, note: "velocity feed-forward 0.98, higher than on semi-closed-loop axes (0.95): with linear scales the position loop sees the table itself; 2 % of v/kv remains (0.31 mm at 42 m/min with kv 45 1/s)"}
      velocity_bw_Hz: {value: 90, src: est, note: "90 Hz for the light head (450 kg): above X (80 Hz, 800 kg), below the 140 Hz head mode"}
    backlash_um: {value: 0.5, src: est, note: "as X: scale feedback, 0.5 um residual"}
    reversal_spike_um: {value: 1.5, src: est, note: "gravity preloads the vertical screw in one direction: 1.5 um, below the 2 um of X and Y"}
    ballscrew: {diameter_mm: 40, pitch_mm: 20, length_mm: 850, fixed_end: motor, cooled_nut: true, src: est, note: "as X: 40 mm x 20 mm lead, cooled nut; length = 475 mm travel + nut + bearings"}
    positioning: {accuracy_um: 5, repeatability_um: 2.5, src: est, note: "as X, over the shorter 475 mm travel: 5 um accuracy, 2.5 um repeatability (not published)"}
    motor_force_N: {value: 9600, src: est, note: "drive force limit (peak) of the Z axis: the published 4.8 kN feed force is the continuous rating (accel_m_s2 note), servo peak 2 x continuous assumed; lifting the 450 kg head at 5 m/s2 against gravity needs 6.7 kN, which a 4.8 kN limit cannot give (the planned rapids would saturate the drive and trip the following-error alarm)"}
    moving_mass_kg: {value: 450, src: est, note: "head with speedMASTER motor spindle"}
    brake: {holds_on_power_loss: true, src: est}
  B:
    type: rotary
    travel_deg: [-35, 110]
    continuous: false
    max_rpm: {value: 30, note: "B/C speed 30 rpm for HEIDENHAIN/SIEMENS controls (180 deg/s)"}
    rapid_deg_s: {value: 180, note: "30 rpm"}
    accel_rad_s2: {value: 15, src: est, note: "swivel with 300 kg load"}
    jerk_rad_s3: {value: 300, src: est, note: "300 rad/s3: the 15 rad/s2 acceleration is reached in 50 ms, longer than one period of the 60 Hz swivel mode (17 ms)"}
    servo:
      kv_1_s: {value: 35, src: est, note: "position-loop gain of the swivel with direct angle measurement: 35 1/s (kv/2 pi = 5.6 Hz, 7 x below the 40 Hz velocity loop), between the geared Haas rotaries (30) and the scale-equipped linear axes (45)"}
      feedforward: {value: 0.95, src: est, note: "0.95, below the linear axes' 0.98: the swivel drive winds up under the cradle and load inertia"}
      velocity_bw_Hz: {value: 40, src: est, note: "40 Hz, as C; the unclamped swivel mode is near 31 Hz (k 8e5 Nm/rad, J about 21 kg m2 from the 60 Hz clamped mode), so the loop needs a notch or acceleration feedback there, as usual when the first drive mode limits the bandwidth (ellis-2012-control-design)"}
    backlash_arcsec: {value: 5, src: est, note: "rotary encoder on the axis assumed (direct measuring on all axes per dmgmori-dmu50-web-2026)"}
    brake:
      clamp_torque_Nm: {value: 2000, src: est, note: "not published"}
      clamp_time_s: {value: 0.3, src: est, note: "hydraulic clamp or release of the swivel, 0.3 s assumed (valve and pressure build-up)"}
      unclamped_stiffness_Nm_rad: {value: 8.0e5, src: est, note: "about a quarter of the clamped 3.0e6 Nm/rad, as for the Haas rotaries (a brake stiffens a geared rotary 3-5 x)"}
      clamped_stiffness_Nm_rad: {value: 3.0e6, src: est, note: "k = J (2 pi f)^2 with the 60 Hz swivel mode (est) and J = 21 kg m2 (a 300 kg load at 0.2 m radius of gyration about the swivel axis, 12 kg m2, plus cradle and table about 9 kg m2, assumed): 21 x 377^2 = 3.0e6 Nm/rad"}
    positioning: {accuracy_arcsec: 8, repeatability_arcsec: 4, src: est, note: "not published; direct angle measurement assumed"}
    motor_torque_Nm: {value: 1000, src: est, note: "not published"}
    cooled_bearing: {value: true, src: dmgmori-dmu50-3rd-2018, page: "p. 4: two cooled table bearings (B and C axes)"}
  C:
    type: rotary
    travel_deg: [0, 360]
    continuous: true
    max_rpm: {value: 30, note: "HEIDENHAIN/SIEMENS"}
    rapid_deg_s: {value: 180, note: "30 rpm"}
    accel_rad_s2: {value: 20, src: est, note: "20 rad/s2 reaches 30 rpm (3.1 rad/s) in 0.16 s; the 600 Nm drive torque (est) would accelerate the table with a 300 kg, 500 mm part (J about 2.6 + 9.4 = 12 kg m2) at 50 rad/s2, so 20 rad/s2 keeps a margin (assumed)"}
    jerk_rad_s3: {value: 400, src: est, note: "the 20 rad/s2 acceleration is reached in a/j = 50 ms, longer than one period of the 140 Hz C mode"}
    servo:
      kv_1_s: {value: 35, src: est, note: "as B: 35 1/s with direct angle measurement"}
      feedforward: {value: 0.95, src: est, note: "as B: 0.95"}
      velocity_bw_Hz: {value: 40, src: est, note: "as B: 40 Hz, below the unclamped C mode at about 70 Hz (k 5e5 Nm/rad, J 2.6 kg m2)"}
    backlash_arcsec: {value: 5, src: est, note: "as B: direct angle measurement on the axis assumed (dmgmori-dmu50-web-2026 lists direct measuring), 5 arcsec"}
    brake:
      clamp_torque_Nm: {value: 1200, src: est, note: "not published: twice the 600 Nm C drive torque (est), so the clamp holds whatever the drive can apply, rounded to 1200 Nm"}
      clamp_time_s: {value: 0.3, src: est, note: "as B: 0.3 s"}
      unclamped_stiffness_Nm_rad: {value: 5.0e5, src: est, note: "about a quarter of the clamped 2.0e6 Nm/rad, as B"}
      clamped_stiffness_Nm_rad: {value: 2.0e6, src: est, note: "k = J (2 pi f)^2 with the 140 Hz C mode (est) and J = 2.6 kg m2 (630 mm table and C rotor, assumed): 2.6 x 880^2 = 2.0e6 Nm/rad"}
    positioning: {accuracy_arcsec: 8, repeatability_arcsec: 4, src: est, note: "as B: direct angle measurement assumed, 8 arcsec accuracy, 4 arcsec repeatability (not published)"}
    motor_torque_Nm: {value: 600, src: est, note: "not published: 60 % of the B drive (1000 Nm est) for the lighter C table; 600 Nm at 30 rpm is 1.9 kW"}

kinematics:
  workpiece_chain:
    - {link: y_slide, axis: Y, direction: [0, -1, 0]}
    - {link: x_slide, axis: X, direction: [-1, 0, 0]}
    - {link: swivel, axis: B, axis_point_mm: [0, 0, -120], direction: [0, -1, 0], src: est, note: "swivel axis parallel to y, assumed 120 mm below the table top through the C axis; DMG MORI publishes no pivot data"}
    - {link: rotary_table, axis: C, axis_point_mm: [0, 0, 0], direction: [0, 0, -1]}
    - {link: table_top, fixed: {translate_mm: [0, 0, 0]}}
  tool_chain:
    - {link: head, axis: Z, direction: [0, 0, 1]}
    - {link: spindle_nose, fixed: {translate_mm: [0, 0, 625]}, src: est, note: "spindle nose 625 mm above the table top at Z0 assumed (max workpiece height 600 mm, dmgmori-dmu50-web-2026)"}
  home_mm: {X: 0, Y: 0, Z: 0, B: 0, C: 0}
  tool_axis: [0, 0, 1]
  singularities: [{axis: C, when: "B = 0", behaviour: slow_down, note: "C parallel to the tool axis"}]

spindles:
  - id: main
    kind: milling
    drive_type: {value: built_in, src: est, note: "speedMASTER motor spindle (built-in motor)"}
    bearings:
      - {position: front, type: angular_contact, count: 3, bore_mm: 60, outer_mm: 95, contact_angle_deg: 15, lubrication: oil_air, axially_fixed: true, src: est, note: "not published: as dmg-dmu50-3rd (7012 C size triplet, oil-air assumed)"}
      - {position: rear, type: angular_contact, count: 2, bore_mm: 50, outer_mm: 80, contact_angle_deg: 15, lubrication: oil_air, axially_fixed: false, src: est, note: "floating rear pair (7010 C size), assumed"}
    nose: SK40                       # HSK-A63 alternative
    max_rpm: 15000
    min_rpm: 20
    drive: "speedMASTER motor spindle (standard)"
    direction_reversible: {value: true, src: est}
    gear_ranges:
      - rpm: [20, 15000]
        rating: "S6 40 % duty cycle"
        src: dmgmori-dmu50-3rd-2018
        digitised: true
        uncertainty_pct: 15
        page: "p. 10 power diagram (15,000 rpm / 21 kW / 111 Nm), p. 11 table (21/16 kW, 111/85 Nm at 40/100 % DC)"
        note: "schematic log-log diagram; plateaus use the labelled values (111 Nm and 21 kW at 40 % DC from 1800 rpm), the dip near 3500-3700 rpm and the roll-off above ~9000 rpm are read from the drawing"
        power_kW: [[0, 0], [1800, 21], [3300, 21], [3500, 17], [3700, 21], [9000, 21], [10000, 16], [15000, 10.5]]
        torque_Nm: [[0, 111], [1800, 111], [3300, 60.8], [3500, 46.4], [3700, 54.2], [9000, 22.3], [10000, 15.3], [15000, 6.7]]
        additional_ratings:
          - rating: "S1 100 % duty cycle"
            src: dmgmori-dmu50-3rd-2018
            digitised: true
            uncertainty_pct: 15
            power_kW: [[0, 0], [1800, 16], [10000, 16], [15000, 10.5]]
            torque_Nm: [[0, 85], [1800, 85], [10000, 15.3], [15000, 6.7]]
    accel_time_s: {value: 1.5, src: est, note: "0-15,000 rpm with J ~0.02 kg m2 (motor spindle + SK40 holder) on the S6 curve gives ~1.2 s; drive ramp limits assumed"}
    decel_time_s: {value: 1.5, src: est, note: "regenerative braking at the same torque as the acceleration: symmetric 1.5 s"}
    gear_change_s: null
    orient_time_s: {value: 0.4, src: est, note: "M19 from rest: one turn at 111 Nm / 0.02 kg m2 = 5550 rad/s2 takes 2 sqrt(2 pi / 5550) = 0.07 s, plus 0.33 s for the position loop to settle (assumed)"}
    rotor_inertia_kgm2: {value: 0.02, src: est, note: "speedMASTER 15 000 rpm motor-spindle rotor and shaft about 0.015 kg m2 plus an SK40 holder about 0.005 kg m2 (assumed); with it the S6 curve takes the spindle to 15 000 rpm in about 1.5 s (accel_time_s)"}
    efficiency: {value: 0.88, src: est, note: "synchronous/asynchronous motor spindle at rated load"}
    idle_power_W: {value: 900, src: est, note: "bearing + windage losses at 15,000 rpm; part removed by the spindle cooling"}
    runout_um: {value: 2, src: est, note: "new SK40 motor spindle, 2 um assumed (not published)"}
    frf_modes:
      - {fn_Hz: 1000, zeta: 0.035, k_N_um: 80, direction: x, src: est, note: "40-taper motor spindle flange mode, typical 700-1200 Hz"}
      - {fn_Hz: 1000, zeta: 0.035, k_N_um: 80, direction: y, src: est, note: "the x mode repeated in y: axisymmetric shaft and bearings"}
      - {fn_Hz: 2300, zeta: 0.03, k_N_um: 220, direction: x, src: est, note: "second (bearing/shaft) mode of the motor spindle: 2300 Hz, 220 N/um, a stiffer 15k cartridge than the 2100 Hz / 200 N/um of haas-vf2ss (assumed)"}
      - {fn_Hz: 2300, zeta: 0.03, k_N_um: 220, direction: y, src: est, note: "the x mode repeated in y"}
    thermal:
      jacket: {flow_l_min: 10, src: est, note: "cooled motor spindle (as dmg-dmu50-3rd); channel geometry and area from the model's defaults"}
      growth_um_at_max_rpm: {value: 15, src: est, note: "cooled motor spindle (brochure p. 4); 10-25 um typical"}
      time_constant_min: {value: 20, src: est, note: "tau = C / G for the liquid-cooled motor spindle: cartridge about 80 kg x 460 J/kgK = 37 kJ/K over G = 600 W / 19 K = 32 W/K (bearing heat at max speed, a 19 K steady rise of the nose, both est) = 1170 s = 20 min"}
      bearing_heat_W_at_max_rpm: {value: 600, src: est, note: "Palmgren speed term 1e-7 f0 (nu n)^(2/3) dm^3 (palmgren-1959-bearings) for three 75 mm pitch-diameter spindle bearings, oil-air f0 = 1, nu = 10 mm2/s, n = 15 000 rpm: 3 x 0.119 Nm = 0.36 Nm x 1571 rad/s = 560 W, i.e. 600 W"}
      thermal_comp: {value: true, src: est}
      comp_residual_fraction: {value: 0.3, src: est, note: "the model-based growth compensation leaves 30 % (as the Haas machines, assumed)"}
    optional: "15,000 rpm / 46 kW / 200 Nm and 20,000 rpm / 35 kW / 130 Nm speedMASTER spindles (SK40 or HSK-A63)"

structure:
  modes:
    - {fn_Hz: 65, zeta: 0.05, k_N_um: 30, direction: x, src: est, note: "column/head rocking; one-piece bed (brochure p. 5)"}
    - {fn_Hz: 75, zeta: 0.05, k_N_um: 35, direction: y, src: est, note: "column nodding in y: slightly stiffer than the 65 Hz x rocking of the one-piece-bed machine, 75 Hz / 35 N/um assumed"}
    - {fn_Hz: 140, zeta: 0.04, k_N_um: 80, direction: z, src: est, note: "vertical head mode: 140 Hz / 80 N/um as the head modes of the Haas machines (130-140 Hz)"}
  table_modes:
    - {fn_Hz: 85, zeta: 0.05, k_N_um: 50, direction: x, src: est, note: "cross slide on linear guides"}
  rotary_modes:
    - {axis: B, fn_Hz: 60, zeta: 0.05, k_Nm_rad: 3.0e6, src: est, note: "one-sided swivel table with load"}
    - {axis: C, fn_Hz: 140, zeta: 0.05, k_Nm_rad: 2.0e6, src: est, note: "C table torsion on its clamp: 140 Hz with the clamped 2.0e6 Nm/rad (see axes.C.brake)"}

error_map:
  squareness_urad: {XY: 10, XZ: 10, YZ: 10, src: est, note: "10 urad per axis pair: scale-equipped machine on a one-piece bed after alignment, below the 15 urad assumed for the Haas machines"}
  straightness_um_per_m: {X: 5, Y: 5, Z: 5, src: est, note: "5 um per metre of travel for the aligned guideways, below the 6 um/m of the Haas machines (assumed)"}
  angular_urad: {}
  pivot_errors:
    B: {position_um: [0, 0, 10], tilt_urad: [0, 0, 15], src: est, note: "after kinematics measurement (KinematicsOpt-type calibration)"}
    C: {position_um: [8, 8, 0], tilt_urad: [15, 15, 0], src: est, note: "as B: residual C-axis centre location (8 um) and tilt (15 urad) after a kinematics calibration (KinematicsOpt type), assumed"}

thermal:
  axis_drift:
    expansion_1_K: {value: 11.5e-6, src: est, note: "mean CTE 20-100 degC of the ballscrew steel (100Cr6 11.5e-6 1/K, DEW column in db/materials/aisi52100-62hrc.yaml)"}
    heat_per_m_travel_J: {value: 40, src: est, note: "cooled ball-screw nuts and bearings (brochure p. 4); position read on linear scales, so screw growth barely reaches the TCP"}
    time_constant_min: {value: 40, src: est, note: "tau = rho c d / (4 h) = 7850 x 460 x 0.040 / (4 x 15 W/m2K) = 2400 s = 40 min for the 40 mm screws; the cooled nuts lower the heat input (heat_per_m_travel_J), not the time constant"}
    scale_feedback: {value: true, src: dmgmori-dmu50-3rd-2018, page: "p. 4: linear scales in all axes"}
  structure_sensitivity_um_per_K: {value: 2.5, src: est, note: "cast-iron CTE 10.5e-6 1/K (db/materials/grey-cast-iron-gjl250.yaml) x an effective loop of about 0.24 m: the cooled spindle and the one-piece bed keep most of the 625 mm spindle-to-table loop uniform (assumed) = 2.5 um/K"}
