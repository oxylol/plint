geometry:
  - name: bed
    attached_to: base
    primitives:
      - {box: {min_mm: [-1100, -800, -1100], max_mm: [1100, 1300, -350]}}
    collide: true
    src: est
    note: "bed below the cross slide: 2200 x 2100 mm footprint inside the 2350 x 2850 mm floor plan (brochure p. 10), 750 mm high under the slide (assumed)"
  - name: column
    attached_to: base
    primitives:
      - {box: {min_mm: [-350, 750, -350], max_mm: [350, 1250, 1700]}}
    collide: true
    src: est
    note: "column assumed as a 700 x 500 mm box behind the table (front face at y 750), from the bed top to 1700 mm, above the head at Z home"
  - name: cross_slide
    attached_to: x_slide
    primitives:
      - {box: {min_mm: [-450, -380, -350], max_mm: [450, 380, -260]}}
    collide: true
    src: est
    note: "cross slide: 900 x 760 mm under the swivel table (the 650 x 520 mm travels plus the slide length), 90 mm thick, assumed"
  - name: swivel_housing
    attached_to: x_slide
    primitives:
      - {cylinder: {p0_mm: [0, 330, -120], p1_mm: [0, 520, -120], radius_mm: 220}}
    collide: true
    src: est
    note: "one-sided swivel drive housing behind the table (B axis along y), assumed"
  - name: swivel_cradle
    attached_to: swivel
    primitives:
      - {box: {min_mm: [-320, -320, -260], max_mm: [320, 330, -90]}}
    collide: true
    src: est
    note: "swivel cradle under the 630 mm table: 640 x 650 mm, from the swivel axis region (z -260) to the table seat (z -90), assumed"
  - name: rotary_table
    attached_to: rotary_table
    primitives:
      - {cylinder: {p0_mm: [0, 0, -90], p1_mm: [0, 0, 0], radius_mm: 315}}
    collide: true
    src: est
    note: "630 mm table (published), flats at +-250 mm not modelled; 90 mm thickness assumed"
  - name: spindle_head
    attached_to: head
    primitives:
      - {box: {min_mm: [-220, -150, 780], max_mm: [220, 800, 1500]}}
      - {cylinder: {p0_mm: [0, 0, 625], p1_mm: [0, 0, 780], radius_mm: 90}}
    collide: true
    src: est
    note: "spindle head: 440 x 950 mm box from 780 mm above the table up to 1500 mm, plus a 180 mm nose housing to the 625 mm spindle nose (assumed)"

notes: "Catalogue values from the DMG MORI DMU 50 3rd generation brochure (05/2018). Not published there: ISO 230-2 accuracy, accelerations, B/C torques and pivot geometry, magazine times, coolant tank; all estimates. Spindle curves read from a schematic log-log diagram (+-15 %)."
