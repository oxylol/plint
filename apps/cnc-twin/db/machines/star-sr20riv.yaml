# Star SR-20RIV Swiss-type (sliding headstock) automatic lathe with guide bush, gang tool post,
# back working attachment (sub spindle). Frames: base origin = front face of the guide bush on the
# spindle axis; +z out of the guide bush toward the tools and the sub spindle; +x radial toward the
# gang tool post; +y completes. The headstock (Z1) moves the bar through the guide bush.
format: cnctwin-machine
version: 1
id: star-sr20riv
maker: "Star Micronics"
model: "SR-20RIV (Type A / Type B)"
type: swiss
src: star-sr20riv-web-2026

controller:
  dialect: fanuc
  model: {value: "FANUC 31i-B5", src: star-gb-sr20riv-e-web-2026, note: "stated for the SR-20RIV Type E; assumed for Type A/B"}
  alarms: fanuc-31i-b
  ipo_period_ms: {value: 1.0, src: est, note: "not published: 1 ms assumed, as for the other FANUC machines (db/controllers/fanuc-31i-b.yaml gives no IPO period either)"}
  block_processing_ms: {value: 1.0, src: est, note: "not published (the FANUC catalogue only says the High-Speed Processing option shortens it, db/controllers/fanuc-31i-b.yaml): 1 ms assumed"}
  lookahead_blocks: {value: 200, src: fanuc-30ibplus-om-2019, page: "665", note: "Table 20.1 (a): AI contour control II reads 200 blocks ahead (db/controllers/fanuc-31i-b.yaml); AI contour control II assumed fitted on the 31i-B5"}
  least_input_increment_mm: {value: 0.001, src: est, note: "FANUC increment system IS-B, the standard one: 0.001 mm (assumed fitted)"}
  least_input_increment_deg: {value: 0.001, src: est, note: "FANUC increment system IS-B: 0.001 deg for the C axes (assumed)"}
  max_feed_mm_min: {value: 35000, src: est, note: "rapid used as the limit"}
  rapid_mm_min: {X1: 35000, Y1: 35000, Z1: 35000, X2: 35000, Z2: 35000, Y2: 15000}
  smoothing: []
  corner_default: {value: blend, src: est}
  in_position_mm: {value: 0.005, src: est, note: "exact-stop window 5 um, above the 3-4 um positioning accuracy (est) of the small Swiss-type slides; the FANUC in-position width is a builder parameter (not published)"}
  rapid_override_steps_pct: {value: [0, 25, 50, 100], src: est, note: "FANUC-style rapid override steps F0 (a parameter-set low speed, written 0), 25, 50 and 100 % assumed"}
  feed_override_range_pct: {value: [0, 150], src: est, note: "feed override 0-150 % assumed for the Star operator panel (not read this session)"}
  tool_life_management: {value: true, src: est}
  probing: {value: false, src: est}
  two_path: {value: true, src: est, note: "main side (path 1) and back working (path 2) run as separate channels synchronised with wait codes"}

axes:
  Z1:
    type: linear
    description: "headstock (bar) stroke through the guide bush"
    travel_mm: [0, 205]
    travel_non_guide_bush_mm: {value: 50, note: "non-guide-bush mode: bar diameter x 2.5, max. 50 mm"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est, note: "max cutting feed not published: the 35 m/min Z1 rapid taken as the limit"}
    accel_m_s2: {value: 8.0, src: est, note: "light headstock slide; not published"}
    jerk_m_s3: {value: 200, src: est, note: "200 m/s3 ramps to the 8 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 50, src: est, note: "position-loop gain 50 1/s (kv/2 pi = 8.0 Hz), 13 x below the 100 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 100, src: est, note: "100 Hz for the 120 kg headstock (bar) slide: 13 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 25, pitch_mm: 10, length_mm: 400, fixed_end: motor, src: est, note: "25 mm x 10 mm lead: the 35 m/min rapid needs 3500 rpm; length = the 205 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 4000, src: est, note: "a small feed servo (about 7.1 Nm through the 10 mm lead at 90 %) gives 4 kN: 33 m/s2 on the 120 kg slide, well above the 8 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 120, src: est, note: "headstock with built-in motor and bar"}
  X1:
    type: linear
    travel_mm: {value: [-5, 150], src: est, note: "gang slide travel not on the spec page; assumed"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est, note: "max cutting feed not published: the 35 m/min X1 rapid taken as the limit"}
    accel_m_s2: {value: 8.0, src: est, note: "8 m/s2: the 3 kN (est) on 80 kg would allow 38 m/s2; Swiss-type slides are light and are run at 0.4-0.8 g (assumed)"}
    jerk_m_s3: {value: 200, src: est, note: "200 m/s3 ramps to the 8 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 50, src: est, note: "position-loop gain 50 1/s (kv/2 pi = 8.0 Hz), 13 x below the 100 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 100, src: est, note: "100 Hz for the 80 kg gang tool slide: 13 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 1.5, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 300, fixed_end: motor, src: est, note: "20 mm x 10 mm lead: the 35 m/min rapid needs 3500 rpm; length = the 155 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 3, repeatability_um: 1.5, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 3000, src: est, note: "a small feed servo (about 5.3 Nm through the 10 mm lead at 90 %) gives 3 kN: 38 m/s2 on the 80 kg slide, well above the 8 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 80, src: est, note: "gang tool slide with its tools and, for X2/Z2, the sub-spindle unit: 80 kg assumed"}
  Y1:
    type: linear
    description: "gang tool selection / Y milling"
    travel_mm: {value: [-200, 200], src: est, note: "assumed"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est, note: "max cutting feed not published: the 35 m/min Y1 rapid taken as the limit"}
    accel_m_s2: {value: 8.0, src: est, note: "8 m/s2: the 3 kN (est) on 100 kg would allow 30 m/s2; Swiss-type slides are light and are run at 0.4-0.8 g (assumed)"}
    jerk_m_s3: {value: 200, src: est, note: "200 m/s3 ramps to the 8 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 50, src: est, note: "position-loop gain 50 1/s (kv/2 pi = 8.0 Hz), 13 x below the 100 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 100, src: est, note: "100 Hz for the 100 kg gang tool selection slide: 13 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 1.5, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 550, fixed_end: motor, src: est, note: "20 mm x 10 mm lead: the 35 m/min rapid needs 3500 rpm; length = the 400 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 3, repeatability_um: 1.5, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 3000, src: est, note: "a small feed servo (about 5.3 Nm through the 10 mm lead at 90 %) gives 3 kN: 30 m/s2 on the 100 kg slide, well above the 8 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 100, src: est, note: "gang tool selection slide with its tools and, for X2/Z2, the sub-spindle unit: 100 kg assumed"}
  X2:
    type: linear
    travel_mm: {value: [-5, 150], src: est, note: "cross stroke of the back-working spindle not on the spec page: as X1 (-5..150 mm), assumed"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est, note: "max cutting feed not published: the 35 m/min X2 rapid taken as the limit"}
    accel_m_s2: {value: 6.0, src: est, note: "6 m/s2: the 3 kN (est) on 120 kg would allow 25 m/s2; Swiss-type slides are light and are run at 0.4-0.8 g (assumed)"}
    jerk_m_s3: {value: 150, src: est, note: "150 m/s3 ramps to the 6 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 45, src: est, note: "position-loop gain 45 1/s (kv/2 pi = 7.2 Hz), 11 x below the 80 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 80, src: est, note: "80 Hz for the 120 kg back-working (sub-spindle) cross slide: 11 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 300, fixed_end: motor, src: est, note: "20 mm x 10 mm lead: the 35 m/min rapid needs 3500 rpm; length = the 155 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 3000, src: est, note: "a small feed servo (about 5.3 Nm through the 10 mm lead at 90 %) gives 3 kN: 25 m/s2 on the 120 kg slide, well above the 6 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 120, src: est, note: "back-working (sub-spindle) cross slide with its tools and, for X2/Z2, the sub-spindle unit: 120 kg assumed"}
  Z2:
    type: linear
    travel_mm: {value: [0, 300], src: est, note: "z stroke of the back-working spindle not on the spec page: 300 mm assumed, enough to reach the 205 mm headstock stroke plus the 80 mm front ejection length"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est, note: "max cutting feed not published: the 35 m/min Z2 rapid taken as the limit"}
    accel_m_s2: {value: 6.0, src: est, note: "6 m/s2: the 3 kN (est) on 120 kg would allow 25 m/s2; Swiss-type slides are light and are run at 0.4-0.8 g (assumed)"}
    jerk_m_s3: {value: 150, src: est, note: "150 m/s3 ramps to the 6 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 45, src: est, note: "position-loop gain 45 1/s (kv/2 pi = 7.2 Hz), 11 x below the 80 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 80, src: est, note: "80 Hz for the 120 kg back-working (sub-spindle) z slide: 11 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 450, fixed_end: motor, src: est, note: "20 mm x 10 mm lead: the 35 m/min rapid needs 3500 rpm; length = the 300 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 3000, src: est, note: "a small feed servo (about 5.3 Nm through the 10 mm lead at 90 %) gives 3 kN: 25 m/s2 on the 120 kg slide, well above the 6 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 120, src: est, note: "back-working (sub-spindle) z slide with its tools and, for X2/Z2, the sub-spindle unit: 120 kg assumed"}
  Y2:
    type: linear
    description: "back tool post Y"
    travel_mm: {value: [-60, 60], src: est, note: "axis exists (15 m/min rapid published); stroke assumed"}
    rapid_mm_min: 15000
    max_feed_mm_min: {value: 15000, src: est, note: "max cutting feed not published: the 15 m/min Y2 rapid taken as the limit"}
    accel_m_s2: {value: 4.0, src: est, note: "4 m/s2: the 2 kN (est) on 50 kg would allow 40 m/s2; Swiss-type slides are light and are run at 0.4-0.8 g (assumed)"}
    jerk_m_s3: {value: 100, src: est, note: "100 m/s3 ramps to the 4 m/s2 acceleration in a/j = 40 ms, longer than one period of the 120 Hz tool-post mode (8 ms; biagiotti-melchiorri-2008)"}
    servo:
      kv_1_s: {value: 40, src: est, note: "position-loop gain 40 1/s (kv/2 pi = 6.4 Hz), 9 x below the 60 Hz velocity loop (cascade rule >= 5-10); light, short slides take higher gains than the large mills (40 1/s)"}
      feedforward: {value: 0.95, src: est, note: "velocity feed-forward 0.95: 5 % of the constant-feed following error v/kv remains; 1.0 overshoots at reversals"}
      velocity_bw_Hz: {value: 60, src: est, note: "60 Hz for the 50 kg back tool post Y slide: 9 x the position-loop crossover, below the 120 Hz tool-post mode"}
    backlash_um: {value: 1, src: est, note: "preloaded ball nut: residual lost motion 0-2 um, 1 um"}
    reversal_spike_um: {value: 2, src: est, note: "friction step at reversal of a semi-closed-loop ballscrew axis (ISO 230-2 reversal value B 1-5 um): small, short slides 1.5-2 um"}
    ballscrew: {diameter_mm: 16, pitch_mm: 5, length_mm: 250, fixed_end: motor, src: est, note: "16 mm x 5 mm lead: the 15 m/min rapid needs 3000 rpm; length = the 120 mm stroke + nut + bearing ends (assumed)"}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est, note: "ISO 230-2 accuracy and repeatability typical of short semi-closed-loop ballscrew axes of small lathes (not published)"}
    motor_force_N: {value: 2000, src: est, note: "a small feed servo (about 1.8 Nm through the 5 mm lead at 90 %) gives 2 kN: 40 m/s2 on the 50 kg slide, well above the 4 m/s2 used (assumed motor size)"}
    moving_mass_kg: {value: 50, src: est, note: "back tool post Y slide with its tools and, for X2/Z2, the sub-spindle unit: 50 kg assumed"}
  C1:
    type: rotary
    travel_deg: [0, 360]
    continuous: true
    indexing: "C-axis control"
    max_rpm: {value: 100, src: est, note: "C-axis contouring speed not published: 100 rpm assumed (C rapid of small built-in spindles)"}
    accel_rad_s2: {value: 100, src: est, note: "100 rad/s2 reaches 100 rpm (10.5 rad/s) in 0.1 s; the 23.6 Nm motor would accelerate the 0.004 kg m2 spindle at 5900 rad/s2, so the value is the C-mode tuning (assumed)"}
    jerk_rad_s3: {value: 2000, src: est, note: "the 100 rad/s2 is reached in a/j = 50 ms"}
    servo:
      kv_1_s: {value: 40, src: est, note: "C mode of the built-in spindle: 40 1/s (kv/2 pi = 6.4 Hz), 8 x below its 50 Hz velocity loop"}
      feedforward: {value: 0.9, src: est, note: "0.9 for the spindle in C mode: the collet and bar inertia vary, less feed-forward than on the feed axes"}
      velocity_bw_Hz: {value: 50, src: est, note: "50 Hz velocity loop of the small spindle in C mode (assumed)"}
    backlash_arcsec: {value: 0, src: est, note: "built-in spindle motor (star-gb-sr20riv-e-web-2026)"}
    brake: {clamp_torque_Nm: {value: 60, src: est, note: "about 2.5 x the 23.6 Nm motor torque, so milling loads on the clamped spindle never drive it: 60 Nm assumed"}, clamp_time_s: {value: 0.1, src: est, note: "spindle clamp of a small Swiss-type headstock: 0.1 s assumed"}}
    positioning: {accuracy_arcsec: 30, repeatability_arcsec: 15, src: est, note: "C indexing on the spindle encoder: 30 arcsec accuracy, 15 arcsec repeatability assumed"}
    motor_torque_Nm: {value: 23.6, src: est, note: "3.7 kW at the assumed 1500 rpm base speed"}
  C2:
    type: rotary
    travel_deg: [0, 360]
    continuous: true
    indexing: "C-axis control"
    max_rpm: {value: 100, src: est, note: "as C1: 100 rpm"}
    accel_rad_s2: {value: 100, src: est, note: "as C1: 100 rad/s2 (same motor rating and spindle size)"}
    jerk_rad_s3: {value: 2000, src: est, note: "as C1: 50 ms ramp"}
    servo:
      kv_1_s: {value: 40, src: est, note: "as C1: 40 1/s"}
      feedforward: {value: 0.9, src: est, note: "as C1: 0.9"}
      velocity_bw_Hz: {value: 50, src: est, note: "as C1: 50 Hz"}
    backlash_arcsec: {value: 0, src: est, note: "built-in spindle motor, no gears: 0, as C1"}
    brake: {clamp_torque_Nm: {value: 60, src: est, note: "as C1: 60 Nm"}, clamp_time_s: {value: 0.1, src: est, note: "as C1: 0.1 s"}}
    positioning: {accuracy_arcsec: 30, repeatability_arcsec: 15, src: est, note: "as C1: 30 arcsec, 15 arcsec"}
    motor_torque_Nm: {value: 23.6, src: est, note: "as C1: 3.7 kW at the assumed 1500 rpm base speed = 23.6 Nm (same published motor rating)"}

kinematics:
  workpiece_chain:
    - {link: headstock, axis: Z1, direction: [0, 0, 1], note: "+Z1 feeds the bar out of the guide bush (+z), so the tool moves back along the part; machine convention assumed"}
    - {link: spindle1, axis: C1, axis_point_mm: [0, 0, 0], direction: [0, 0, -1]}
    - {link: bar_end, fixed: {translate_mm: [0, 0, 0]}, note: "part datum at the guide bush face when Z1 = 0"}
  workpiece_chain_sub:
    - {link: sub_x, axis: X2, direction: [1, 0, 0]}
    - {link: sub_z, axis: Z2, direction: [0, 0, 1]}
    - {link: spindle2, axis: C2, axis_point_mm: [0, 0, 0], direction: [0, 0, 1]}
    - {link: chuck2_face, fixed: {translate_mm: [0, 0, 20], rotate_deg: [0, 180, 0]}, src: est, note: "sub-spindle collet face 20 mm from the guide bush at Z2 = 0, X2 = 0 on the axis; assumed"}
  tool_chain:
    - {link: gang_x, axis: X1, direction: [1, 0, 0]}
    - {link: gang_y, axis: Y1, direction: [0, 1, 0]}
    - {link: gang_tool_ref, fixed: {translate_mm: [0, 0, 1.5]}, src: est, note: "turning tools cut ~1.5 mm in front of the guide bush; assumed"}
  home_mm: {Z1: 0, X1: 150, Y1: 0, X2: 150, Z2: 300, Y2: 0}
  back_tool_chain:
    - {link: back_y, axis: Y2, direction: [0, 1, 0]}
    - {link: back_tool_ref, fixed: {translate_mm: [0, 0, 150]}, src: est, note: "back working tools facing -z toward the sub spindle, assumed"}
  tool_axis: [1, 0, 0]
  singularities: null

spindles:
  - id: main
    kind: turning
    nose: {value: "collet, built-in motor headstock", src: est, note: "built-in spindle motors per star-gb-sr20riv-e-web-2026; collet chucking assumed"}
    max_rpm: 10000
    max_machining_diameter_mm: 20
    gear_ranges:
      - rpm: [0, 10000]
        rating: "10 min / 25 % ED"
        src: est
        note: "only the motor ratings are published (2.2 kW cont / 3.7 kW 10 min 25 % ED); constant torque up to an assumed 1500 rpm base speed, then constant power"
        power_kW: [[0, 0], [1500, 3.7], [10000, 3.7]]
        torque_Nm: [[0, 23.6], [1500, 23.6], [10000, 3.5]]
        additional_ratings:
          - {rating: "S1 continuous", src: est, note: "the published 2.2 kW continuous rating with the same assumed 1500 rpm base speed: 14.0 Nm, then constant power", power_kW: [[0, 0], [1500, 2.2], [10000, 2.2]], torque_Nm: [[0, 14.0], [1500, 14.0], [10000, 2.1]]}
    motor_kW: {cont: 2.2, s2_10min_25ed: 3.7}
    direction_reversible: {value: true, src: est}
    accel_time_s: {value: 0.5, src: est, note: "small built-in spindle, J ~ 0.004 kg m2"}
    decel_time_s: {value: 0.5, src: est, note: "regenerative braking at the same torque as the acceleration: symmetric 0.5 s"}
    gear_change_s: null
    orient_time_s: {value: 0.2, src: est, note: "M19 from rest: one turn at 23.6 Nm / 0.004 kg m2 = 5900 rad/s2 takes 0.07 s, plus 0.13 s settle (assumed)"}
    rotor_inertia_kgm2: {value: 0.004, src: est, note: "built-in rotor and spindle of a 20 mm bar headstock (about 0.003 kg m2) plus the collet and bar (about 0.001 kg m2), assumed; with it 0-10 000 rpm takes 0.04 s at 23.6 Nm to 1500 rpm and 0.004 x (1047^2 - 157^2) / 7400 = 0.58 s to 10 000 rpm (accel_time_s 0.5 s)"}
    efficiency: {value: 0.85, src: est, note: "small built-in spindle motor and drive at rated load: about 0.88 x 0.97, 0.85 (assumed)"}
    idle_power_W: {value: 150, src: est, note: "no-load loss at 10 000 rpm: bearing friction 120 W (thermal note) plus windage about 30 W = 150 W"}
    runout_um: {value: 2, src: est, note: "collet spindle of a new Swiss-type lathe: 2 um assumed (not published)"}
    frf_modes: []
    thermal:
      growth_um_at_max_rpm: {value: 8, src: est, note: "axial growth alpha L dT = 11.5e-6 1/K x 0.15 m (bearing span of the small headstock, assumed) x 4.6 K (steady rise at the 120 W bearing heat, assumed) = 8 um"}
