# Star SR-20RIV Swiss-type (sliding headstock) automatic lathe with guide bush, gang tool post,
# back working attachment (sub spindle). Frames: base origin = front face of the guide bush on the
# spindle axis; +z out of the guide bush toward the tools and the sub spindle; +x radial toward the
# gang tool post; +y completes. The headstock (Z1) moves the bar through the guide bush.
format: cnctwin-machine
version: 1
id: star-sr20riv
maker: "Star Micronics"
model: "SR-20RIV (Type A / Type B)"
type: swiss
src: star-sr20riv-web-2026

controller:
  dialect: fanuc
  model: {value: "FANUC 31i-B5", src: star-gb-sr20riv-e-web-2026, note: "stated for the SR-20RIV Type E; assumed for Type A/B"}
  alarms: fanuc-31i-b
  ipo_period_ms: {value: 1.0, src: est}
  block_processing_ms: {value: 1.0, src: est}
  lookahead_blocks: {value: 200, src: est}
  least_input_increment_mm: {value: 0.001, src: est}
  least_input_increment_deg: {value: 0.001, src: est}
  max_feed_mm_min: {value: 35000, src: est, note: "rapid used as the limit"}
  rapid_mm_min: {X1: 35000, Y1: 35000, Z1: 35000, X2: 35000, Z2: 35000, Y2: 15000}
  smoothing: []
  corner_default: {value: blend, src: est}
  in_position_mm: {value: 0.005, src: est}
  rapid_override_steps_pct: {value: [0, 25, 50, 100], src: est}
  feed_override_range_pct: {value: [0, 150], src: est}
  tool_life_management: {value: true, src: est}
  probing: {value: false, src: est}
  two_path: {value: true, src: est, note: "main side (path 1) and back working (path 2) run as separate channels synchronised with wait codes"}

axes:
  Z1:
    type: linear
    description: "headstock (bar) stroke through the guide bush"
    travel_mm: [0, 205]
    travel_non_guide_bush_mm: {value: 50, note: "non-guide-bush mode: bar diameter x 2.5, max. 50 mm"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est}
    accel_m_s2: {value: 8.0, src: est, note: "light headstock slide; not published"}
    jerk_m_s3: {value: 200, src: est}
    servo:
      kv_1_s: {value: 50, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 100, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 2, src: est}
    ballscrew: {diameter_mm: 25, pitch_mm: 10, length_mm: 400, fixed_end: motor, src: est}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est}
    motor_force_N: {value: 4000, src: est}
    moving_mass_kg: {value: 120, src: est, note: "headstock with built-in motor and bar"}
  X1:
    type: linear
    travel_mm: {value: [-5, 150], src: est, note: "gang slide travel not on the spec page; assumed"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est}
    accel_m_s2: {value: 8.0, src: est}
    jerk_m_s3: {value: 200, src: est}
    servo:
      kv_1_s: {value: 50, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 100, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 1.5, src: est}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 300, fixed_end: motor, src: est}
    positioning: {accuracy_um: 3, repeatability_um: 1.5, src: est}
    motor_force_N: {value: 3000, src: est}
    moving_mass_kg: {value: 80, src: est}
  Y1:
    type: linear
    description: "gang tool selection / Y milling"
    travel_mm: {value: [-200, 200], src: est, note: "assumed"}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est}
    accel_m_s2: {value: 8.0, src: est}
    jerk_m_s3: {value: 200, src: est}
    servo:
      kv_1_s: {value: 50, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 100, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 1.5, src: est}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 550, fixed_end: motor, src: est}
    positioning: {accuracy_um: 3, repeatability_um: 1.5, src: est}
    motor_force_N: {value: 3000, src: est}
    moving_mass_kg: {value: 100, src: est}
  X2:
    type: linear
    travel_mm: {value: [-5, 150], src: est}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est}
    accel_m_s2: {value: 6.0, src: est}
    jerk_m_s3: {value: 150, src: est}
    servo:
      kv_1_s: {value: 45, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 80, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 2, src: est}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 300, fixed_end: motor, src: est}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est}
    motor_force_N: {value: 3000, src: est}
    moving_mass_kg: {value: 120, src: est}
  Z2:
    type: linear
    travel_mm: {value: [0, 300], src: est}
    rapid_mm_min: 35000
    max_feed_mm_min: {value: 35000, src: est}
    accel_m_s2: {value: 6.0, src: est}
    jerk_m_s3: {value: 150, src: est}
    servo:
      kv_1_s: {value: 45, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 80, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 2, src: est}
    ballscrew: {diameter_mm: 20, pitch_mm: 10, length_mm: 450, fixed_end: motor, src: est}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est}
    motor_force_N: {value: 3000, src: est}
    moving_mass_kg: {value: 120, src: est}
  Y2:
    type: linear
    description: "back tool post Y"
    travel_mm: {value: [-60, 60], src: est, note: "axis exists (15 m/min rapid published); stroke assumed"}
    rapid_mm_min: 15000
    max_feed_mm_min: {value: 15000, src: est}
    accel_m_s2: {value: 4.0, src: est}
    jerk_m_s3: {value: 100, src: est}
    servo:
      kv_1_s: {value: 40, src: est}
      feedforward: {value: 0.95, src: est}
      velocity_bw_Hz: {value: 60, src: est}
    backlash_um: {value: 1, src: est}
    reversal_spike_um: {value: 2, src: est}
    ballscrew: {diameter_mm: 16, pitch_mm: 5, length_mm: 250, fixed_end: motor, src: est}
    positioning: {accuracy_um: 4, repeatability_um: 2, src: est}
    motor_force_N: {value: 2000, src: est}
    moving_mass_kg: {value: 50, src: est}
  C1:
    type: rotary
    travel_deg: [0, 360]
    continuous: true
    indexing: "C-axis control"
    max_rpm: {value: 100, src: est}
    accel_rad_s2: {value: 100, src: est}
    jerk_rad_s3: {value: 2000, src: est}
    servo:
      kv_1_s: {value: 40, src: est}
      feedforward: {value: 0.9, src: est}
      velocity_bw_Hz: {value: 50, src: est}
    backlash_arcsec: {value: 0, src: est, note: "built-in spindle motor (star-gb-sr20riv-e-web-2026)"}
    brake: {clamp_torque_Nm: {value: 60, src: est}, clamp_time_s: {value: 0.1, src: est}}
    positioning: {accuracy_arcsec: 30, repeatability_arcsec: 15, src: est}
    motor_torque_Nm: {value: 23.6, src: est, note: "3.7 kW at the assumed 1500 rpm base speed"}
  C2:
    type: rotary
    travel_deg: [0, 360]
    continuous: true
    indexing: "C-axis control"
    max_rpm: {value: 100, src: est}
    accel_rad_s2: {value: 100, src: est}
    jerk_rad_s3: {value: 2000, src: est}
    servo:
      kv_1_s: {value: 40, src: est}
      feedforward: {value: 0.9, src: est}
      velocity_bw_Hz: {value: 50, src: est}
    backlash_arcsec: {value: 0, src: est}
    brake: {clamp_torque_Nm: {value: 60, src: est}, clamp_time_s: {value: 0.1, src: est}}
    positioning: {accuracy_arcsec: 30, repeatability_arcsec: 15, src: est}
    motor_torque_Nm: {value: 23.6, src: est}

kinematics:
  workpiece_chain:
    - {link: headstock, axis: Z1, direction: [0, 0, 1], note: "+Z1 feeds the bar out of the guide bush (+z), so the tool moves back along the part; machine convention assumed"}
    - {link: spindle1, axis: C1, axis_point_mm: [0, 0, 0], direction: [0, 0, -1]}
    - {link: bar_end, fixed: {translate_mm: [0, 0, 0]}, note: "part datum at the guide bush face when Z1 = 0"}
  workpiece_chain_sub:
    - {link: sub_x, axis: X2, direction: [1, 0, 0]}
    - {link: sub_z, axis: Z2, direction: [0, 0, 1]}
    - {link: spindle2, axis: C2, axis_point_mm: [0, 0, 0], direction: [0, 0, 1]}
    - {link: chuck2_face, fixed: {translate_mm: [0, 0, 20], rotate_deg: [0, 180, 0]}, src: est, note: "sub-spindle collet face 20 mm from the guide bush at Z2 = 0, X2 = 0 on the axis; assumed"}
  tool_chain:
    - {link: gang_x, axis: X1, direction: [1, 0, 0]}
    - {link: gang_y, axis: Y1, direction: [0, 1, 0]}
    - {link: gang_tool_ref, fixed: {translate_mm: [0, 0, 1.5]}, src: est, note: "turning tools cut ~1.5 mm in front of the guide bush; assumed"}
  home_mm: {Z1: 0, X1: 150, Y1: 0, X2: 150, Z2: 300, Y2: 0}
  back_tool_chain:
    - {link: back_y, axis: Y2, direction: [0, 1, 0]}
    - {link: back_tool_ref, fixed: {translate_mm: [0, 0, 150]}, src: est, note: "back working tools facing -z toward the sub spindle, assumed"}
  tool_axis: [1, 0, 0]
  singularities: null

spindles:
  - id: main
    kind: turning
    nose: {value: "collet, built-in motor headstock", src: est, note: "built-in spindle motors per star-gb-sr20riv-e-web-2026; collet chucking assumed"}
    max_rpm: 10000
    max_machining_diameter_mm: 20
    gear_ranges:
      - rpm: [0, 10000]
        rating: "10 min / 25 % ED"
        src: est
        note: "only the motor ratings are published (2.2 kW cont / 3.7 kW 10 min 25 % ED); constant torque up to an assumed 1500 rpm base speed, then constant power"
        power_kW: [[0, 0], [1500, 3.7], [10000, 3.7]]
        torque_Nm: [[0, 23.6], [1500, 23.6], [10000, 3.5]]
        additional_ratings:
          - {rating: "S1 continuous", src: est, power_kW: [[0, 0], [1500, 2.2], [10000, 2.2]], torque_Nm: [[0, 14.0], [1500, 14.0], [10000, 2.1]]}
    motor_kW: {cont: 2.2, s2_10min_25ed: 3.7}
    direction_reversible: {value: true, src: est}
    accel_time_s: {value: 0.5, src: est, note: "small built-in spindle, J ~ 0.004 kg m2"}
    decel_time_s: {value: 0.5, src: est}
    gear_change_s: null
    orient_time_s: {value: 0.2, src: est}
    rotor_inertia_kgm2: {value: 0.004, src: est}
    efficiency: {value: 0.85, src: est}
    idle_power_W: {value: 150, src: est}
    runout_um: {value: 2, src: est}
    frf_modes: []
    thermal:
      growth_um_at_max_rpm: {value: 8, src: est}
      time_constant_min: {value: 20, src: est}
      bearing_heat_W_at_max_rpm: {value: 120, src: est}
      thermal_comp: {value: true, src: est}
      comp_residual_fraction: {value: 0.3, src: est}
  - id: sub
    kind: sub
    nose: {value: "collet", src: est}
    max_rpm: 10000
    max_chucking_diameter_mm: 20
    gear_ranges:
      - rpm: [0, 10000]
        rating: "10 min / 25 % ED"
        src: est
        note: "as main (same published motor rating 2.2 / 3.7 kW)"
        power_kW: [[0, 0], [1500, 3.7], [10000, 3.7]]
        torque_Nm: [[0, 23.6], [1500, 23.6], [10000, 3.5]]
    motor_kW: {cont: 2.2, s2_10min_25ed: 3.7}
    direction_reversible: {value: true, src: est}
    accel_time_s: {value: 0.5, src: est}
    decel_time_s: {value: 0.5, src: est}
    orient_time_s: {value: 0.2, src: est}
    rotor_inertia_kgm2: {value: 0.004, src: est}
    efficiency: {value: 0.85, src: est}
    idle_power_W: {value: 150, src: est}
    runout_um: {value: 2, src: est}
    frf_modes: []
    front_ejection_length_mm: 80
    max_work_projection_mm: 30
  - id: live
    kind: live_tool
    nose: {value: "ER16 driven units", src: star-gb-sr20riv-e-web-2026}
    max_rpm: 8000
    drive_kW: 2.2
    gear_ranges:
      - rpm: [0, 8000]
        rating: "est."
        src: est
        note: "2.2 kW driven-tool motor published; constant torque to an assumed 2000 rpm"
        power_kW: [[0, 0], [2000, 2.2], [8000, 2.2]]
        torque_Nm: [[0, 10.5], [2000, 10.5], [8000, 2.6]]
    accel_time_s: {value: 0.3, src: est}
    decel_time_s: {value: 0.3, src: est}
    orient_time_s: {value: 0.2, src: est}
    rotor_inertia_kgm2: {value: 0.001, src: est}
    efficiency: {value: 0.8, src: est}
    idle_power_W: {value: 80, src: est}
    runout_um: {value: 8, src: est}
    frf_modes:
      - {fn_Hz: 900, zeta: 0.04, k_N_um: 8, direction: x, src: est, note: "small gang-mounted driven unit"}
    max_drilling_mm: 10
    max_tapping: "M8 x 1.25"

structure:
  modes:
    - {fn_Hz: 120, zeta: 0.05, k_N_um: 20, direction: x, src: est, note: "gang tool post on the X1/Y1 slides"}
  table_modes: []
  rotary_modes: []

error_map:
  squareness_urad: {XZ: 15, YZ: 15, XY: 15, src: est}
  straightness_um_per_m: {X1: 5, Y1: 5, Z1: 5, src: est}
  angular_urad: {}
  pivot_errors: {}

thermal:
  axis_drift:
    expansion_1_K: {value: 11.5e-6, src: est}
    heat_per_m_travel_J: {value: 40, src: est}
    time_constant_min: {value: 30, src: est}
  structure_sensitivity_um_per_K: {value: 2, src: est}
  warmup: {cold_to_warm_min: 40, src: est}

tool_changer:
  type: none
  capacity: 0
  tool_to_tool_s: {value: 0.3, src: est, note: "gang tool change = Y1/X1 move between adjacent tools"}
  chip_to_chip_s: {value: 0.4, src: est}
  max_tool_diameter_mm: null
  max_tool_diameter_adjacent_empty_mm: null
  max_tool_length_mm: null
  max_tool_mass_kg: null
  pocket_pitch_mm: null

tooling:
  turning_tools: {front: 5, rear: 2, rear_shank_mm: 12, note: "7 turning tools; 12 mm square shanks (star-gb-sr20riv-e-web-2026)"}
  sleeve_holder_4: {front: 4, rear: 4, max_drilling_mm: 12, max_tapping: "M10 x 1.5"}
  sleeve_holder_2_front: {tools: 2, max_drilling_mm: 10, max_hole_depth_mm: 100}
  cross_milling: 3
  cartridge_driven_positions: 2
  type_a_adjustable_angle: {positions: 1, tools: "front 3 + rear 3"}
  type_b_b_axis: {positions: 1, tools: "front 3 + rear 3"}
  back_tools: 8
  back_stationary_max_drilling_mm: 12
  back_driven_max_drilling_mm: 6
  gang_pitch_mm: {value: 16, src: est, note: "spacing of 12 mm shank tools on the gang plate, assumed"}

turrets: []
pallet_changer: null
tailstock: null
steady_rest: null
guide_bushing:
  type: {value: rotary, src: est, note: "guide-bush type is not stated on the pages read; a spindle-synchronised rotary bush is assumed"}
  clearance_um: {value: 5, src: est, note: "adjusted bush-to-bar clearance for h8/h9 ground bar, typical"}
  position_mm: 0
  switchable_to_non_guide_bush: {value: true, src: star-gb-sr20riv-e-web-2026}
  max_bar_diameter_mm: 20
doors: {count: {value: 1, src: est}, auto: {value: false, src: est}, open_time_s: null}

probes:
  spindle_probe: null
  tool_setter: null
  laser: null

coolant:
  tank_l: {value: 180, src: est, note: "not published; Swiss-type machines usually run neat cutting oil"}
  pumps:
    - {id: flood, kind: flood, pressure_bar: 4, flow_l_min: 30, power_kW: 0.4, src: est}
    - {id: hp, kind: high_pressure, option: true, pressure_bar: 70, flow_l_min: 12, power_kW: 2.2, src: est}
  nozzles:
    - {id: gang, kind: flood, attached_to: gang_x, position_mm: [20, 0, 20], aim: [-0.7, 0, -0.7], diameter_mm: 3, pump: flood, src: est}
    - {id: back, kind: flood, attached_to: sub_z, position_mm: [20, 0, 40], aim: [-0.7, 0, -0.7], diameter_mm: 3, pump: flood, src: est}
  air_blast: null
  chiller: {value: "oil cooler", src: est}
  filtration_um: {value: 25, src: est}

chip_conveyor: {type: none, src: est, note: "chip box; conveyor optional", rate_kg_h: {value: 15, src: est}}

enclosure:
  box_mm: {value: [[-250, -300, -100], [250, 300, 450]], src: est, note: "machining zone in front of the guide bush"}
  floor_slope_deg: {value: 45, src: est}

power:
  base_W: {value: 600, src: est}
  servo_standby_W: {value: 200, src: est}
  air_consumption_l_min: {value: 100, src: est}
  supply_kVA: 4.7
  dimensions_mm: [2334, 1200, 1695]
  machine_mass_kg: 2600

geometry:
  - name: guide_bush_housing
    attached_to: base
    primitives:
      - {cylinder: {p0_mm: [0, 0, -150], p1_mm: [0, 0, 0], radius_mm: 60}}
      - {box: {min_mm: [-200, -200, -260], max_mm: [200, 200, -150]}}
    collide: true
    src: est
  - name: gang_tool_post
    attached_to: gang_x
    primitives:
      - {box: {min_mm: [12, -220, -10], max_mm: [140, 220, 40]}}
    collide: true
    src: est
    note: "gang plate with 12 mm shank turning tools"
  - name: sub_spindle_head
    attached_to: sub_z
    primitives:
      - {cylinder: {p0_mm: [0, 0, 20], p1_mm: [0, 0, 220], radius_mm: 55}}
    collide: true
    src: est

notes: "Main-unit specification from Star's SR-20RIV page; controller and guide-bush switchability from Star GB (Type E). Axis strokes other than the 205 mm headstock stroke, all accelerations, torques (only motor kW published), coolant system and geometry are estimates."
