# Workpiece material: aluminium 6061-T6 (also representative of T651 stretched plate).
# Physical and mechanical data: Kaiser 2006 sheet/plate datasheet and NASA 1972 materials handbook.
format: cnctwin-material
version: 1
id: al6061-t6
name: "Aluminium 6061-T6"
family: aluminium
iso_group: N
condition: "T6: solution heat treated and artificially aged (values for T6/T651 sheet, plate and bar)"
designations: {UNS: A96061, EN: "EN AW-6061", DIN: "AlMg1SiCu"}
stock_forms: [rolled_plate]        # estimated profile only, see residual_stress

physical:
  src: kaiser-2006-al6061-datasheet
  density_kg_m3: {value: 2700, note: "also 2.70 g/cm3 in muraca-1972-al6061-handbook"}
  specific_heat_J_kgK: {table: [[100, 962]], src: muraca-1972-al6061-handbook, range: [896, 962], note: "0.23 cal/g C at 100 C (NASA); Kaiser lists 896 J/kgK labelled 212 F/100 C. Single point, no temperature dependence read"}
  conductivity_W_mK: {table: [[20, 167]], note: "T6/T651 at 20 C; NASA gives 0.40 cal/cm s C = 167.4 W/mK at 25 C"}
  expansion_1_K: {table: [[100, 23.6e-6]], note: "mean 20-100 C; NASA tabular abstract gives 23.4e-6"}
  youngs_modulus_GPa: {table: [[20, 68.9]], src: muraca-1972-al6061-handbook, range: [68.3, 68.9], note: "typical E = 10.0e3 ksi; Kaiser 68.3 GPa"}
  poisson: {value: 0.33, src: muraca-1972-al6061-handbook}
  solidus_degC: {value: 582, note: "melting range 582-652 C; NASA 582-649 C"}
  liquidus_degC: {value: 652, range: [649, 652], note: "Kaiser 652, NASA 649"}
  glass_transition_degC: null
  decomposition_degC: null
  hardness: {HB: 95, src: muraca-1972-al6061-handbook, note: "Brinell 500 kg / 10 mm, T6 and T651; Kaiser also 95"}
  yield_MPa: {value: 276, note: "typical, T6/T651; NASA 40.0 ksi"}
  ultimate_MPa: {value: 310, note: "typical, T6/T651; NASA 45.0 ksi"}
  elongation_pct: {value: 17, note: "Kaiser: in 4D, 0.500 in specimen; NASA: 17 % in 2 in"}
  fracture_strain: {value: 0.5, src: est, note: "true strain at fracture ln(1/(1-RA)) with an assumed reduction of area of about 40 %; no quasi-static measured value read. lesuer-2001-llnl-jc report tension failure after a true strain of 0.26 (Hopkinson bar, 8000 1/s, necked) while compression samples reached the limit of the experiment without failure"}

flow_stress:                       # sigma = (A + B eps^n)(1 + C ln(epsdot/epsdot0))(1 - T*^m)
  model: johnson_cook
  A_MPa: {value: 324, range: [324, 334], note: "Table 1 of the original LLNL report (lesuer-2001-llnl-jc); dawara-2023-impact-framework print A = 334 MPa for the same set (3 % higher, taken as a transcription error); 324 used"}
  B_MPa: 114
  n: 0.42
  C: 0.002
  m: {value: 1.34, note: "Table 1 (previously an estimate taken from a review snippet; now read in the original)"}
  ref_strain_rate_1_s: {value: 1.0, note: "the report states the rate is 'typically normalized to a strain rate of 1.0 s-1' (p. 6)"}
  T_ref_degC: {value: 20, src: est, note: "room temperature assumed; not stated in lesuer-2001-llnl-jc or dawara-2023-impact-framework"}
  T_melt_degC: {value: 652, src: kaiser-2006-al6061-datasheet, note: "liquidus of the alloy; the melting temperature used with the set is not stated in lesuer-2001-llnl-jc"}
  damage: {D1: -0.77, D2: 1.45, D3: -0.47, D4: 0.0, D5: 1.60, note: "Johnson-Cook fracture constants of Table 1 (eps_f = [D1 + D2 exp(D3 sigma*)][1 + D4 ln eps*][1 + D5 T*]). The report finds the model predicts eps_f = 0.52 in tension against 0.26 measured at 8000 1/s, so the set over-predicts tensile ductility"}
  src: lesuer-2001-llnl-jc
  note: "Lesuer, Kay & LeBlanc (LLNL UCRL-JC-134118, 2001) Table 1, read in the original on OSTI; the same set is quoted by dawara-2023-impact-framework (with A = 334). Identified on Hopkinson-bar compression (4000 1/s) and tension (8000 1/s) of hot cross-rolled 6061-T6 plate, not on machining tests; the report notes the measured curves work-harden faster than the JC fit."

cutting:
  kienzle:
    - tool_class: carbide
      coating: any
      kc11_N_mm2: 800
      mc: 0.25
      rake_ref_deg: {value: 0, src: est, note: "ISCAR's table does not state the reference geometry; a neutral (0 deg) rake is assumed, as Sandvik defines its kc1 for a 0 deg rake"}
      vc_ref_m_min: {value: 300, src: est, note: "catalogue kc1 values carry no reference speed; a typical carbide speed for wrought aluminium is assumed"}
      src: iscar-materials-groups
      note: "ISCAR material group 22: aluminium wrought alloy, hardenable (100 HB), kc1 for a 1 mm2 chip section"
    - tool_class: hss
      coating: uncoated
      kc11_N_mm2: 920
      mc: 0.25
      rake_ref_deg: 0
      vc_ref_m_min: 60
      src: est
      note: "carbide catalogue value x 1.15, assumed for HSS (lower speed, larger edge radius); no published HSS value read"
  mechanistic: []                  # no published end-milling calibration for 6061 was read
  min_chip_thickness_ratio: {value: 0.23, src: wojciechowski-2022-min-chip-thickness, range: [0.08, 0.45], note: "6061, analytic (Malekian et al. 2009) in Table 1; aluminium alloys span 0.08 (6082, experimental, Rahman et al.) to 0.45 (2024-T6, FEM, Ozel et al.)"}
  indentation_coeff_N_mm3: {value: 1.5e4, src: est, note: "order-of-magnitude placeholder for the process-damping indentation coefficient of a ~95 HB aluminium alloy; replace with an identified value"}
  work_hardening:
    layer_depth_um: {value: 30, src: est, note: "assumed for sharp-tool milling/turning of a peak-aged alloy; no measurement read"}
    hardness_increase_pct: {value: 10, src: est, note: "assumed; peak-aged 6061 has limited strain-hardening capacity (JC n = 0.42 but B only 114 MPa)"}
    strain_hardening_exponent: {value: 0.42, src: dawara-2023-impact-framework, note: "JC exponent n"}

friction:                          # tool-chip interface, Zorev sticking-sliding
  - tool_class: carbide
    coating: uncoated
    mu_sliding: {value: 0.55, src: est, range: [0.5, 0.6], note: "same Coulomb value that luo-2021-al7075-drilling chose for 7075-T6 FE (0.5-0.6 range of Ceretti and Arrazola); an FE input, not a measurement, adopted for 6061"}
    sticking_ratio: {value: 0.6, src: est, note: "aluminium adheres strongly to uncoated carbide (BUE/BUL); long sticking zone assumed"}
  - tool_class: pcd
    coating: uncoated
    mu_sliding: {value: 0.3, src: est, note: "assumed; PCD resists aluminium adhesion"}
    sticking_ratio: {value: 0.3, src: est, note: "assumed"}

chip:
  tendency: continuous
  segmentation: null               # not observed for 6061 in the sources read
  bue:
    interface_temp_degC: {range: [100, 300], src: est, note: "assumed; no interface temperature for 6061 BUE was read"}
    vc_m_min: [10, 200]
    src: est
    note: "window assumed by analogy with 7075 (BUE/BUL in dry turning at 40-200 m/min, trujillo-2017-al7075-adhesion; still present at 300 m/min, jomaa-2014-al7075-orthogonal); BUE grows with feed"
  breakability: {value: poor, src: est, note: "long ductile ribbon chips without a chip breaker; no quantitative source read"}
  oxide_colours: null

tool_life:                         # extended Taylor: vc * T^n * (f/feed_ref)^a * (ap/ap_ref)^b = C; T in min at VB_limit
  - tool_class: carbide
    coating: uncoated
    C_m_min: 1800
    n: 0.3
    a: 0.3
    b: 0.1
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    life_basis: cutting_time
    src: est
    note: "no published Taylor fit read. C set so that T = 15 min at vc = 800 m/min (uncoated K10 carbide in wrought aluminium, general knowledge, not a cited source); n, a, b assumed typical of carbide. In practice BUE and edge chipping limit life more than flank wear"
  - tool_class: pcd
    coating: uncoated
    C_m_min: 6000
    n: 0.35
    a: 0.3
    b: 0.1
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.1
    life_basis: cutting_time
    src: est
    note: "placeholder: T = 15 min at vc ~ 2300 m/min; PCD life in aluminium is typically very long; not a cited value"
  - tool_class: hss
    coating: uncoated
    C_m_min: 220
    n: 0.15
    a: 0.4
    b: 0.15
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    life_basis: cutting_time
    src: est
    note: "C set so that T = 60 min at vc = 120 m/min (general knowledge); n typical of HSS"
tool_life_usui: null               # template puts `usui` under the tool_life list, which is not valid YAML; kept as a sibling key

residual_stress:                   # as-supplied stock, through-thickness profile [z/thickness, sigma_MPa]
  - form: rolled_plate
    thickness_mm: 76
    direction: L
    profile_MPa: [[0.026, 7], [0.05, -1], [0.10, -12], [0.15, -16], [0.20, -18], [0.25, -11], [0.30, 5], [0.35, 17], [0.40, 17], [0.45, 10], [0.50, 5], [0.55, 8], [0.60, 17], [0.65, 19], [0.70, 9], [0.75, -7], [0.80, -19], [0.85, -20], [0.90, -14], [0.95, 1], [0.963, 6]]
    src: est
    note: "ESTIMATE for T651 (stretched 1.5-3 %) plate, no 6061 profile read: the measured rolling-direction profile of 76 mm 7050-T7451 stretched plate (Prime & Hill 2002 slitting data as reproduced in seger-2024-al7050-plate-rs Fig. 2b, digitised for al7075-t7351.yaml) resampled every 0.05 z/t and rounded to 1 MPa, amplitude not scaled. 6061 is less quench-sensitive and weaker than 7050, so the +-20 MPa amplitude is probably an upper bound. The earlier placeholder ([[0,-20],[0.1,-5],[0.25,15],[0.5,-10],[0.75,15],[0.9,-5],[1,-20]], 50 mm) had the wrong shape (tensile, not compressive, at mid-thickness in the measurement). Unstretched T6 parts (quenched bar, forgings) carry far larger quench stresses (about 10x per prime-2003-al-forgings-rs) that are not represented here"

skin:
  type: none
  thickness_mm: {value: 0}
  hardness_factor: {value: 1.0}
  abrasiveness_factor: {value: 1.0}

thermal_damage:
  burn_degC: null
  white_layer_degC: null
  melt_smear_degC: {value: 582, src: kaiser-2006-al6061-datasheet, note: "solidus; smearing/incipient melting of the surface. Over-ageing (loss of T6 strength) starts far lower, after time at temperature; not quantified here"}

ignition: null
composite: null

notes: "Peak-aged 6061 for general machining. Measured or catalogue data: physical and tensile properties (Kaiser, NASA), JC strength and damage constants (Lesuer et al. 2001, original LLNL report; A = 324 MPa confirmed), Kienzle (ISCAR catalogue), h_min/r_n (review table). Estimates: HSS Kienzle, friction, BUE window, work hardening, K_sp, all Taylor constants and the plate residual-stress profile (now shaped on the measured 7050-T7451 plate profile)."
