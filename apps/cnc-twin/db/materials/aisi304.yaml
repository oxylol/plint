# AISI 304 / X5CrNi18-10 (1.4301), solution annealed. Sources: db/bibliography/materials-steels.yaml
format: cnctwin-material
version: 1
id: aisi304
name: "AISI 304 / 1.4301 austenitic stainless steel, solution annealed"
family: stainless
iso_group: M
condition: "+AT: solution annealed 1000-1100 C, water or air quenched (thyssenkrupp-2020-14301)"
designations: {UNS: S30400, EN: "X5CrNi18-10 (1.4301)", AISI: "304", JIS: "SUS304"}
stock_forms: []

physical:
  src: thyssenkrupp-2020-14301
  density_kg_m3: {value: 7900}
  specific_heat_J_kgK: {value: 500, note: "20 C (also outokumpu-steel-grades)"}
  conductivity_W_mK: {table: [[20, 15], [400, 20]], src: outokumpu-steel-grades, note: "Table 13 RT and 400 C"}
  expansion_1_K: {table: [[100, 16.0e-6], [200, 16.5e-6], [300, 17.0e-6], [400, 17.5e-6], [500, 18.0e-6]], note: "mean from 20 C"}
  youngs_modulus_GPa: {table: [[20, 200], [200, 186], [400, 172], [500, 165]]}
  poisson: {value: 0.3, src: est, note: "no 304-specific value read; 0.3 as used for 316L by benmeddour-2021-316l-turning (jiang-2024 used 0.33)"}
  solidus_degC: {value: 1400, src: zou-2026-304-min-cutting-thickness, note: "JC melting temperature 1673 K used as solidus; jiang-2024 Table 7 also lists 1400 C"}
  liquidus_degC: {value: 1450, src: est, note: "typical melting range 1400-1450 C of 18-8 stainless (general knowledge)"}
  glass_transition_degC: null
  decomposition_degC: null
  hardness: {HB: 180, src: est, note: "typical annealed 304 (general knowledge); no hardness value read"}
  yield_MPa: {value: 270, src: outokumpu-steel-grades, range: [190, 270], note: "Outokumpu typical (hot-rolled plate); 190 = minimum for bars L <= 160 mm (thyssenkrupp-2020-14301)"}
  ultimate_MPa: {value: 600, src: outokumpu-steel-grades, range: [500, 700], note: "typical; bars 500-700 (thyssenkrupp)"}
  elongation_pct: {value: 55, src: outokumpu-steel-grades, note: "typical; minimum 45 % for bars (thyssenkrupp)"}
  fracture_strain: {value: 1.1, src: est, note: "assumed reduction of area ~67 % (ln(1/0.33)); not read"}

flow_stress:
  model: johnson_cook
  A_MPa: 452
  B_MPa: 694
  n: 0.311
  C: 0.0067
  m: 0.996
  ref_strain_rate_1_s: 0.001
  T_ref_degC: {value: 0, note: "the source table gives Tr = 273 K"}
  T_melt_degC: 1400
  src: zou-2026-304-min-cutting-thickness
  note: "Table 2 (Tm 1673 K), quoting Zhou F., PhD thesis, HUST 2014; the same A, B, n, C, m are set JC1 in jiang-2024-304-jc-ga (attributed there to Zhang et al. 2018, IJMTM 130-131:36). Alternatives in jiang-2024 Table 4: Zou 2023 JMRT 357.8/801.8/0.912/0.136/0.411; Ling 2012 277/556/0.796/0.0096/0.944; 310/1000/0.65/0.07/1. marcicano-2005 fitted A 360, B 1244, n 0.72 from compression but obtained a negative C."

cutting:
  kienzle:
    - tool_class: carbide
      coating: any
      kc11_N_mm2: 1800
      mc: 0.21
      rake_ref_deg: 0
      vc_ref_m_min: {value: 150, src: est, note: "Walter gives no reference speed"}
      src: walter-2025-technical-compendium
      note: "Walter group M1 'stainless, austenitic steels, Rm 400-900' (1.4301 listed as M1), p. F9"
    - tool_class: carbide
      coating: uncoated
      kc11_N_mm2: 1910
      mc: 0.254
      rake_ref_deg: 5
      vc_ref_m_min: 38
      src: est
      note: "least-squares fit by this database of kc = Fc/(b h) to the 11 orthogonal tests of marcicano-2005-304-machining Table 3 (uncoated M-type carbide TPGN 160308, rake 5 deg, b = 1 mm, h = 0.06-0.43 mm, vc = 24-60 m/min); the 13 tests with the second insert (Table 4, b = 1.5 mm, vc 13-67 m/min) give 1656 N/mm2, mc 0.184"
  mechanistic: []
  min_chip_thickness_ratio: {value: 0.27, src: zou-2026-304-min-cutting-thickness, range: [0.25, 0.30], note: "minimum cutting thickness / tool nose (edge) radius stays at 0.25-0.30 for radii 0.01-0.04 mm (FE and analytical model)"}
  indentation_coeff_N_mm3: {value: 2.7e4, src: est, note: "placeholder 3.0e4 N/mm3 at 200 HB scaled by hardness (180/200)"}
  work_hardening:
    layer_depth_um: {value: 110, src: zou-2026-304-min-cutting-thickness, range: [100, 120], note: "measured microhardness returns to bulk at 100-120 um below the surface (turning v = 90-210 m/min, f = 0.1 mm/rev)"}
    hardness_increase_pct: {value: 70, src: est, note: "simulated peak surface microhardness 381-401 HV in zou-2026 (base hardness not stated) against an assumed annealed bulk of ~200-230 HV gives +65-100 %; 70 % used"}
    strain_hardening_exponent: {value: 0.311, src: zou-2026-304-min-cutting-thickness, note: "JC n; the tensile strain-hardening exponent is 0.6 (outokumpu-steel-grades Table 13, n/Ahom 0.6/40)"}

friction:
  - tool_class: carbide
    coating: uncoated
    mu_sliding: {value: 0.6, src: zou-2026-304-min-cutting-thickness, note: "empirical value used in their minimum-cutting-thickness model (their ref. 36); not measured"}
    sticking_ratio: {value: 0.6, src: est, note: "strong adhesion of austenitic stainless assumed"}
  - tool_class: carbide
    coating: TiAlN
    mu_sliding: {value: 0.45, src: est, note: "assumed"}
    sticking_ratio: {value: 0.5, src: est, note: "assumed"}

chip:
  tendency: continuous
  segmentation:
    criterion: critical_speed
    vc_onset_m_min: {value: 100, src: mao-2026-304-milling-shear, note: "end milling with TiAlN-coated carbide under flood coolant: band-like chips at 50 m/min, serrated chip edges from 100 m/min, sharper serrations at 150-200 m/min"}
  bue:
    interface_temp_degC: {range: [200, 600], src: est, note: "assumed"}
    vc_m_min: [5, 60]
    src: est
    note: "austenitic stainless forms BUE and adhesion at low speeds; window assumed, not measured"
  breakability: {value: poor, src: est, note: "tough, strongly work-hardening chips; not quantified in a read source"}
  oxide_colours:
    table: [[290, "#EFE3A6", "pale yellow"], [340, "#DDBE6A", "straw yellow"], [370, "#C9A046", "dark yellow"], [390, "#9A6A3A", "brown"], [420, "#7D4A55", "purple brown"], [450, "#56306E", "dark purple"], [540, "#3E5FB8", "blue"], [600, "#253A7A", "dark blue"]]
    src: bssa-heat-tint
    note: "1.4301 heated in air, about 1 h; longer exposure deepens the colours; hex values are this database's rendering (est)"

tool_life:                         # extended Taylor: vc * T^n * (f/feed_ref)^a * (ap/ap_ref)^b = C; C = vc*T^n at feed_ref and ap_ref
  - tool_class: carbide
    coating: "CVD or PVD (M-grade)"
    C_m_min: 394
    n: 0.25
    a: 0.3
    b: 0.12
    feed_ref_mm: 0.25
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    src: est
    note: "no published Taylor fit read; C set so that T = 15 min at vc = 200 m/min (coated M-grade recommendation for austenitic stainless, general knowledge). Outokumpu machinability index (carbide): 4301 = 105 relative to 4404 = 100"
  - tool_class: carbide
    coating: uncoated
    C_m_min: 181
    n: 0.22
    a: 0.3
    b: 0.12
    feed_ref_mm: 0.25
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    src: est
    note: "C set so that T = 15 min at vc = 100 m/min (general knowledge)"
tool_life_usui: null

residual_stress: []                # solution-annealed bar: no published as-supplied profile read

skin:
  type: none
  thickness_mm: {value: 0, src: est, note: "solution-annealed stainless bar is normally pickled, peeled or ground"}
  hardness_factor: {value: 1.0, src: est, note: "no skin"}
  abrasiveness_factor: {value: 1.0, src: est, note: "no skin"}

thermal_damage:
  burn_degC: {value: 290, src: bssa-heat-tint, note: "first heat tint (pale yellow)"}
  white_layer_degC: null           # austenitic: no rehardening transformation
  melt_smear_degC: null

ignition: null
composite: null

notes: "Annealed 304. Not hardenable by heat treatment; the machining risks are work hardening of the surface layer, BUE/adhesion and heat tint. Prolonged exposure at roughly 450-850 C can sensitise 304 by chromium-carbide precipitation (general metallurgical knowledge, not from a cited source; not modelled). Tool life, BUE window and breakability are estimates."
