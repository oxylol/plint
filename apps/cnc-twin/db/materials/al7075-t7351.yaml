# Workpiece material: aluminium 7075-T7351 (over-aged, stress relieved by stretching) plate.
# Physical and mechanical data: Kaiser 2006 sheet/plate datasheet; alloy-level data from NASA 1972.
format: cnctwin-material
version: 1
id: al7075-t7351
name: "Aluminium 7075-T7351"
family: aluminium
iso_group: N
condition: "T7351: solution heat treated, stress relieved by stretching, over-aged for stress-corrosion resistance (plate)"
designations: {UNS: A97075, EN: "EN AW-7075", DIN: "AlZn5.5MgCu"}
stock_forms: [rolled_plate]        # surrogate measured profiles (stretched 7050-T7451 plate), see residual_stress

physical:
  src: kaiser-2006-al7075-datasheet
  density_kg_m3: {value: 2800, note: "also NASA 2.80 g/cm3"}
  specific_heat_J_kgK: {table: [[-18, 837], [93, 920], [200, 1013], [300, 1096]], src: muraca-1972-al7075-handbook, digitised: true, uncertainty_pct: 5, note: "alloy curve digitised from NASA Fig. 9.2111; Kaiser gives 960 J/kgK at 100 C"}
  conductivity_W_mK: {table: [[20, 155]], note: "T7351 at 20 C (90 Btu/ft h F)"}
  expansion_1_K: {table: [[38, 23.0e-6], [93, 23.8e-6], [149, 24.3e-6], [204, 24.7e-6]], src: muraca-1972-al7075-handbook, digitised: true, uncertainty_pct: 3, note: "alloy curve digitised from NASA Fig. 9.2111 (mean from room temperature, assumed); Kaiser: 23.4e-6 for 20-100 C"}
  youngs_modulus_GPa: {table: [[20, 71.0]], range: [71.0, 71.7], note: "Kaiser 10.3e3 ksi / 71.0 GPa; NASA typical 71.7 GPa"}
  poisson: {value: 0.33, src: muraca-1972-al7075-handbook}
  solidus_degC: {value: 477, src: muraca-1972-al7075-handbook, range: [477, 532], note: "NASA 477 C (eutectic melting); Kaiser melting range starts at 532 C"}
  liquidus_degC: {value: 635, range: [635, 638], note: "Kaiser 635 C; NASA 638 C"}
  glass_transition_degC: null
  decomposition_degC: null
  hardness: {HB: 135, src: est, note: "Kaiser gives no Brinell value for T7351; scaled from T651 (150 HB) by the UTS ratio 503/572"}
  yield_MPa: {value: 434, note: "typical, T7351 plate"}
  ultimate_MPa: {value: 503, note: "typical, T7351 plate; ultimate shear strength 303 MPa"}
  elongation_pct: {value: 13, note: "in 4D"}
  fracture_strain: {value: 0.35, src: est, note: "ln(1/(1-RA)) with an assumed reduction of area of about 30 %; no measured value read"}

flow_stress:
  model: johnson_cook
  A_MPa: 390
  B_MPa: {value: 457, note: "B of the 7075-T6 set kept: the T7351 and T6 tensile ranges (UTS - YS = 69 MPa) are equal"}
  n: {value: 0.357, note: "n of the 7075-T6 set"}
  C: {value: 0.01, note: "C of the 7075-T6 set"}
  m: {value: 1.1, note: "m of the 7075-T6 set"}
  ref_strain_rate_1_s: 1.0
  T_ref_degC: 20
  T_melt_degC: {value: 604, src: luo-2021-al7075-drilling, note: "value used with the 7075-T6 set"}
  src: est
  note: "No published JC set for T7351 was found. Derived from the 7075-T6 machining set of luo-2021-al7075-drilling (A 452, B 457, n 0.357, C 0.01, m 1.1) by scaling A with the typical yield ratio T7351/T6 = 434/503 (A = 390 MPa). Treat as an estimate."

cutting:
  kienzle:
    - tool_class: carbide
      coating: any
      kc11_N_mm2: 800
      mc: 0.25
      rake_ref_deg: {value: 0, src: est, note: "reference geometry not stated by ISCAR; neutral 0 deg rake assumed"}
      vc_ref_m_min: {value: 300, src: est, note: "no reference speed in the catalogue; assumed"}
      src: iscar-materials-groups
      note: "ISCAR group 22: aluminium wrought alloy, hardenable (100 HB nominal)"
    - tool_class: hss
      coating: uncoated
      kc11_N_mm2: 920
      mc: 0.25
      rake_ref_deg: 0
      vc_ref_m_min: 60
      src: est
      note: "carbide catalogue value x 1.15 assumed for HSS"
  mechanistic:                     # SURROGATE: Al 7050-T7451 calibrations (no 7075-T7351 calibration read); the averaged 'Al-7075' coefficients of Engin & Altintas are in al7075-t6.yaml
    - tool_class: carbide          # tool material not stated in the source; carbide assumed (1500 m/min on aluminium)
      coating: "not stated"
      process: milling
      helix_deg: 30
      rake_deg: 8
      Ktc_N_mm2: 886.08
      Krc_N_mm2: {value: 144.79, note: "printed as the feed-direction coefficient Kfc of the oblique transformation; the guide states that the turning feed direction is the milling radial direction"}
      Kac_N_mm2: {value: 329.48, note: "printed as the radial coefficient Krc of the oblique transformation (turning radial = milling axial direction)"}
      Kte_N_mm: {value: 16.52, note: "33.046 N / b 2 mm from the orthogonal tests (the guide writes the unit as N/mm2)"}
      Kre_N_mm: {value: 17.83, note: "feed-direction edge coefficient Kfe = 35.669 N / 2 mm"}
      Kae_N_mm: {value: 0, note: "the guide assumes the third edge-force component to be zero"}
      calibration: {vc_m_min: 1500, h_mm: [0.05, 0.2], rake_deg: 8, method: "orthogonal tube turning (wall b 2.0 mm), seven feeds; edge forces from the intercepts; tau_s 356.46 MPa, phi 39.79 deg, beta 19.25 deg averaged; orthogonal-to-oblique transformation (eta = i = 30 deg)", tool: "not stated"}
      src: mal-2013-cutpro-guide
      note: "SURROGATE: Al 7050-T7451, worked example of the CutPro guide (pp. 5-9): orthogonal tests at 8 deg rake transformed to a 30 deg oblique (helix) angle with the same normal rake. Coefficients for other helix or rake angles follow from tau_s, phi and beta with the same transformation. 7050-T7451 and 7075-T7351 are both over-aged, stretched 7xxx plate of similar strength; no 7075-T7351 data were found. The tool material is not stated in the guide; tool_class carbide is this database's assumption"
    - tool_class: carbide          # tool material not stated in the source; carbide assumed
      coating: "not stated"
      process: milling
      helix_deg: null              # not stated
      rake_deg: null               # not stated
      flutes: 2
      Ktc_N_mm2: 746.81
      Krc_N_mm2: 208.20
      Kac_N_mm2: 83.27
      Kte_N_mm: 25.49
      Kre_N_mm: 27.85
      Kae_N_mm: -2.50
      fz_mm: [0.068, 0.204]
      calibration: {method: "average-force slotting identification in CutPro (dynamometer, exact number of revolutions to remove runout), 700 rpm, five or more feeds", tool: "two-fluted end mill; diameter, helix and rake not stated"}
      src: mal-2013-cutpro-guide
      note: "SURROGATE: Al 7050-T7451 average cutting force coefficients of Fig. 2.10 (pp. 10-11; the guide states on p. 29 that these coefficients are for the AL7050 workpiece). Valid for that tool only (average coefficients are tool-specific). Tool material not stated; tool_class carbide is assumed"
  min_chip_thickness_ratio: {value: 0.3, src: wojciechowski-2022-min-chip-thickness, range: [0.2, 0.45], note: "no 7075 entry; chosen inside the aluminium-alloy range of Table 1"}
  indentation_coeff_N_mm3: {value: 2.1e4, src: est, note: "placeholder: 1.5e4 N/mm3 assumed for 6061-T6 (95 HB) scaled by hardness (135/95)"}
  work_hardening:
    layer_depth_um: {value: 30, src: est, note: "assumed; no measurement read"}
    hardness_increase_pct: {value: 10, src: est, note: "assumed"}
    strain_hardening_exponent: {value: 0.357, src: est, note: "n of the derived JC set"}

friction:
  - tool_class: carbide
    coating: uncoated
    mu_sliding: {value: 0.55, src: est, range: [0.5, 0.6], note: "the 7075-T6 FE value of luo-2021-al7075-drilling adopted for T7351"}
    sticking_ratio: {value: 0.6, src: est, note: "assumed"}
  - tool_class: carbide
    coating: TiN
    mu_sliding: {value: 0.5, src: est, note: "assumed"}
    sticking_ratio: {value: 0.55, src: est, note: "assumed"}
  - tool_class: pcd
    coating: uncoated
    mu_sliding: {value: 0.3, src: est, note: "assumed"}
    sticking_ratio: {value: 0.3, src: est, note: "assumed"}

chip:
  tendency: continuous
  segmentation: null
  bue:
    interface_temp_degC: {range: [150, 400], src: est, note: "assumed"}
    vc_m_min: [40, 300]
    src: est
    note: "taken over from 7075 measured in other tempers (trujillo-2017-al7075-adhesion: BUE/BUL at 40-200 m/min, temper not stated; jomaa-2014-al7075-orthogonal: T651, BUE at 300 m/min, reduced at 1000 m/min); assumed to apply to T7351"
  breakability: {value: medium, src: est, note: "assumed similar to 7075-T6"}
  oxide_colours: null

tool_life:
  - tool_class: carbide
    coating: uncoated
    C_m_min: 1600
    n: 0.3
    a: 0.3
    b: 0.1
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    life_basis: cutting_time
    src: est
    note: "no published Taylor fit read. C set so that T = 15 min at vc = 700 m/min (general knowledge)"
  - tool_class: pcd
    coating: uncoated
    C_m_min: 5500
    n: 0.35
    a: 0.3
    b: 0.1
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.1
    life_basis: cutting_time
    src: est
    note: "placeholder: T = 15 min at vc ~ 2100 m/min; not a cited value"
  - tool_class: hss
    coating: uncoated
    C_m_min: 185
    n: 0.15
    a: 0.4
    b: 0.15
    feed_ref_mm: 0.2
    ap_ref_mm: 2
    VB_limit_mm: 0.3
    life_basis: cutting_time
    src: est
    note: "C set so that T = 60 min at vc = 100 m/min (general knowledge)"
tool_life_usui: null               # kept as a sibling key (template's nested `usui` is not valid YAML)

residual_stress:                   # SURROGATE measurements on stretched 7050-T7451 plate; no 7075-T7351 profile was read
  - form: rolled_plate
    thickness_mm: 76
    direction: L
    profile_MPa:
      value: [[0.026, 7.2], [0.05, -0.8], [0.075, -7.8], [0.10, -11.5], [0.125, -13.8], [0.15, -15.9], [0.175, -17.7], [0.20, -18.0], [0.225, -15.6], [0.25, -10.6], [0.275, -3.0], [0.30, 5.1], [0.325, 12.2], [0.35, 16.9], [0.375, 18.6], [0.40, 17.3], [0.425, 13.8], [0.45, 9.9], [0.475, 6.5], [0.50, 5.0], [0.525, 5.6], [0.55, 8.4], [0.575, 12.6], [0.60, 16.6], [0.625, 19.1], [0.65, 18.8], [0.675, 15.4], [0.70, 9.1], [0.725, 0.9], [0.75, -7.0], [0.775, -13.8], [0.80, -18.5], [0.825, -20.3], [0.85, -19.7], [0.875, -17.4], [0.90, -13.5], [0.925, -7.3], [0.95, 1.0], [0.963, 6.0]]
      digitised: true
      uncertainty_pct: 10
      note: "solid 'rolling' curve of Fig. 2b traced pixel by pixel on the embedded figure image after calibrating both axes on the tick marks (z/t = 0 and 1 on the top axis, -25 to +25 MPa on the left axis); reading error about +-1 MPa, the slitting error bars of the source (+-1 to +-3 MPa) come on top. The measurement spans z/t 0.026-0.963 only; the mean over that span is -0.4 MPa (self-equilibrated within the reading error)"
    src: seger-2024-al7050-plate-rs
    note: "Prime & Hill (Scripta Mater. 46 (2002) 77-82) slitting measurement on a 150 mm square sample from the centre of a 760 x 760 x 76 mm 7050-T7451 plate (stretched 1.5-3 %), as reproduced in Fig. 2b of seger-2024-al7050-plate-rs (the 2002 paper itself was not read). SURROGATE for 7075-T7351: both are stretched (TX51), over-aged 7xxx plates; the characteristic M-shaped profile comes from the stretch. The unstretched 7050-T74 plate of the same study carried about ten times larger stresses"
  - form: rolled_plate
    thickness_mm: 76
    direction: LT
    profile_MPa:
      value: [[0.107, -8.2], [0.125, -11.0], [0.15, -12.8], [0.175, -11.5], [0.20, -8.0], [0.225, -3.2], [0.25, 0.8], [0.275, 4.7], [0.30, 7.8], [0.325, 9.0], [0.35, 9.7], [0.375, 9.1], [0.40, 8.1], [0.43, 6.8], [0.46, 5.7], [0.50, 5.0], [0.55, 7.3], [0.60, 9.7], [0.635, 10.5], [0.675, 9.5], [0.70, 7.5], [0.725, 4.9], [0.75, 1.5], [0.775, -2.1], [0.80, -5.7], [0.825, -8.5], [0.85, -10.0], [0.875, -11.1], [0.90, -10.7], [0.925, -9.1], [0.95, -7.8], [0.975, -7.2]]
      digitised: true
      uncertainty_pct: 15
      note: "dashed 'transverse' curve of Fig. 2b: traced where the dashes are separate from the rolling curve, read on a 0.05 z/t x 5 MPa grid elsewhere (reading error about +-1.5 MPa; source error bars +-1 to +-5 MPa, largest near z/t 0.15). Spans z/t 0.107-0.975; mean over that span +0.9 MPa"
    src: seger-2024-al7050-plate-rs
    note: "long-transverse stress of the same Prime & Hill 76 mm 7050-T7451 plate (Fig. 2b); about half the rolling-direction amplitude. SURROGATE for 7075-T7351 as above"
  - form: rolled_plate
    thickness_mm: 90.5
    direction: L
    profile_MPa:
      value: [[0.05, -1.8], [0.075, -6.9], [0.10, -10.7], [0.125, -11.6], [0.15, -11.3], [0.175, -10.7], [0.20, -9.4], [0.225, -6.5], [0.25, -2.3], [0.275, 3.4], [0.30, 9.0], [0.325, 13.5], [0.35, 15.9], [0.375, 15.3], [0.40, 12.6], [0.425, 8.8], [0.45, 5.0], [0.475, 2.9], [0.50, 4.2], [0.525, 6.1], [0.55, 9.9], [0.575, 14.0], [0.60, 16.5], [0.625, 16.9], [0.65, 15.0], [0.675, 9.1], [0.70, 2.7], [0.725, -3.7], [0.75, -8.4], [0.775, -10.0], [0.80, -9.4], [0.825, -8.1], [0.85, -7.8], [0.875, -9.5], [0.90, -12.5], [0.91, -13.4]]
      digitised: true
      uncertainty_pct: 10
      note: "Fig. 2a (sample 4E, sigma_x versus normalised cut depth) traced pixel by pixel after axis calibration (ticks at 0.2-0.8 and -10 to +20 MPa); reading error about +-1 MPa, source error bars about +-1 MPa. Spans z/t 0.05-0.91; the authors attribute the dip near 0.8 to a ligament (gravity) effect of the cantilevered sample. Mean over the span +1.2 MPa"
    src: seger-2024-al7050-plate-rs
    note: "Seger et al. slitting measurement in a 90.5 mm thick Kaiser Select 7050-T7451 rolled plate (rolling-direction stress through the thickness). Their neutron-diffraction map of the same plate (Fig. 9b, XY averages at 14 depths, error bars about +-13 MPa) gives L, LT and ST stresses of the same M shape between about -32 and +23 MPa. SURROGATE for 7075-T7351"

skin:
  type: none
  thickness_mm: {value: 0}
  hardness_factor: {value: 1.0}
  abrasiveness_factor: {value: 1.0}

thermal_damage:
  burn_degC: null
  white_layer_degC: null
  melt_smear_degC: {value: 477, src: muraca-1972-al7075-handbook, note: "start of the NASA melting range (eutectic melting); Kaiser 532 C"}

ignition: null
composite: null

notes: "Over-aged, stretched 7075 plate (aerospace structural parts). Sourced: T7351 tensile, conductivity, density, E (Kaiser 2006); alloy-level cp/alpha (NASA, digitised), Kienzle (ISCAR). Surrogate data from stretched 7050-T7451 (sourced, flagged SURROGATE): through-thickness residual-stress profiles of 76 mm (L and LT, Prime & Hill 2002 via Seger et al. 2024, digitised) and 90.5 mm (L, Seger et al.) plate, and two mechanistic coefficient sets (CutPro guide). Estimated: hardness, JC set (scaled from the 7075-T6 machining set), friction, BUE window (carried over from other 7075 tempers), work hardening, K_sp and Taylor constants."
