format: cnctwin-bibliography
version: 1
# Sources of result-geometry inspection (cnctwin.inspect, docs/models/inspect.md): GD&T definitions and datum
# reference frames, minimum-zone and least-squares association, size and fits, screw-thread tolerances, the
# virtual CMM and the solvers. ISO 286-1, ISO 1101, ISO 1, ISO 965-1, ISO 68-1, ISO 724 and Machinery's Handbook
# are listed in other bibliography files (models-report, models-tooling, models-holding, models-surface).
