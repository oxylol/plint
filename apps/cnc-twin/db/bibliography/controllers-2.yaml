# Sources for db/controllers/*.yaml, second research round (2026-11-03): FANUC 30i-B Plus manuals,
# SIEMENS SINUMERIK diagnostics and programming manuals. PDF text was extracted locally (pypdf and
# pdfminer; alarm texts were confirmed in both text layers).
# Still not readable: FANUC 0i-F / 0i-F Plus alarm manuals (B-64605EN, B-64695EN), the English edition of
# the SINUMERIK 840D sl Diagnostics Manual (support.industry.siemens.com refuses automated access; only
# the Chinese edition is on the open download server), the Haas NGC alarm pages (haascnc.com HTML 403).
format: cnctwin-bibliography
version: 1
entries:

  # ---------------------------------------------------------------- FANUC
  fanuc-30ibplus-maint-2019:
    type: manual
    authors: "FANUC CORPORATION"
    title: "FANUC Series 30i/31i/32i-MODEL B Plus MAINTENANCE MANUAL, B-64725EN/01 (file revision 01.02)"
    venue: "FANUC CORPORATION, Yamanashi, (c) 2019; PDF from the FANUC DVD Manual A08B-9012-J019#12 (FANUC Series 30i/31i/32i-MODEL B Plus & FANUC AC SERVO MOTOR alpha-i/beta-i series, 2020, Version 2.0), as published on the Internet Archive (item 9012-j-019-12, ISO image, file PDF/B-64725EN_01_02.PDF)"
    year: 2019
    url: "https://archive.org/download/9012-j-019-12/9012_J019_12.ISO/PDF%2FB-64725EN_01_02.PDF"
    accessed: 2026-11-03
    pages: "Appendix A.1 ALARM LIST (CNC): (1) PS/BG/SR alarms pp. 665-716, (4)-(12) SW, SV, OT, IO, PW, SP, OH, DS, IE alarms pp. 716-742; A.3 ALARM LIST (SERIAL SPINDLE) pp. 777-779 (printed page numbers; the page of every alarm used is given per alarm)"

  fanuc-30ibplus-om-2019:
    type: manual
    authors: "FANUC CORPORATION"
    title: "FANUC Series 30i/31i/32i-MODEL B Plus OPERATOR'S MANUAL (Common to Lathe System/Machining Center System), B-64724EN/01"
    venue: "FANUC CORPORATION, (c) 2019; PDF from the FANUC DVD Manual A08B-9012-J019#12 (2020, Version 2.0), Internet Archive item 9012-j-019-12, file PDF/B-64724EN_01.PDF"
    year: 2019
    url: "https://archive.org/download/9012-j-019-12/9012_J019_12.ISO/PDF%2FB-64724EN_01.PDF"
    accessed: 2026-11-03
    pages: "printed pages: 37-41 Table 3.2 (a) G code list in the lathe system; 286-287 11 AUXILIARY FUNCTION (M00, M01, M02, M30, M98, M99, M198, multiple M codes); 314-316 Tables 13.2 (b) major functions and addresses, 13.2 (c) ranges of command values; 440 local and common variables; 455-466 system variables (tool compensation, #3000-#3902, modal information #4001-#4530, positions #5001-#5200, workpiece origin offsets #5201-#5340, #7001-#7960); 483-484 #3000 macro alarm (MC display, parameter 6008 bit 1 MCA); 486 #3006 stop with a message; 665-667 20 HIGH-SPEED CUTTING FUNCTIONS, Table 20.1 (a) number of blocks read ahead and the G05.1/G08/G05 AI contour control formats"

