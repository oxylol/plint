# Sources of the coolant models (cnctwin.coolant, docs/models/coolant.md) and of their coefficients in
# db/models/coolant-*.yaml. Standard textbook and journal equations; where a coefficient was recalled
# rather than re-read in this session the parameter file says so in its note.
# amanatides-woo-1987 (3-D DDA grid traversal, used for jet occlusion) is in models-geom.yaml.
format: cnctwin-bibliography
version: 1
entries:

  martin-1977-impinging-jets:
    type: article
    authors: "Martin, H."
    title: "Heat and mass transfer between impinging gas jets and solid surfaces"
    venue: "Advances in Heat Transfer 13, 1-60"
    year: 1977
    doi: "10.1016/S0065-2717(08)70221-1"
    pages: "single round nozzle: Nu/Pr^0.42 = G(r/D, H/D) F1(Re), G = (D/r)(1 - 1.1 D/r)/(1 + 0.1 (H/D - 6) D/r), F1 = 2 Re^0.5 (1 + 0.005 Re^0.55)^0.5; 2000 <= Re <= 4e5, 2.5 <= r/D <= 7.5, 2 <= H/D <= 12"

