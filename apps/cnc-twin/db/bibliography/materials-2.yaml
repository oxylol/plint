format: cnctwin-bibliography
version: 1
# Second research round for db/materials, db/tool_materials, db/workholding and db/holders:
# Johnson-Cook check, Taylor tool-life fits, mechanistic milling coefficients, residual stress of
# as-supplied plate, vise clamping force and ER clamping-nut torques. Every entry was read
# (full text) on 2026-11-03 unless its note says otherwise.
entries:
  # ------------------------------------------------------------------ flow stress (Johnson-Cook)
  lesuer-2001-llnl-jc:
    type: article
    authors: "Lesuer, D.R.; Kay, G.J.; LeBlanc, M.M."
    title: "Modeling Large-Strain, High-Rate Deformation in Metals"
    venue: "Third Biennial Tri-Laboratory Engineering Conference on Modeling and Simulation, Pleasanton, CA, 3-5 Nov 1999; Lawrence Livermore National Laboratory report UCRL-JC-134118 (OSTI 15005327)"
    year: 2001
    url: "https://www.osti.gov/servlets/purl/15005327"
    accessed: 2026-11-03
    pages: "Table 1 (p. 6): Johnson-Cook strength and damage constants for 6061-T6 (A 324 MPa, B 114 MPa, n 0.42, C 0.002, m 1.34; D1 -0.77, D2 1.45, D3 -0.47, D4 0.0, D5 1.60) and Ti-6Al-4V (862, 331, 0.34, 0.012, 0.8; D1 -0.09, D2 0.25, D3 -0.5, D4 0.014, D5 3.87); p. 6 (strain rate typically normalised to 1.0 1/s); p. 5 (6061 received as hot cross-rolled T6 plate, Ti-6Al-4V to AMS 4911; Hopkinson-bar tests at 1e3-1e4 1/s)"
    note: "The report does not say how Table 1 was fitted or which melting/reference temperatures go with it; the Ti-6Al-4V row equals the Johnson (1985) set quoted by ducobu-2017-jc-ti6al4v."

  # ------------------------------------------------------------------ residual stress of as-supplied stock
  seger-2024-al7050-plate-rs:
    type: article
    authors: "Seger, M.; Mathews, R.; Marais, D.; Venter, A.M.; Halley, J.; Wang, J.; Malik, A."
    title: "Effects of Aluminum Plate Residual Stress on Machined-Part Distortion"
    venue: "Preprint submitted to ASME (Journal of Manufacturing Science and Engineering), OSTI 2448191 (Oak Ridge National Laboratory)"
    year: 2024
    url: "https://www.osti.gov/servlets/purl/2448191"
    accessed: 2026-11-03
    pages: "Fig. 2a (slitting residual stress sigma_x(z) in a 90.5 mm thick Kaiser Select 7050-T7451 plate, sample 4E); Fig. 2b (rolling and transverse stress in 76 mm thick 7050-T7451 plate by slitting, reproduced from Prime & Hill, Scripta Mater. 46 (2002) 77-82, ref. [16]); Fig. 9b (neutron diffraction, XY-averaged L/LT/ST stress at 14 depths, error bars about +-13 MPa); p. 2 ('stress-relieved wrought material such as Al 7050-T7451, which contains residual stress of only about +-20-30 MPa'); p. 4 (Prime & Hill: 7050-T74 not stress relieved, an order of magnitude larger stress than 7050-T7451 stretched 1.5-3 %)"
    note: "Profiles stored in db/materials were digitised from the embedded figure images (axis-calibrated pixel tracing), see the notes at each profile."

  prime-2003-al-forgings-rs:
    type: article
    authors: "Prime, M.B.; Newborn, M.A.; Balog, J.A."
    title: "Quenching and Cold-Work Residual Stresses in Aluminum Hand Forgings: Contour Method Measurement and FEM Prediction"
    venue: "Materials Science Forum 426-432, 435-440 (THERMEC 2003); Los Alamos report LA-UR-03-0585 (OSTI 976531)"
    year: 2003
    url: "https://www.osti.gov/servlets/purl/976531"
    accessed: 2026-11-03
    pages: "p. 1 (introduction: 'In plates, stress relief by stretching is quite effective in reducing the residual stresses by a factor of about 10'; cold compression of forgings does not fully relieve them); 7050-T74 and 7050-T7452 hand forgings 107 x 158 mm section"

  # ------------------------------------------------------------------ mechanistic milling coefficients
  mal-2013-cutpro-guide:
    type: manual
    authors: "Manufacturing Automation Laboratories Inc."
    title: "CUTPRO: Fundamentals of Machining - Start to Finish Guide"
    publisher: "Manufacturing Automation Laboratories Inc., Vancouver"
    year: 2013
    url: "https://www.malinc.com/wp-content/uploads/2014/05/CutPro_Guide.pdf"
    accessed: 2026-11-03
    pages: "pp. 5-7 of 83 (Fig. 2.5/2.6 and Table 2.2: orthogonal tube tests on Al 7050-T7451, V 1500 m/min, b 2.0 mm, rake 8 deg, h 0.05-0.20 mm; Ft = 1424 h + 33.046, Ff = 13.444 h + 35.669; Kte 16.52, Kfe 17.83 N/mm; average shear angle 39.79 deg, friction angle 19.25 deg, shear stress 356.46 MPa; density 0.00283 g/mm3); p. 9 (orthogonal-to-oblique example for a 30 deg oblique angle and 8 deg rake: Ktc 886.08, Kfc 144.79, Krc 329.48 MPa; edge forces 33.046 / 35.669 / 0 N); pp. 10-11 (average-coefficient slotting identification with a two-fluted cutter at 700 rpm, Fig. 2.10: Ktc 746.81, Krc 208.20, Kac 83.27 N/mm2, Kte 25.49, Kre 27.85, Kae -2.50 N/mm, fz 0.068-0.204 mm); p. 29 (the coefficients of Chapter 2 are for the AL7050 workpiece)"
    note: "Rendered page images were read (the equations are not in the PDF text layer). The guide does not state the tool material, the end-mill diameter, helix or rake of the slotting test, nor the coolant."

  mal-2015-machining-course:
    type: manual
