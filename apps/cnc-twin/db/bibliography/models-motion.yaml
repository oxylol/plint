# Sources for db/models/motion.yaml and docs/models/motion.md (planner, servo, kinematics, timing).
# Entries already in other bibliography files are cited by key there (altintas-2012-mfg-automation,
# erkorkmaz-altintas-2001, ellis-2012-control-design, armstrong-1994-friction, palmgren-1959,
# shoemake-1985-slerp, fanuc-30i-b-operator, siemens-840d-cycles, heidenhain-tnc640-plane,
# heidenhain-tnc640-klartext-2023, haas-ngc-mill-om-2020, haas-ngc-lathe-om-2020).
# murray-li-sastry-1994 (ch. 3, Paden-Kahan subproblems) is in models-controller-cycles.yaml.
format: cnctwin-bibliography
version: 1
entries:
  biagiotti-melchiorri-2008:
    type: book
    authors: "Biagiotti, L.; Melchiorri, C."
    title: "Trajectory Planning for Automatic Machines and Robots"
    publisher: "Springer, Berlin Heidelberg"
    year: 2008
    doi: "10.1007/978-3-540-85629-0"
    pages: "s. 3.4 trajectory with double S velocity profile (seven segments, time-optimal for given V, A, J; rest-to-rest case and the conditions for A and V to be reached)"
  biagiotti-melchiorri-2012-fir:
    type: article
    authors: "Biagiotti, L.; Melchiorri, C."
    title: "FIR filters for online trajectory planning with time- and frequency-domain specifications"
    venue: "Control Engineering Practice 20(12), 1385-1399"
    year: 2012
    doi: "10.1016/j.conengprac.2012.08.009"
    pages: "trajectories as cascades of moving-average (FIR) filters: the double-S profile with limits V, A, J is a step filtered by moving averages of lengths h/V, V/A and A/J, so a jerk limit J realised by filtering is a moving average of length A/J"
  suh-2008-cnc-systems:
    type: book
    authors: "Suh, S.-H.; Kang, S.-K.; Chung, D.-H.; Stroud, I."
    title: "Theory and Design of CNC Systems"
    publisher: "Springer, London"
    year: 2008
    doi: "10.1007/978-1-84800-336-1"
    pages: "interpolation chapter: sampled-data (reference-word) interpolators hand the position loop one point per interpolation period; on a circle the chord between two points deviates from the arc by R - sqrt(R^2 - (F T / 2)^2), which bounds the feed for a given chord error"
  yeh-hsu-2002-chord-error:
    type: article
    authors: "Yeh, S.-S.; Hsu, P.-L."
    title: "Adaptive-feedrate interpolation for parametric curves with a confined chord error"
    venue: "Computer-Aided Design 34(3), 229-237"
    year: 2002
    doi: "10.1016/S0010-4485(01)00082-3"
    pages: "feed limited by the chord error at the interpolation period, V <= (2 / T) sqrt(rho^2 - (rho - delta)^2) with rho the radius of curvature"
  erkorkmaz-altintas-2001-feed-drives:
    type: article
    authors: "Erkorkmaz, K.; Altintas, Y."
    title: "High speed CNC system design. Part II: modeling and identification of feed drives"
    venue: "International Journal of Machine Tools and Manufacture 41(10), 1487-1509"
    year: 2001
    doi: "10.1016/S0890-6955(01)00003-7"
    pages: "cascaded position/velocity control of ball-screw drives, Coulomb friction and its effect at velocity reversal"
  nordin-gutman-2002-backlash:
    type: article
    authors: "Nordin, M.; Gutman, P.-O."
    title: "Controlling mechanical systems with backlash - a survey"
    venue: "Automatica 38(10), 1633-1649"
    year: 2002
    doi: "10.1016/S0005-1098(02)00047-X"
    pages: "dead-zone (backlash) model between motor and load, effect on position control"
  iso-230-1-2012:
    type: standard
    title: "ISO 230-1:2012 Test code for machine tools - Part 1: Geometric accuracy of machines operating under no-load or quasi-static conditions"
    publisher: "ISO, Geneva"
    year: 2012
    pages: "error motions of linear axes (positioning, straightness, angular: pitch, yaw, roll), squareness between axes, location and orientation errors of rotary axis average lines"
  iso-230-2-2014:
    type: standard
    title: "ISO 230-2:2014 Test code for machine tools - Part 2: Determination of accuracy and repeatability of positioning of numerically controlled axes"
    publisher: "ISO, Geneva"
    year: 2014
    pages: "reversal value B (lost motion) of an axis, accuracy A and repeatability R"
  iso-230-4-2005:
    type: standard
    title: "ISO 230-4:2005 Test code for machine tools - Part 4: Circular tests for numerically controlled machine tools"
    publisher: "ISO, Geneva"
    year: 2005
    pages: "circular deviation, radial deviation and reversal spikes of contouring axes"
  iso-841-2001:
    type: standard
    title: "ISO 841:2001 Industrial automation systems and integration - Numerical control of machines - Coordinate system and motion nomenclature"
    publisher: "ISO, Geneva"
    year: 2001
    pages: "right-handed axes, rotary axes A, B, C about X, Y, Z, spindle rotation sense (clockwise looking from the spindle toward the workpiece), table motions with reversed sense"
