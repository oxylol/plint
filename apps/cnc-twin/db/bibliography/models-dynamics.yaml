  bayly-2003-stability-interrupted:
    type: article
    authors: "Bayly, P.V.; Halley, J.E.; Mann, B.P.; Davies, M.A."
    title: "Stability of interrupted cutting by temporal finite element analysis"
    venue: "ASME Journal of Manufacturing Science and Engineering 125(2), 220-225"
    year: 2003
    doi: "10.1115/1.1556860"
