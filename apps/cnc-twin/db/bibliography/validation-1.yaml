# Sources for validation/cases/{cutting_force, drilling_thrust, drilling_torque, tool_temperature,
# chip_temperature, shear_angle, chip_ratio}/ and validation/budgets.yaml (validation references, part 1).
# All read on 2026-11-03: arXiv and repository PDFs text-extracted and rendered locally, open-access
# journal papers as full text (JATS XML) through the Europe PMC REST service and their figures from PMC.
# Values marked digitised in a case were read off a figure; the method is given in the case.
# Some works also appear under other keys in materials-*.yaml with the pages used there; the entries
# here carry the pages used for validation.
format: cnctwin-bibliography
version: 1
entries:

  klippel-2022-arxiv-orthogonal-data:
    type: report
    authors: "Klippel, H.; Süssmaier, S.; Kuffa, M.; Wegener, K."
    title: "Dry cutting experiments database Ti6Al4V and Ck45"
    venue: "arXiv preprint 2209.04197, Institute of Machine Tools and Manufacturing (IWF), ETH Zurich, 42 pp."
    year: 2022
    doi: "10.48550/arXiv.2209.04197"
    url: "https://arxiv.org/pdf/2209.04197"
    accessed: 2026-11-03
    pages: "Sect. 2 and Tables 1-3 (material batches: Ck45 Rm 671, Rp0.2 420 MPa, A5 22.2 %; Ti6Al4V 952/869 MPa, 30 HRC); Sect. 2.6 and Table 7 (Schaublin 42L lathe, tubes D ~72 mm wall ~2 mm, Kistler 9121A5, 30 Hz low-pass, uncoated CCMW 09T304 H13A, rake 0, clearance 7, corner radius 0.397 mm, Applitec SCACL-2020X-09, entering angle 90, inclination 0); Sect. 2.6.1 (edge radii 20-50 um, mean 37.5 um, sd 4.9 um); Sect. 2.6.2 (havg = Achip/lchip); Sect. 3.1-3.5 (forces, BUE up to 50 m/min, chip-thickness scatter, friction, tempering colours 200-360 C); Tables B.14 (Ti6Al4V) and B.15 (Ck45): per test vc, f, Fc, Ff per mm width with sd, rn, havg, cut length, Tchip, wear, status"
    note: "Same work as klippel-2022-ck45-cutting-database in materials-steels.yaml; the journal version is klippel-2024-ck45-orthogonal (IJAMT 135, 2871-2908), not used here."

  ducobu-2017-ti6al4v-orthogonal-reference:
    type: article
    authors: "Ducobu, F.; Rivière-Lorphèvre, E.; Filippi, E."
    title: "On the importance of the choice of the parameters of the Johnson-Cook constitutive model and their influence on the results of a Ti6Al4V orthogonal cutting model"
    venue: "International Journal of Mechanical Sciences 122, 143-155"
    year: 2017
    doi: "10.1016/j.ijmecsci.2017.01.004"
    url: "https://orbi.umons.ac.be/bitstream/20.500.12907/27254/1/Duco2017_IJMS.pdf"
    accessed: 2026-11-03
    pages: "Sect. 4 and Tables 2-3 (experimental reference: planing on a milling machine, Kistler 9257B, vc 30 m/min, h 40/60/100 um, rake 15, clearance 2, edge radius 20 um; RMS CF 86/113/174 N/mm, FF 40/44/50 N/mm, chip thickness 59/80/135 um; sd < 10 %); Table 4 (properties); Table 5 (twenty JC sets at h = 60 um: CF 89-192 N/mm, FF 18-50 N/mm, h' 76 to >115 um)"
    note: "Same work as ducobu-2017-jc-ti6al4v in materials-light.yaml. The experiments were first published in Ducobu, Rivière-Lorphèvre, Filippi (2015) Int. J. Mater. Form. 8(3), 455-468 (not read). Table 5 was read from the rendered page because its text layer is jumbled; the printed delta percentages do not all follow from the printed forces, so only the forces are used."

