# Sources of the surface finish, marks, burr, surface-integrity and thread-measurement models
# (cnctwin.surface, docs/models/surface.md) and of their coefficients in db/models/surface-*.yaml.
# Works already in other bibliography files are cited by key: iso-4287-1997 (models-report),
# brammertz-1961-roughness and grzesik-1996-roughness (models-wear), martellotti-1941 (models-mdata),
# johnson-1985-contact-mechanics (models-cutting), tabor-1951-hardness (models-mechanics),
# timoshenko-goodier-1970-elasticity (models-wear), carslaw-jaeger-1959-conduction (models-mechanics),
# trent-wright-2000-metal-cutting (models-thermal), iso-68-1-1998 and iso-965-1-2013 (models-tooling),
# oberg-2016 (models-sanity).
# pekelharing-1978-exit-failure (exit foot formation) is in models-wear.yaml.
format: cnctwin-bibliography
version: 1
entries:

  iso-4288-1996:
    type: standard
    authors: "ISO"
    title: "ISO 4288:1996 Geometrical Product Specifications (GPS) - Surface texture: Profile method - Rules and procedures for the assessment of surface texture"
    publisher: "International Organization for Standardization, Geneva"
    year: 1996
    pages: "Tables 1-3: sampling length (cut-off) from Ra, Rz (non-periodic profiles) and RSm (periodic profiles); evaluation length of 5 sampling lengths; measurement in the direction of the maximum value (perpendicular to the lay)"

  iso-3274-1996:
    type: standard
    authors: "ISO"
    title: "ISO 3274:1996 Geometrical Product Specifications (GPS) - Surface texture: Profile method - Nominal characteristics of contact (stylus) instruments"
    publisher: "International Organization for Standardization, Geneva"
    year: 1996
    pages: "Table 1: short-wave cut-off lambda_s and the maximum sampling spacing for each cut-off lambda_c"

  iso-16610-21-2011:
    type: standard
    authors: "ISO"
    title: "ISO 16610-21:2011 Geometrical product specifications (GPS) - Filtration - Part 21: Linear profile filters: Gaussian filters"
    publisher: "International Organization for Standardization, Geneva"
    year: 2011
    pages: "weighting function s(x) = exp(-pi (x / (alpha lambda_c))^2) / (alpha lambda_c), alpha = sqrt(ln 2 / pi) = 0.4697 (50 % transmission at the cut-off)"

  iso-1302-2002:
    type: standard
    authors: "ISO"
    title: "ISO 1302:2002 Geometrical Product Specifications (GPS) - Indication of surface texture in technical product documentation"
    publisher: "International Organization for Standardization, Geneva"
    year: 2002
    pages: "Table 2: surface lay symbols (=, perpendicular, X, M, C, R, P)"

  iso-13715-2017:
    type: standard
    authors: "ISO"
    title: "ISO 13715:2017 Technical product documentation - Edges of undefined shape - Indication and dimensioning"
    publisher: "International Organization for Standardization, Geneva"
    year: 2017
    pages: "edge states: burr (external edge with overhang) and its permitted size"

  iso-724-1993:
    type: standard
    authors: "ISO"
    title: "ISO 724:1993 ISO general-purpose metric screw threads - Basic dimensions"
    publisher: "International Organization for Standardization, Geneva"
    year: 1993
    pages: "pitch diameter d2 = d - 0.6495 P (= d - 0.75 H, H = 0.866025 P)"

  boothroyd-knight-2006:
    type: book
    authors: "Boothroyd, G.; Knight, W.A."
    title: "Fundamentals of Machining and Machine Tools"
    edition: "3rd"
    publisher: "CRC Press / Taylor & Francis, Boca Raton"
    year: 2006
    pages: "surface roughness of turned surfaces: peak-to-valley height f^2 / (8 r) of a round-nosed tool; arithmetic mean of the parabolic profile f^2 / (18 sqrt(3) r)"

  vickers-quan-1989-scallop:
    type: article
    authors: "Vickers, G.W.; Quan, K.W."
    title: "Ball-mills versus end-mills for curved surface machining"
    venue: "ASME Journal of Engineering for Industry 111(1), 22-26"
    year: 1989
    pages: "scallop (cusp) height between adjacent passes from the effective cutting profile of ball and flat end mills; h = R - sqrt(R^2 - s^2 / 4) for a ball"

  cirstoiu-2024-turning-roughness:
    type: article
    authors: "Cirstoiu, A."
    title: "Surface roughness prediction techniques in turning processes"
