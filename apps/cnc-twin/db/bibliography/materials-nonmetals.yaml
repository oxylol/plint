# Sources for db/materials/{pom-c, pa66, pmma, wood-beech, mdf, pu-tooling-board, eps-foam,
# cfrp-t300-epoxy, gfrp-eglass-epoxy}.yaml
# All read on 2026-11-03. PDFs were downloaded and text-extracted locally; web pages were read as HTML.
# Wikipedia articles are used only as secondary sources; the revision read is given (oldid) and the
# primary source they cite is named in `note` (the primary was not read unless it has its own entry).
# Paywalled machining papers (Elsevier, Springer, ASME) could not be opened in this session; values
# that would normally come from them are estimates in the material files and are listed there as gaps.
# walter-2025-technical-compendium is in materials-steels.yaml.
format: cnctwin-bibliography
version: 1
entries:

  # ------------------------------------------------------------------ cutting-force catalogue
  # walter-2025-technical-compendium (defined in materials-steels.yaml) is cited here for p. F9 rows
  # 'thermoplasts and thermosetting plastics, without abrasive fillers' 150 N/mm2, mc 0.2 (O1, O2) and 'fibre-reinforced plastics' 300 N/mm2, mc 0.3 (O3, O4, O5), and
  # pp. F30-F31 (O1 = PMMA/acrylic, PC, UHMW, PA, acetal (Delrin, Celcon), PTFE, nylon; O2 = epoxy,
  # Bakelite, Pertinax, Resitex).

  # ------------------------------------------------------------------ POM-C
  ensinger-2023-tecaform-ah-datasheet:
    type: datasheet
    authors: "Ensinger GmbH"
    title: "TECAFORM AH natural - Stock Shapes (rods, plates, tubes), technical data sheet"
    venue: "Ensinger GmbH, Nufringen; data sheet version AF, 2023/07/19 (also shown on the product web page)"
    year: 2023
    url: "https://www.ensingerplastics.com/en/shapes/acetal-tecaform-ah-natural"
    accessed: 2026-11-03
    pages: "Technical details tables: density 1.41 g/cm3; E (tensile, 1 mm/min) 2800 MPa; tensile strength 67 MPa; strength at yield 67 MPa; elongation at yield 9 %, at break 32 %; flexural strength 91 MPa; flexural modulus 2600 MPa; compression modulus 2300 MPa; compression strength 20/35/68 MPa at 1/2/5 % strain; Charpy notched 8 kJ/m2; Shore D 82; Tg -60 C and Tm 166 C (DSC, ISO 11357); thermal conductivity 0.39 W/mK and specific heat 1.4 J/gK (ISO 22007-4); service temperature 140 C short / 100 C long term; CLTE 13e-5 (23-60 C) and 14e-5 1/K (23-100 C); water absorption 0.05-0.1 % (24 h/96 h). PDF: values 'determined by tests at reference dimensions (typically rods with diameter 40-60 mm according to DIN EN 15860) on extruded and machined specimen'"
    note: "PDF datasheet: https://www.ensinger-online.com/modules/public/sheet/createsheet.php?SID=1344&FL=0&FILENAME=TECAFORM_AH_natural_0.PDF"

  ensinger-2024-tecaform-ah-phis:
    type: datasheet
    authors: "Ensinger GmbH"
    title: "Product Handling Information Sheet (PHIS) TECAFORM AH"
    venue: "Ensinger GmbH, PHIB_TECAFORM AH_EN_en_04.1, V 04.1, edition of 26.03.2024"
    year: 2024
    url: "https://www.ensinger-online.com/modules/nonpublic/customersheet/openpdf.php?pdf=SH_TECAFORM%20AH_en_04_1.pdf"
    accessed: 2026-11-03
    pages: "Sect. 7 (mechanical processing should generate as little dust as possible; local extraction); Sect. 8 (formaldehyde WEL 2.5 mg/m3 = 2 ppm, 8 h TWA, UK; ABEK-P3 filter if ventilation insufficient); Sect. 9 (melting point ca. 166 C; decomposition temperature > 240 C; flammability 320-340 C); Sect. 10 (strong overheating releases formaldehyde and paraformaldehyde)"

  # ------------------------------------------------------------------ PA66
  ensinger-2023-tecamid66-datasheet:
    type: datasheet
    authors: "Ensinger GmbH"
    title: "TECAMID 66 natural - Stock Shapes (rods, plates, tubes), technical data sheet"
    venue: "Ensinger GmbH, Nufringen; data sheet version AD, 2023/07/19 (also shown on the product web page)"
    year: 2023
    url: "https://www.ensingerplastics.com/en/shapes/pa66-tecamid-66-natural"
    accessed: 2026-11-03
    pages: "Technical details tables: density 1.15 g/cm3; E (tensile) 3500 MPa; tensile strength 85 MPa; strength at yield 84 MPa; elongation at yield 7 %, at break 70 %; flexural strength 110 MPa; flexural modulus 3100 MPa; compression modulus 2700 MPa; compression strength 20/35/81 MPa at 1/2/5 %; Charpy notched 5 kJ/m2; Shore D 82; Tg 47 C (footnote: 'found in public sources'); Tm 258 C (ISO 11357); thermal conductivity 0.36 W/mK; specific heat 1.5 J/gK; service temperature 170 C short / 100 C long term; CLTE 11e-5 (23-60 C), 12e-5 1/K (23-100 C); water absorption 0.2-0.4 % (24 h/96 h). Same test-condition statement as the TECAFORM AH sheet; moisture conditioning of the specimens is not stated"
    note: "PDF datasheet: https://www.ensinger-online.com/modules/public/sheet/createsheet.php?SID=792&FL=0&FILENAME=TECAMID_66_natural_0.PDF"

  ensinger-2026-tecamid66-phis:
    type: datasheet
    authors: "Ensinger GmbH"
    title: "Product Handling Information Sheet (PHIS) TECAMID 66"
    venue: "Ensinger GmbH, PHIB_TECAMID 66_EN_en_03.0, V 03.0, edition of 05.05.2026"
    year: 2026
    url: "https://www.ensinger-online.com/modules/nonpublic/customersheet/openpdf.php?pdf=SH_TECAMID%2066_en.pdf"
    accessed: 2026-11-03
    pages: "Sect. 7 (little dust, local extraction); Sect. 8 (general dust limit applies; FFP1/FFP2 if dusty); Sect. 9 (melting range ca. 253-263 C; decomposition temperature > 300 C; flammability > 400 C); Sect. 10 (strong overheating: carbon monoxide, nitrogen oxides, caprolactam and traces of hydrogen cyanide)"

  # ------------------------------------------------------------------ PMMA
  polyvantis-2025-plexiglas-gs-xt:
    type: datasheet
    authors: "POLYVANTIS GmbH (PLEXIGLAS, trademark of Roehm GmbH)"
    title: "PLEXIGLAS Solid sheet, block, multi-skin sheet, corrugated sheet, tube and rod - Technical Information, Ref. No. 211-1"
    venue: "POLYVANTIS GmbH, Weiterstadt; issue 04/25"
    year: 2025
    url: "https://www.plexiglas.de/files/plexiglas-content/pdf/technische-informationen/211-1-EN-PLEXIGLAS-GS-XT.pdf"
    accessed: 2026-11-03
    pages: "p. 1 (GS = cast, max. service temperature approx. 80 C); p. 4 typical values at 23 C/50 % RH for GS 0F00: density 1.19 g/cm3; tensile strength 110 MPa at -40 C, 80 MPa at 23 C, 40 MPa at 70 C; elongation at break 5.5 %; flexural strength 115 MPa; compressive yield stress 110 MPa; E 3300 MPa; dynamic shear modulus 1700 MPa (10 Hz); indentation hardness H961/30 175 MPa; coefficient of friction plastic/plastic 0.8, plastic/steel 0.5, steel/plastic 0.45; Poisson 0.37. p. 5 thermal: CTE 7e-5 1/K (0-50 C); thermal conductivity 0.19 W/mK; specific heat 1.47 J/gK; forming temperature 160-175 C; max. surface temperature (IR radiator) 200 C; max. permanent service temperature 80 C; ignition temperature 425 C (DIN 51794); Vicat B50 115 C; HDT 105 C (1.8 MPa) and 113 C (0.45 MPa)"

  polyvantis-2024-machining-plexiglas:
    type: manual
    authors: "POLYVANTIS GmbH (PLEXIGLAS)"
    title: "Guidelines for Workshop Practice: Machining PLEXIGLAS, Ref. No. 311-1"
    venue: "POLYVANTIS GmbH, Weiterstadt (PDF created 2024-07-25; no printed issue date)"
    year: 2024
    url: "https://www.plexiglas.de/files/plexiglas-content/pdf/verarbeitungsrichtlinie/311-1-Machining-PLEXIGLAS.pdf"
    accessed: 2026-11-03
    pages: "1.7 Tools (HSS, carbide or diamond; carbide longest life; pigments reduce tool life noticeably; oil-free coolants); 2.1 circular saws (carbide: clearance 10-15 deg, rake 0-15 deg, vc up to 4500 m/min); 3.1 twist drills (clearance 3-8, rake 0-4, point angle 60-90, helix 12-16 deg; vc 10-60 m/min; f 0.1-0.3 mm/rev; Fig. 14 chip types: speed/feed too high -> crumbly chip; too slow -> overheating, decomposition, molten chip; optimal -> smooth continuous chip); 4 routing (clearance 2-10, rake 0-5 deg; vc 200-4500 m/min; f up to 0.5 mm/rev; depth up to 6 mm; cooling normally not necessary); 5 turning (clearance 5-10, rake 0 to -4 deg, kappa ca. 45 deg; vc 20-300 m/min; f 0.1-0.5 mm/rev; depth up to 6 mm; 'ten times the cutting speed for steel'); 8 annealing (GS 80 C, unformed parts up to 100 C; time = thickness[mm]/3 h, min. 2 h; cooling <= 15 C/h; remove below 60 C); 1.2 CTE 0.07 mm/m K"

  lucite-2015-perspex-cast-tds:
    type: datasheet
    authors: "Lucite International UK Ltd (distributed by The Plastic Shop)"
    title: "Perspex Cell Cast Acrylic - Technical Data Sheet (A guide to the technical properties and data of Perspex Sheet (cast))"
    venue: "PDF hosted by theplasticshop.co.uk (file dated 2014-07/2015-08)"
    year: 2015
    url: "https://www.theplasticshop.co.uk/plastic_technical_data_sheets/perspex_technical_properties_data_sheet.pdf"
    accessed: 2026-11-03
    pages: "Table of properties: density 1.19 g/cm3 (ISO 1183); Rockwell M 102 (ISO 2039-2); water absorption 0.2 % (ISO 62); Vicat > 110 C (ISO 306 A); CTE 7.7e-5 1/K (ASTM D696); tensile strength 75 MPa and elongation at break 4 % (ISO 527, 5 mm/min); flexural strength 116 MPa and modulus 3210 MPa (ISO 178); Charpy unnotched 12 kJ/m2; Poisson 0.38"

  wikipedia-en-pmma-2026:
    type: web
