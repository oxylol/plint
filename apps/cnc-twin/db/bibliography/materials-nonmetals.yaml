    venue: "en.wikipedia.org, revision oldid=1378742053 (2026-10-06)"
    year: 2026
    url: "https://en.wikipedia.org/w/index.php?title=Poly(methyl_methacrylate)&oldid=1378742053"
    accessed: 2026-11-03
    pages: "section 'Properties': Tg of atactic PMMA 105 C; commercial grades 85-165 C (cites Ashby, Materials Selection in Mechanical Design, 3rd ed., 2005, p. 519); infobox density 1.18 g/cm3"
    note: "secondary source; Ashby 2005 not read"

  # ------------------------------------------------------------------ wood
  fpl-2010-wood-handbook:
    type: handbook
    authors: "Forest Products Laboratory"
    title: "Wood handbook - Wood as an engineering material. General Technical Report FPL-GTR-190"
    venue: "USDA Forest Service, Forest Products Laboratory, Madison, WI"
    year: 2010
    doi: "10.2737/FPL-GTR-190"
    url: "https://research.fs.usda.gov/download/treesearch/37440.pdf"
    accessed: 2026-11-03
    pages: "Ch. 4 p. 4-10 to 4-14: Eq. 4-15 k across grain = Gx(B + C x) + A (A 0.01864, B 0.1941, C 0.004064, Gx > 0.3, x < 25 % MC, ~24 C); along grain 1.5-2.8x (avg 1.8x) across; k rises 2-3 % per 10 C; Table 4-7 (American beech SG 0.68: 0.15 ovendry, 0.18 W/mK at 12 % MC); Eq. 4-16a cp0 = 0.1031 + 0.003867 T (kJ/kgK, T in K); Eqs. 4-17/4-18 moisture correction (valid 280-420 K); Table 4-8 heat capacity at 12 % MC 1.5/1.6/1.7/1.8/1.9/2.0 kJ/kgK at 280/290/300/320/340/360 K; CTE parallel to grain 3.1-4.5e-6 1/K (ovendry, species independent), Eqs. 4-19a/4-20a alpha_r = (32.4 G0 + 9.9)e-6, alpha_t = (32.4 G0 + 18.4)e-6 1/K. Ch. 5: Table 5-1 elastic ratios, Table 5-2 Poisson ratios (12 % MC); Table 5-3a American beech (Fagus grandifolia) at 12 % MC: SG 0.64, MOR 103 MPa, MOE 11.9 GPa, compression parallel 50.3 MPa, compression perpendicular 7.0 MPa, shear parallel 13.9 MPa, tension perpendicular 7.0 MPa, side hardness 5800 N; note: EL ~ bending MOE + 10 %. Ch. 18 p. 18-8 to 18-10: pyrolysis regimes (100-200 C dehydration; 200-300 C hemicellulose and onset of lignin pyrolysis, CO and tar; 300-450 C cellulose depolymerisation 300-350 C, vigorous volatiles; glowing possible from 200 C surface temperature); piloted ignition surface temperature 300-400 C (avg 347-377 C); Table 18-2 ignition temperatures: particleboard (794 kg/m3) 563 K, hardboard (1026 kg/m3) 593 K, OSB 599 K"

  wikipedia-de-buchenholz-2024:
    type: web
    authors: "Wikipedia-Autoren"
    title: "Buchenholz"
    venue: "de.wikipedia.org, revision oldid=249121765 (2024-10-04)"
    year: 2024
    url: "https://de.wikipedia.org/w/index.php?title=Buchenholz&oldid=249121765"
    accessed: 2026-11-03
    pages: "Infobox Holz (Rotbuche, Fagus sylvatica): Rohdichte mean 720 kg/m3 (12-15 % MC per text), limits 540-910 kg/m3; shrinkage axial 0.3 %, radial 5.8 %, tangential 11.8 %; bending strength 105-123 N/mm2; compressive strength 53-62 N/mm2; tensile strength 135 N/mm2; thermal conductivity 0.176 W/mK (cites Niemz, Bauphysik 29(4), 2007, 311-312, doi 10.1002/bapi.200710040); text: very hard, homogeneous, strong shrinkage"
    note: "secondary source; the infobox values (except conductivity) are uncited in the article (literature list names Grosser & Teetz 1998, 'Einheimische Nutzhoelzer: Buche'); Niemz 2007 not read"

  leitz-2017-lexicon-ed7-ch11:
    type: catalogue
    authors: "Leitz GmbH & Co. KG"
    title: "Leitz Lexicon Edition 7 - 11 User encyclopedia"
    venue: "Leitz GmbH & Co. KG, Oberkochen (PDF created 2017-09, modified 2021-03)"
    year: 2017
    url: "https://www.leitz.org/fileadmin/Downloads/Lexicon/EN/Leitz_Lexicon_Edition_7_-_11_User_encyclopedia.pdf"
    accessed: 2026-11-03
    pages: "(printed page numbers) 11.1.1 p. 2-4: tool wear rises in direct proportion to bulk density; silicate inclusions cause abrasive wear; table 'bulk densities and strength values (moisture content 12 %)' from Wagenfuehr Holzatlas 2007: beech (red beech) 540-910 kg/m3, compressive 41-99, bending 74-210, shear 6.5-19.0 N/mm2; hardness parallel to fibres ~2x perpendicular. 11.1.2 p. 7-8: MDF bulk density usually 600-1000 kg/m3; EN 316 classes HDF >= 800, light MDF <= 650, ultra-light <= 550 kg/m3; glued joints and corundum overlays cause most edge wear. 11.1.3 p. 9-10: thermoplastics soften from around 60 C, above which chips melt and tools become sticky; thermosets pyrolyse above 150 C; abrasive fibres in thermosets need other cutting materials. 11.1.6 p. 13: composites (CFRP, GRP) risk delamination from cutting forces. 11.2 p. 14-18: HW (WC-Co, HV 1300-2500) universal for wood, panels and plastics; DP (PCD, 0.3-0.6 mm layer, grain 1-30 um) for chipboard/fibreboard and very abrasive materials including fibre reinforced plastics. 11.3.2 p. 21: climb (with-feed) cutting gives about 30 % shorter tool life than up-cut. 11.3.5 p. 25: cutting speed guide values (tools > 100 mm): softwoods 50-90, hardwoods 50-80, MDF 60-90, thermoplastics 40-60, thermosets 30-50 m/s (sawing 60-100, 60-100, 60-90, 40-70, 40-60 m/s); shank router cutters 10-40 m/s, drills 5-10 m/s; p. 26 tooth feed fz: fine finishing 0.3-0.8, finishing 0.8-2.5, roughing 2.5-5.0 mm"

  leitz-2020-lexicon-ed7-ch05:
    type: catalogue
    authors: "Leitz GmbH & Co. KG"
    title: "Leitz Lexicon Edition 7 - 05 Routing"
    venue: "Leitz GmbH & Co. KG, Oberkochen (PDF created 2020-08, modified 2026-05)"
    year: 2020
    url: "https://www.leitz.org/fileadmin/Downloads/Lexicon/EN/Leitz_Lexicon_Edition_7_-_05_Routing.pdf"
    accessed: 2026-11-03
    pages: "(PDF page numbers) p. 4, 5.1: cutting materials per workpiece (chipboard/MDF: HW, HW solid, DP; duromers: HW, HW solid, DP; plastomers: HS, HW, HW solid, DP). p. 22 serrated grooving cutter WO 110 1 for 'glass and carbon fiber materials or other fiber reinforced materials, PU hard foams': HW solid Z2, D 2-8 mm, n = 10000-16000 1/min, vf = 1.5-2.0 m/min, multi-teeth geometry to avoid delamination. p. 115 multi-purpose cutterhead table: vc HW softwood 60-90, hardwood 50-80, chipboard/MDF 60-80 m/s; fz solid wood along grain 0.3-0.5 mm, across grain 0.25-0.35 mm, chipboard/MDF 0.3-0.5 mm; application note: solid wood along grain climb cut, across grain conventional cut"

  leitz-2020-lexicon-ed7-ch06:
    type: catalogue
    authors: "Leitz GmbH & Co. KG"
    title: "Leitz Lexicon Edition 7 - 06 Drilling"
    venue: "Leitz GmbH & Co. KG, Oberkochen (PDF created 2020-11, modified 2026-03)"
    year: 2020
    url: "https://www.leitz.org/fileadmin/Downloads/Lexicon/EN/Leitz_Lexicon_Edition_7_-_06_Drilling.pdf"
    accessed: 2026-11-03
    pages: "PDF p. 55 'Signs of wear': abrasive spur wear sets the end of drill life and raises cutting forces; thermal wear from high rpm at low feed, dwell at the reversal point, poor chip removal or resin build-up destroys HS, HW and DP cutting materials (binder attacked, grain breakage)"

  # ------------------------------------------------------------------ MDF
  wikipedia-en-mdf-2026:
    type: web
    authors: "Wikipedia contributors"
    title: "Medium-density fibreboard"
    venue: "en.wikipedia.org, revision oldid=1382854549 (2026-10-30)"
    year: 2026
    url: "https://en.wikipedia.org/w/index.php?title=Medium-density_fibreboard&oldid=1382854549"
    accessed: 2026-11-03
    pages: "intro: typically 82 % wood fibre, 9 % urea-formaldehyde resin, 8 % water, 1 % paraffin wax (cites Kozlowski & Helwig 1996, FAO); 'Physical properties': typical density 600-800 kg/m3, MOR 40 MPa, MOE 3 GPa; 'Safety concerns': cutting releases a large quantity of dust; formaldehyde resins; IARC classification of formaldehyde (cites IARC Monograph 88); E0/E1/E2 emission classes"
    note: "secondary source; primary references not read"

  wikipedia-de-mdf-2026:
    type: web
    authors: "Wikipedia-Autoren"
    title: "Mitteldichte Holzfaserplatte"
    venue: "de.wikipedia.org, revision oldid=269740402 (2026-08-17)"
    year: 2026
    url: "https://de.wikipedia.org/w/index.php?title=Mitteldichte_Holzfaserplatte&oldid=269740402"
    accessed: 2026-11-03
    pages: "intro: densities 600-1000 kg/m3 in trade; composition of an E1 furniture board with UF glue: 80-83 % wood, 9-10.5 % glue, 0.5-2.5 % additives (mainly paraffin), 6-8 % water; mostly UF resins, sometimes MUF/PF, rarely pMDI; press skin ('Presshaut') from the hot press is sanded off"
    note: "secondary source"

  # ------------------------------------------------------------------ dust hazards
  hse-2022-wis23:
    type: manual
    authors: "Health and Safety Executive (UK)"
    title: "Wood dust: Controlling the risks. Woodworking Information Sheet No 23 (Revision 3), WIS23(rev3)"
    venue: "HSE, published 05/22 (revised 06/22)"
    year: 2022
    url: "https://www.hse.gov.uk/pubns/wis23.pdf"
    accessed: 2026-11-03
    pages: "p. 1: biggest risk from fine dust; composite boards (chipboard, fibre boards) listed as dust sources; health risks asthma, dermatitis, irritation; hardwood dust can cause a rare nasal cancer; wood dust is flammable and can cause fire or explosion. p. 2: WEL hardwood dust 3 mg/m3, softwood dust 5 mg/m3 (8 h TWA); hardwood WEL applies to mixtures; ALARP for carcinogens/asthmagens. LEV section: BS EN 12779 air transport velocity 20-25 m/s"

  ntp-2021-roc15-wood-dust:
    type: web
    authors: "National Toxicology Program (US DHHS)"
    title: "Report on Carcinogens, Fifteenth Edition: Wood Dust (profile)"
    venue: "NTP, Research Triangle Park, NC; 15th RoC (2021)"
    year: 2021
    url: "https://ntp.niehs.nih.gov/sites/default/files/ntp/roc/content/profiles/wooddust.pdf"
    accessed: 2026-11-03
    pages: "p. 1: 'known to be a human carcinogen' (first listed in the 10th RoC, 2002); strongest association with nasal adenocarcinoma; solvent extracts of beech and oak dust caused DNA damage in mammalian cells. p. 2 'Exposure': particles > 5 um deposit almost completely in the nose, 0.5-5 um (respirable) in the lower airways; most of the dust mass is in particles > 10 um aerodynamic diameter, while 61-65 % of particles by count are 1-5 um (IARC 1995)"

