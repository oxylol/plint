    note: "fetched via the data-sheet index https://www.toraycma.com/resources/data-sheets/"

  wikipedia-en-glass-fiber-2026:
    type: web
    authors: "Wikipedia contributors"
    title: "Glass fiber"
    venue: "en.wikipedia.org, revision oldid=1378370089 (2026-10-04)"
    year: 2026
    url: "https://en.wikipedia.org/w/index.php?title=Glass_fiber&oldid=1378370089"
