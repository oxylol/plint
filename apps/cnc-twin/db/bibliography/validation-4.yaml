# Sources for validation/cases/ (validation references, part 4: spindle thermal growth, coolant reach,
# chip form, roughness, wall error, stability lobes, cycle time). All read on 2026-11-03: open-access
# journal papers as full text (JATS XML) through the Europe PMC REST service, with figures from the
# PMC open-data bucket (pmc-oa-opendata.s3.amazonaws.com, same files as the article pages) digitised
# locally (method stated in each case); the UBC thesis as full text and PDF through the cIRcle DSpace
# REST API (scanned figures rendered at 6x and digitised locally).
format: cnctwin-bibliography
version: 1
