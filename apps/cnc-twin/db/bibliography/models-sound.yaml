    year: 1952
    doi: "10.1098/rspa.1952.0060"
    pages: "acoustic power of a subsonic turbulent jet proportional to rho U^8 D^2 / c^5; acoustic efficiency of the order of 1e-4 M^5 (M the orifice Mach number)"
  fitzpatrick-lee-1952:
    type: report
    authors: "Fitzpatrick, H.M.; Lee, R."
    title: "Measurements of noise radiated by subsonic air jets"
