format: cnctwin-bibliography
version: 1
# Sources of the machining sound model (cnctwin.sound, docs/models/sound.md): sound radiation from vibrating
# structures, statistical energy analysis, room acoustics, enclosures, machine noise estimates, aerodynamic
# sound, impacts, bubbles, rolling bearings, electric machines, milling forces and chatter, levels and
# weightings, digital audio. iso-21940-11-2016 (balance quality grades) is in models-tooling.yaml.
entries:
  kinsler-2000:
    type: book
    authors: "Kinsler, L.E.; Frey, A.R.; Coppens, A.B.; Sanders, J.V."
    title: "Fundamentals of Acoustics"
    edition: 4
    publisher: "Wiley, New York"
    year: 2000
    isbn: "978-0-471-84789-2"
    pages: "7.2-7.5: pulsating and oscillating (dipole) spheres, radiation impedance Z = (4 pi a^2 rho c / 3) [(ka)^4 + i ka (2 + (ka)^2)] / (4 + (ka)^4) of the oscillating sphere; 5.12 reference levels"
  pierce-2019:
    type: book
    authors: "Pierce, A.D."
    title: "Acoustics: An Introduction to Its Physical Principles and Applications"
    edition: 3
    publisher: "Springer, Cham"
    year: 2019
    doi: "10.1007/978-3-030-11214-1"
    pages: "4.4-4.5: monopole and dipole radiation; far field of a rigid sphere translating with velocity U: p = rho a^3 cos(theta) U''(t - r/c) / (2 c r)"
  fahy-gardonio-2007:
    type: book
    authors: "Fahy, F.; Gardonio, P."
    title: "Sound and Structural Vibration: Radiation, Transmission and Response"
    edition: 2
    publisher: "Academic Press, Oxford"
    year: 2007
    isbn: "978-0-12-373633-8"
    pages: "3.4 radiation efficiency of elementary sources (sigma = (ka)^2 / (1 + (ka)^2) pulsating sphere, (ka)^4 / (4 + (ka)^4) oscillating sphere); 2.7 point mobility of an infinite plate"
  cremer-heckl-2005:
    type: book
    authors: "Cremer, L.; Heckl, M.; Petersson, B.A.T."
    title: "Structure-Borne Sound: Structural Vibrations and Sound Radiation at Audio Frequencies"
    edition: 3
    publisher: "Springer, Berlin"
    year: 2005
    isbn: "978-3-540-22696-3"
    pages: "5.4: point mobility of an infinite thin plate Y = 1 / (8 sqrt(B m'')), real and frequency independent; the frequency average of a finite plate's drive-point mobility"
  lyon-dejong-1995:
    type: book
    authors: "Lyon, R.H.; DeJong, R.G."
    title: "Theory and Application of Statistical Energy Analysis"
    edition: 2
    publisher: "Butterworth-Heinemann, Boston"
    year: 1995
    isbn: "0-7506-9111-5"
    pages: "power balance of a subsystem W_in = omega (eta_int + eta_rad) E; radiation loss factor eta_rad = rho c sigma / (omega m'')"
  beranek-ver-1992:
    type: book
    authors: "Beranek, L.L.; Ver, I.L. (editors)"
    title: "Noise and Vibration Control Engineering: Principles and Applications"
    publisher: "Wiley, New York"
    year: 1992
    isbn: "0-471-61751-2"
    pages: "6 sound in small enclosures and rooms (room constant R = S a / (1 - a), p^2 = rho c W (Q / (4 pi r^2) + 4 / R)); 9 sound transmission, mass law; 13 enclosures (IL ~ TL + 10 log a); 11 loss factors of materials and built-up structures (cast iron, bolted joints 0.01-0.05)"
  bies-hansen-2003:
    type: book
    authors: "Bies, D.A.; Hansen, C.H."
    title: "Engineering Noise Control: Theory and Practice"
    edition: 3
    publisher: "Spon Press, London"
    year: 2003
    isbn: "0-415-26713-7"
    pages: "pp. 523-524 pump noise L_p(1 m) = 72 + 10 log10(kW) for 3000-3600 rpm pumps below 75 kW; pp. 553-554 electric motor noise L_p(1 m) = 17 + 17 log10(kW) + 15 log10(rpm) below 40 kW, 28 + 10 log10(kW) + 15 log10(rpm) above; 8.x field-incidence mass law TL = 20 log10(f m'') - 47 dB (5 dB below normal incidence); 7.x hemispherical directivity Q = 2 over a hard floor; overall levels quoted within about +-5 dB"
  arup-strutt-2026:
    type: software
    authors: "Arup"
    title: "Strutt acoustics help: empirical noise sources (small motors LMSmall_Motor, pumps LMPumps)"
    year: 2026
    url: "https://strutt.arup.com/help/Empirical/LMSmall_Motor.htm"
    accessed: 2026-11-03
    pages: "restates the Bies & Hansen 3rd ed. motor (pp. 553-554) and pump (pp. 523-524) formulas: overall sound pressure level at 1 m, sound power by distance correction to a hemispherical point source"
  hopkins-stryker-1948:
