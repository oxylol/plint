# Sources of the tool wear, damage, life and breakage models (cnctwin.wear, docs/models/wear.md)
# and of their coefficients in db/models/wear-*.yaml. Works already in other bibliography files
# (usui-1984-tool-wear, yen-2004-tool-wear-fem, taylor-1907, iso-3685-1993, trent-wright-2000-metal-cutting,
# roebuck-2009-npl-mgpg20, smithey-2001-worn-tool-forces, carslaw-jaeger-1959-conduction) are cited by key.
format: cnctwin-bibliography
version: 1
entries:

  takeyama-murata-1963-tool-wear:
    type: article
    authors: "Takeyama, H.; Murata, R."
    title: "Basic investigation of tool wear"
    venue: "Transactions of the ASME, Journal of Engineering for Industry 85(1), 33-37"
    year: 1963
    pages: "dW/dt = G(V, f) + D exp(-E / (R theta)): a mechanical (abrasive) term and a thermally activated (diffusion) term"

  archard-1953-contact:
    type: article
    authors: "Archard, J.F."
    title: "Contact and rubbing of flat surfaces"
    venue: "Journal of Applied Physics 24(8), 981-988"
    year: 1953
    doi: "10.1063/1.1721448"
    pages: "wear volume = K x load x sliding distance / hardness"

  weibull-1951-distribution:
    type: article
    authors: "Weibull, W."
    title: "A statistical distribution function of wide applicability"
    venue: "Journal of Applied Mechanics 18(3), 293-297"
    year: 1951
    pages: "P_f = 1 - exp(-int (sigma / sigma_0)^m dV / V_0)"

  astm-c1683-2010:
    type: standard
    authors: "ASTM International"
    title: "ASTM C1683-10 Standard practice for size scaling of tensile strengths using Weibull statistics for advanced ceramics"
    venue: "ASTM International, West Conshohocken PA"
    year: 2010
    pages: "effective volume of three-point flexure of a rectangular bar V_eff = L b d / (2 (m + 1)^2); scaling sigma_2 / sigma_1 = (V_1 / V_2)^(1/m)"

  timoshenko-goodier-1970-elasticity:
    type: book
    authors: "Timoshenko, S.P.; Goodier, J.N."
    title: "Theory of Elasticity"
    edition: "3rd"
    publisher: "McGraw-Hill, New York"
    year: 1970
    pages: "section 36, force at the end of a wedge: radial stress sigma_r = -2 P cos(theta) / (r (2 a + sin 2a)) (axial load) and -2 P sin(theta) / (r (2 a - sin 2a)) (transverse load)"

  tada-paris-irwin-2000-cracks:
    type: handbook
    authors: "Tada, H.; Paris, P.C.; Irwin, G.R."
    title: "The Stress Analysis of Cracks Handbook"
    edition: "3rd"
    publisher: "ASME Press, New York"
    year: 2000
    pages: "edge crack in a semi-infinite plate under remote tension: K_I = 1.1215 sigma sqrt(pi a)"

  kingery-1955-thermal-stress:
    type: article
    authors: "Kingery, W.D."
    title: "Factors affecting thermal stress resistance of ceramic materials"
    venue: "Journal of the American Ceramic Society 38(1), 3-15"
    year: 1955
    pages: "surface stress of a fully constrained layer: sigma = E alpha dT / (1 - nu)"

  nakajima-2006-wc-co-fatigue:
    type: conference
    authors: "Nakajima, T.; Hosokawa, H.; Shimojima, K."
    title: "Influence of cobalt content on the fatigue strength of WC-Co hardmetals"
    venue: "Extended Abstracts of the 2006 Powder Metallurgy World Congress, Part 1 (Korean Powder Metallurgy Institute), 623-624"
    year: 2006
    url: "https://koreascience.or.kr/article/CFKO200617317789634.page"
    accessed: "2026-11-03"
    pages: "abstract: the calculated fatigue limit at 1e7 cycles is about 70 % of the flexural strength for every WC-Co grade tested; high fatigue sensitivity, no distinct fatigue limit"

  muralidharan-manson-1988-universal-slopes:
    type: article
    authors: "Muralidharan, U.; Manson, S.S."
    title: "A modified universal slopes equation for estimation of fatigue characteristics of metals"
    venue: "ASME Journal of Engineering Materials and Technology 110(1), 55-58"
    year: 1988
    pages: "elastic strain amplitude 0.623 (sigma_u / E)^0.832 (2 N_f)^-0.09"

  basquin-1910-exponential-law:
    type: article
    authors: "Basquin, O.H."
    title: "The exponential law of endurance tests"
    venue: "Proceedings of the American Society for Testing and Materials 10, 625-630"
    year: 1910
    pages: "sigma_a = sigma_f' (2 N_f)^b"

  miner-1945-cumulative-damage:
    type: article
    authors: "Miner, M.A."
    title: "Cumulative damage in fatigue"
    venue: "Journal of Applied Mechanics 12(3), A159-A164"
    year: 1945
    pages: "failure when sum n_i / N_i reaches 1"

  smith-watson-topper-1970-swt:
    type: article
    authors: "Smith, K.N.; Watson, P.; Topper, T.H."
    title: "A stress-strain function for the fatigue of metals"
    venue: "Journal of Materials 5(4), 767-778"
    year: 1970
    pages: "mean-stress correction: equivalent fully reversed amplitude sqrt(sigma_max sigma_a)"

  pekelharing-1978-exit-failure:
    type: article
    authors: "Pekelharing, A.J."
    title: "The exit failure in interrupted cutting"
    venue: "Annals of the CIRP 27(1), 5-10"
    year: 1978
    pages: "edge fracture when the tool leaves the work (foot formation): the exit loads the wedge as severely as the entry"

  bouzakis-2012-coated-tools:
    type: article
    authors: "Bouzakis, K.-D.; Michailidis, N.; Skordaris, G.; Bouzakis, E.; Biermann, D.; M'Saoubi, R."
    title: "Cutting with coated tools: coating technologies, characterization methods and performance optimization"
    venue: "CIRP Annals - Manufacturing Technology 61(2), 703-723"
    year: 2012
    pages: "coating fatigue and spallation under repetitive impact loading (impact test); wear-protection of coatings until worn through"

  brammertz-1961-roughness:
    type: article
    authors: "Brammertz, P.H."
    title: "Die Entstehung der Oberflächenrauheit beim Feindrehen"
    venue: "Industrie-Anzeiger 83(2), 25-32"
    year: 1961
    pages: "R_t = f^2 / (8 r) + (h_min / 2)(1 + r h_min / f^2)"

  grzesik-1996-roughness:
    type: article
    authors: "Grzesik, W."
    title: "A revised model for predicting surface roughness in turning"
    venue: "Wear 194(1-2), 143-148"
    year: 1996
    pages: "Brammertz's minimum-chip-thickness term added to the kinematic roughness"

  martellotti-1941-milling:
    type: article
    authors: "Martellotti, M.E."
    title: "An analysis of the milling process"
    venue: "Transactions of the ASME 63, 677-700"
    year: 1941
    pages: "trochoidal tooth path; feed-mark height about fz^2 / (8 R) in peripheral milling"

  iso-8688-2-1989:
    type: standard
    authors: "ISO"
    title: "ISO 8688-2:1989 Tool life testing in milling - Part 2: End milling"
    venue: "International Organization for Standardization, Geneva"
    year: 1989
    pages: "tool-life criteria for end mills: uniform flank wear VB 0.3 mm, localised 0.5 mm"

  iso-3327-2009:
    type: standard
    authors: "ISO"
    title: "ISO 3327:2009 Hardmetals - Determination of transverse rupture strength"
    venue: "International Organization for Standardization, Geneva"
    year: 2009
    pages: "three-point bending of type A and type B test pieces (the standard itself was not read in this session)"
