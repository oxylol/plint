# nginx site for CNC Studio. Replace the domain, then: sudo certbot --nginx -d cnc.example.com
server {
    listen 80;
    server_name cnc.example.com;

    # drawings / PDFs / models sent to Claude travel in the request
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Claude's answer is streamed and can take minutes
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
