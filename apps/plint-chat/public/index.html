<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plint">
<title>Plint</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- sign in -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="mark"><img src="/icon.svg" alt=""></div>
      <h1 class="serif">Plint</h1>
      <p class="muted">A login code goes to your phone through ntfy.</p>
      <button id="send-code" class="btn primary wide">Send code to my phone</button>
      <form id="code-form" hidden>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" aria-label="Login code">
        <button class="btn primary wide">Sign in</button>
      </form>
      <p id="login-msg" class="muted small" role="status"></p>
    </div>
  </section>

  <!-- the chat app -->
  <section id="main" class="main" hidden>
    <aside id="drawer" class="drawer" aria-label="Chats">
      <div class="drawer-head">
        <span class="serif brand">Plint</span>
        <button class="icon-btn" id="close-drawer" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="new-chat-2">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New chat
      </button>
      <div class="drawer-label">Recents</div>
      <nav id="chat-list" class="chat-list"></nav>
      <button class="drawer-foot" id="logout">Sign out</button>
    </aside>
    <div id="scrim" class="scrim"></div>

    <div class="pane">
      <header class="top">
        <button class="icon-btn" id="open-drawer" aria-label="Chats">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <button class="title" id="title-btn"><span id="title">New chat</span>
          <svg viewBox="0 0 24 24" class="chev"><path d="M8 10l4 4 4-4"/></svg>
        </button>
        <button class="icon-btn" id="new-chat" aria-label="New chat">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <div id="chat-menu" class="menu" hidden>
          <label class="menu-row switch-row"><span>Auto-approve tools<small>Run commands without asking</small></span>
            <input type="checkbox" id="auto"><i class="switch"></i></label>
          <button class="menu-row" id="rename">Rename</button>
          <button class="menu-row danger" id="delete">Delete chat</button>
        </div>
      </header>

      <main id="scroll" class="scroll">
        <div id="empty" class="empty">
          <div class="mark"><img src="/icon.svg" alt=""></div>
          <h1 class="serif" id="greeting">Hello, Filip</h1>
        </div>
        <div id="thread" class="thread"></div>
      </main>

      <footer class="composer-wrap">
        <button id="jump" class="jump" hidden aria-label="Scroll to bottom">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="How can I help you today?" enterkeyhint="send"></textarea>
          <div class="composer-row">
            <span id="auto-badge" class="badge" hidden>Auto-approve</span>
            <span class="spacer"></span>
            <button type="button" id="model-btn" class="model-btn"><span id="model-name">Auto Sonnet</span>
              <svg viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg></button>
            <button type="submit" id="send" class="send" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button type="button" id="stop" class="send stop" aria-label="Stop" hidden>
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
          <div id="model-menu" class="menu up" hidden></div>
        </form>
        <p class="fine">Runs on Plint as the plint user. Check what it does.</p>
      </footer>
    </div>
  </section>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
