<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plint">
<title>Plint</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<script>
  // Theme and reply font before first paint, so nothing flashes.
  try {
    const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    if (localStorage.getItem("reply") === "sans") document.documentElement.dataset.reply = "sans";
  } catch {}
</script>
<!--brand-->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/thread.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>
<section id="login" class="login" hidden>
  <div class="login-card">
    <div><span data-spark></span></div>
    <h1>Plint</h1>
    <p class="muted">Sign in with a code sent to your phone.</p>
    <button id="send-code" class="btn primary lg wide">Send code to my phone</button>
    <form id="code-form" hidden>
      <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Login code">
      <button class="btn brand lg wide">Continue</button>
    </form>
    <p id="login-msg" class="muted small" role="status"></p>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <main class="main">
    <div class="main-col">
      <header class="top" id="top"></header>
      <div class="view" id="view"></div>
    </div>
    <section id="panel" class="panel" hidden aria-label="Side panel"></section>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
