# Plint · /etc/systemd/resolved.conf.d/plint.conf
# AdGuard owns port 53 on this host, so the stub listener steps aside.
# The host itself resolves through AdGuard first, then a public resolver,
# so installs keep working even while AdGuard is down.
[Resolve]
DNSStubListener=no
DNS=127.0.0.1 1.1.1.1
FallbackDNS=9.9.9.9
Domains=~.
