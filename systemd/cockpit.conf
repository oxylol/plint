# Plint · Cockpit behind Caddy at https://host.${DOMAIN}
# install.sh substitutes ${DOMAIN} and writes this to /etc/cockpit/cockpit.conf
[WebService]
Origins = https://host.${DOMAIN} wss://host.${DOMAIN}
ProtocolHeader = X-Forwarded-Proto
ForwardedForHeader = X-Forwarded-For
AllowUnencrypted = true
LoginTitle = Plint

[Session]
IdleTimeout = 60
