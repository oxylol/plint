# ─────────────────────────────────────────────────────────────
#  Plint · twin stack
#  CNC Twin: a physical twin of the machine, controller, tool, workpiece,
#  chips and coolant, run before a CNC program goes to the real machine.
#  Source in apps/cnc-twin (README there). The service runs one simulation
#  at a time with the compute here on Plint; projects and runs live in
#  data/cnc-twin. Headless CLI: apps/cnc-twin/bin/twin.
# ─────────────────────────────────────────────────────────────
name: twin

services:
  cnc-twin:
    build: ../../apps/cnc-twin
    image: plint/cnc-twin:local
    container_name: cnc-twin
    restart: unless-stopped
    user: "${PUID:-1002}:${PGID:-1002}"
    ports:
      - "127.0.0.1:5210:5210"
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      CNCTWIN_MAX_JOBS: 1
      # one simulation peaks at 1.7-2.0 GB on the examples (docs/performance.md); the job's RLIMIT_DATA counts
      # reserved mappings too, the container's cgroup limit below bounds the resident memory
      CNCTWIN_JOB_MEMORY: 3584M
    volumes:
      - ../../data/cnc-twin:/data
    # not read_only: Numba loads its warm cache (/app/.numba-cache) only from a writable directory
    tmpfs: [/tmp]
    # server + one simulation (up to ~2 GB resident) + one light job (check, compare)
    mem_limit: 3584m
    cpus: 2
    networks:
      - twin

networks:
  twin:
    name: plint-twin
