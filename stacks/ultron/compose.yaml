# ─────────────────────────────────────────────────────────────
#  Plint · ultron stack
#  Ultron: a companion you talk to. celeris-1 (CELERIS_API_KEY) or Claude
#  Haiku thinks, VoiceStudio speaks each sentence in the cloned voice
#  (profile "Ultron"), the page plays them in order. Source in apps/ultron;
#  talk and memory in data/ultron. The only VoiceStudio is the one on the
#  PC, reached over the tailnet: when the PC is off he answers in text.
#  ntfy (his line to the phone) is in the ops stack, over `plint-ops`.
# ─────────────────────────────────────────────────────────────
name: ultron

services:
  ultron:
    build: ../../apps/ultron
    image: plint/ultron:local
    container_name: ultron
    restart: unless-stopped
    user: "${PUID:-1002}:${PGID:-1002}"
    ports:
      - "127.0.0.1:5230:5230"
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      CELERIS_API_KEY: ${CELERIS_API_KEY:-}
      # a second mind to try (TUNE → MIND): Claude Haiku
      ANTHROPIC_API_KEY: ${ULTRON_ANTHROPIC_API_KEY:-}
      # The voice: VoiceStudio on the PC's GPU over the tailnet (16 steps there
      # take about a second). No VOICE_URL/VOICE_KEY: there is no local voice.
      VOICE_NAME: ${ULTRON_VOICE:-Ultron}
      VOICE_FORMAT: mp3
      VOICE_FAST_URL: ${ULTRON_PC_VOICE_URL:-}
      VOICE_FAST_KEY: ${ULTRON_PC_VOICE_KEY:-}
      VOICE_FAST_STEPS: 16
      # His reach into the house (TUNE → REACH on WEB + HOUSE, Haiku only): a line
      # on the phone through ntfy (ops stack, over its network). Unset means he cannot.
      NTFY_URL: http://ntfy/plint
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ../../data/ultron:/data
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    networks:
      - ops

networks:
  ops:
    name: plint-ops
    external: true
