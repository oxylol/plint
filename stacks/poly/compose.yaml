# ─────────────────────────────────────────────────────────────
#  Plint · poly stack
#  Polybot: two Polymarket strategies side by side. "Consensus" buys what the
#  leaderboard's top traders agree on; "underdog" buys the cheaper side of a
#  game at kickoff and sells into the early bounce. Source in apps/polybot
#  (README there). Paper mode until
#  POLY_PRIVATE_KEY + POLY_WALLET are in .env and POLY_LIVE=1. Its book
#  lives in data/polybot; it pushes trades to the phone through ntfy.
# ─────────────────────────────────────────────────────────────
name: poly

services:
  polybot:
    build: ../../apps/polybot
    image: plint/polybot:local
    container_name: polybot
    restart: unless-stopped
    user: "${PUID:-1002}:${PGID:-1002}"
    ports:
      - "127.0.0.1:5190:8000"
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      PORT: 8000
      # ntfy only listens on the host's loopback, so talk to it over the ops network.
      NTFY_URL: http://ntfy:80/plint
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      # Account: leave empty to paper trade with public data only.
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY:-}
      POLY_WALLET: ${POLY_WALLET:-}
      POLY_RELAYER_API_KEY: ${POLY_RELAYER_API_KEY:-}
      POLY_RELAYER_API_KEY_ADDRESS: ${POLY_RELAYER_API_KEY_ADDRESS:-}
      POLY_LIVE: ${POLY_LIVE:-0}
      # Who to follow, what counts as agreement, how to trade (defaults are
      # documented in apps/polybot/README.md; override any of them in .env).
      POLY_WINDOW: ${POLY_WINDOW:-week}
      POLY_CATEGORY: ${POLY_CATEGORY:-overall}
      POLY_TOP_N: ${POLY_TOP_N:-25}
      POLY_MIN_AGREE: ${POLY_MIN_AGREE:-5}
      POLY_LOOKBACK_HOURS: ${POLY_LOOKBACK_HOURS:-24}
      POLY_MIN_LEADER_USD: ${POLY_MIN_LEADER_USD:-25}
      POLY_STAKE_USD: ${POLY_STAKE_USD:-5}
      POLY_MAX_PRICE: ${POLY_MAX_PRICE:-0.90}
      POLY_MIN_PRICE: ${POLY_MIN_PRICE:-0.05}
      POLY_MAX_ABOVE_LEADERS: ${POLY_MAX_ABOVE_LEADERS:-0.05}
      POLY_MAX_OPEN: ${POLY_MAX_OPEN:-20}
      POLY_DAILY_BUDGET_USD: ${POLY_DAILY_BUDGET_USD:-50}
      POLY_COOLDOWN_HOURS: ${POLY_COOLDOWN_HOURS:-72}
      POLY_MIN_HOURS_TO_END: ${POLY_MIN_HOURS_TO_END:-1}
      POLY_FOLLOW_SELLS: ${POLY_FOLLOW_SELLS:-1}
      POLY_AUTO_REDEEM: ${POLY_AUTO_REDEEM:-1}
      POLY_POLL_SECONDS: ${POLY_POLL_SECONDS:-300}
      # Extra consensus setups to compare, each with its own paper book:
      # name:setting=value,setting=value;name2:... (settings are POLY_* names without the prefix).
      # Leave empty for the built-in set: every board at 5 and 4 agreeing, plus the two credible-pack
      # setups "credible" (weighted agreement among credible traders) and "smart" (one credible
      # trader's fresh conviction bet, trust adapting to results). See apps/polybot/README.md.
      POLY_VARIANTS: ${POLY_VARIANTS:-}
      # Credibility rules for the pack setups
      CR_POOL: ${CR_POOL:-200}
      CR_PACK_SIZE: ${CR_PACK_SIZE:-12}
      CR_REFRESH_HOURS: ${CR_REFRESH_HOURS:-6}
      CR_MIN_FILLS_7D: ${CR_MIN_FILLS_7D:-10}
      CR_MAX_IDLE_HOURS: ${CR_MAX_IDLE_HOURS:-72}
      CR_MIN_CLOSED: ${CR_MIN_CLOSED:-30}
      CR_MIN_PROFIT_FACTOR: ${CR_MIN_PROFIT_FACTOR:-1.3}
      CR_MIN_WIN_RATE: ${CR_MIN_WIN_RATE:-0.40}
      CR_MAX_TOP_SHARE: ${CR_MAX_TOP_SHARE:-0.50}
      CR_MIN_HOLD_HOURS: ${CR_MIN_HOLD_HOURS:-12}
      CR_MIN_EDGE: ${CR_MIN_EDGE:-0.02}
      CR_MIN_AGE_DAYS: ${CR_MIN_AGE_DAYS:-30}
      CR_MAX_TWO_SIDED: ${CR_MAX_TWO_SIDED:-0.30}
      # Strategy 2, underdog: buy the cheaper side of a game at kickoff, sell into the bounce.
      UD_ENABLED: ${UD_ENABLED:-1}
      UD_SPORTS: ${UD_SPORTS:-}
      UD_STAKE_USD: ${UD_STAKE_USD:-5}
      UD_TAKE_PROFIT_PCT: ${UD_TAKE_PROFIT_PCT:-15}
      UD_STOP_LOSS_PCT: ${UD_STOP_LOSS_PCT:-30}
      UD_MAX_HOLD_MIN: ${UD_MAX_HOLD_MIN:-30}
      UD_MIN_PRICE: ${UD_MIN_PRICE:-0.10}
      UD_MAX_PRICE: ${UD_MAX_PRICE:-0.45}
      UD_MAX_SPREAD: ${UD_MAX_SPREAD:-0.03}
      UD_MIN_LIQUIDITY: ${UD_MIN_LIQUIDITY:-5000}
      UD_BUY_BEFORE_MIN: ${UD_BUY_BEFORE_MIN:-3}
      UD_BUY_UNTIL_MIN: ${UD_BUY_UNTIL_MIN:-2}
      UD_MAX_OPEN: ${UD_MAX_OPEN:-6}
      UD_DAILY_BUDGET_USD: ${UD_DAILY_BUDGET_USD:-50}
      UD_LOOKAHEAD_HOURS: ${UD_LOOKAHEAD_HOURS:-3}
      UD_TICK_SECONDS: ${UD_TICK_SECONDS:-30}
      # Strategy 3, forecast: No on tomorrow's high being the forecast (Open-Meteo, several models) plus a margin.
      FC_ENABLED: ${FC_ENABLED:-1}
      FC_PLUS_C: ${FC_PLUS_C:-2}
      FC_STAKE_USD: ${FC_STAKE_USD:-5}
      FC_MIN_PRICE: ${FC_MIN_PRICE:-0.50}
      FC_MAX_PRICE: ${FC_MAX_PRICE:-0.95}
      FC_DAILY_BUDGET_USD: ${FC_DAILY_BUDGET_USD:-50}
      FC_MAX_OPEN: ${FC_MAX_OPEN:-40}
      FC_MAX_PER_TICK: ${FC_MAX_PER_TICK:-5}
      FC_MODELS: ${FC_MODELS:-best_match,ecmwf_ifs025,gfs_seamless,icon_seamless,gem_seamless}
      FC_AGG: ${FC_AGG:-max}
      FC_EXIT_IF_FORECAST_MOVES: ${FC_EXIT_IF_FORECAST_MOVES:-1}
      FC_LOWEST: ${FC_LOWEST:-0}
      FC_DAYS_AHEAD: ${FC_DAYS_AHEAD:-1}
      FC_TICK_SECONDS: ${FC_TICK_SECONDS:-1800}
    volumes:
      - ../../data/polybot:/data
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - poly
      - ops

networks:
  poly:
    name: plint-poly
  ops:
    external: true
    name: plint-ops
